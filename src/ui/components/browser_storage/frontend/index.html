<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>html, body { margin: 0; padding: 0; overflow: hidden; }</style>
</head>
<body>
<script>
  const STORAGE_KEY = "levelup.prefs";

  function sendValue(value) {
    window.parent.postMessage(
      { type: "streamlit:setComponentValue", value: value, dataType: "json" },
      "*"
    );
  }

  function isReady() {
    window.parent.postMessage({ type: "streamlit:componentReady", apiVersion: 1 }, "*");
  }

  window.addEventListener("message", function (event) {
    if (event.data.type !== "streamlit:render") return;
    const args = event.data.args || {};

    if (args.action === "read") {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const data = raw ? JSON.parse(raw) : {};
        sendValue({ ok: true, data: data });
      } catch (e) {
        sendValue({ ok: false, data: {} });
      }

    } else if (args.action === "write") {
      try {
        const existing = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        const merged = Object.assign({}, existing, args.data || {});
        localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
        sendValue({ ok: true, data: {} });
      } catch (e) {
        sendValue({ ok: false, data: {} });
      }

    } else if (args.action === "clear") {
      try {
        localStorage.removeItem(STORAGE_KEY);
        sendValue({ ok: true, data: {} });
      } catch (e) {
        sendValue({ ok: false, data: {} });
      }
    }
  });

  isReady();
</script>
</body>
</html>
