# Pre-commit hooks — LevelUp (Sprint 28 : toolchain Go + hooks universels)
#
# Installation: pip install pre-commit && pre-commit install
# Exécution manuelle: pre-commit run --all-files
# Pour activer les tests avant push: pre-commit install --hook-type pre-push
#
# Hooks Python retirés (migration Go terminée) :
#   ruff, ruff-format, check-ast, check-docstring-first, name-tests-test,
#   validate-models, pytest-fast, check-imports, check-code-size
# Hooks Go ajoutés : gofmt, go-vet, golangci-lint-go

repos:
  # ==========================================================================
  # QUALITÉ DU CODE GO
  # ==========================================================================

  - repo: local
    hooks:
      # Formatage Go — équivalent black/ruff-format
      - id: gofmt
        name: gofmt (Go formatting)
        entry: bash -c 'files=$(gofmt -l "$@"); [ -z "$files" ] || { echo "Run gofmt:"; echo "$files"; exit 1; }' --
        language: system
        types: [go]
        pass_filenames: true

      # Analyse statique de base — équivalent pyflakes/govet
      # CGO_ENABLED=0 : évite les dépendances C (DuckDB) dans le hook pre-commit
      - id: go-vet
        name: go vet
        entry: bash -c 'cd apps/go-api && CGO_ENABLED=0 go vet $(go list ./... 2>/dev/null | grep -v "cmd/server" | tr "\n" " ") 2>&1 || true'
        language: system
        types: [go]
        pass_filenames: false

      # Lint complet — équivalent ruff + enforce_size_limits.py + McCabe
      # Nécessite golangci-lint installé : https://golangci-lint.run/usage/install/
      # Skippé silencieusement si golangci-lint absent (CI s'en charge via golangci/golangci-lint-action)
      - id: golangci-lint-go
        name: golangci-lint (Go quality)
        entry: bash -c 'command -v golangci-lint >/dev/null 2>&1 && (cd apps/go-api && golangci-lint run --fast ./...) || echo "golangci-lint non installé — skipped (voir CI)"'
        language: system
        types: [go]
        pass_filenames: false

      # Phase D plan multi-titres : interdiction des libellés FieldKey hardcodés
      # côté React. Le script Node compare les littéraux à la source de vérité
      # config/titles/halo_infinite/mappings/fields.toml et autorise les
      # patterns de fallback (labelOf(key, 'X'), ?? 'X', === 'X').
      - id: lint-no-hardcoded-fields
        name: Lint multi-titres (no-hardcoded-fields)
        entry: node tools/lint-no-hardcoded-fields.mjs
        language: system
        files: ^(apps/web/src/.*\.(ts|tsx)|config/titles/halo_infinite/mappings/fields\.toml|tools/lint-no-hardcoded-fields\.mjs)$
        pass_filenames: false

  # Hooks génériques de pre-commit
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Nettoyage basique
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]

      # Validation de syntaxe
      - id: check-yaml
      - id: check-json
        exclude: ^apps/web/tsconfig.*\.json$
      - id: check-toml

      # Sécurité et erreurs courantes
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: check-merge-conflict      # Conflits git non résolus
      - id: detect-private-key        # Clés privées accidentelles
      - id: check-case-conflict       # Fichiers qui diffèrent par la casse

  # ==========================================================================
  # SÉCURITÉ (détection de secrets)
  # ==========================================================================

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: 'package.lock.json|_test\.go$'

  # ==========================================================================
  # TESTS RAPIDES Go (avant push uniquement)
  # Équivalent pytest-fast → go test -short
  # ==========================================================================

  - repo: local
    hooks:
      # Tests Go rapides avant push — équivalent pytest-fast
      - id: go-test-short
        name: go test -short (fast unit tests)
        entry: bash -c 'cd apps/go-api && go test -short ./... -timeout 60s'
        language: system
        types: [go]
        pass_filenames: false
        stages: [pre-push]

      # Dry-run deploy avant push sur main (Docker + build Go)
      - id: deploy-dry-run
        name: Deploy dry-run (Docker, stubs, permissions)
        entry: bash scripts/test_deploy_dry_run.sh
        language: system
        pass_filenames: false
        stages: [pre-push]

  # ==========================================================================
  # TYPE CHECKING (optionnel - décommenter si souhaité)
  # ==========================================================================

  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.10.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [pydantic>=2.0, polars-lts-cpu, types-requests]
  #       args: [--ignore-missing-imports, --no-error-summary]
  #       files: ^src/

# ==========================================================================
# CONFIGURATION CI/CD
# ==========================================================================

ci:
  autofix_commit_msg: "style: auto-fix by pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: 'main'
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autoupdate_schedule: monthly
  skip: [go-test-short, golangci-lint-go]  # Lint/tests Go seulement en local, GitHub Actions s'en charge
