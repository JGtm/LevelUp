name: Triage feedback issues

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'feedback')
    runs-on: ubuntu-latest
    steps:
      # Pinné par SHA (supply-chain hygiene). Tag en commentaire.
      - uses: actions/checkout@<sha>          # v4
      - uses: actions/setup-node@<sha>        # v4
        with:
          node-version: '20'
      - run: npm install --no-save @anthropic-ai/sdk@^0.32.0
      - run: node .github/scripts/triage-feedback.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
