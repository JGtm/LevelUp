name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1 : Build Go server — matrice Linux / macOS / Windows (Sprint 34)
  # ─────────────────────────────────────────────────────────────────────────────
  build-go:
    name: Build Go ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ""
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: ""
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: ".exe"
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      - name: Extract version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Go server (CGo enabled — DuckDB bindings)
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }}" \
            -o dist/levelup-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} \
            ./cmd/server/

      - name: Upload Go binary
        uses: actions/upload-artifact@v4
        with:
          name: go-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apps/go-api/dist/levelup-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2 : Build web dist (Vite) — partagé entre les artefacts Go
  # ─────────────────────────────────────────────────────────────────────────────
  build-web:
    name: Build Web (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build Vite
        run: npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3 : Publish GitHub Release
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [build-go, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/levelup-server-linux-amd64
            dist/levelup-server-darwin-arm64
            dist/levelup-server-windows-amd64.exe
          body: |
            ## Installation

            ### Docker (recommandé — serveur Go natif)
            ```bash
            docker compose up -d
            ```

            ### Binaires Go natifs
            Téléchargez le binaire correspondant à votre plateforme :
            - **Linux (x86_64)** : `levelup-server-linux-amd64`
            - **macOS (Apple Silicon)** : `levelup-server-darwin-arm64`
            - **Windows (x86_64)** : `levelup-server-windows-amd64.exe`

            > **Note — binaires non autosuffisants.** Ils requièrent `ffmpeg`/`ffprobe`
            > dans le PATH (miniatures WebP, transcodage HLS, remux live) et les dossiers
            > `config/` et `static/` adjacents au binaire (mappings de titres, assets UI).
            > L'artefact de production de référence reste l'**image Docker** (ci-dessus),
            > qui embarque déjà ffmpeg, `config/` et `static/`.

            ```bash
            chmod +x levelup-server-linux-amd64
            LEVELUP_REPO_ROOT=/chemin/vers/levelup ./levelup-server-linux-amd64
            ```
