name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy levelup.fr
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            git config --global --add safe.directory /opt/levelup
            cd /opt/levelup
            bash /opt/levelup/deploy.sh

  deploy-demo:
    name: Regen demo.lvelup.info
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Regen données démo via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/levelup
            rm -rf data/demo/warehouse data/demo/db_profiles.json data/demo/app_settings.json data/demo/players/DEMO/stats.duckdb
            docker compose run --rm levelup python scripts/prepare_demo_data.py --gamertag JGtm --max-matches 50 --service-tag SPTA --out data/demo
            docker compose stop levelup-demo
            docker compose up -d levelup-demo
