name: Deploy to VPS

# Aucun accès au dépôt nécessaire côté GITHUB_TOKEN : le déploiement se fait
# entièrement en SSH avec des secrets (VPS_HOST / VPS_SSH_KEY) et le seul
# checkout (job pre-check) est un clone public en lecture par l'action. Token
# sans aucune permission (2026-07-26). SEULE exception, déclarée AU NIVEAU DU JOB
# concerné : `attente-ci` a besoin de `actions: read` pour lire le verdict de la
# CI. Ne pas remonter cette permission ici.
permissions: {}

on:
  push:
    branches: [main]
    # Ne pas redéployer la PROD pour un commit qui ne change rien de déployé
    # (2026-07-26). Constaté sur pièces : 3 déploiements prod COMPLETS (build des
    # 2 images + arrêt/redémarrage des conteneurs) déclenchés par de simples
    # renommages de fichiers `.ai/` les 23 et 24/07 — l'un a laissé un conteneur
    # orphelin, un autre a fini en timeout SSH.
    #
    # MISE EN GARDE — NE JAMAIS élargir à `docs/**` :
    #   - le Dockerfile fait `COPY docs /app/docs` ;
    #   - `docs/CHANGELOG.md` (handlers/changelog.go) et
    #     `docs/RELEASE_NOTES.md` + `docs/FR/RELEASE_NOTES.md`
    #     (service/release_notes_service.go) sont lus AU RUNTIME par l'API.
    # Ignorer `docs/**` ferait servir en prod des notes de version périmées sans
    # aucun signal. Seul `docs/adr/**` est ignoré : vérifié, aucun code ne lit ce
    # sous-dossier au runtime (uniquement cité dans des commentaires).
    #
    # INVARIANT (D29, 2026-07-26) : le `paths-ignore` de ci.yml doit rester un
    # SOUS-ENSEMBLE de celui-ci. Un push qui déclenche CE workflow sans déclencher
    # la CI condamnerait le job `attente-ci` à sonder pendant 55 min un run qui
    # n'existera jamais (déploiement refusé, prod non mise à jour, verdict inutile).
    # Autrement dit : RETIRER un motif ici est libre, en AJOUTER un impose de
    # vérifier qu'il n'est pas déjà (ou plus largement) ignoré par ci.yml.
    # Garde-rail : TestCIPathsIgnoreSubsetOfDeployPathsIgnore
    # (apps/go-api/internal/archlint/ci_deploy_triggers_test.go).
    paths-ignore:
      - ".ai/**"
      - ".claude/**"
      - "docs/adr/**"
      - "README*.md"
      - "CLAUDE.md"
      - "LICENSE"

  # Soupape d'urgence (D29, 2026-07-26) — déclenchement MANUEL du déploiement.
  # Sans elle, la mise en attente du verdict CI (job `attente-ci`) rendrait tout
  # hotfix dépendant d'une CI complète (~25-30 min) même quand la prod est à terre.
  workflow_dispatch:
    inputs:
      ignorer_attente_ci:
        description: "Hotfix urgent UNIQUEMENT : déploie sans attendre le verdict de la CI. La CI reste due a posteriori — vérifier son résultat après coup."
        type: boolean
        default: false
        required: false

# Un seul deploy à la fois : deux pushs rapprochés lançaient deux deploy.sh
# CONCURRENTS sur le VPS (constaté au deploy v7.1.0 : le `compose up` du run N
# a tenté de recréer un conteneur que le `compose down` du run N+1 venait de
# supprimer → run N rouge). File d'attente sans annulation : le dernier push
# attend son tour et déploie l'état final.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  # ── Job 0 : Attente du verdict CI (D29, 2026-07-26) ───────────────────────
  #
  # AVANT : push sur main = CI et Deploy lancés EN PARALLÈLE. La prod recevait le
  # code avant tout verdict, et un rouge n'avait aucune conséquence (40 % des runs
  # rouges sur main en 14 jours, sans effet visible : c'est comme ça que la dette
  # de CI s'est installée). MAINTENANT : le déploiement attend que le run CI DU
  # MÊME COMMIT soit vert.
  #
  # Pourquoi une boucle de sondage et pas un déclencheur `workflow_run` : ce dernier
  # ne supporte NI `paths-ignore` (on redéploierait la prod pour un renommage de
  # note d'agent — le défaut corrigé le 2026-07-26) NI un `concurrency` fondé sur la
  # branche poussée, et il perd le lien direct avec le sha poussé.
  attente-ci:
    name: Attente du verdict CI
    runs-on: ubuntu-latest
    # 60 min : la CI complète dure ~25-30 min (job go-coverage ~22 min). La boucle
    # s'arrête d'elle-même à 55 min pour rendre un message explicite AVANT que
    # GitHub ne tue le job (un job tué ne dit rien de la cause).
    timeout-minutes: 60
    # Permission déclarée ICI et pas au niveau workflow (qui reste `{}`) : seul ce
    # job lit l'API Actions. Aucun checkout, aucun accès au contenu du dépôt.
    permissions:
      actions: read
    # Sauté dans deux cas SEULEMENT :
    #   - soupape d'urgence (workflow_dispatch + ignorer_attente_ci) ;
    #   - déclenchement manuel hors main (le job deploy ne déploiera pas de toute
    #     façon — inutile de sonder la CI d'une branche pendant 55 min).
    # Un job SAUTÉ ferait sauter ses dépendants par défaut : c'est pourquoi le job
    # deploy porte `!failure() && !cancelled()` (cf. sa condition).
    if: ${{ github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.ignorer_attente_ci) }}
    steps:
      - name: Attendre que la CI de ce commit soit verte
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Le workflow CI est identifié par son FICHIER (ci.yml) et non par son nom
          # d'affichage : le fichier est ce que le dépôt contrôle, et c'est déjà
          # l'ancre du garde-rail Go. Le renommer/déplacer fait répondre 404 à l'API
          # → échec explicite ci-dessous (jamais une attente silencieuse).
          WORKFLOW="ci.yml"
          INTERVALLE=30
          MAX_SONDAGES=110 # 110 x 30 s = 55 min, sous le timeout-minutes du job
          ERR_FILE="${RUNNER_TEMP}/gh_api_err.txt"

          echo "Commit surveillé  : $SHA"
          echo "Workflow attendu  : .github/workflows/$WORKFLOW"
          echo "Sondage           : toutes les ${INTERVALLE}s, ${MAX_SONDAGES} fois max"

          dernier_etat=""
          for i in $(seq 1 "$MAX_SONDAGES"); do
            if ! reponse=$(gh api "repos/${REPO}/actions/workflows/${WORKFLOW}/runs?head_sha=${SHA}&per_page=100" 2>"$ERR_FILE"); then
              if grep -qi "not found" "$ERR_FILE"; then
                echo "::error::Workflow .github/workflows/${WORKFLOW} introuvable via l'API Actions (renommé ou supprimé ?). Ce job doit être mis à jour — le déploiement est refusé plutôt que de partir sans verdict."
                head -5 "$ERR_FILE"
                exit 1
              fi
              # Erreur probablement transitoire (5xx, rate limit) : on retente. La
              # borne de la boucle garantit qu'une panne durable finit en échec.
              echo "::warning::Appel API en échec, nouvelle tentative dans ${INTERVALLE}s"
              head -3 "$ERR_FILE"
              sleep "$INTERVALLE"
              continue
            fi

            # Plusieurs runs possibles pour un même sha (re-run, run de PR) : on ne
            # regarde que le PLUS RÉCENT.
            ligne=$(printf '%s' "$reponse" | jq -r '
              [.workflow_runs[]?] | sort_by(.run_started_at // .created_at) | last
              | if . == null then "absent - -"
                else "\(.status) \(.conclusion // "-") \(.html_url)" end' 2>/dev/null || echo "illisible - -")
            statut=${ligne%% *}
            reste=${ligne#* }
            conclusion=${reste%% *}
            url=${reste#* }

            case "$statut" in
              completed)
                case "$conclusion" in
                  success)
                    echo "[OK] CI verte pour ce commit — déploiement autorisé"
                    echo "   Run : $url"
                    exit 0
                    ;;
                  skipped | neutral)
                    # Pas un rouge : la CI n'a rendu aucun verdict (tous les jobs
                    # sautés). On laisse passer en le SIGNALANT plutôt que de bloquer
                    # un déploiement légitime sur un cas dégénéré.
                    echo "::warning::CI conclue « ${conclusion} » (aucun verdict rendu) — déploiement autorisé, à vérifier : $url"
                    exit 0
                    ;;
                  *)
                    echo "::error::CI rouge — déploiement refusé. Corriger puis re-pousser, ou lancer manuellement le workflow « Deploy to VPS » avec ignorer_attente_ci pour une urgence."
                    echo "   Conclusion CI : ${conclusion}"
                    echo "   Run : $url"
                    exit 1
                    ;;
                esac
                ;;
              absent)
                etat="aucun run CI enregistré pour ce commit"
                ;;
              illisible)
                etat="réponse API illisible (nouvelle tentative)"
                ;;
              *)
                etat="CI en cours (statut : ${statut})"
                ;;
            esac

            if [ "$etat" != "$dernier_etat" ]; then
              echo "[$(date -u +%H:%M:%SZ)] ${etat}"
              dernier_etat="$etat"
            elif [ $((i % 10)) -eq 0 ]; then
              echo "[$(date -u +%H:%M:%SZ)] toujours en attente (sondage ${i}/${MAX_SONDAGES})"
            fi
            sleep "$INTERVALLE"
          done

          echo "::error::Aucun verdict CI après $((MAX_SONDAGES * INTERVALLE / 60)) min pour ${SHA} — déploiement refusé."
          echo "   Dernier état observé : ${dernier_etat:-aucun}"
          echo "   Si AUCUN run CI n'a jamais été enregistré, l'invariant de déclenchement est rompu :"
          echo "   le paths-ignore de ci.yml doit rester un SOUS-ENSEMBLE de celui de deploy.yml, et"
          echo "   la branche poussée doit figurer dans le filtre « branches » de ci.yml (garde-rail :"
          echo "   apps/go-api/internal/archlint/ci_deploy_triggers_test.go)."
          exit 1

  # ── Job 1 : Pré-validation rapide (syntaxe — ne nécessite pas de SSH) ──────
  pre-check:
    name: Pré-validation deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Validation workflows GitHub Actions (actionlint)
        # actionlint : binaire Go natif, validation sémantique GitHub Actions
        # (script officiel rhysd/actionlint). Remplace l'ancien python3+pyyaml.
        #
        # VERSION PINNÉE (2026-07-26) : le script d'installation était tiré de
        # `main` et sans argument de version → il installait le DERNIER actionlint
        # publié. Une nouvelle version durcissant des règles a rougi 11 runs les
        # 17-18/07 sur des findings INFO, sans aucun changement de notre côté. Le
        # tag du script + la version explicite rendent ce step reproductible.
        # Montée de version = geste volontaire (changer les deux occurrences ici
        # et dans test-deploy-precheck.yml, qui doivent rester identiques).
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - name: Validation syntaxe Bash (scripts/*.sh)
        run: |
          errors=0
          for f in scripts/*.sh; do
            [[ -f "$f" ]] || continue
            if bash -n "$f" 2>&1; then echo "  ✅ $f"
            else echo "  ❌ $f"; errors=$((errors + 1)); fi
          done
          exit $errors

      - name: Pas de répertoires fantômes à la racine
        run: |
          for f in db_profiles.json app_settings.json; do
            if [[ -d "$f" ]]; then
              echo "  ❌ $f est un répertoire — volume Docker corrompu"
              exit 1
            fi
          done
          echo "  ✅ Aucun répertoire fantôme à la racine"

  # ── Job 2 : Déploiement VPS ────────────────────────────────────────────────
  deploy:
    name: Deploy lvelup.info
    runs-on: ubuntu-latest
    needs: [attente-ci, pre-check]
    # Trois choses dans cette condition (D29, 2026-07-26) :
    #   - `github.ref == refs/heads/main` : SEULE autorisation de déployer. Le
    #     workflow_dispatch de la soupape d'urgence peut être lancé depuis
    #     n'importe quelle branche ; rien d'autre que main ne part en prod.
    #   - `!failure()` : bloque le déploiement si un `needs` a ÉCHOUÉ (CI rouge via
    #     attente-ci, ou pré-validation rouge).
    #   - `!cancelled()` : ne déploie pas un run annulé.
    # Ce n'est PAS un `if` cosmétique : `attente-ci` peut être légitimement SAUTÉ
    # (soupape d'urgence) et GitHub saute par défaut les jobs qui dépendent d'un job
    # sauté. Sans cette condition, la soupape ne déploierait jamais rien.
    if: ${{ github.ref == 'refs/heads/main' && !failure() && !cancelled() }}
    # 50 min : DOIT rester au-dessus du `command_timeout: 40m` de l'action SSH
    # ci-dessous, sinon GitHub tuerait le job avant que l'action puisse rapporter
    # son propre timeout (et le VPS resterait à moitié déployé sans message clair).
    timeout-minutes: 50

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          # Défaut appleboy = 10m : tué le build v7.2.0 en plein go build (2 vCPU,
          # 3 binaires CGO à compiler après invalidation du layer source). 40m.
          command_timeout: 40m
          script: |
            git config --global --add safe.directory /opt/levelup
            cd /opt/levelup
            bash /opt/levelup/scripts/deploy.sh

  # ── Job 3 : Regen données démo ────────────────────────────────────────────
  deploy-demo:
    name: Regen demo.lvelup.info
    runs-on: ubuntu-latest
    needs: deploy
    # 50 min : même garde que le job deploy (command_timeout: 40m côté action).
    timeout-minutes: 50

    steps:
      - name: Regen données démo via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          # Même garde que le job deploy : build image demo possible (piège n°4).
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /opt/levelup

            # Regen données démo — NON DESTRUCTIF (incident 2026-06-05).
            # On NE supprime PAS data/demo/warehouse|players AVANT le seed : seed-demo
            # est idempotent (os.Remove par fichier puis recrée). Supprimer d'abord =
            # si le seed échoue (ex: binaire levelup absent), la démo reste vidée.
            # On nettoie uniquement les répertoires fantômes que Docker crée à la place
            # d'un JSON absent au bind-mount ; les fichiers valides sont écrasés par seed-demo.
            for f in data/demo/db_profiles.json data/demo/app_settings.json; do
              if [[ -d "$f" ]]; then
                rm -rf "$f"
                echo "[regen] Répertoire fantôme supprimé: $f"
              fi
            done

            # Permissions fixées automatiquement par docker-entrypoint.sh (gosu pattern)
            mkdir -p data/demo

            # Garde anti-crash-loop : si une tache de fond hote (cmd/[b]ackfill_*) tient
            # le lock DuckDB, stopper la prod l'empecherait de rouvrir (cf. memoire
            # deploy_hazards). On SKIP le regen sans faire echouer le deploiement (la
            # demo garde ses donnees sur disque). Le motif [b]ackfill evite que pgrep
            # matche le mot dans sa propre ligne de commande (faux positif permanent).
            # Cette garde DOIT rester avant tout `docker compose stop` : sur ce chemin
            # rien n'a encore ete arrete, prod ET demo restent donc en ligne telles quelles.
            if pgrep -f '[b]ackfill' >/dev/null 2>&1; then
              echo "[regen] Tache de fond hote detectee — regen demo SKIP (prod preservee)"
              exit 0
            fi

            # seed-demo lit les DB source du joueur JGtm que la PROD tient verrouillées
            # (lock DuckDB mono-writer) → on stoppe la prod le temps du seed (~5-10 s),
            # puis on la REDÉMARRE TOUJOURS (même si le seed échoue, sinon prod down).
            # Pas de `levelup seed` ici : seed-demo COPIE la metadata prod (référentiels
            # + rank_translations déjà présents) ; l'ancien `levelup seed` verrouillait
            # la metadata prod = cause de l'échec historique de ce job.
            #
            # La DÉMO est stoppée elle aussi. NE PAS retirer cet arrêt en le croyant
            # superflu (ajouté le 2026-07-26, défaut constaté au deploy v7.2.1) : le seed
            # des échantillons Prestige ATTACHe data/demo/warehouse/metadata.duckdb en
            # READ_ONLY pour dériver les jalons du VRAI catalogue du titre
            # (insertDemoMilestonesEarned, apps/go-api/internal/ops/seed_demo_prestige.go).
            # Le conteneur levelup-demo tient ce fichier ouvert : tant qu'il tournait,
            # l'ATTACH échouait sur « Could not set lock on file … Conflicting lock is
            # held in PID 0 » et milestone_earned restait à 0 sur les deux titres —
            # silencieusement, l'erreur étant best-effort côté Go (WARN « jalons
            # débloqués non seedés »). Vérifié sur pièces : seed rejoué démo arrêtée →
            # milestone_earned passe de 0 à 6 par titre.
            #
            # Corollaire : la démo DOIT revenir en ligne sur TOUS les chemins de sortie
            # (seed KO, garde configs en échec, erreur inattendue sous `set -e`, session
            # SSH coupée) — sinon cet arrêt transforme un défaut cosmétique en démo
            # durablement hors ligne. D'où le trap ci-dessous : SEUL endroit qui recrée
            # le conteneur démo (--force-recreate = nouvelle data + image + mounts à
            # jour). Armé APRÈS la garde pgrep (qui sort sans avoir rien arrêté) et
            # AVANT le stop, donc aucune fenêtre où la démo serait arrêtée sans filet.
            # Le `up -d levelup` du trap n'est PAS le redémarrage nominal de la prod
            # (qui reste explicite plus bas, juste après le seed) : c'est un filet
            # idempotent — no-op si la prod tourne déjà — pour les sorties anticipées
            # (signal/session SSH coupée) survenant avant ce redémarrage nominal.
            # Le trap préserve le code de sortie en cours et le force à 1 si une
            # remise en service échoue : un job vert ne peut pas masquer un service à terre.
            _regen_restart_services() {
              _rc=$?
              trap - EXIT INT TERM HUP   # pas de 2e passage via le trap EXIT
              docker compose up -d levelup \
                || { _rc=1; echo "[regen] ❌ levelup (prod) n'a PAS redémarré — logs : docker compose logs levelup"; }
              echo "[regen] Recréation du conteneur démo..."
              if docker compose up -d --force-recreate levelup-demo; then
                echo "[regen] ✅ levelup-demo recréé avec les données fraîches"
              else
                echo "[regen] ❌ levelup-demo n'a PAS redémarré — logs : docker compose logs levelup-demo"
                _rc=1
              fi
              exit "$_rc"
            }
            trap _regen_restart_services EXIT INT TERM HUP

            echo "[regen] Stop prod + démo (libère les locks des DB source ET de la metadata démo)..."
            docker compose stop levelup levelup-demo

            # Indexation des captures Halo 5 (mp4 web-natifs servis en direct) : associe
            # chaque clip à son match h5 par timestamp et écrit media_files/associations
            # dans shared_social h5 — lues ensuite par seed-demo pour extraire des clips
            # démo (extractDemoMediaH5). Best-effort + IDEMPOTENT (re-association). Requiert
            # ffmpeg (miniatures) — présent sur le VPS. Prod+démo stoppées → DB libres.
            # buffer-min 10 : les captures Game Bar sont prises en FIN de match (delta jusqu'à
            # ~8 min vs start_time). captures-dir = {media base}/JGtm (résolu par la CLI).
            echo "[regen] Index media Halo 5 (captures → associations)..."
            docker compose run --rm levelup \
              levelup index-media --gamertag JGtm --title halo_5 --buffer-min 10 \
              || echo "[regen] ⚠️ index-media halo_5 a échoué (pas de clip H5 ce regen)"

            # seed-demo seede désormais TOUS les titres où JGtm a des données (dérivés de
            # db_profiles) : halo_infinite (flux HLS) + halo_5 (clips mp4 indexés ci-dessus).
            docker compose run --rm levelup \
              levelup seed-demo --gamertag JGtm --service-tag SPTA --out data/demo --max-media 12 \
              || echo "[regen] ⚠️ seed-demo a échoué — données démo inchangées (prod redémarrée juste après, conteneur démo recréé à la sortie)"
            echo "[regen] Restart prod..."
            docker compose up -d levelup

            # [Guard] Vérification post-regen — les configs doivent être des fichiers.
            ok=true
            for f in data/demo/db_profiles.json data/demo/app_settings.json; do
              if [[ -d "/opt/levelup/$f" ]]; then
                echo "[regen] ❌ $f est un répertoire (regen incomplet)"; ok=false
              else
                echo "[regen] ✅ $f OK"
              fi
            done
            $ok || { echo "[regen] ❌ Configs démo invalides — prod déjà redémarrée ; la recréation du conteneur démo (trap de sortie) va échouer sur le bind-mount"; exit 1; }

            # Fin du corps du script : le conteneur démo est recréé par le trap de sortie
            # armé plus haut, sur CE chemin comme sur tous les autres. Ne pas rajouter de
            # `docker compose up -d levelup-demo` ici — ce serait un second endroit à
            # maintenir, et surtout un chemin de sortie non couvert de plus.
