name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  # ── Job 0 : Pré-validation rapide (syntaxe — ne nécessite pas de SSH) ──────
  pre-check:
    name: Pré-validation deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validation workflows GitHub Actions (actionlint)
        # actionlint : binaire Go natif, validation sémantique GitHub Actions
        # (script officiel rhysd/actionlint). Remplace l'ancien python3+pyyaml.
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Validation syntaxe Bash (scripts/*.sh)
        run: |
          errors=0
          for f in scripts/*.sh; do
            [[ -f "$f" ]] || continue
            if bash -n "$f" 2>&1; then echo "  ✅ $f"
            else echo "  ❌ $f"; errors=$((errors + 1)); fi
          done
          exit $errors

      - name: Pas de répertoires fantômes à la racine
        run: |
          for f in db_profiles.json app_settings.json; do
            if [[ -d "$f" ]]; then
              echo "  ❌ $f est un répertoire — volume Docker corrompu"
              exit 1
            fi
          done
          echo "  ✅ Aucun répertoire fantôme à la racine"

  # ── Job 1 : Déploiement VPS ────────────────────────────────────────────────
  deploy:
    name: Deploy levelup.fr
    runs-on: ubuntu-latest
    needs: pre-check

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            git config --global --add safe.directory /opt/levelup
            cd /opt/levelup
            bash /opt/levelup/scripts/deploy.sh

  # ── Job 2 : Regen données démo ────────────────────────────────────────────
  deploy-demo:
    name: Regen demo.levelup.info
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Regen données démo via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/levelup

            # Regen données démo
            # Note : on supprime uniquement les données, PAS les fichiers de config stub.
            # Les stubs (créés par scripts/deploy.sh) évitent que Docker crée des répertoires
            # fantômes si le regen échoue en cours de route.
            rm -rf data/demo/warehouse data/demo/players/DEMO/stats.duckdb
            # Supprimer les JSON — fichier ou répertoire fantôme (docker crée un dossier
            # si le fichier n'existe pas au moment du bind-mount)
            for f in data/demo/db_profiles.json data/demo/app_settings.json; do
              if [[ -d "$f" ]]; then
                rm -rf "$f"
                echo "[regen] 🧹 Répertoire fantôme supprimé: $f"
              elif [[ -f "$f" ]]; then
                rm -f "$f"
              fi
            done

            # Permissions fixées automatiquement par docker-entrypoint.sh (gosu pattern)
            mkdir -p data/demo

            docker compose run --rm levelup \
              levelup seed career-ranks citation-mappings medals
            # TODO: remplacer par la commande Go de génération des données démo
            # (équivalent de l'ancien scripts/prepare_demo_data.py --gamertag JGtm --max-matches 50 --service-tag SPTA --out data/demo)

            # [Guard] Vérification post-regen — les fichiers doivent exister et être des fichiers
            echo "[regen] Vérification fichiers post-regen..."
            ok=true
            for f in data/demo/db_profiles.json data/demo/app_settings.json; do
              fp="/opt/levelup/$f"
              if [[ -d "$fp" ]]; then
                echo "[regen] ❌ ERREUR : $f est un répertoire (regen a échoué + Docker a créé un fantôme)"
                ok=false
              else
                echo "[regen] ✅ $f OK"
              fi
            done
            $ok || { echo "[regen] ❌ Abandon — levelup-demo ne sera pas redémarré"; exit 1; }

            # Redémarrer levelup-demo avec les nouvelles données
            docker compose stop levelup-demo
            docker compose up -d levelup-demo
            echo "[regen] ✅ levelup-demo redémarré"
