name: CI

on:
  push:
    branches: [main, feature/*, refactor/*, fix/*, docs/*]
  pull_request:
    branches: [main]

jobs:
  fast-data-contracts:
    name: Fast Data Contracts (PR + push main)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run fast data contracts
        run: |
          python -m pytest tests/test_data_contract_medals.py tests/test_data_contract_performance_metrics.py tests/test_data_contract_shots_accuracy.py tests/test_data_contract_participants.py tests/test_data_contract_assets_aliases.py -q --tb=short

      - name: Run filters/visualization non-regression
        run: |
          python -m pytest tests/test_filters_and_visualization_contracts.py -q --tb=short

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install spnkr (Python 3.11+ uniquement)
        if: matrix.python-version != '3.10'
        run: pip install -e ".[spnkr]"

      - name: Verify DuckDB installation
        run: |
          python -c "import duckdb; print(f'DuckDB version: {duckdb.__version__}')"
          python -c "import bitstring; print(f'bitstring: {bitstring.__version__}')"

      - name: Prepare data directory (metadata prebuilt)
        run: |
          mkdir -p data/warehouse
          unzip -o data/warehouse/metadata-prebuilt.zip -d data/warehouse/ 2>/dev/null || true

      - name: Run tests
        env:
          LEVELUP_DATA: ${{ github.workspace }}/data
        run: |
          python -m pytest tests/ -v --tb=short --ignore=tests/integration --ignore=tests/e2e

      - name: Run visualization tests
        env:
          LEVELUP_DATA: ${{ github.workspace }}/data
        run: |
          python -m pytest tests/test_visualizations.py -v --tb=short -m visualization

      - name: Run DuckDB-specific tests
        env:
          LEVELUP_DATA: ${{ github.workspace }}/data
        run: |
          python -m pytest tests/test_duckdb_repository.py tests/test_materialized_views.py -v --tb=short || true

      - name: Check types (Pylance/Pyright)
        continue-on-error: true
        run: |
          pip install pyright
          pyright src/

  frontend:
    name: Frontend (TypeScript + Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Type-check
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint --if-present

      - name: Build (Vite)
        run: npm run build

      - name: Run tests (Vitest)
        run: npm run test --if-present -- --run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting (Black)
        run: black --check --diff src/ tests/ || true

      - name: Check imports (isort)
        run: isort --check-only --diff src/ tests/ || true

      - name: Lint (Ruff)
        run: ruff check src/ tests/ --output-format=github

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code size limits
        run: python scripts/enforce_size_limits.py

      - name: Check imports health
        run: python scripts/validate_imports.py || true

  go-build:
    name: Go Build + Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      - name: go vet (domain + analysis — sans CGo)
        run: go vet ./internal/domain/... ./internal/analysis/...
        env:
          CGO_ENABLED: "0"

      - name: go build (contracttest — sans CGo)
        run: go build ./contracttest/...
        env:
          CGO_ENABLED: "0"

      - name: go test (unit, no CGo DB)
        run: go test ./internal/domain/... ./internal/analysis/... ./contracttest/... -timeout 60s -count=1
        env:
          CGO_ENABLED: "0"
          LEVELUP_DEMO_MODE: "true"

  go-lint:
    name: Go Lint (golangci-lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      # golangci-lint : équivalent ruff + ruff-format + enforce_size_limits + McCabe pour Go
      # Règles : gocyclo max 12 / funlen 80L / lll 100c / revive argument-limit 5
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          working-directory: apps/go-api
          args: --timeout 5m

  go-coverage:
    name: Go Coverage (seuil 50%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      - name: go test with coverage (domain + analysis + contracttest)
        run: |
          go test -coverprofile=coverage.out -covermode=atomic \
            ./internal/domain/... ./internal/analysis/... ./contracttest/... \
            -timeout 60s -count=1
        env:
          CGO_ENABLED: "0"
          LEVELUP_DEMO_MODE: "true"

      - name: Check coverage threshold (min 50% — Sprint 35)
        run: |
          total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${total}%"
          awk "BEGIN { exit (${total:-0} < 50) }" || \
            { echo "FAIL: couverture ${total:-0}% < seuil 50%"; exit 1; }

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-report
          path: apps/go-api/coverage.out

  go-golden-test:
    name: Go Golden Test (parité endpoints)
    runs-on: ubuntu-latest
    # CGo requis pour DuckDB — ubuntu-latest dispose de gcc
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps (duckdb + httpx)
        run: pip install duckdb httpx

      - name: Create test fixtures DuckDB
        env:
          LEVELUP_REPO_ROOT: ${{ github.workspace }}
        run: python apps/go-api/tests/create_test_fixture.py

      - name: Build Go server (CGo DuckDB)
        working-directory: apps/go-api
        run: |
          go build \
            -ldflags "-X main.version=ci-golden" \
            -o bin/levelup-server \
            ./cmd/server/
        env:
          CGO_ENABLED: "1"

      - name: Start Go server (mode démo)
        run: |
          LEVELUP_DEMO_MODE=true \
          LEVELUP_REPO_ROOT=${{ github.workspace }} \
          apps/go-api/bin/levelup-server &
          # Attendre que l'API réponde (max 20s)
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && echo "Server ready" && break
            sleep 1
          done

      - name: Run parity check vs golden values
        working-directory: apps/go-api
        env:
          LEVELUP_GO_URL: "http://localhost:8000"
          LEVELUP_PLAYER: "DEMO"
        run: python scripts/parity_check.py --go-url http://localhost:8000

      - name: Assert zéro diffs critiques
        run: |
          python - <<'EOF'
          import json, sys, pathlib
          report = pathlib.Path("apps/go-api/tests/fixtures/parity_report.json")
          if not report.exists():
              print("Rapport parity_report.json absent — parity_check.py n'a pas tourné")
              sys.exit(1)
          data = json.loads(report.read_text())
          failed = [r for r in data.get("results", []) if r.get("status") == "fail"]
          print(f"Résultats : {len(data.get('results', []))} tests, {len(failed)} échecs")
          if failed:
              for f in failed:
                  print(f"  FAIL: {f.get('name')} — {f.get('error', '')[:120]}")
              sys.exit(1)
          print("OK — tous les golden tests passent")
          EOF

      - name: Upload parity report (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: apps/go-api/tests/fixtures/parity_report.json
          retention-days: 7

  go-openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate openapi.yaml (spectral)
        uses: stoplightio/spectral-action@v0.8.11
        with:
          file_glob: apps/go-api/api/openapi.yaml

  go-contract-test:
    name: Go Contract Test (OpenAPI YAML)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      # Tests YAML-only : vérifie que openapi.yaml est valide, complet (≥20 paths)
      # et que les paths obligatoires (health, bootstrap, settings…) sont présents.
      # CGO_ENABLED=0 : aucune dépendance platform/duckdb.
      - name: Run contract tests
        run: |
          go test ./contracttest/... -run TestContract -v -timeout 30s
        env:
          CGO_ENABLED: "0"
          LEVELUP_DEMO_MODE: "true"

  e2e-react:
    name: E2E React (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers (Chromium uniquement)
        run: npx playwright install chromium --with-deps

      - name: Set up Go (backend démo)
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      - name: Build Go backend
        working-directory: apps/go-api
        run: CGO_ENABLED=0 go build -o levelup-api ./cmd/api/
        env:
          CGO_ENABLED: "0"

      - name: Start backend in demo mode
        working-directory: apps/go-api
        run: |
          LEVELUP_DEMO_MODE=true LEVELUP_API_PORT=8000 ./levelup-api &
          echo "Backend PID: $!"
          # Attendre que l'API réponde (max 30s)
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
        env:
          CGO_ENABLED: "0"
          LEVELUP_DEMO_MODE: "true"

      - name: Start frontend dev server
        run: |
          VITE_API_BASE_URL=http://localhost:8000 npm run dev &
          echo "Frontend PID: $!"
          # Attendre que Vite soit prêt (max 30s)
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 && break
            sleep 1
          done
        env:
          VITE_API_BASE_URL: "http://localhost:8000"

      - name: Run Playwright tests
        run: |
          npx playwright test \
            --project=chromium \
            --reporter=list \
            --timeout=30000 \
            --retries=2
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: "http://localhost:5173"

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
