name: CI

on:
  # Push : couvre les conventions de branches réellement utilisées dans le repo
  # (git branch -r au 2026-07-12). Historiquement seuls feature/* / refactor/* /
  # fix/* / docs/* / chore/* déclenchaient la CI en push : les branches `feat/*`
  # (préfixe majoritaire, 37 branches) n'étaient PAS couvertes → 2 chantiers de la
  # campagne 2026-07 ont navigué sans CI complète. `**` (au lieu de `*`) matche aussi
  # les sous-segments. Les branches bot (copilot/*, dependabot/*) passent par la CI
  # via le trigger pull_request, inutile de les déclencher en push.
  push:
    branches:
      [
        main,
        feat/**,
        feature/**,
        fix/**,
        hotfix/**,
        refactor/**,
        perf/**,
        docs/**,
        chore/**,
        integration/**,
      ]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (TypeScript + Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Type-check
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint --if-present

      - name: Lint multi-titres (no hardcoded FieldKey)
        run: npm run lint:fields

      - name: Guard — feedback-drawer ne doit pas importer le wrapper api
        run: |
          if grep -E "^import.*\\bapi\\b.*from.*['\"]@/lib/api/client" apps/web/src/features/feedback-drawer/queries.ts; then
            echo "::error::feedback-drawer/queries.ts ne doit JAMAIS importer { api } — il leakerait X-LevelUp-Title et les cookies de session vers GitHub. Utiliser fetch() direct avec credentials: 'omit'."
            exit 1
          fi

      - name: Build (Vite)
        run: npm run build

      - name: Run tests (Vitest) + coverage
        # P3.8 (revue 2026-04-29) : activation Vitest coverage en CI.
        # Pas de ratchet pour l'instant (baseline a etablir une fois par main).
        # Le rapport HTML est uploade en artefact pour debug.
        run: npm run test:coverage --if-present

      - name: Upload coverage report (Vitest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-html
          path: apps/web/coverage/
          if-no-files-found: warn
          retention-days: 7

  go-build:
    name: Go Build + Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      - name: go vet (domain + analysis — sans CGo)
        run: go vet ./internal/domain/... ./internal/analysis/...
        env:
          CGO_ENABLED: "0"

      - name: go build (contracttest — sans CGo)
        run: go build ./contracttest/...
        env:
          CGO_ENABLED: "0"

      - name: go test (unit, no CGo DB)
        run: go test ./internal/domain/... ./internal/analysis/... ./contracttest/... -timeout 60s -count=1
        env:
          CGO_ENABLED: "0"
          LEVELUP_DEMO_MODE: "true"
          # P6.1 (revue 2026-04-29) : flag MULTI_TITLE_API_ENABLED active en CI
          # pour exercer les chemins multi-titres (sinon le code derriere le flag
          # reste non couvert).
          MULTI_TITLE_API_ENABLED: "true"
          # P3.4 : flag PRESTIGE_ENABLED active en CI pour exercer les ~21 routes
          # Prestige (smoke tests + route registration).
          PRESTIGE_ENABLED: "true"

  go-lint:
    name: Go Lint (golangci-lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      # fetch-depth: 0 requis par le ratchet --new-from-* : le calcul de la base
      # (merge-base contre origin/main, ou commit parent sur main) a besoin de
      # l'historique complet et de la ref origin/main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      # golangci-lint : équivalent ruff + ruff-format + enforce_size_limits + McCabe pour Go
      # Règles : gocyclo max 12 / funlen 80L / lll 100c / revive argument-limit 5
      # Config en format v2 (migration 2026-05-20, branche v1 abandonnée depuis mars 2025).
      #
      # RATCHET LINT PÉRENNE (2026-07-12) — remplace `only-new-issues: true`.
      # POURQUOI : `only-new-issues` récupérait le patch du diff via l'API GitHub,
      # qui refuse les PR > 20 000 lignes ("failed to fetch push patch ... Not
      # Found"). L'action retombait alors sur TOUTE la dette gelée (~479 issues :
      # goconst, noctx, funlen, gocyclo) → faux rouge (vécu sur la PR #54) ; le job
      # était aussi rouge en push sur main depuis des semaines. Le ratchet
      # `--new-from-*` compare au niveau git (indépendant de la taille du diff,
      # aucune dépendance à l'API GitHub) :
      #   - branches / PR : base = merge-base(origin/main, HEAD) → seules les issues
      #     AJOUTÉES par la branche rougissent, quelle que soit l'avance de main ;
      #   - push sur main : base = commit parent (github.event.before) → toute issue
      #     introduite par le push rougit ; main reste vert tant qu'on n'ajoute rien.
      # La dette gelée (~479) reste invisible tant qu'aucune ligne fautive n'est
      # ajoutée. golangci-lint v2.12.2 supporte --new-from-merge-base (dispo v1.55).
      # RETRAIT : quand la dette tend vers 0, repasser à un `golangci-lint run ./...`
      # plein (sans --new-from-*) — critère mesurable : 0 issue sur un run complet.
      - name: Calculer la base du ratchet lint
        id: lint_base
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            echo "args=--new-from-rev=$BEFORE" >> "$GITHUB_OUTPUT"
            echo "Ratchet main : --new-from-rev=$BEFORE"
          else
            echo "args=--new-from-merge-base=origin/main" >> "$GITHUB_OUTPUT"
            echo "Ratchet branche/PR : --new-from-merge-base=origin/main"
          fi

      - name: golangci-lint (ratchet)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: apps/go-api
          # only-new-issues volontairement absent (défaut false) : le ratchet passe
          # par les flags --new-from-* ci-dessous, jamais par l'API GitHub.
          args: --timeout 5m ${{ steps.lint_base.outputs.args }}

  go-lease-enforcement:
    name: Go Lease Enforcement (ADR 0013)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v7

      - name: Check lease enforcement (no direct DB writes in service/handlers)
        run: bash scripts/check_lease_enforcement.sh

  go-baseline-tests:
    name: Go Baseline Tests (non-régression)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      - name: Vérifier GCC (CGO requis pour DuckDB)
        run: gcc --version

      - name: Vérifier suite baseline de tests pré-migration
        run: bash ../../scripts/check_test_baseline.sh tests
        env:
          CGO_ENABLED: "1"
          LEVELUP_DEMO_MODE: "true"
          MULTI_TITLE_API_ENABLED: "true"
          PRESTIGE_ENABLED: "true"

  go-coverage:
    name: Go Coverage (CGO_ENABLED=1 — ./... complet)
    # ubuntu-latest dispose de GCC — CGO_ENABLED=1 fonctionne sans config supplémentaire
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      # S45 T8 — décision : CGO=0 fast-check = job go-build ; CGO=1 full = ce job.
      - name: Vérifier GCC (CGO requis pour DuckDB)
        run: gcc --version

      # S45 T1-2 : -coverpkg=./... garantit que les tests externes (golden, contracttest)
      # remontent la couverture des packages qu'ils exercent.
      # S45 T3 : exclusions gen/ et msal-poc/ via coverage_filter.sh
      # M2 (2026-07-05) : `-p 1` NON NÉGOCIABLE — le driver DuckDB est mono-process ;
      # en parallèle (défaut), platform/duckdb + sync se contendent, avortent avec des
      # durées FANTÔMES (~28000s) et MASQUENT les vraies défaillances → faux-vert
      # (incident 2026-07-03). timeout 600s = marge par package une fois sérialisé.
      - name: go test avec couverture complète (CGO + intégration)
        run: |
          go test \
            -coverprofile=coverage.raw \
            -covermode=atomic \
            -coverpkg=./... \
            -tags=integration \
            -timeout 600s \
            -count=1 \
            -p 1 \
            ./...
        env:
          CGO_ENABLED: "1"
          LEVELUP_DEMO_MODE: "true"
          # P6.1 / P3.4 (revue 2026-04-29) : flags actives en CI pour couvrir
          # les chemins multi-titres + Prestige.
          MULTI_TITLE_API_ENABLED: "true"
          PRESTIGE_ENABLED: "true"

      # S45 T3 : filtrer internal/api/gen/ et cmd/msal-poc/ du profil
      - name: Filtrer exclusions (gen/ + msal-poc/)
        run: bash scripts/coverage_filter.sh coverage.raw > coverage.out

      # S49 closure : ratchet via coverage_check.sh — seuil actuel = baseline 76.0%
      # Progressive : S45→15%, S46→35%, S47→55%, S48→70%, S49→76% (per-package mean, tous ≥ 50%)
      # platform/auth=66%, validation=52.9%, ops=51.4% — sync/migration exclus (integration only)
      - name: Vérifier ratchet couverture (vs coverage_baseline.txt)
        run: bash scripts/coverage_check.sh coverage.out coverage_baseline.txt
        env:
          CI: "true"
          GITHUB_REF: ${{ github.ref }}

      # S45 gate : rapport HTML accessible en artifact CI
      - name: Générer rapport HTML
        run: go tool cover -html=coverage.out -o coverage.html
        if: always()

      - name: Upload rapport HTML (artifact 30j)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-html
          path: apps/go-api/coverage.html
          retention-days: 30

      - name: Upload profil coverage.out
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-profile
          path: apps/go-api/coverage.out
          retention-days: 7

      # S51 : internal/sync absent du profil ./... (angle mort identifié audit Phase 11).
      # Ce step isole le package sync pour mesurer sa couverture réelle.
      - name: go test couverture internal/sync (CGO + intégration)
        run: |
          go test \
            -coverprofile=cov_sync.out \
            -covermode=atomic \
            -coverpkg=./internal/sync/... \
            -tags=integration \
            -timeout 600s \
            -count=1 \
            -p 1 \
            ./internal/sync/...
        env:
          CGO_ENABLED: "1"
          LEVELUP_DEMO_MODE: "true"

      - name: Afficher couverture internal/sync
        run: go tool cover -func=cov_sync.out | tail -5
        if: always()

      - name: Upload profil cov_sync.out
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage-sync
          path: apps/go-api/cov_sync.out
          retention-days: 7

  go-openapi-lint:
    name: OpenAPI Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate openapi.yaml (spectral)
        uses: stoplightio/spectral-action@v0.8.13
        with:
          file_glob: apps/go-api/api/openapi.yaml

  go-contract-test:
    name: Go Contract Test (OpenAPI YAML)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      # Tests YAML-only : vérifie que openapi.yaml est valide, complet (≥20 paths)
      # et que les paths obligatoires (health, bootstrap, settings…) sont présents.
      # CGO_ENABLED=0 : aucune dépendance platform/duckdb.
      - name: Run contract tests
        run: |
          go test ./contracttest/... -run TestContract -v -timeout 30s
        env:
          CGO_ENABLED: "0"
          LEVELUP_DEMO_MODE: "true"

  e2e-react:
    name: E2E React (Playwright)
    runs-on: ubuntu-latest
    # Coût ~3-5 min + flakiness retries=2, et les tests auth E2E exigent des
    # identifiants absents en CI → le job traînait ~48 min puis rougissait main.
    # Trigger : PR vers main UNIQUEMENT (verdict avant merge), jamais sur push
    # (n'allonge plus / ne bloque plus main). Pour lancer à la demande :
    # `cd apps/web && npx playwright test` localement.
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers (Chromium uniquement)
        run: npx playwright install chromium --with-deps

      - name: Set up Go (backend démo)
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      - name: Build Go backend
        working-directory: apps/go-api
        # CGO_ENABLED=1 obligatoire : cmd/server/ importe platform/duckdb qui
        # dépend de duckdb-go-bindings (binding C). ubuntu-latest fournit gcc.
        run: CGO_ENABLED=1 go build -o levelup-api ./cmd/server/
        env:
          CGO_ENABLED: "1"

      # Fixture démo SYNTHÉTIQUE (2026-07-13) — remplace le skip des specs
      # data-dépendantes. `levelup seed-demo --synthetic` construit data/demo/ (DuckDB
      # vierges migrées + INSERT déterministes ; aucune donnée réelle, aucune DB de
      # prod, aucun fichier externe). La sonde e2e/_helpers/demoData.ts résout alors
      # demo-player (200/503) → les ~60 specs data-dépendantes s'exécutent au lieu de
      # skipper. Détail : apps/web/e2e/README.md + internal/ops/seed_demo_synthetic.go.
      - name: Seed synthetic demo fixture
        working-directory: apps/go-api
        # CGO_ENABLED=1 : le générateur ouvre des DuckDB (binding C). ubuntu fournit gcc.
        run: |
          CGO_ENABLED=1 go build -o levelup ./cmd/levelup/
          ./levelup seed-demo --synthetic
        env:
          CGO_ENABLED: "1"

      - name: Start backend in demo mode
        working-directory: apps/go-api
        # LEVELUP_DEMO_LOCALE=fr : la vitrine démo force l'anglais par défaut (audience
        # internationale) ; les specs E2E vérifient l'UI FR → on pinne la locale française.
        run: |
          LEVELUP_DEMO_MODE=true LEVELUP_DEMO_LOCALE=fr LEVELUP_API_PORT=8000 ./levelup-api &
          echo "Backend PID: $!"
          # Attendre que l'API réponde (max 30s)
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
        env:
          LEVELUP_DEMO_MODE: "true"
          LEVELUP_DEMO_LOCALE: "fr"

      - name: Start frontend dev server
        # NE PAS définir VITE_API_BASE_URL : il remplacerait le préfixe `/api/v1` du
        # client par `http://localhost:8000`, produisant des URLs sans `/api/v1` (404).
        # L'app utilise donc le défaut relatif `/api/v1` → proxy Vite → backend démo.
        # VITE_API_PROXY_TARGET pointe le proxy sur le backend (défaut déjà 127.0.0.1:8000).
        run: |
          npm run dev &
          echo "Frontend PID: $!"
          # Attendre que Vite soit prêt (max 30s)
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5173 && break
            sleep 1
          done
        env:
          VITE_API_PROXY_TARGET: "http://127.0.0.1:8000"

      - name: Run Playwright tests
        run: |
          npx playwright test \
            --project=chromium \
            --reporter=list \
            --timeout=30000 \
            --retries=2
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: "http://localhost:5173"
          # Démo SYNTHÉTIQUE : certaines specs exigent des données d'un joueur RÉEL
          # (gamertags nommés, synergies, backfill engagement) et skippent alors avec
          # un motif (skipRequiresRealPlayer / engagement E2E_DEMO_MODE). Voir e2e/README.md.
          E2E_DEMO_MODE: "1"
          E2E_SYNTHETIC_DEMO: "1"

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
