name: CI

on:
  push:
    branches: [main, feature/*, refactor/*, fix/*, docs/*]
  pull_request:
    branches: [main]

jobs:
  fast-data-contracts:
    name: Fast Data Contracts (PR + push main)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run fast data contracts
        run: |
          python -m pytest tests/test_data_contract_medals.py tests/test_data_contract_performance_metrics.py tests/test_data_contract_shots_accuracy.py tests/test_data_contract_participants.py tests/test_data_contract_assets_aliases.py -q --tb=short

      - name: Run filters/visualization non-regression
        run: |
          python -m pytest tests/test_filters_and_visualization_contracts.py -q --tb=short

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install spnkr (Python 3.11+ uniquement)
        if: matrix.python-version != '3.10'
        run: pip install -e ".[spnkr]"

      - name: Verify DuckDB installation
        run: |
          python -c "import duckdb; print(f'DuckDB version: {duckdb.__version__}')"
          python -c "import bitstring; print(f'bitstring: {bitstring.__version__}')"

      - name: Prepare data directory (metadata prebuilt)
        run: |
          mkdir -p data/warehouse
          unzip -o data/warehouse/metadata-prebuilt.zip -d data/warehouse/ 2>/dev/null || true

      - name: Run tests
        env:
          LEVELUP_DATA: ${{ github.workspace }}/data
        run: |
          python -m pytest tests/ -v --tb=short --ignore=tests/integration --ignore=tests/e2e

      - name: Run visualization tests
        env:
          LEVELUP_DATA: ${{ github.workspace }}/data
        run: |
          python -m pytest tests/test_visualizations.py -v --tb=short -m visualization

      - name: Run DuckDB-specific tests
        env:
          LEVELUP_DATA: ${{ github.workspace }}/data
        run: |
          python -m pytest tests/test_duckdb_repository.py tests/test_materialized_views.py -v --tb=short || true

      - name: Check types (Pylance/Pyright)
        continue-on-error: true
        run: |
          pip install pyright
          pyright src/

  streamlit-smoke:
    name: Streamlit Smoke (pages/filtres/graphes)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Streamlit smoke tests
        run: |
          python -m pytest tests/test_page_router_smoke.py tests/test_page_router_regressions.py tests/test_navigation_state_regressions.py tests/test_filters_and_visualization_contracts.py tests/test_teammates_impact_tab.py -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check formatting (Black)
        run: black --check --diff src/ tests/ || true

      - name: Check imports (isort)
        run: isort --check-only --diff src/ tests/ || true

      - name: Lint (Ruff)
        run: ruff check src/ tests/ --output-format=github

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check code size limits
        run: python scripts/enforce_size_limits.py

      - name: Check imports health
        run: python scripts/validate_imports.py || true
