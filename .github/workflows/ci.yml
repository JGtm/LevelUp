name: CI

# Permissions minimales au niveau workflow (2026-07-26) : aucun job de cette CI
# n'écrit dans le dépôt (pas de commit, pas de commentaire de PR, pas de check
# écrit via l'API). `contents: read` suffit — c'est aussi ce dont a besoin
# actions/upload-artifact (qui passe par l'API artifacts, pas par le contenu du
# repo). Un job qui aurait besoin de plus doit déclarer ses propres `permissions`
# au niveau job, jamais élargir ce bloc.
permissions:
  contents: read

# FORME DU WORKFLOW (chantier b1016, étape E1) — durée visée : 15 à 20 minutes, bornée par le
# plus long lot Go (les deux moitiés du paquet `grammar`) plus la fusion ; le résumé du job
# `go-coverage-merge` donne la durée de chaque lot, c'est la mesure qui sert à rééquilibrer.
#   - la suite Go tourne en LOTS parallèles (job `go-coverage`, matrice), chacun sur sa machine
#     en `-p 1` (contrainte DuckDB mono-process, M2 2026-07-05) ; la définition des lots vit
#     dans .github/ci/go-shards.txt, le job `go-coverage-merge` rassemble verdicts et profils ;
#   - Vitest tourne en 3 lots (job `web-tests`) fusionnés par `web-coverage-merge` ;
#   - sur une branche de travail, le job `changes` saute les jobs de l'autre pile quand le
#     push ne touche qu'une pile (cf. le job) ; `main`, `feat/v75` et les PR rejouent TOUT.

# Un seul run par branche de travail à la fois : un push qui en suit un autre annule le run
# périmé. Sur `main` et `feat/v75`, chaque commit doit rendre son verdict (le déploiement attend
# celui du run de `main`, cf. `attente-ci` de deploy.yml) : le groupe y porte `github.run_id`,
# donc chaque run a son propre groupe. Sans cela, GitHub ne garde qu'UN run EN ATTENTE par groupe
# même avec `cancel-in-progress: false` : trois pushs rapprochés annuleraient le deuxième, et le
# déploiement de ce commit se refuserait. Le groupe porte aussi la ref : les runs de PR
# (refs/pull/N/merge) et de push ne s'annulent pas entre eux.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/v75') && github.run_id || 'travail' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/feat/v75' }}

on:
  # Push : couvre les conventions de branches réellement utilisées dans le repo
  # (git branch -r au 2026-07-12). Historiquement seuls feature/* / refactor/* /
  # fix/* / docs/* / chore/* déclenchaient la CI en push : les branches `feat/*`
  # (préfixe majoritaire, 37 branches) n'étaient PAS couvertes → 2 chantiers de la
  # campagne 2026-07 ont navigué sans CI complète. `**` (au lieu de `*`) matche aussi
  # les sous-segments. Les branches bot (copilot/*, dependabot/*) passent par la CI
  # via le trigger pull_request, inutile de les déclencher en push.
  push:
    branches:
      [
        main,
        feat/**,
        feature/**,
        fix/**,
        hotfix/**,
        refactor/**,
        perf/**,
        docs/**,
        chore/**,
        integration/**,
      ]
    # Journaux/plans d'agents en Markdown : aucun impact sur le code testé.
    # PRUDENCE (2026-07-26) : on ignore UNIQUEMENT le Markdown sous .ai/ —
    # `.ai/baselines/**` (tests_pre_migration.jsonl, coverage_pre_migration.*) est
    # une ENTRÉE du gate de non-régression (step « Vérifier suite baseline de tests
    # pré-migration » du job go-coverage-merge) : l'ignorer laisserait passer une
    # modification de baseline sans la rejouer. Ne PAS remplacer par `.ai/**`.
    # Le motif `**.md` (et non `**/*.md`) est celui documenté par GitHub pour
    # « tous les .md à toute profondeur » ; s'il ne matchait pas, la CI tournerait
    # quand même — le sens de l'échec est sûr.
    #
    # INVARIANT (D29, 2026-07-26) : cet ensemble doit rester un SOUS-ENSEMBLE du
    # `paths-ignore` de deploy.yml. Sinon un push pourrait déclencher le déploiement
    # SANS déclencher la CI, et le job `attente-ci` de deploy.yml sonderait un run
    # qui n'existera jamais. Garde-rail : TestCIPathsIgnoreSubsetOfDeployPathsIgnore
    # (apps/go-api/internal/archlint/ci_deploy_triggers_test.go).
    paths-ignore:
      - ".ai/**.md"
  pull_request:
    branches: [main]

jobs:
  # timeout-minutes sur TOUS les jobs (2026-07-26) : sans budget explicite, le
  # défaut GitHub est 360 min — un job bloqué (attente réseau, deadlock DuckDB,
  # serveur dev qui ne rend jamais la main) squattait un runner des heures avant
  # d'être tué, et le verdict de la CI arrivait trop tard pour servir. Chaque
  # valeur = ~2x la durée observée sur main, arrondie.

  # Filtre de chemins (E1.6) : dit quelle pile (Go, web) un push de branche de travail touche.
  #
  # CONTRAT, tenu par archlint/ci_paths_filter_test.go : tout job qui dépend de `changes`
  # (`needs: changes`) porte dans son `if:` le contournement
  #     github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
  #     || github.ref == 'refs/heads/feat/v75'
  # AVANT la lecture de la sortie `go` / `web`. Sur `main`, `feat/v75` et les PR, TOUT tourne,
  # inconditionnellement : le filtre n'existe que pour les branches de travail, et un
  # défaut du filtre ne peut donc jamais laisser passer du code non testé jusqu'à la production
  # (le déploiement attend le run de `main`). Les jobs govulncheck et npm-audit n'en dépendent
  # pas (ci_workflows_security_test.go leur interdit toute condition).
  #
  # Un job SAUTÉ qui figure dans `needs` d'un autre le fait sauter : les jobs de fusion
  # (`go-coverage-merge`, `web-coverage-merge`) lisent le résultat de leur matrice et se
  # sautent eux-mêmes quand elle l'est. Un run dont des jobs sont sautés conclut `success`, ce
  # que `attente-ci` (deploy.yml) accepte ; sur `main` rien n'est sauté.
  #
  # Comparaison à `main` (base par défaut de l'action), PAS au push précédent : un run annulé
  # par `concurrency` ou rouge ne doit pas laisser un changement Go non testé derrière un push
  # web ultérieur.
  #
  # Classement des fichiers modifiés (prédicat `some-with-excludes` : au moins un motif retenu et
  # aucun motif exclu). Conservateur : dans le doute, les deux piles tournent.
  #   web      apps/web/**
  #   go       apps/go-api/** hors openapi.yaml
  #   croisee  le contrat OpenAPI (relie les deux piles) et les miroirs TypeScript que des tests
  #            Go relisent (parité des capacités, variations sonores, familles d'objectifs,
  #            fixtures de contrat du rejeu) : touchent les deux piles
  #   autre    tout le reste (.github/, scripts/, Makefile, docs/, config/, tools/, ...) : les
  #            tests Go et les lints web lisent des fichiers hors de leur dossier
  #   tous     au moins un fichier modifié (sinon, rien à classer : tout tourne)
  # Les sorties sont des booléens, jamais la liste des fichiers : sur une branche loin de `main`
  # elle dépasserait la taille d'une variable d'environnement.
  changes:
    name: Filtre de chemins (piles touchées)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Hors branche de travail le job ne filtre rien : ses étapes sont sautées, leurs sorties sont
    # vides et les deux expressions ci-dessous valent `true` (`tous != 'true'`).
    outputs:
      go: ${{ steps.fichiers.outputs.tous != 'true' || steps.fichiers.outputs.go == 'true' || steps.fichiers.outputs.croisee == 'true' || steps.fichiers.outputs.autre == 'true' }}
      web: ${{ steps.fichiers.outputs.tous != 'true' || steps.fichiers.outputs.web == 'true' || steps.fichiers.outputs.croisee == 'true' || steps.fichiers.outputs.autre == 'true' }}
    steps:
      - uses: actions/checkout@v6.1.0
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/feat/v75' }}

      # Épinglé par SHA de commit : le tag v4.0.3 désigne directement un commit (objet non annoté).
      - name: Fichiers modifiés par rapport à main
        id: fichiers
        if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/feat/v75' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: main
          predicate-quantifier: some-with-excludes
          filters: |
            tous:
              - '**'
            web:
              - 'apps/web/**'
            go:
              - 'apps/go-api/**'
              - '!**/openapi.yaml'
            croisee:
              - '**/openapi.yaml'
              - 'apps/web/src/lib/capabilities/**'
              - 'apps/web/src/features/match-replay/**'
            autre:
              - '**'
              - '!apps/web/**'
              - '!apps/go-api/**'

  frontend:
    name: Frontend (TypeScript + Vite build)
    needs: changes
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/v75' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Type-check
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint --if-present

      - name: Lint multi-titres (no hardcoded FieldKey)
        run: npm run lint:fields

      - name: Lint couleurs (tokens semantiques uniquement)
        run: npm run lint:colors

      # A3.4 (backlog 2026-09-26, item 5) : ce lint ne tournait qu'au pre-commit
      # (lefthook.yml), jamais en CI ni dans `gate-push` — une branche jamais
      # repassée par le hook local pouvait dériver sans que rien ne le voie. Chemin
      # relatif depuis `working-directory: apps/web` (l.66), même patron que le
      # ratchet knip juste en dessous.
      - name: Lint cross-feature imports (frontières features/ et components/)
        run: node ../../tools/lint-cross-feature-imports.mjs

      # Ratchet knip — SANS condition de chemin, et c'est tout l'objet du step.
      # Le hook pre-push homonyme (lefthook.yml) est glob-gaté sur
      # `apps/web/src/**/*.{ts,tsx}` : il ne s'exécute que si le push CONTIENT des
      # sources web. Le mode d'échec réellement constaté (J1-b) n'est pas celui-là —
      # c'est une branche qui accumule des exports morts et n'est JAMAIS poussée, donc
      # jamais soumise au hook ; le dépassement de plafond n'est apparu qu'à la
      # réconciliation. Un glob ne peut pas rattraper ça : seul un job qui tourne à
      # chaque push le peut. Le hook local reste le filet rapide, la CI est l'autorité.
      - name: Ratchet knip (code mort frontend)
        run: node ../../tools/knip-ratchet.mjs

      # J4.0 (2026-08-01) — ce garde ne gardait RIEN. Le job tourne sous
      # `working-directory: apps/web` (l.66) et le chemin était écrit depuis la
      # racine : `apps/web/apps/web/src/...` n'existe pas, `grep` sortait en
      # erreur « fichier absent » (rc=2), et un `if` sur une erreur est FAUX —
      # le step passait au vert sans avoir lu une ligne. L'invariant, lui,
      # tenait (vérifié le 2026-08-01 : queries.ts n'importe pas `api` et pose
      # `credentials: 'omit'`) : c'était un trou latent, pas une fuite.
      # Leçon généralisable : UN GARDE QUI NE PEUT PAS ÉCHOUER NE GARDE RIEN.
      # D'où le contrôle d'existence AVANT le grep — même patron que
      # TestHalowaypointAllowlistEntriesPointToExistingFiles côté Go : la cible
      # disparue ou déplacée fait échouer le garde BRUYAMMENT, elle ne le rend
      # pas muet.
      - name: Guard — feedback-drawer ne doit pas importer le wrapper api
        run: |
          cible="src/features/feedback-drawer/queries.ts"
          if [ ! -f "$cible" ]; then
            echo "::error::$cible est introuvable depuis $(pwd) — ce garde ne peut plus vérifier son invariant. Corriger le chemin, ou retirer le garde si le fichier a disparu pour de bon. Ne JAMAIS le laisser passer à vide."
            exit 1
          fi
          if grep -E "^import.*\\bapi\\b.*from.*['\"]@/lib/api/client" "$cible"; then
            echo "::error::feedback-drawer/queries.ts ne doit JAMAIS importer { api } — il leakerait X-LevelUp-Title et les cookies de session vers GitHub. Utiliser fetch() direct avec credentials: 'omit'."
            exit 1
          fi

      - name: Build (Vite)
        run: npm run build

      # Les tests Vitest et leur couverture tournent dans les jobs `web-tests` (3 lots) et
      # `web-coverage-merge`, plus bas : ce job garde le typage, les lints, knip, le build et
      # la rasterisation.

      # LES DEUX SEULES PREUVES DE RENDU DU REJEU — ICI, ET PAS DANS LE JOB e2e-react
      # (M1, registre d'audit du 2026-09-05). Le job `e2e-react` est gaté
      # `github.event_name == 'pull_request'` (l.524) ; la campagne v7.5 travaille en
      # branche unique, donc ZÉRO exécution depuis le tag v7.3.0 : 373 commits sur
      # `match-replay` que ces 589 lignes de garde-rail n'ont pas protégés. Elles étaient
      # d'ailleurs ROUGES quand on les a rejouées le 2026-09-06 (harnais périmé de deux
      # refactorings) — un garde-rail qu'on n'exécute pas ne garde rien.
      #
      # POURQUOI ELLES ONT LEUR PLACE ICI : elles n'ouvrent AUCUN serveur (`page.setContent`
      # seul ; `playwright.config.ts` n'a pas de bloc `webServer`), donc ni API démo ni Vite,
      # contrairement au reste de `e2e/`. Coût : l'installation de Chromium (~1 min) plus
      # ~3 s d'exécution.
      #
      # POURQUOI PAS EN VITEST : jsdom n'a pas de moteur 2D. Seul un Chromium réel dit ce que
      # `oklch(...)` et `globalCompositeOperation: 'lighter'` produisent — la panne que ces
      # specs ont démasquée (« primitives parfaites, image vide », 0 pixel changé sur fond
      # clair) est invisible à vitest par construction.
      - name: Rasterisation du rejeu (Playwright, sans serveur)
        run: |
          npx playwright install chromium --with-deps
          npx playwright test --project=chromium --reporter=list \
            e2e/replay-explosion-raster.spec.ts \
            e2e/replay-muzzle-raster.spec.ts

      - name: Upload Playwright report (rasterisation, si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raster-playwright-results
          path: tests/e2e-results/
          if-no-files-found: ignore
          retention-days: 7

  # Vitest en lots (E1.5). Chaque lot exécute 1/N des fichiers de test et écrit un rapport
  # « blob » (résultats ET couverture brute v8) ; `web-coverage-merge` les rassemble. Le nombre
  # de lots est celui de la matrice (`strategy.job-total`) : ajouter une valeur à `shard` suffit.
  # `--coverage.reporter=json-summary` : un lot ne produit pas de rapport lisible (il serait
  # partiel), seul le blob compte.
  web-tests:
    name: Vitest (lot ${{ matrix.shard }})
    needs: changes
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/v75' || needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      # P3.8 (revue 2026-04-29) : couverture Vitest en CI, sans ratchet (baseline à établir).
      - name: Vitest (lot ${{ matrix.shard }}/${{ strategy.job-total }})
        run: >
          npx vitest run
          --coverage --coverage.reporter=json-summary
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=blob

      - name: Upload rapport blob (Vitest)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: apps/web/.vitest-reports/
          # Le dossier commence par un point : upload-artifact@v4 exclut les fichiers cachés par
          # défaut et ne trouverait rien à envoyer.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2

  # Fusion des lots Vitest : verdict des tests de tous les lots + rapport de couverture HTML.
  # Se saute quand les lots le sont (filtre de chemins), sans quoi `needs` le ferait échouer.
  web-coverage-merge:
    name: Vitest (fusion des lots + couverture)
    needs: web-tests
    if: ${{ !cancelled() && needs.web-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Télécharger les rapports blob
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: apps/web/.vitest-reports

      # Un lot absent (job tué avant l'upload) fausserait la couverture et le verdict. Vitest nomme
      # chaque blob `blob-<lot>-<total>.json` : le total écrit par les lots dit combien de blobs
      # sont attendus, sans le répéter ici.
      - name: Contrôler que tous les lots sont présents
        run: |
          shopt -s nullglob
          ls -la .vitest-reports
          blobs=(.vitest-reports/blob-*-*.json)
          if [ "${#blobs[@]}" -eq 0 ]; then
            echo "::error::aucun rapport blob Vitest"
            exit 1
          fi
          totaux=$(for b in "${blobs[@]}"; do t=${b##*-}; echo "${t%.json}"; done | sort -u)
          if [ "$(printf '%s\n' "$totaux" | grep -c .)" -ne 1 ]; then
            echo "::error::rapports blob de totaux différents (totaux lus : $totaux)"
            exit 1
          fi
          if [ "${#blobs[@]}" -ne "$totaux" ]; then
            echo "::error::${#blobs[@]} rapport(s) blob sur $totaux attendus : un lot Vitest n'a pas rendu son rapport"
            exit 1
          fi

      - name: Fusion des rapports + couverture
        run: npx vitest --merge-reports --coverage

      - name: Upload coverage report (Vitest)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-html
          path: apps/web/coverage/
          if-no-files-found: warn
          retention-days: 7

  go-build:
    name: Go Build + Test
    needs: changes
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/v75' || needs.changes.outputs.go == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      - name: go vet (domain + analysis — sans CGo)
        run: go vet ./internal/domain/... ./internal/analysis/... ./internal/games/weapons/... ./internal/games/halo_infinite/film/internal/profile/... ./internal/games/halo_infinite/film/internal/grammar/... ./internal/games/halo_infinite/film/internal/facts/... ./internal/games/halo_infinite/film/replay/...
        env:
          CGO_ENABLED: "0"

      - name: go build (contracttest — sans CGo)
        run: go build ./contracttest/...
        env:
          CGO_ENABLED: "0"

      # CORPUS `gamefiles` (2026-09-05) : les 62 tests de rétro-ingénierie du dépôt
      # lisent l'installation locale de Halo Infinite et coûtent des minutes (corpus
      # entier : ~385 s ; TestBalayageCoquille seul : 203 s, 26 cartes). Ils sont
      # derrière `//go:build gamefiles` — donc PAS compilés par le `go test` par défaut.
      # Sans ce vet, ils pourriraient sans que rien ne rougisse : la CI n'a pas le jeu
      # installé, elle ne peut pas les EXÉCUTER, mais elle doit les COMPILER.
      # Garde-rails du tag lui-même : internal/archlint/gamefiles_tag_test.go.
      #
      # LES DEUX PAQUETS `cmd/` SONT ARRIVÉS LE 2026-09-06 (constat I1) : jusque-là leurs
      # tests ouvraient le jeu SANS le tag, donc le `go test` par défaut les compilait —
      # les mettre sous le tag les aurait sortis de toute compilation en CI si cette liste
      # n'avait pas suivi. Un tag sans vet est un fichier qui pourrit en silence.
      #
      # CGO OBLIGATOIRE, ET SUR LINUX SEULEMENT (correctif du 2026-09-05). `himap` importe
      # `himodule`, qui importe `internal/ooz` — un paquet CGO (décodeur Oodle C++). Avec
      # CGO_ENABLED=0, ooz n'a AUCUN fichier compilable : le vet meurt sur « build
      # constraints exclude all Go files », ce qui a rougi le job ubuntu et fait annuler le
      # job windows par fail-fast dès l'ajout de cette étape. Le toolchain C++ est garanti
      # sur le runner Linux (le job Coverage y compile déjà ooz avec CGO_ENABLED=1) ; il ne
      # l'est pas sur le runner Windows, et compiler le corpus DEUX fois n'apprend rien.
      - name: go vet (corpus gamefiles — compilation seule, jamais exécuté en CI)
        if: runner.os == 'Linux'
        run: go vet -tags=gamefiles ./internal/himap/ ./cmd/mapstruct-build/ ./cmd/mapfond-build/
        env:
          CGO_ENABLED: "1"

      # INSTRUMENTS `research` (2026-09-16, chantier du decodeur de film). Les instruments de
      # recherche qui REBALAYENT les 7 bobines versionnees (`e191b_carte_ti37_*`, `e191c_*` dans
      # `filmdec`) sont derriere `//go:build research` : ils tournent a la demande
      # (`go test -tags research ./internal/games/halo_infinite/film/internal/grammar/ -run TestE191`),
      # jamais en CI. Chiffres du jour : le paquet `filmdec` valait 26,1 s avant le lot 1.9.1 bis,
      # 89,9 s apres (dont 72 s pour ces instruments), et le job de couverture Linux — atomic,
      # coverpkg ./... — a rougi a `-timeout 600s` (run 34978931976 : `FAIL filmdec 600.236s`,
      # aucun test en echec, un paquet entier sans verdict) alors qu'il dure deja 33 min sur 45.
      # Meme logique que `gamefiles` : un tag sans vet est un fichier qui pourrit en silence,
      # donc la CI COMPILE ces instruments ici. Regle ecrite au plan du decodeur (§2.3).
      # PERIMETRE ELARGI A TOUT LE MODULE (J12.7, DU-5 a, 2026-09-30) : les `*_research_test.go` du
      # module entier portent le tag (ratchet archlint/research_tag_test.go). CGO=1 comme le vet
      # gamefiles : `./...` compile ooz et DuckDB.
      - name: go vet (instruments research — compilation seule, jamais executes en CI)
        if: runner.os == 'Linux'
        run: go vet -tags=research ./...
        env:
          CGO_ENABLED: "1"

      # BUDGET 600 s (2026-09-16, run 34968331540 sur 4abf6f466) : le paquet `filmdec` a
      # depasse les 60 s sur le runner Windows (`panic: test timed out after 1m0s` dans
      # `kfScanNext`, ubuntu vert). Mesure locale, CGO_ENABLED=0, -count=1 : 26,1 s pour le
      # paquet, dont sept tests de 2,5 a 5,3 s qui rebalayent chacun les images-cle des
      # 7 bobines versionnees ; le runner Windows est deux a trois fois plus lent. 300 s est
      # le budget que tenait l'ancien job baseline (cf. plus bas), porte a 600 s (celui du job
      # de couverture) a la fusion du lot 1.9.1 bis, puis les instruments lourds sont passes
      # sous le tag `research` (etape ci-dessus) : le budget reste, il n'est plus la defense.
      - name: go test (unit, no CGo DB)
        run: go test ./internal/domain/... ./internal/analysis/... ./internal/games/weapons/... ./internal/games/halo_infinite/film/internal/profile/... ./internal/games/halo_infinite/film/internal/grammar/... ./internal/games/halo_infinite/film/internal/facts/... ./internal/games/halo_infinite/film/replay/... ./contracttest/... -timeout 600s -count=1
        env:
          CGO_ENABLED: "0"
          LEVELUP_DEMO_MODE: "true"
          # MULTI_TITLE_API_ENABLED retire le 2026-08-02 (v7.3 lot 2) : le flag
          # n'existe plus, les routes multi-titres sont montees sans condition.
          # P3.4 : flag PRESTIGE_ENABLED active en CI pour exercer les ~21 routes
          # Prestige (smoke tests + route registration).
          PRESTIGE_ENABLED: "true"

  # J12.6 (2026-09-30) : D-5 (deux films decodes en parallele ne partagent aucun etat) est prouve
  # SOUS `-race`. `-race` est incompatible avec DuckDB (cf. job coverage) : ce job cible donc le
  # seul paquet grammar, mini-bobines du depot, aucune base. CGO obligatoire pour `-race`.
  film-race:
    name: Film race (grammar, -race cible)
    needs: changes
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/v75' || needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      - name: go test -race (deux films en parallele)
        run: go test -race -count=1 -run TestDeuxFilmsEnParallele ./internal/games/halo_infinite/film/internal/grammar/
        env:
          CGO_ENABLED: "1"

  go-lint:
    name: Go Lint (golangci-lint)
    needs: changes
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/v75' || needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      # fetch-depth: 0 requis par le ratchet --new-from-* : le calcul de la base
      # (merge-base contre origin/main, ou commit parent sur main) a besoin de
      # l'historique complet et de la ref origin/main.
      - uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      # golangci-lint : équivalent ruff + ruff-format + enforce_size_limits + McCabe pour Go
      # Règles : gocyclo max 12 / funlen 80L / lll 100c / revive argument-limit 5
      # Config en format v2 (migration 2026-05-20, branche v1 abandonnée depuis mars 2025).
      #
      # RATCHET LINT PÉRENNE (2026-07-12) — remplace `only-new-issues: true`.
      # POURQUOI : `only-new-issues` récupérait le patch du diff via l'API GitHub,
      # qui refuse les PR > 20 000 lignes ("failed to fetch push patch ... Not
      # Found"). L'action retombait alors sur TOUTE la dette gelée (~479 issues :
      # goconst, noctx, funlen, gocyclo) → faux rouge (vécu sur la PR #54) ; le job
      # était aussi rouge en push sur main depuis des semaines. Le ratchet
      # `--new-from-*` compare au niveau git (indépendant de la taille du diff,
      # aucune dépendance à l'API GitHub) :
      #   - branches / PR : base = merge-base(origin/main, HEAD) → seules les issues
      #     AJOUTÉES par la branche rougissent, quelle que soit l'avance de main ;
      #   - push sur main : base = commit parent (github.event.before) → toute issue
      #     introduite par le push rougit ; main reste vert tant qu'on n'ajoute rien.
      # La dette gelée (~479) reste invisible tant qu'aucune ligne fautive n'est
      # ajoutée. golangci-lint v2.12.2 supporte --new-from-merge-base (dispo v1.55).
      # RETRAIT : quand la dette tend vers 0, repasser à un `golangci-lint run ./...`
      # plein (sans --new-from-*) — critère mesurable : 0 issue sur un run complet.
      - name: Calculer la base du ratchet lint
        id: lint_base
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            echo "args=--new-from-rev=$BEFORE" >> "$GITHUB_OUTPUT"
            echo "Ratchet main : --new-from-rev=$BEFORE"
          else
            echo "args=--new-from-merge-base=origin/main" >> "$GITHUB_OUTPUT"
            echo "Ratchet branche/PR : --new-from-merge-base=origin/main"
          fi

      - name: golangci-lint (ratchet)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: apps/go-api
          # only-new-issues volontairement absent (défaut false) : le ratchet passe
          # par les flags --new-from-* ci-dessous, jamais par l'API GitHub.
          args: --timeout 5m ${{ steps.lint_base.outputs.args }}

  go-lease-enforcement:
    name: Go Lease Enforcement (ADR 0013)
    needs: changes
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/v75' || needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Check lease enforcement (no direct DB writes in service/handlers)
        run: bash scripts/check_lease_enforcement.sh

  # Contrôles de vulnérabilités de dépendances — BLOQUANTS. Le hook local
  # (scripts/git-hooks/lefthook/govulncheck.sh) reste indicatif ; la CI est l'autorité.
  # Ni échappatoire (`|| true`, `continue-on-error`) ni condition `if:` sur ces deux jobs :
  # garde-rail archlint/ci_workflows_security_test.go.
  #
  # Le verdict dépend de la base de vulnérabilités publiée au moment du run : une
  # nouvelle alerte sur une dépendance déjà fusionnée rougit la CI sans changement de code.
  # C'est voulu (le déploiement attend le verdict de ce workflow, cf. `attente-ci` de
  # deploy.yml) ; la sortie corrective est la montée de la dépendance ou du toolchain.
  govulncheck:
    name: Govulncheck (vulnérabilités Go atteintes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v6.1.0

      # Le toolchain vient de la ligne `go` de go.mod : govulncheck juge la bibliothèque
      # standard de CETTE version, la même que celle qui compile les binaires de release.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      # Version exacte : un outil de sécurité flottant changerait de verdict sans commit.
      # La monter volontairement, avec un run vert pour preuve.
      - name: Installer govulncheck (version épinglée)
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # CGO_ENABLED=1 : le module importe DuckDB (binding C) ; ubuntu-latest fournit gcc.
      # Exit 3 = vulnérabilité atteinte par le code (trace affichée) : le step échoue.
      - name: govulncheck ./...
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...
        env:
          CGO_ENABLED: "1"

  npm-audit:
    name: npm audit (dépendances de production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Lit package-lock.json (aucune installation nécessaire). `--omit=dev` : seul ce qui
      # est livré dans le bundle compte ; les alertes d'outillage de build se traitent par
      # Dependabot.
      - name: npm audit (production, seuil high)
        run: npm audit --omit=dev --audit-level=high

  # La suite Go complète, en LOTS parallèles (E1), pour deux gates : le verdict de non-régression
  # (JSONL `-json`, consommé par `check_test_baseline.sh --from-jsonl`) et le ratchet de couverture
  # (profil `-coverprofile`). Une seule exécution de la suite sert les deux (D3, 2026-07-26 : le
  # job go-baseline-tests qui la rejouait est supprimé).
  #
  # DÉCOUPAGE : .github/ci/go-shards.txt (lots, durées, listes de tests lourds de `grammar`), lu
  # par scripts/ci_go_shard.sh. Le dernier lot est le COMPLÉMENT de `go list -tags=integration
  # ./...` : l'union des lots couvre le module par construction, et le job de fusion le revérifie
  # contre le JSONL. La liste des lots ci-dessous est celle du fichier (archlint/ci_go_shards_test.go).
  #
  # `-p 1` PAR MACHINE, NON NÉGOCIABLE (M2, 2026-07-05) : le driver DuckDB est mono-process ; en
  # parallèle dans une même machine, platform/duckdb + sync se contendent, avortent avec des durées
  # FANTÔMES (~28000s) et MASQUENT les vraies défaillances → faux-vert (incident 2026-07-03). Le
  # parallélisme se prend entre machines : chaque lot est un job.
  #
  # `-covermode=atomic -coverpkg=./...` : les tests externes (golden, contracttest) remontent la
  # couverture des paquets qu'ils exercent (S45 T1-2) ; le profil de chaque lot couvre tout le
  # module, le job de fusion les additionne. `-timeout` par processus de test : valeur du fichier
  # de définition (600 s, 900 s pour les moitiés de `grammar` qui n'ont pas de marge sous 600 s).
  go-coverage:
    name: Go Coverage (lot ${{ matrix.lot }})
    needs: changes
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/v75' || needs.changes.outputs.go == 'true' }}
    # ubuntu-latest dispose de GCC — CGO_ENABLED=1 fonctionne sans config supplémentaire
    runs-on: ubuntu-latest
    # ~2x le plus long lot estimé (~12 min, marge pour une machine lente ou un cache froid).
    timeout-minutes: 30
    strategy:
      # Un lot rouge n'annule pas les autres : le job de fusion juge l'ensemble, et un second
      # lot rouge est une information de plus, pas du bruit.
      fail-fast: false
      matrix:
        lot: [film-grammar-lourd, film-grammar-reste, film, platform, sync, reste]
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      # S45 T8 — décision : CGO=0 fast-check = job go-build ; CGO=1 full = ce job.
      - name: Vérifier GCC (CGO requis pour DuckDB)
        run: gcc --version

      # `-json` retire toute sortie humaine du log : c'est le job de fusion (analyse du JSONL)
      # qui réimprime les lignes utiles en cas d'échec. `set +e` : le JSONL et le profil doivent
      # être uploadés même quand la suite est rouge.
      - name: go test du lot avec couverture + JSONL (CGO + intégration)
        env:
          LOT: ${{ matrix.lot }}
          CGO_ENABLED: "1"
          LEVELUP_DEMO_MODE: "true"
          # P3.4 (revue 2026-04-29) : flag actif en CI pour couvrir les chemins Prestige.
          PRESTIGE_ENABLED: "true"
        run: |
          set -uo pipefail
          out=$(bash ../../scripts/ci_go_shard.sh "$LOT") || {
            echo "::error::ci_go_shard.sh refuse le lot $LOT (voir .github/ci/go-shards.txt)"
            exit 1
          }
          mapfile -t args <<< "$out"
          echo "lot $LOT : go test ${args[*]}"
          set +e
          go test \
            -json \
            -coverprofile="coverage.$LOT.raw" \
            -covermode=atomic \
            -coverpkg=./... \
            -tags=integration \
            -count=1 \
            -p 1 \
            "${args[@]}" > "baseline_$LOT.jsonl" 2>&1
          rc=$?
          set -e
          echo "go test: exit=$rc, $(wc -l < "baseline_$LOT.jsonl") lignes JSONL, ${SECONDS}s"
          echo "- lot \`$LOT\` : exit $rc, ${SECONDS} s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Lot $LOT rouge (exit $rc). Le détail lisible est imprimé par le job « Go Coverage + Baseline » (fusion), qui juge l'ensemble des lots."
          fi
          exit $rc

      # Pièces du job de fusion. `if: !cancelled()` : un lot rouge doit livrer son JSONL.
      - name: Upload JSONL + profil du lot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: go-lot-${{ matrix.lot }}
          path: |
            apps/go-api/baseline_${{ matrix.lot }}.jsonl
            apps/go-api/coverage.${{ matrix.lot }}.raw
          if-no-files-found: warn
          retention-days: 3

  # Fusion des lots Go : ex-job unique `go-coverage` (verdict de non-régression + ratchet de
  # couverture + rapport HTML), désormais alimenté par les artefacts des lots. Se saute quand les
  # lots le sont (filtre de chemins). `!cancelled()` et non `always()` : un run annulé n'a plus
  # d'artefacts à fusionner ; un lot rouge, lui, doit être jugé ici.
  go-coverage-merge:
    name: Go Coverage + Baseline non-régression (fusion des lots)
    needs: go-coverage
    if: ${{ !cancelled() && needs.go-coverage.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      - name: Télécharger les artefacts des lots
        uses: actions/download-artifact@v4
        with:
          pattern: go-lot-*
          merge-multiple: true
          path: apps/go-api/lots

      # Contrôle d'ensemble (D-3) : un lot sans artefact, un paquet que personne n'a exécuté ou un
      # paquet exécuté qui n'existe plus dans le module = échec nommé, jamais une suite plus petite
      # qui passe au vert. L'ensemble de référence est `go list -tags=integration ./...`, la même
      # énumération que `go test ... ./...`. Tout paquet du module apparaît dans le JSONL (même
      # sans test : événement `skip` « no test files »), dont ceux qui ne compilent pas
      # (`build-fail`, `fail`), d'où la lecture du champ `Package` de tous les événements.
      - name: Concaténer les JSONL et contrôler l'ensemble des paquets
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          ls -la lots
          echo "## Lots Go" >> "$GITHUB_STEP_SUMMARY"
          manquants_lots=0
          for lot in $(bash ../../scripts/ci_go_shard.sh --lots); do
            if [ ! -s "lots/baseline_$lot.jsonl" ] || [ ! -f "lots/coverage.$lot.raw" ]; then
              echo "::error::lot $lot : JSONL ou profil absent (job tué avant l'upload, ou lot non exécuté)"
              manquants_lots=$((manquants_lots + 1))
            fi
          done
          cat lots/baseline_*.jsonl > baseline_current.jsonl
          grep -a -o '"Package":"[^"]*"' baseline_current.jsonl | sed 's/^"Package":"//; s/"$//' | sort -u > paquets_executes.txt
          go list -tags=integration ./... | tr -d '\r' | sort -u > paquets_module.txt
          comm -23 paquets_module.txt paquets_executes.txt > paquets_non_executes.txt
          comm -13 paquets_module.txt paquets_executes.txt > paquets_en_trop.txt
          echo "paquets du module : $(wc -l < paquets_module.txt), exécutés : $(wc -l < paquets_executes.txt)"
          echo "- paquets du module : $(wc -l < paquets_module.txt), exécutés : $(wc -l < paquets_executes.txt)" >> "$GITHUB_STEP_SUMMARY"
          if [ -s paquets_non_executes.txt ]; then
            echo "::error::paquets du module que AUCUN lot n'a exécutés :"
            sed 's/^/    /' paquets_non_executes.txt
          fi
          if [ -s paquets_en_trop.txt ]; then
            echo "::error::paquets exécutés qui ne sont plus dans le module :"
            sed 's/^/    /' paquets_en_trop.txt
          fi
          if [ "$manquants_lots" -ne 0 ] || [ -s paquets_non_executes.txt ] || [ -s paquets_en_trop.txt ]; then
            exit 1
          fi

      # Durée par lot (somme des durées de paquet) : la mesure qui sert à rééquilibrer
      # .github/ci/go-shards.txt. Affichage seul.
      - name: Durées par lot et paquets les plus longs
        if: ${{ !cancelled() }}
        run: |
          {
            echo ""
            echo "| lot | paquets | secondes de test |"
            echo "|---|---|---|"
            for f in lots/baseline_*.jsonl; do
              lot=$(basename "$f" .jsonl); lot=${lot#baseline_}
              grep -a '"Action":"\(pass\|fail\)"' "$f" | grep -av '"Test":' \
                | sed -n 's/.*"Package":"\([^"]*\)","Elapsed":\([0-9.]*\).*/\2 \1/p' \
                | awk -v lot="$lot" '{s+=$1} END{printf "| %s | %d | %.0f |\n", lot, NR, s}'
            done
            echo ""
            echo "Paquets les plus longs :"
            echo ""
            grep -a -h '"Action":"\(pass\|fail\)"' lots/baseline_*.jsonl | grep -av '"Test":' \
              | sed -n 's/.*"Package":"\([^"]*\)","Elapsed":\([0-9.]*\).*/\2 \1/p' \
              | sort -rn | head -8 | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      # Gate de NON-RÉGRESSION — ex-job `go-baseline-tests`, fusionné ici (D3).
      # Contrôles : présence de TOUS les tests de .ai/baselines/tests_pre_migration.jsonl,
      # aucun test en échec, aucun package en échec hors test. Mode CONSOMMATEUR
      # (`--from-jsonl`) : analyse le JSONL concaténé des lots, ne relance RIEN.
      #
      # `!cancelled()` NON NÉGOCIABLE : ce gate doit rendre son verdict même quand un lot est
      # rouge — c'est précisément là qu'il diagnostique (test disparu, package qui ne compile
      # plus) et qu'il réimprime la sortie humaine que `-json` a retirée du log.
      - name: Vérifier suite baseline de tests pré-migration
        if: ${{ !cancelled() }}
        run: |
          [ -s baseline_current.jsonl ] || cat lots/baseline_*.jsonl > baseline_current.jsonl
          bash ../../scripts/check_test_baseline.sh tests --from-jsonl baseline_current.jsonl

      # Sans cet artefact, un gate rouge n'était pas diagnosticable. Uniquement en échec (le
      # fichier pèse plusieurs Mo et n'a aucun intérêt quand c'est vert).
      - name: Upload JSONL du run courant (diagnostic)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: go-baseline-current-jsonl
          path: apps/go-api/baseline_current.jsonl
          if-no-files-found: warn
          retention-days: 7

      # Fusion des profils (D-4) : UNE ligne `mode: atomic`, puis tous les blocs de tous les lots.
      # `go tool cover` additionne les blocs identiques (chaque lot instrumente tout le module ;
      # un bloc couvert dans un lot et pas dans l'autre compte comme couvert). Un profil d'un autre
      # mode ferait un total faux : refusé.
      - name: Fusionner les profils de couverture
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          profils=(lots/coverage.*.raw)
          if [ "${#profils[@]}" -eq 0 ]; then
            echo "aucun profil de lot (les go test ont échoué avant de l'écrire) — fusion sautée"
            exit 0
          fi
          for f in "${profils[@]}"; do
            [ "$(head -1 "$f")" = "mode: atomic" ] || { echo "::error::$f : en-tête inattendu « $(head -1 "$f") » (mode: atomic attendu)"; exit 1; }
          done
          { echo "mode: atomic"; for f in "${profils[@]}"; do tail -n +2 "$f"; done; } > coverage.raw
          echo "profil fusionné : $(wc -l < coverage.raw) lignes pour ${#profils[@]} lot(s)"

      # S45 T3 : filtrer internal/api/gen/ et cmd/msal-poc/ du profil
      - name: Filtrer exclusions (gen/ + msal-poc/)
        run: |
          [ -f coverage.raw ] || { echo "coverage.raw absent — étape sautée"; exit 0; }
          bash scripts/coverage_filter.sh coverage.raw > coverage.out

      # Ratchet via coverage_check.sh — le SEUIL FAIT FOI dans
      # apps/go-api/coverage_baseline.txt (source unique).
      # Historique : montée progressive S45→15%, S46→35%, S47→55%, S48→70%,
      # S49→76%, puis 84.5% ; ABAISSÉE à 69.0 le 2026-05-22 (commit d1631dbaa).
      # Cause : coverage_filter.sh a étendu ses exclusions à cmd/* (56 outils CLI,
      # 286/292 fonctions à 0%) et scripts/* — le PÉRIMÈTRE de mesure a changé, la
      # valeur mesurée est passée à 70,7% et la baseline a été posée à 69.0 (1,7 pt
      # de marge). Ce n'est donc pas une régression de qualité.
      # RÈGLE (ratchet) : la baseline ne descend JAMAIS sans justification datée
      # écrite ici ET dans le commit qui la modifie. Elle peut monter : sur main,
      # coverage_check.sh réécrit le fichier quand la couverture progresse — mais
      # rien ne commite ce fichier, l'écriture reste locale au runner ; la valeur
      # qui fait foi est donc celle versionnée.
      - name: Vérifier ratchet couverture (vs coverage_baseline.txt)
        run: |
          [ -f coverage.out ] || { echo "::error::coverage.out absent : aucun profil de lot à vérifier"; exit 1; }
          bash scripts/coverage_check.sh coverage.out coverage_baseline.txt
        env:
          CI: "true"
          GITHUB_REF: ${{ github.ref }}

      # S51 : internal/sync est exclu du profil filtré (coverage_filter.sh) — sa couverture réelle
      # se lit sur le profil fusionné NON filtré. Affichage seul, ce n'est pas un gate.
      - name: Afficher couverture internal/sync
        if: ${{ !cancelled() }}
        run: |
          [ -f coverage.raw ] || { echo "coverage.raw absent — étape sautée"; exit 0; }
          { head -1 coverage.raw; grep -a '/internal/sync/' coverage.raw; } > cov_sync.out
          go tool cover -func=cov_sync.out | tail -5

      # S45 gate : rapport HTML accessible en artifact CI
      # `!cancelled()` volontaire (on veut le rapport même quand le ratchet échoue),
      # MAIS coverage.out n'existe pas quand les `go test` ont échoué avant de l'écrire :
      # `go tool cover` sortait alors en erreur et ajoutait un « exit code 2 »
      # PARASITE après le vrai échec, brouillant le diagnostic. D'où la garde.
      - name: Générer rapport HTML
        run: |
          [ -f coverage.out ] || { echo "coverage.out absent (go test a échoué) — étape sautée"; exit 0; }
          go tool cover -html=coverage.out -o coverage.html
        if: ${{ !cancelled() }}

      - name: Upload rapport HTML (artifact 30j)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: go-coverage-html
          path: apps/go-api/coverage.html
          retention-days: 30

      - name: Upload profil coverage.out
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: go-coverage-profile
          path: apps/go-api/coverage.out
          retention-days: 7

  go-openapi-lint:
    name: OpenAPI Lint
    needs: changes
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/v75' || needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Validate openapi.yaml (spectral)
        uses: stoplightio/spectral-action@v0.8.13
        with:
          file_glob: apps/go-api/api/openapi.yaml

  go-contract-test:
    name: Go Contract Test (OpenAPI YAML)
    needs: changes
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/v75' || needs.changes.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      # Tests YAML-only : vérifie que openapi.yaml est valide, complet (≥20 paths)
      # et que les paths obligatoires (health, bootstrap, settings…) sont présents.
      # CGO_ENABLED=0 : aucune dépendance platform/duckdb.
      - name: Run contract tests
        run: |
          go test ./contracttest/... -run TestContract -v -timeout 30s
        env:
          CGO_ENABLED: "0"
          LEVELUP_DEMO_MODE: "true"

  e2e-react:
    name: E2E React (Playwright)
    runs-on: ubuntu-latest
    # 30 min : les deux serveurs (API démo + Vite) sont démarrés en arrière-plan
    # avec des boucles d'attente ; un serveur qui ne répond jamais laissait le job
    # traîner (~48 min constatés) au lieu d'échouer.
    timeout-minutes: 30
    # Coût ~3-5 min + flakiness retries=2, et les tests auth E2E exigent des
    # identifiants absents en CI → le job traînait ~48 min puis rougissait main.
    # Trigger : PR vers main UNIQUEMENT (verdict avant merge), jamais sur push
    # (n'allonge plus / ne bloque plus main). Pour lancer à la demande :
    # `cd apps/web && npx playwright test` localement.
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers (Chromium uniquement)
        run: npx playwright install chromium --with-deps

      - name: Set up Go (backend démo)
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      - name: Build Go backend
        working-directory: apps/go-api
        # CGO_ENABLED=1 obligatoire : cmd/server/ importe platform/duckdb qui
        # dépend de duckdb-go-bindings (binding C). ubuntu-latest fournit gcc.
        run: CGO_ENABLED=1 go build -o levelup-api ./cmd/server/
        env:
          CGO_ENABLED: "1"

      # Fixture démo SYNTHÉTIQUE (2026-07-13) — remplace le skip des specs
      # data-dépendantes. `levelup seed-demo --synthetic` construit data/demo/ (DuckDB
      # vierges migrées + INSERT déterministes ; aucune donnée réelle, aucune DB de
      # prod, aucun fichier externe). La sonde e2e/_helpers/demoData.ts résout alors
      # demo-player (200/503) → les ~60 specs data-dépendantes s'exécutent au lieu de
      # skipper. Détail : apps/web/e2e/README.md + internal/ops/seed_demo_synthetic.go.
      - name: Seed synthetic demo fixture
        working-directory: apps/go-api
        # CGO_ENABLED=1 : le générateur ouvre des DuckDB (binding C). ubuntu fournit gcc.
        run: |
          CGO_ENABLED=1 go build -o levelup ./cmd/levelup/
          ./levelup seed-demo --synthetic
        env:
          CGO_ENABLED: "1"

      - name: Start backend in demo mode
        working-directory: apps/go-api
        # LEVELUP_DEMO_LOCALE=fr : la vitrine démo force l'anglais par défaut (audience
        # internationale) ; les specs E2E vérifient l'UI FR → on pinne la locale française.
        run: |
          LEVELUP_DEMO_MODE=true LEVELUP_DEMO_LOCALE=fr LEVELUP_API_PORT=8000 ./levelup-api &
          echo "Backend PID: $!"
          # Attendre que l'API réponde (max 30s)
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
        env:
          LEVELUP_DEMO_MODE: "true"
          LEVELUP_DEMO_LOCALE: "fr"

      - name: Start frontend dev server
        # NE PAS définir VITE_API_BASE_URL : il remplacerait le préfixe `/api/v1` du
        # client par `http://localhost:8000`, produisant des URLs sans `/api/v1` (404).
        # L'app utilise donc le défaut relatif `/api/v1` → proxy Vite → backend démo.
        # VITE_API_PROXY_TARGET pointe le proxy sur le backend (défaut déjà 127.0.0.1:8000).
        run: |
          npm run dev &
          echo "Frontend PID: $!"
          # Attendre que Vite soit prêt (max 30s)
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5173 && break
            sleep 1
          done
        env:
          VITE_API_PROXY_TARGET: "http://127.0.0.1:8000"

      - name: Run Playwright tests
        run: |
          npx playwright test \
            --project=chromium \
            --reporter=list \
            --timeout=30000 \
            --retries=2
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: "http://localhost:5173"

      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
