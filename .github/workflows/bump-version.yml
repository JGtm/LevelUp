name: Bump Version & Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Type de bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      note:
        description: "Note optionnelle (apparaît dans le titre de la release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  bump-and-tag:
    name: Bump ${{ inputs.bump }} & push tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Token avec droit d'écriture pour pousser le commit + tag
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute new version
        id: ver
        run: |
          # Lire la version actuelle depuis pyproject.toml
          CURRENT=$(python - <<'EOF'
          import re, pathlib
          text = pathlib.Path("pyproject.toml").read_text()
          m = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          print(m.group(1))
          EOF
          )
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          # Calculer la nouvelle version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: Update pyproject.toml
        run: |
          python - <<EOF
          import re, pathlib
          p = pathlib.Path("pyproject.toml")
          text = p.read_text()
          text = re.sub(
              r'^(version\s*=\s*")[^"]+(")',
              r'\g<1>${{ steps.ver.outputs.new }}\2',
              text,
              flags=re.MULTILINE,
          )
          p.write_text(text)
          EOF
          echo "pyproject.toml mis à jour : ${{ steps.ver.outputs.current }} → ${{ steps.ver.outputs.new }}"

      - name: Commit & tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          NOTE="${{ inputs.note }}"
          if [ -n "$NOTE" ]; then
            MSG="chore(release): bump version to ${{ steps.ver.outputs.new }} — $NOTE"
          else
            MSG="chore(release): bump version to ${{ steps.ver.outputs.new }}"
          fi
          git commit -m "$MSG"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }} --follow-tags
          echo "✅ Tag ${{ steps.ver.outputs.tag }} poussé → release automatique déclenchée"
