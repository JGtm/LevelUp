name: Bump Version & Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Type de bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      note:
        description: "Note optionnelle (apparaît dans le titre de la release)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  bump-and-tag:
    name: Bump ${{ inputs.bump }} & push tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Token avec droit d'écriture pour pousser le commit + tag
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Compute new version
        id: ver
        run: |
          # Lire la version actuelle depuis VERSION
          CURRENT=$(cat VERSION)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          # Calculer la nouvelle version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW" >> "$GITHUB_OUTPUT"

      - name: Update VERSION
        run: |
          echo "${{ steps.ver.outputs.new }}" > VERSION
          echo "VERSION mis à jour : ${{ steps.ver.outputs.current }} → ${{ steps.ver.outputs.new }}"

      - name: Commit & tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          NOTE="${{ inputs.note }}"
          if [ -n "$NOTE" ]; then
            MSG="chore(release): bump version to ${{ steps.ver.outputs.new }} — $NOTE"
          else
            MSG="chore(release): bump version to ${{ steps.ver.outputs.new }}"
          fi
          git commit -m "$MSG"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }} --follow-tags
          echo "✅ Tag ${{ steps.ver.outputs.tag }} poussé → release automatique déclenchée"
