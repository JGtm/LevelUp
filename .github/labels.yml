# Définition versionnée des labels GitHub.
# Synchronisé via .github/workflows/sync-labels.yml (action crazy-max/ghaction-github-labeler).
# Toute modif ici est appliquée au repo au prochain push sur main.

# --- Catégorisation feedback drawer ---
- name: feedback
  color: "0e8a16"
  description: "Retour utilisateur envoyé via le drawer in-app"

- name: bug
  color: "d73a4a"
  description: "Quelque chose ne fonctionne pas"

- name: enhancement
  color: "a2eeef"
  description: "Amélioration ou nouvelle fonctionnalité"

- name: question
  color: "d876e3"
  description: "Question utilisateur"

# --- Sévérité (peuplée par classifyFeedback puis affinée par Claude) ---
- name: "severity:critical"
  color: "b60205"
  description: "Bloquant — TypeError ou crash franc"

- name: "severity:high"
  color: "d93f0b"
  description: "Impact fort — bug visible / perte de progression"

- name: "severity:medium"
  color: "fbca04"
  description: "Bug confirmé sans bloquer l'usage"

- name: "severity:low"
  color: "0e8a16"
  description: "Suggestion ou question"

