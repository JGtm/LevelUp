# Dependabot version updates pour le monorepo LevelUp.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Note : ce fichier pilote les *version updates* (PRs de bump automatiques).
# Les *security alerts* (Dependabot alerts) sont activees au niveau du repo et
# fonctionnent independamment de ce fichier.
#
# Config sobre (apres l'incident des 15 PRs du scan initial) :
#   - mensuel (pas hebdo) pour limiter les vagues
#   - groupe : 1 PR groupee par ecosysteme pour les bumps minor/patch
#   - github-actions : on ignore les majors (sauts v4->v7 risquant de casser
#     la CI / le deploy) ; ils restent traitables a la main si besoin.

version: 2
updates:
  # Frontend (npm) — apps/web
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript 7.x : bloque tant que l'ecosysteme ne suit pas (verifie le
      # 2026-08-25 : typescript-eslint 8.68 refuse TS 7.0 en dur — support prevu
      # TS >= 7.1, https://github.com/typescript-eslint/typescript-eslint/issues/10940 ;
      # openapi-typescript 7.13 plante aussi, peer "^5.x"). Condition de retrait :
      # typescript-eslint ET openapi-typescript publient un support TS 7 — retester
      # alors le bump (tsconfig deja pret : baseUrl retire le 2026-08-25).
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  # Backend (Go modules) — apps/go-api
  - package-ecosystem: "gomod"
    directory: "/apps/go-api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Workflows GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
