# Dependabot version updates pour le monorepo LevelUp.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Note : ce fichier pilote les *version updates* (PRs de bump automatiques).
# Les *security alerts* (Dependabot alerts) sont activees au niveau du repo et
# fonctionnent independamment de ce fichier.
#
# Config sobre (apres l'incident des 15 PRs du scan initial) :
#   - mensuel (pas hebdo) pour limiter les vagues
#   - groupe : 1 PR groupee par ecosysteme pour les bumps minor/patch
#   - github-actions : on ignore les majors (sauts v4->v7 risquant de casser
#     la CI / le deploy) ; ils restent traitables a la main si besoin.
#   - docker : meme politique (majors ignorees : node 22->24, debian bookworm->trixie
#     sont des migrations a instruire). La PR qui monte `golang:X.Y.Z-bookworm` reste
#     rouge tant que la ligne `go` de apps/go-api/go.mod ne suit pas : c'est voulu
#     (garde-rail internal/archlint/dockerfile_go_version_test.go).

version: 2
updates:
  # Frontend (npm) — apps/web
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript 7.x : bloque tant que l'ecosysteme ne suit pas (verifie le
      # 2026-08-25 : typescript-eslint 8.68 refuse TS 7.0 en dur — support prevu
      # TS >= 7.1, https://github.com/typescript-eslint/typescript-eslint/issues/10940 ;
      # openapi-typescript 7.13 plante aussi, peer "^5.x"). Condition de retrait :
      # typescript-eslint ET openapi-typescript publient un support TS 7 — retester
      # alors le bump (tsconfig deja pret : baseUrl retire le 2026-08-25).
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # react-table 9.x : le bump seul casse la compilation (15 fichiers sur
      # l'API v8 - useReactTable, row models). Verifie le 2026-08-25, PR #78
      # fermee. La migration v9 (useTable, tableFeatures, data/columns readonly)
      # est un lot dedie post-v7.5 avec gate visuel sur les tableaux. Condition
      # de retrait : ouverture de ce lot (cf. registre des reports v7.5).
      - dependency-name: "@tanstack/react-table"
        update-types:
          - "version-update:semver-major"

  # Backend (Go modules) — apps/go-api
  - package-ecosystem: "gomod"
    directory: "/apps/go-api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Briques Go (modules sous libs/, ADR 0041) : une entree par go.mod. Le module go-api les
  # lit par go.work (aucune directive replace) ; seules leurs dependances externes se bumpent ici
  # (garde-rail internal/archlint/dockerfile_go_version_test.go).
  - package-ecosystem: "gomod"
    directory: "/libs/gamefiles"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/libs/himap"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Workflows GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Images de base du Dockerfile (golang, node, debian) — racine du depot
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
