# =============================================================================
# Nemesis + Souffre-douleur (KPI cards)
# =============================================================================
# 2 KPI cards côte à côte (st.columns(2)) :
#   - Card gauche : Nemesis = adversaire qui m'a le plus tué
#   - Card droite : Bully (souffre-douleur) = adversaire que j'ai le plus tué
# Chaque card affiche : titre, gamertag (clic-link), 2 lignes "X tués / Y morts".
# Couleur d'accent (vert/rouge) selon le ratio kills/deaths du joueur.
# Une zone debug optionnelle (_is_debug_antagonists_enabled) ajoute des stats
# de validation (deaths_missing, kills_estimated, ✓/⚠).
# =============================================================================

id: "match_view.12"
title: "Nemesis et Souffre-douleur du match"
page: match_view
section: "Onglet Combat — Antagonistes"
source_function: "src/ui/pages/match_view_players_nemesis.py::render_nemesis_section"
source_helpers:
  - "src/ui/pages/match_view_players_nemesis.py::_resolve_kv_display_name"
  - "src/ui/pages/match_view_players_nemesis.py::_clean_antagonist_name"
  - "src/ui/pages/match_view_players_nemesis.py::_antagonist_cmp_color"
  - "src/ui/pages/match_view_players_nemesis.py::_fmt_antagonist_two_lines"
  - "src/ui/pages/match_view_players_nemesis.py::_is_debug_antagonists_enabled"
  - "src/analysis/personal_antagonists.py::compute_personal_antagonists"
  - "src/ui/pages/match_view_helpers.py::os_card"
fragment: false
chart_kind: kpi_row                                             # 2 KPI cards (variant nemesis/bully)

# === COUCHE DONNÉES ===
data:
  computed_by: server
  upstream_service: "compute_personal_antagonists(highlight_events, me_xuid, tolerance_ms=5, official_stats)"
  input_dataframe:
    required_fields:
      highlight_events: "list[dict] (kill/death events)"
      official_stats: "list[dict] (load_match_players_stats)"
      me_xuid: "string"
      match_gt_map: "dict {xuid → gamertag}"
  call_args:
    tolerance_ms: 5
  filters_applied: []

  transformations:
    - description: "Calcul des antagonistes (nemesis + bully) avec validation"
      polars: |
        res = compute_personal_antagonists(
          highlight_events,
          me_xuid=me_xuid,
          tolerance_ms=5,
          official_stats=official_stats,
        )
        # res : {nemesis: AntagonistResult|None, bully: AntagonistResult|None,
        #        my_kills_total, my_kills_assigned_total, my_kills_assigned_certain,
        #        my_deaths_total, my_deaths_assigned_total, my_deaths_assigned_certain,
        #        is_validated: bool}
      sql_duckdb: |
        -- Joindre highlight_events sur les paires kill/death pour identifier les rivalités directes.
        -- L'algo Python est complexe (matching kill→death avec tolerance_ms=5)
        -- À porter dans internal/analysis/personal_antagonists.go avec test de référence.
      detail: |
        AntagonistResult contient :
          - xuid, gamertag
          - opponent_killed_me : Counter (total, has_estimated)  → adversaire m'a tué N fois
          - me_killed_opponent : Counter (total, has_estimated)  → j'ai tué N fois

    - description: "Résolution du gamertag d'affichage (cascade name → xuid raccourci)"
      polars: |
        nemesis_name = _resolve_kv_display_name(res.nemesis.xuid, res.nemesis.gamertag, match_gt_map)
        nemesis_name = _clean_antagonist_name(nemesis_name)

    - description: "Calcul de la couleur d'accent selon le rapport kills/deaths"
      polars: |
        accent = _antagonist_cmp_color(killed_me, me_killed, colors)
        # Ratio favorable → vert ; défavorable → rouge ; neutre → couleur défaut

# === KPI ROW SPECIFIC ===
kpi_row:
  layout: "st.columns(2)"
  tiles:
    - id: nemesis
      type: enriched                                            # /!\ card via os_card avec accent + sub_style
      title_source: "{{t.lbl_nemesis}}"
      kpi_field: "gamertag_link(nemesis_name) ou '-' si nemesis is None"
      kpi_is_html: true
      sub_field: "_fmt_antagonist_two_lines(killed_me, killed_me_approx, me_killed, me_killed_approx)"
      sub_style: |
        color: rgba(245, 248, 255, 0.92);
        font-weight: 800;
        font-size: 16px;
        line-height: 1.15;
      accent_field: "_antagonist_cmp_color(nemesis_killed_me, me_killed_nemesis, colors)"
      min_h: 110

    - id: bully
      type: enriched
      title_source: "{{t.lbl_victim}}"                          # /!\ libellé "Souffre-douleur"
      kpi_field: "gamertag_link(bully_name) ou '-'"
      kpi_is_html: true
      sub_field: "_fmt_antagonist_two_lines(...)"
      sub_style: "(idem nemesis)"
      accent_field: "_antagonist_cmp_color(bully_killed_me, me_killed_bully, colors)"
      min_h: 110

  formatter_two_lines:                                          # _fmt_antagonist_two_lines
    detail: |
      Construit 2 lignes HTML :
        - Ligne 1 : "X morts" (nb fois adversaire m'a tué) avec ~ si approx
        - Ligne 2 : "Y kills" (nb fois j'ai tué l'adversaire) avec ~ si approx
      Format : f"{label} {value}{'≈' if approx else ''}"

# === ZONE DEBUG OPTIONNELLE (sous-bloc) ===
debug_section:
  enabled: false                                                # désactivé par défaut
  trigger: "_is_debug_antagonists_enabled() == True"
  content: |
    Affiche en sous-section :
      - Validation icon ✓ ou ⚠ + label (lbl_validated / lbl_not_validated)
      - deaths_missing = my_deaths_total - my_deaths_assigned_total
      - deaths_estimated = my_deaths_assigned_total - my_deaths_assigned_certain
      - kills_missing = my_kills_total - my_kills_assigned_total
      - kills_estimated = my_kills_assigned_total - my_kills_assigned_certain
  detail: "Pour debug interne dev — activé via env var ou flag de session_state"

# === COMPOSITION / AFFICHAGE ===
display:
  shown_when: |
    table highlight_events exists
    AND (res.nemesis is not None OR res.bully is not None)
  empty_state:
    type: "st.info"
    message: "{{t.mv_nemesis_no_data}}"
    triggered_by:
      - "table highlight_events absente → mv_nemesis_unavailable"
      - "res.nemesis et res.bully tous None → mv_nemesis_no_data"
  config: null                                                   # composant UI HTML
  width_mode: stretch
  preceded_by:
    - "st.subheader(t('mv_antagonists_title'))"
    - "st.spinner(t('mv_highlight_loading'))"
  followed_by:
    - "(potentiellement render_antagonist_chart si 'mode debug' actif — non couvert ici)"

# === I18N ===
i18n_keys:
  viz_t: []
  t:
    - mv_antagonists_title
    - mv_nemesis_unavailable
    - mv_highlight_loading
    - mv_nemesis_no_data
    - lbl_nemesis
    - lbl_victim
    - lbl_validated
    - lbl_not_validated

