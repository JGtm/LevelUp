    - mvc_hist_avg                                             # paramétré : "Moyenne {category} ({n} matchs)"
    - tm_killing_spree                                         # "Folie meurtrière"
    - tm_headshots                                             # "Tirs à la tête"
    - tm_perfect_kills                                         # "Frags parfaits"
    - ts_spree                                                 # subheader "Folie meurtrière"
    - insufficient_data_chart

# === INTERACTIVITÉ ===
interactivity:
  click_target: null
  drilldown_chain: []
  session_state_writes: []

# === FINGERPRINT ===
fingerprint:
  source_commit: "db638c09f02008b21e6bfbd2ef560c87125400c6"
  generated_at: "2026-04-30T00:00:00Z"
  generator_version: "manual@v0"
  manual_fields: ["all"]

  notes:
    - decision: "Per-bar coloring sur 1 trace (3 couleurs distinctes)"
      why: |
        Plotly accepte `marker_color: list[str]` pour donner UNE couleur DIFFÉRENTE par bar
        au sein de la MÊME trace. Donc "Spree" est violet, "Headshots" cyan, "Perfect" vert,
        TOUTES sous le même nom de trace "Réel". ECharts equivalent : `data[i].itemStyle.color`
        par item, pas series-level color. Le YAML modélise via `color_per_bar: [...]`.

    - decision: "Pattern dotté sur la trace historique (au lieu d'une couleur différente)"
      why: |
        Visuellement, les bars "Moyenne historique" partagent les MÊMES couleurs (violet/cyan/vert)
        que les bars "Réel" mais avec un PATTERN dotté + opacité 0.35. Cela permet de comparer
        directement la valeur du match courant à sa moyenne historique pour la même catégorie.
        ECharts : pas de pattern natif comme Plotly mais on peut utiliser `decal` (depuis ECharts 5.4+)
        ou simuler via opacité + bordure.

    - decision: "Trace 'history_avg' conditionnée à match_count >= 10"
      why: |
        Pas assez de matchs historiques (< 10) → moyenne pas significative → on n'affiche que
        la trace 'Réel'. Côté Go API : renvoyer `null` ou ne pas inclure la trace dans la réponse
        si match_count < 10. Côté frontend : check sur le shape de la réponse.

    - decision: "rangemode: tozero sur Y"
      why: |
        Force l'axe Y à commencer à 0, même si toutes les valeurs sont > 5. Cohérence visuelle
        avec un chart de 'count' (pas de zoom artificiel sur des écarts mineurs). À porter via
        `yAxis.min: 0` côté ECharts.

    - decision: "PLOTLY_STATIC_CONFIG (chart figé)"
      why: |
        Pas de hover interactif riche, pas de zoom utile sur 3 catégories. STATIC = pas de modeBar.
        Cohérent avec le voisinage du chart expected_vs_actual qui est aussi STATIC.

    - decision: "Logique d'enrichissement Perfect Kills via medals_earned"
      why: |
        Le code Python compte les Perfect Kills via DuckDBRepository.count_perfect_kills_by_match
        (qui requête shared.medals_earned). Les autres stats (spree, headshots) sont dans match_stats
        directement. Cette dualité est documentée pour qu'un dev Go ne cherche pas Perfect Kills
        dans match_stats où il N'EST PAS — il faut un join avec medals_earned.
