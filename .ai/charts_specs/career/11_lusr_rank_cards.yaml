# =============================================================================
# Career page · LUSR rank cards — grille de cards par playlist (LUSR/CSR)
# =============================================================================
# Grille de cards (3 par row, st.columns) affichant le rating actuel de chaque
# playlist où le joueur a un LUSR ou CSR. Chaque card :
#   - Image rank (PNG en base64, 90×90 px) — get_rank_image_path(rating_value)
#   - Label playlist (avec icône _PG_ICONS) — Slayer, BTB, Ranked, Quickplay, ...
#   - Tier label (Onyx Diamond III, Platinum Sergeant, ...)
#   - Badge type (LUSR cyan / CSR doré)
#   - Rating value (numéric, ex 1842)
#   - Delta vs précédent : ▲ +24 (vert), ▼ -15 (rouge), = 0 (gris)
#
# Affiché AVANT le chart LUSR timeseries (career.04) dans _render_lusr_section.
# =============================================================================

id: "career.11"
title: "LUSR rank cards — grille N playlists avec rating + delta"
page: career
section: "Section LUSR (avant career.04 timeseries)"
display_order_in_page: 5
source_function: "src/ui/pages/career_lusr.py::_render_lusr_rank_cards"
source_helpers:
  - "src/ui/pages/career_lusr.py::_render_lusr_section"
  - "src/ui/pages/career_lusr.py::_get_pg_labels"
  - "src/ui/pages/career_lusr.py::_PG_ICONS"
  - "src/analysis/skill_rating_config::get_rank_image_path"
fragment: false
chart_kind: kpi_row

data:
  computed_by: server
  upstream_service: "Lecture career_progression + rating snapshots → list[dict] ordonnés"
  input_dataframe:
    required_fields:
      ordered: "list[dict]"
    fields_per_card:
      - playlist_group                                          # 'ranked', 'slayer', 'btb', 'quickplay', ...
      - tier_label                                              # 'Onyx Diamond III' ou t('unranked')
      - rating_value                                            # float
      - rating_delta                                            # float | None (vs précédent)
      - rating_type                                             # 'LUSR' | 'CSR'
  call_args:
    project_root: "Path — pour résoudre img_path relatif"
  filters_applied:
    - "len(ordered) > 0 sinon section masquée"

  constants:
    n_per_row: 3
    image_size: "90×90 px (object-fit: contain)"
    badge_colors:
      LUSR: "#00B7EB"                                           # cyan
      CSR:  "#FFD700"                                           # doré
    delta_colors:
      positive: "#00C853"                                       # vert
      negative: "#FF5252"                                       # rouge
      zero:     "#888888"                                       # gris
    delta_arrows:
      positive: "▲"
      negative: "▼"
      zero:     "= 0"
    pg_icons_default: "🎮"

# === KPI ROW ===
kpi_row:
  cardinality: "N (1 par playlist avec rating)"
  layout: "st.columns(min(N, 3)) répétées par row"

  cells_template:
    iterator: "for snap in ordered (chunked by 3)"
    cell:
      container: "st.container(border=True)"
      content_html_template: |
        <div>
          <div>{{pg_icon}} {{pg_label}}</div>
          {img_html | "<div style='width:90px;height:90px'></div>"}
          <div>{{tier_label}}</div>
          <span style="background:{{badge_bg}};color:{{badge_fg}};padding:1px 6px;border-radius:8px;font-weight:600">
            {{rating_type}}
          </span>
          <span style="font-weight:700;font-size:1.1em">{{rating_value:.0f}}</span>
          {delta_html | ""}

  delta_html_logic: |
    if delta is None:           ""
    elif delta == 0:            "<div style='color:#888;font-size:0.9em'>= 0</div>"
    elif delta > 0:             "<div style='color:#00C853;font-size:0.85em'>▲ +{delta}</div>"
    else:                       "<div style='color:#FF5252;font-size:0.85em'>▼ {delta}</div>"

  img_html_logic: |
    img_path = get_rank_image_path(rating_value)
    if img_path and (project_root / img_path).exists():
        img_b64 = base64.b64encode(img_full.read_bytes()).decode()
        img_html = f"<img src='data:image/png;base64,{img_b64}' style='width:90px;height:90px;object-fit:contain' />"
    else:
        img_html = "<div style='width:90px;height:90px'></div>"

traces: []

layout:
  inherits: _theme_default
  height:
    value: null
    expression: "max(220, ceil(N / 3) * 220)"

display:
  shown_when: "ordered non vide"
  empty_state:
    type: "section masquée"
    triggered_by: ["ordered vide → return silencieux"]
  config: null
  width_mode: stretch
  preceded_by:
    - "st.subheader(f'🏅 {LUSR_TITLE} — {LUSR_SUBTITLE}')"
  followed_by:
    - "_render_lusr_rating_chart(db_path, xuid)   # → career.04"

i18n_keys:
  viz_t: []
  t:
    - unranked

fingerprint:
  source_commit: "0abef2c0"
  generated_at: "2026-04-30T00:00:00Z"
  generator_version: "manual@v0"
  manual_fields: ["all"]

  notes:
    - decision: "Image rank en base64 inline (pas URL externe)"
      why: |
        Les images de rangs Halo (Onyx, Diamond, Platinum, ...) sont des assets LOCAUX du repo.
        Encoder en base64 dans le HTML évite des requêtes HTTP supplémentaires et garantit
        l'affichage offline. La taille reste raisonnable (90×90 PNG → ~5-10 KB par image).
        Côté React : utiliser un mapping rating → URL importée via Vite/webpack assets.

    - decision: "Badge couleur LUSR cyan vs CSR doré"
      why: |
        LUSR (Light Universal Skill Rating) = système universel tous modes. CSR (Competitive
        Skill Rating) = ranked compétitif officiel. Couleurs distinctes pour différencier d'un
        coup d'œil. Convention de l'app.

    - decision: "Delta affiché seulement si pas None"
      why: |
        Le premier snapshot d'une playlist n'a pas de delta calculable (pas de précédent).
        On masque l'élément delta plutôt que d'afficher '?' ou '0' qui serait ambigu.

    - decision: "3 cards par row"
      why: |
        Compromis lecture/densité : 3 cards par row tient sur la majorité des écrans desktop
        sans devoir scroller horizontalement. Si le joueur a 6+ playlists actives, plusieurs
        rows s'enchaînent verticalement. Côté React : `display: grid; grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr))` pour adaptation responsive.

    - decision: "Section AVANT career.04 timeseries dans _render_lusr_section"
      why: |
        Lecture naturelle : 'où j'en suis MAINTENANT' (cards) → 'comment j'ai évolué' (chart).
        Convention dashboard : KPIs en haut, détails timeseries en bas.
