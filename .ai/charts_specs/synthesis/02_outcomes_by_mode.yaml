# === FINGERPRINT ===
fingerprint:
  source_commit: "db638c09f02008b21e6bfbd2ef560c87125400c6"
  generated_at: "2026-04-30T00:00:00Z"
  generator_version: "manual@v0"
  sample_dataset: null
  fig_dict_path: null
  ast_extracted_fields: []
  runtime_extracted_fields: []
  manual_fields: ["all"]

  notes:
    - decision: "Spec dupliquée vs spec partagée avec 01"
      why: |
        Tentation : factoriser 01 et 02 dans une seule spec puisqu'ils utilisent la même fonction.
        Choix retenu : duplication. Trois raisons :
        (1) max_categories diffère (12 vs 10), margin override b diffère (80 vs 60).
        (2) Le 02 a une transformation supplémentaire (_mode_short) qui n'existe pas sur 01.
        (3) En Go API, ce seront probablement DEUX endpoints distincts (/synthesis/by-map et
            /synthesis/by-mode) avec leur propre SQL. La duplication YAML reflète la cible.

    - decision: "Transformation `_mode_short` documentée en pseudo-SQL DuckDB"
      why: |
        Le code Python utilise `str.split(" : ", 1)[1]`. DuckDB n'a pas exactement cette syntaxe ;
        j'ai proposé `regexp_replace(mode_source, '^[^:]+ : ', '')` qui retire tout ce qui
        précède et inclut " : ". Alternative : `string_split(mode_source, ' : ')[2]` (DuckDB
        list indexing 1-based). À valider lors de l'implémentation Go avec une vraie requête.

    - decision: "Différence max_categories 10 vs 12 explicitée dans call_args"
      why: |
        Subtilité facile à manquer en relisant le code : 12 cartes, 10 modes. La raison probable :
        il y a moins de modes distincts que de cartes dans Halo Infinite (~10-15 modes vs
        ~25 cartes), donc 10 couvre déjà l'essentiel sans tronquer. Ce n'est pas documenté côté
        Python mais c'est cohérent avec le domaine.

    - decision: "margin_override.b = 60 (mode) vs 80 (carte)"
      why: |
        Petite asymétrie dans win_loss.py:120 vs win_loss.py:163. Probablement parce que les
        labels de modes sont plus courts en moyenne ("Assassin", "CTF") que les noms de cartes
        ("Behemoth", "Aquarius") → moins de hauteur nécessaire pour les labels rotation 45°.
        Documenté pour ne pas l'aplatir lors du portage.