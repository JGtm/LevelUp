  annotations: []

# === COMPOSITION / AFFICHAGE ===
display:
  shown_when: |
    ('mode_ui' in dff.columns OR 'mode_category' in dff.columns OR 'pair_name' in dff.columns)
    AND 'outcome' in dff.columns
    AND not dff.is_empty()
    AND plot_stacked_outcomes_by_category(...) is not None
  hidden_when: null
  empty_state:
    type: "st.info"
    message: "{{t.insufficient_data_chart}}"
    triggered_by:
      - "aucune des colonnes mode_ui / mode_category / pair_name présente"
      - "outcome absent des colonnes"
      - "df vide après drop_nulls"
      - "build_outcome_pivot retourne None (toutes catégories filtrées par min_matches)"
  config: PLOTLY_STATIC_CONFIG
  width_mode: "stretch"
  filters_widgets: [synthesis_period]
  fragment_isolation: true
  layout_position:
    container: "st.columns(2)"
    column_index: 1                                  # colonne DROITE
    column_label: "{{t.wl_by_mode}}"
  preceded_by:
    - "(divider et subheader partagés avec le chart 01 dans le même bloc fragment)"
    - "st.markdown(f'##### {t(\"wl_by_mode\")}')"

# === CONTROLS ===
controls:
  - id: "synthesis_period"
    label: "{{t.encounters_period_label}}"
    widget: "segmented_control"
    position: "above_page"
    scope: "page"
    options:
      values: ["all", "2y", "1y", "1m", "1w"]
      labels_i18n: "encounters_period_{value}"
      default: "all"
    effect: "filter_dataset"
    effect_detail: "Filtre dff en amont sur start_time. Affecte tous les charts."
    api_param_mapping:
      query_param: "period"
      values_passthrough: true
    requires_refetch: false
    affects_charts: ["synthesis.01", "synthesis.02", "synthesis.03", "synthesis.04", "synthesis.05"]

