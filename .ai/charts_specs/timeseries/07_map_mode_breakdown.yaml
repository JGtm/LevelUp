# =============================================================================
# Map / Mode breakdown — 2 stacked bars side-by-side (par carte & par mode)
# =============================================================================
# Section avec st.columns(2). Côté gauche : V/D/T par CARTE (top 12). Côté
# droit : V/D/T par MODE. Réutilise la fonction `plot_stacked_outcomes_by_category`
# avec un argument différent (col='map_ui' ou 'mode_canon').
# Documenté dans synthesis.01 (par carte) et synthesis.02 (par mode) — ici on
# a un YAML compact qui référence ces 2 specs et explique l'usage timeseries.
# =============================================================================

id: "timeseries.07"
title: "Map / Mode breakdown — V/D/T par carte (top 12) + par mode"
page: timeseries
section: "Onglet Cartes & Modes"
display_order_in_tab: 1
source_function: "src/ui/pages/win_loss.py::_render_map_mode_breakdown"
source_helpers:
  - "src/visualization/distributions_outcomes.py::plot_stacked_outcomes_by_category"
fragment: true                                                  # @fragment_if_available
chart_kind: stacked_bar

# === COUCHE DONNÉES ===
data:
  reuses:
    of: ["synthesis.01", "synthesis.02"]
    differences: |
      - Affichage en colonnes côte à côte (st.columns(2)) plutôt qu'en ligne.
      - Mêmes args : min_matches=1, max_categories=12, sort_by='total'.
      - Légende horizontale en haut à droite (override layout dans le caller).

  upstream_service: "plot_stacked_outcomes_by_category(dff, col, min_matches=1, max_categories=12, sort_by='total')"
  input_dataframe:
    required_fields:
      dff:
        - map_name | map_ui                                     # pour breakdown par carte
        - mode_canon                                            # pour breakdown par mode
        - outcome
  call_args:
    min_matches: 1
    sort_by: "total"
    max_categories: 12

# === TRACES ===
traces: []                                                       # Renvoie aux YAML synthesis.01/02

layout:
  inherits: _theme_default
  height:
    value: 380

# === COMPOSITE LAYOUT ===
composite_layout:
  type: "st.columns(2)"
  cells:
    - position: left
      title_i18n: "{{t.wl_by_map}}"
      chart_ref: synthesis.01                                   # même YAML
      override:
        col: "map_ui (priorité) sinon map_name"
    - position: right
      title_i18n: "{{t.wl_by_mode}}"
      chart_ref: synthesis.02
      override:
        col: "mode_canon"

  legend_override:
    orientation: h
    yanchor: bottom
    y: 1.02
    xanchor: right
    x: 1
  margin_override: { l: 40, r: 20, t: 30, b: 80 }

# === COMPOSITION / AFFICHAGE ===
display:
  shown_when: "dff non vide AND (map_name ∈ dff.columns OR mode_canon ∈ dff.columns)"
  empty_state:
    type: "st.info"
    triggered_by:
      - "ni map_name ni outcome → t('insufficient_data_chart')"
      - "fig_map None → t('insufficient_data_chart')"
  config: PLOTLY_STATIC_CONFIG
  width_mode: stretch
  preceded_by:
    - "st.divider()"
    - "st.subheader(t('wl_results_by_map_mode'))"

# === I18N ===
i18n_keys:
  viz_t: []
  t:
    - wl_results_by_map_mode
    - wl_by_map
    - wl_by_mode
    - insufficient_data_chart

# === FINGERPRINT ===
fingerprint:
  source_commit: "0abef2c0"
  generated_at: "2026-04-30T00:00:00Z"
  generator_version: "manual@v0"
  manual_fields: ["all"]

  notes:
    - decision: "Référence à synthesis.01 / 02 plutôt que duplication"
      why: |
        Même fonction Python sous-jacente (plot_stacked_outcomes_by_category), mêmes args,
        seul le contexte d'appel diffère. Côté React : composant <StackedOutcomes /> partagé,
        prop `groupBy` (map | mode) configurable.

    - decision: "Override de la légende (horizontal en haut à droite)"
      why: |
        Le caller _render_map_mode_breakdown override la légende du chart pour la mettre EN HAUT
        plutôt qu'EN BAS (default des charts synthesis). Raison : st.columns(2) compresse la
        hauteur — la légende en bas mangerait trop d'espace utile pour les barres.
