# =============================================================================
# Rank score — bars personal_score + line rank avec autorange='reversed' Y2
# =============================================================================
# Bars amber sur Y1 = personal_score (rangemode=tozero).
# Line cyan sur Y2 = rank avec autorange='reversed' (rang 1 EN HAUT, pas en bas).
# Subplots make_subplots avec specs secondary_y=True.
# =============================================================================

id: "timeseries.19"
title: "Rank score — score personnel + rang (Y2 inversé)"
page: timeseries
section: "Onglet Progression — Rang"
display_order_in_tab: 9
source_function: "src/visualization/_timeseries_progression.py::plot_rank_score"
source_helpers: []
fragment: false
chart_kind: line                                                # bars+line via secondary_y

# === COUCHE DONNÉES ===
data:
  computed_by: server
  input_dataframe:
    required_fields:
      df: [start_time, personal_score, rank]                    # rank optionnel
  call_args: { lang: "fr | en" }
  filters_applied: ["filtres globaux + 'rank' in dff.columns conditionnel"]

  constants:
    score_color: "#ffb300"                                      # amber
    score_opacity: 0.75
    rank_color: "#41d6ff"                                       # cyan
    height: 380                                                 # HEIGHT_PROGRESSION

# === TRACES ===
traces:
  - id: personal_score
    type: bar
    y_axis: y1
    color: "#ffb300"
    opacity: 0.75
    optional: true                                              # ssi 'personal_score' in d.columns
    name_i18n: "{{viz_t.trace_personal_score}}"
    hovertemplate: "score=%{y:.0f}<extra></extra>"

  - id: rank_line
    type: scatter
    mode: lines+markers
    y_axis: y2                                                  # secondary
    color: "#41d6ff"
    marker: { size: 4 }
    optional: true                                              # ssi 'rank' in d.columns
    name_i18n: "{{viz_t.trace_rank}}"
    hovertemplate: "rang=%{y}<extra></extra>"

# === LAYOUT ===
layout:
  inherits: _theme_default
  height:
    value: 380
  margin: { l: 40, r: 50, t: 40, b: 90 }
  hovermode: "x unified"
  legend: "horizontal_bottom"
  yaxis:
    title_i18n: "{{viz_t.trace_personal_score}}"
    rangemode: tozero
  yaxis_secondary:
    title_i18n: "{{viz_t.trace_rank}}"
    autorange: reversed                                         # /!\ rang 1 EN HAUT
    rangemode: tozero

# === COMPOSITION / AFFICHAGE ===
display:
  shown_when: "'personal_score' ∈ dff.columns OR 'rank' ∈ dff.columns"
  config: PLOTLY_CLEAN_CONFIG
  width_mode: stretch
  preceded_by:
    - "st.subheader(t('ts_rank_score'))"

# === I18N ===
i18n_keys:
  viz_t:
    - trace_personal_score
    - trace_rank
  t: ["ts_rank_score"]

# === FINGERPRINT ===
fingerprint:
  source_commit: "0abef2c0"
  generated_at: "2026-04-30T00:00:00Z"
  generator_version: "manual@v0"
  manual_fields: ["all"]

  notes:
    - decision: "autorange='reversed' sur Y2 pour le rang"
      why: |
        Le rang 1 = MEILLEUR (champion du match). Visuellement, le 'meilleur' doit être EN HAUT.
        Sans cette inversion, le rang 8 (loser) serait en haut, ce qui contredit l'intuition.
        Côté ECharts : `yAxis[1].inverse: true`.

    - decision: "Score personnel en BARS, rang en LINE"
      why: |
        Score = quantité (taille de la barre proportionnelle), rang = ordre (mieux représenté
        par une ligne qui monte/descend de rang en rang). Convention bar/line séparant cardinal
        vs ordinal.
