<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquette des réglages du rejeu</title>
<style>
:root,:root[data-theme='dark']{
  --background:oklch(0.145 0 0);--foreground:oklch(0.985 0 0);--card:oklch(0.205 0 0);--popover:oklch(0.269 0 0);
  --primary:oklch(0.922 0 0);--primary-foreground:oklch(0.205 0 0);--secondary:oklch(0.269 0 0);
  --accent:oklch(0.371 0 0);--accent-foreground:oklch(0.985 0 0);--muted:oklch(0.269 0 0);--muted-foreground:oklch(0.708 0 0);
  --border:oklch(0.275 0 0);--input:oklch(0.325 0 0);--ring:oklch(0.556 0 0);--destructive:oklch(0.704 0.191 22.216);
  --scrim:oklch(0 0 0);--on-scrim:oklch(1 0 0);--placeholder-border:oklch(0.55 0 0);--radius:0.5rem;
  --ac-team-ally:#3B82F6;--ac-team-enemy:#EF4444;--ac-zone-neutral:#9CA3AF;--ac-divergent-neutral:#60A5FA;
  --ac-success:#10B981;--ac-legendary:#FBBF24;--ac-marker-band:#080C12;--ac-marker-rim:#FFFFFF;
  --ac-s1:#93C5FD;--ac-s2:#6366F1;--ac-s3:#4F46E5;--ac-s4:#4338CA;--ac-s5:#3730A3;--ac-s6:#10B981;--ac-s7:#F59E0B;--ac-s8:#EC4899;
  color-scheme:dark;
}
:root[data-theme='light']{
  --background:oklch(0.985 0.004 255);--foreground:oklch(0.255 0.02 255);--card:oklch(0.995 0.002 255);--popover:oklch(0.995 0.002 255);
  --primary:oklch(0.56 0.22 262);--primary-foreground:oklch(0.985 0 0);--secondary:oklch(0.95 0.01 255);
  --accent:oklch(0.92 0.02 255);--accent-foreground:oklch(0.24 0.02 255);--muted:oklch(0.96 0.008 255);--muted-foreground:oklch(0.52 0.015 255);
  --border:oklch(0.9 0.01 255);--input:oklch(0.93 0.01 255);--ring:oklch(0.63 0.12 262);--destructive:oklch(0.637 0.208 25.331);
  --placeholder-border:oklch(0.9 0.01 255);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--background);color:var(--foreground);font:400 14px/1.4 Roboto,system-ui,sans-serif;min-width:1280px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
input,select{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 2px var(--ring)}
.tn{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block}
[hidden]{display:none!important}
.mut{color:var(--muted-foreground)}
.desc{color:var(--muted-foreground)}
#ov-feed .a{color:var(--ac-team-ally)}#ov-feed .e{color:var(--ac-team-enemy)}

/* ---------- bandeau de maquette (hors page simulée) ---------- */
#mq{position:sticky;top:0;z-index:100;display:flex;align-items:center;gap:14px;min-height:44px;padding:5px 14px;background:#241a46;color:#f1ecff;border-bottom:2px solid #8b5cf6;font-size:12px;flex-wrap:wrap}
#mq b{font-weight:600}
#mq .mq-line{flex:1 1 360px;min-width:260px;line-height:1.3}
#mq .mq-grp{display:flex;align-items:center;gap:6px}
#mq .mq-lab{opacity:.75}
#mq .mq-seg{display:flex;border:1px solid #6d5bb3;border-radius:6px;overflow:hidden}
#mq .mq-seg button{padding:4px 9px;font-size:11.5px;color:#d8cffc}
#mq .mq-seg button[aria-pressed=true]{background:#8b5cf6;color:#fff}
#mq .mq-btn{padding:4px 10px;border:1px solid #6d5bb3;border-radius:6px;font-size:11.5px;color:#f1ecff}
#mq .mq-btn:hover{background:#3a2c6e}
#mq .mq-btn[aria-pressed=true]{background:#8b5cf6;border-color:#8b5cf6;color:#fff}
#mq select{background:#241a46;color:#f1ecff;border:1px solid #6d5bb3;border-radius:6px;padding:3px 6px;font-size:11.5px}
#mq :focus-visible{box-shadow:0 0 0 2px #c4b5fd}
#mq .mq-count{font-variant-numeric:tabular-nums;opacity:.9;flex:1 1 100%;font-size:11.5px}

/* ---------- coque de l'application ---------- */
#appbar{height:48px;display:flex;align-items:center;gap:20px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--card)}
#appbar .logo{font-weight:700;font-size:15px;letter-spacing:.01em}
#appbar nav{display:flex;gap:4px;font-size:13px}
#appbar nav span{padding:6px 10px;border-radius:6px;color:var(--muted-foreground)}
#appbar nav span.on{background:var(--accent);color:var(--accent-foreground)}
#appbar .av{margin-left:auto;width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600}
#page{width:100%;margin:0 auto;padding:0 24px}
.f-standard #page{max-width:1248px}
.f-cinema #page{padding:0 24px 8px}
.f-full #appbar{display:none}
.f-full #page{position:fixed;left:0;right:0;top:var(--mqh,44px);bottom:0;z-index:40;background:var(--background);padding:12px 4px 6px;overflow-y:auto;display:flex;flex-direction:column}
.f-full #page>*{flex-shrink:0}
.f-full #page>#grid{margin-top:auto;margin-bottom:auto}

/* ---------- en-têtes ---------- */
.hdr-s{height:64px;display:grid;grid-template-columns:minmax(0,1fr) 440px minmax(0,1fr);column-gap:16px;align-items:center}
.hdr-c{height:52px;display:flex;align-items:center;gap:12px;padding:0 4px}
.hdr-cell{display:flex;align-items:center;gap:12px;min-width:0}
.hdr-cell.r{justify-content:flex-end;gap:8px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;height:32px;width:32px;border-radius:6px;color:var(--muted-foreground);flex-shrink:0}
.iconbtn:hover{background:var(--accent);color:var(--accent-foreground)}
.ttl{min-width:0}
.ttl .l1{font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl .l2{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheetlink{display:inline-flex;align-items:center;height:28px;padding:0 10px;font-size:12px;border:1px solid var(--border);border-radius:6px;color:var(--muted-foreground)}
.quitbtn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;font-size:14px;border:1px solid var(--border);border-radius:6px;background:var(--card)}
.quitbtn:hover{background:var(--accent);color:var(--accent-foreground)}
.quitbtn kbd{font:inherit;font-size:12px;color:var(--muted-foreground);border:1px solid var(--border);border-radius:4px;padding:0 6px}

/* bandeau de score */
.score{display:flex;align-items:stretch;gap:8px;width:100%}
.score .bar{position:relative;flex:1;min-width:0;height:24px;background:var(--muted);border-radius:3px;overflow:hidden}
.score .bar i{position:absolute;top:0;bottom:0;display:block}
.score .bar .n{position:absolute;top:0;bottom:0;display:flex;align-items:center;padding:0 8px;font:700 14px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--foreground)}
.score .ally{border-left:3px solid var(--ac-team-ally)}
.score .ally i{background:var(--ac-team-ally);right:0}
.score .ally .n{right:0}
.score .enemy{border-right:3px solid var(--ac-team-enemy)}
.score .enemy i{background:var(--ac-team-enemy);left:0}
.score .enemy .n{left:0}
.score .clock{flex-shrink:0;min-width:44px;display:flex;align-items:center;justify-content:center;font:700 13px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.score .tl{position:absolute;left:8px;font-size:10px;font-weight:600;letter-spacing:.04em;opacity:.75;top:0;bottom:0;display:flex;align-items:center;z-index:1;color:var(--foreground)}

/* rangée de fiches (cinéma, plein cadre) */
#cardsrow{display:grid;grid-template-columns:minmax(0,1fr) 270px minmax(0,1fr);column-gap:8px;align-items:center;margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.card-c{position:relative;display:flex;align-items:center;gap:6px;height:34px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:11.5px;min-width:0}
.card-c .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.card-c .nm{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.card-c .kd{font-size:11px;color:var(--muted-foreground)}
.card-c.sel{background:var(--accent)}
.card-c.hid .nm{color:var(--muted-foreground);text-decoration:line-through}
.card-c.fol{box-shadow:inset 0 0 0 1px var(--ring)}
.tact{display:flex;gap:2px;position:absolute;right:3px;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .12s}
.group:hover .tact,.group:focus-within .tact,.tact:has([aria-pressed=true]){opacity:1}
.tact button{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:3px;background:color-mix(in oklab,var(--background) 80%,transparent);color:var(--muted-foreground)}
.tact button:hover{color:var(--foreground)}
.tact button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}

/* ---------- grille plan + colonne ---------- */
#grid{position:relative}
.f-standard #grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden;margin-bottom:12px}
.f-cinema #grid,.f-full #grid{display:block}
#mapcell{min-width:0;display:flex;flex-direction:column}
.f-standard #mapblock{display:flex;flex-direction:column;flex:1}
.f-standard #stage{margin:12px 12px 0}
.f-cinema #mapblock,.f-full #mapblock{position:relative;border:1px solid var(--border);border-radius:8px;background:var(--card);overflow:hidden}
.f-cinema #mapblock{padding-bottom:0}
#stage{position:relative;height:var(--cvh,520px);border-radius:8px;overflow:hidden;background:color-mix(in oklab,var(--background) 70%,var(--card))}
.f-cinema #stage,.f-full #stage{border-radius:0;height:var(--cvh,520px)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#cv.drag{cursor:grabbing}
#barout{margin-top:6px}
#col{display:none}
.f-standard #col{display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--border);padding:12px 14px;min-width:0;max-height:var(--colh,640px)}
.f-standard #col.withsheet{overflow-y:auto}

/* ---------- bouton Vue, accès rapide, calques sur la carte ---------- */
#ov-top{position:absolute;right:8px;top:8px;z-index:20;display:flex;gap:6px;align-items:center}
.vbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:color-mix(in oklab,var(--card) 85%,transparent);backdrop-filter:blur(4px);white-space:nowrap}
.vbtn b{font-weight:600;color:var(--foreground)}
.vbtn[aria-expanded=true]{background:var(--accent);color:var(--accent-foreground)}
.vbtn:hover{background:var(--accent)}
.vbtn .mod{font-weight:400;color:var(--muted-foreground)}
.quick{display:flex;gap:2px;padding:2px;border:1px solid var(--border);border-radius:6px;background:color-mix(in oklab,var(--card) 85%,transparent);backdrop-filter:blur(4px);height:32px;align-items:center}
.quick button{width:26px;height:26px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted-foreground)}
.quick button:hover{background:var(--accent);color:var(--accent-foreground)}
.quick button[aria-pressed=true]{background:var(--accent);color:var(--accent-foreground)}
.quick button:disabled{opacity:.35}
.quick .qe{font-size:10.5px;color:var(--muted-foreground);padding:0 8px}
.ov{position:absolute;z-index:10;pointer-events:none}
#ov-feed{left:16px;bottom:12px;width:350px;display:flex;flex-direction:column;gap:0;font-size:12px;text-shadow:0 0 2px var(--scrim),0 0 6px var(--scrim),0 1px 2px var(--scrim);color:var(--on-scrim)}
#ov-feed .fo{height:28px;display:flex;align-items:center;gap:6px;white-space:nowrap}
#ov-legend{left:12px;top:12px;font-size:10px;color:var(--muted-foreground);padding:6px 8px;border-radius:6px;background:color-mix(in oklab,var(--card) 85%,transparent);border:1px solid var(--border);width:132px}
#ov-legend .gr{height:6px;border-radius:3px;margin:4px 0 3px;background:linear-gradient(90deg,#1d4ed8,#06b6d4,#fde047,#ef4444)}
#ov-legend .lb{display:flex;justify-content:space-between}
#ov-zoom{right:12px;bottom:8px;pointer-events:auto;display:flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:6px;background:color-mix(in oklab,var(--card) 85%,transparent)}
#ov-zoom .zc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
#ov-zoom .zc span{font-size:10.5px;color:var(--muted-foreground);line-height:20px}
#ov-zoom button{width:20px;height:20px;border-radius:3px;font-size:10.5px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted-foreground)}
#ov-zoom button:hover:not(:disabled){background:var(--accent);color:var(--accent-foreground)}
#ov-zoom button:disabled{opacity:.35}
#ov-zoom .cross{display:grid;grid-template-columns:repeat(3,20px);grid-template-rows:repeat(3,20px)}
#ov-sound{left:50%;top:10px;transform:translateX(-50%);padding:3px 10px;border-radius:999px;font-size:11px;background:color-mix(in oklab,var(--card) 88%,transparent);border:1px solid var(--border);opacity:0;transition:opacity .25s}
#ov-sound.on{opacity:1}
#ov-pov{left:12px;bottom:8px;font-size:10.5px;color:var(--muted-foreground);padding:2px 8px;border-radius:999px;background:color-mix(in oklab,var(--card) 80%,transparent)}
.f-cinema #ov-pov,.f-full #ov-pov{display:none}

/* ---------- barre complète ---------- */
#bar-full{margin-top:12px;background:color-mix(in oklab,var(--background) 40%,transparent);padding:12px 12px 10px}
.tracks{display:grid;grid-template-columns:104px minmax(0,1fr);row-gap:5px;align-items:center;margin-bottom:5px}
.tracks .lab{font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.tracks .lab select{width:100%;font-size:11px;text-transform:none;letter-spacing:0;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:1px 2px;color:var(--foreground)}
.trk{position:relative;border:1px solid var(--border);border-radius:6px;background:color-mix(in oklab,var(--muted) 30%,transparent);overflow:hidden}
.trk.t1{height:20px}.trk.t2{height:14px}.trk.t3{height:10px;border-radius:999px}.trk.t4{height:10px;border-radius:999px}
.trk .mk{position:absolute;top:2px;bottom:2px;width:3px;border-radius:1px;margin-left:-1px}
.trk .mk.k{background:var(--ac-success)}.trk .mk.d{background:var(--ac-team-enemy);top:auto;height:55%;bottom:2px}.trk .mk.k{height:55%;bottom:auto}
.trk.t2 .mk{top:2px;bottom:2px;opacity:.85}
.trk .seg{position:absolute;top:0;bottom:0}
.curs{position:relative;display:grid;grid-template-columns:104px minmax(0,1fr)}
.curs .in{position:relative;height:16px;cursor:pointer;touch-action:none}
.curs .rail{position:absolute;left:0;right:0;top:6px;height:4px;border-radius:999px;background:var(--input)}
.curs .fill{position:absolute;left:0;top:6px;height:4px;border-radius:999px;background:var(--muted-foreground)}
.curs .th{position:absolute;top:2px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--foreground)}
.curs .head{position:absolute;top:-62px;bottom:16px;width:1px;background:color-mix(in oklab,var(--foreground) 55%,transparent);pointer-events:none}
.tlabels{display:grid;grid-template-columns:104px minmax(0,1fr)}
.tlabels .tl{position:relative;height:15px}
.tlabels span{position:absolute;transform:translateX(-50%);font-size:11px;font-weight:500;color:var(--muted-foreground);white-space:nowrap}
.tlabels .chev{display:flex;align-items:center}
.chevbtn{display:flex;align-items:center;justify-content:center;width:100%;height:16px;border-radius:4px;color:var(--muted-foreground)}
.chevbtn:hover{background:var(--accent);color:var(--foreground)}
.bar-row{display:flex;align-items:center;gap:14px;margin-top:6px}
.bar-row .side{display:flex;flex:1;align-items:center;gap:8px;min-width:0}
.bar-row .side.r{justify-content:flex-end}
.bar-row .mid{display:flex;align-items:center;gap:6px;flex-shrink:0}
.rb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;flex-shrink:0;font-size:10.5px;font-weight:500}
.rb.ghost{color:var(--muted-foreground)}
.rb.ghost:hover{background:var(--accent);color:var(--accent-foreground)}
.rb.bord{border:1px solid var(--input)}
.rb.bord:hover{background:var(--accent)}
.playbtn{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--primary);color:var(--primary-foreground);flex-shrink:0}
.playbtn:hover{background:color-mix(in oklab,var(--primary) 90%,transparent)}
.autoplay{display:inline-flex;align-items:center;justify-content:center;height:30px;width:34px;border-radius:999px;color:var(--muted-foreground)}
.autoplay[aria-checked=true]{color:var(--foreground);background:var(--secondary)}
.autoplay:hover{background:var(--accent)}
.snd{display:flex;align-items:center;gap:6px}
.sndb{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:var(--muted-foreground);position:relative}
.sndb:hover{background:var(--accent);color:var(--accent-foreground)}
.sndb[aria-pressed=true]{color:var(--foreground)}
.sndb.pulse::after{content:'';position:absolute;inset:3px;border-radius:50%;border:2px solid var(--ring);animation:pl .5s ease-out forwards}
@keyframes pl{from{opacity:1;transform:scale(.8)}to{opacity:0;transform:scale(1.35)}}
input[type=range].vol{appearance:none;-webkit-appearance:none;background:transparent;height:12px;width:58px;cursor:pointer;margin:0}
input[type=range].vol::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(to right,var(--muted-foreground) 0 var(--played),var(--input) var(--played) 100%)}
input[type=range].vol::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;margin-top:-4px;width:12px;height:12px;border-radius:50%;background:var(--foreground)}
input[type=range].vol::-moz-range-track{height:4px;border-radius:999px;background:linear-gradient(to right,var(--muted-foreground) 0 var(--played),var(--input) var(--played) 100%)}
input[type=range].vol::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--foreground)}
input[type=range].vol:disabled{opacity:.6}
.spdbtn{position:relative}
.spd{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--input);border-radius:999px;font-size:12.5px;font-weight:500}
.spd:hover{background:var(--accent)}
.menu{position:absolute;bottom:calc(100% + 6px);z-index:30;border:1px solid var(--border);border-radius:8px;background:var(--popover);padding:4px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.menu button.mi{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:28px;padding:0 8px;border-radius:4px;font-size:12.5px;white-space:nowrap}
.menu button.mi:hover,.menu button.mi[aria-checked=true]{background:var(--accent);color:var(--accent-foreground)}
.menu .sub{font-size:10.5px;color:var(--muted-foreground)}
.menu h4{margin:0;padding:4px 8px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground)}
.capwrap{display:inline-flex;align-items:center;gap:2px;padding:4px;border-radius:999px;border:1px solid var(--border);background:color-mix(in oklab,var(--muted) 40%,transparent)}
.capwrap button{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%}
.capwrap .cap{background:var(--secondary)}
.capwrap .exp{background:var(--primary);color:var(--primary-foreground)}
.fbtns{display:flex;align-items:center;gap:2px;margin-left:6px}
.fbtns .fb{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;color:var(--muted-foreground)}
.fbtns .fb:hover{background:var(--accent);color:var(--accent-foreground)}
.fbtns .fb[aria-pressed=true]{background:var(--accent);color:var(--accent-foreground)}
.fbtns .sepv{width:1px;height:16px;background:var(--border);margin:0 4px}

/* ---------- barre d'une ligne ---------- */
#bar-compact{position:relative;height:56px;background:transparent}
.f-full #bar-compact{background:color-mix(in oklab,var(--background) 70%,transparent)}
.f-full #bar-compact.fine{background:color-mix(in oklab,var(--background) 45%,transparent);backdrop-filter:blur(6px)}
.f-full #barin{position:absolute;left:1px;right:1px;bottom:1px;z-index:20;border-radius:0 0 7px 7px;overflow:visible}

/* A : onglets verticaux */

/* B : accordéon */
.acc{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.searchf{display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border:1px solid var(--input);border-radius:6px;background:var(--background);color:var(--muted-foreground)}

.accbody{padding:4px 4px 6px}
mark.hl{background:color-mix(in oklab,var(--ac-legendary) 35%,transparent);color:inherit;border-radius:2px}

/* lignes de réglage */
.row{display:flex;align-items:center;gap:6px;min-height:28px;padding:0 6px 0 8px;border-radius:4px;font-size:12px;position:relative}
.row:hover{background:var(--muted)}
.row .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.row.child{padding-left:24px}

.row.off .lb{color:var(--muted-foreground)}

.sw{position:relative;flex-shrink:0;width:28px;height:16px;border-radius:999px;border:1px solid var(--border);background:var(--muted);transition:background .12s}

.sw[aria-checked=true]{background:var(--primary);border-color:var(--primary)}

.sw:disabled{opacity:.5}
.pin{width:20px;height:20px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted-foreground);opacity:0;flex-shrink:0}
.row:hover .pin,.row:focus-within .pin,.pin[aria-pressed=true]{opacity:1}

.pin[aria-pressed=true]{color:var(--foreground);background:var(--accent)}
.segrow{display:flex;flex-direction:column;gap:3px;padding:4px 8px 6px;font-size:12px}
.segrow.child{padding-left:24px}

.seg{display:flex;border:1px solid var(--border);border-radius:6px;padding:1px;gap:1px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;min-height:24px;padding:3px 6px;border-radius:5px;font-size:11px;font-weight:500;line-height:1.15;color:var(--muted-foreground);text-align:center}
.seg button:hover{background:var(--accent)}
.seg button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}

.pastilles{display:flex;gap:4px;flex-wrap:wrap}

.hrow .v{min-width:6ch;font-variant-numeric:tabular-nums;text-align:right}
.note{font-size:11px;color:var(--muted-foreground);padding:2px 8px 4px}
.empty{margin:4px 8px;border:1px dashed var(--placeholder-border);border-radius:6px;padding:6px 8px;font-size:11px;color:var(--muted-foreground)}
.slrow{display:flex;align-items:center;gap:10px;padding:4px 8px;font-size:12px}
.slrow .lb{width:70px;color:var(--foreground)}
.slrow input{flex:1;accent-color:var(--primary)}
.slrow .v{min-width:4ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted-foreground)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:200;padding:8px 14px;border-radius:8px;background:var(--popover);border:1px solid var(--border);font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4)}

/* ancien panneau */
.old .og{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}

.oldbanner{font-size:11px;color:var(--muted-foreground);border:1px dashed var(--placeholder-border);border-radius:6px;padding:6px 8px;margin-bottom:8px}

</style>
</head>
<body>
<div id="mq" role="region" aria-label="Bandeau de la maquette">
  <div class="mq-line"><b>Maquette des réglages du rejeu 2D</b> : <span id="mq-what"></span></div>
  <div class="mq-grp"><span class="mq-lab">Panneau</span>
    <div class="mq-seg" role="group" aria-label="Variante du panneau">
      <button type="button" data-mq="variant" data-v="A" aria-pressed="true">Variante A</button>
      <button type="button" data-mq="variant" data-v="B" aria-pressed="false">Variante B</button>
    </div></div>
  <div class="mq-grp"><span class="mq-lab">Thème</span>
    <div class="mq-seg" role="group" aria-label="Thème">
      <button type="button" data-mq="theme" data-v="dark" aria-pressed="true">Sombre</button>
      <button type="button" data-mq="theme" data-v="light" aria-pressed="false">Clair</button>
    </div></div>
  <div class="mq-grp"><label class="mq-lab" for="mq-mode">Match</label>
    <select id="mq-mode"><option value="ctf">Capture du drapeau</option><option value="slayer">Assassin (sans objectif)</option></select>
    <button type="button" class="mq-btn" data-mq="reopen" title="Rouvrir le rejeu : applique la vue d'ouverture choisie">Rouvrir le rejeu</button></div>
  <button type="button" class="mq-btn" id="mq-compare" data-mq="compare" aria-pressed="false">Comparer avec l'existant</button>
  <button type="button" class="mq-btn" data-mq="reset">Réinitialiser la maquette</button>
  <span class="mq-count" id="mq-count" aria-live="polite"></span>
</div>

<div id="shell" class="f-standard">
  <div id="appbar">
    <span class="logo">LevelUp</span>
    <nav aria-label="Navigation de l'application (décor)"><span>Accueil</span><span class="on">Matchs</span><span>Sessions</span><span>Escouades</span><span>Médias</span></nav>
    <span class="av" aria-hidden="true">A</span>
  </div>
  <div id="page">
    <header id="hdr"></header>
    <div id="cardsrow" hidden></div>
    <div id="grid">
      <div id="mapcell">
        <div id="mapblock">
          <div id="stage">
            <canvas id="cv" aria-label="Carte du rejeu (animation)"></canvas>
            <div id="ov-top"></div>
            <div class="ov" id="ov-legend" hidden></div>
            <div class="ov" id="ov-feed" hidden></div>
            <div class="ov" id="ov-sound"></div>
            <div class="ov" id="ov-pov"></div>
            <div class="ov" id="ov-zoom" hidden></div>
            <div id="popover" class="popover" hidden></div>
          </div>
          <div id="barin"><div id="bar-full"></div></div>
        </div>
        <div id="barout"></div>
      </div>
      <aside id="col" aria-label="Équipes et fil"></aside>
    </div>
  </div>
  <div id="host"></div>
</div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
'use strict';
/* Logique pure de la maquette : scénario, registre des réglages, préréglages, comptes. Aucun accès au DOM. */
(function (root) {
  var MAP = { w: 760, h: 564 };
  var V = 55, DT = 0.1, TMAX = 60, NS = 601, RESPAWN = 5;

  /* ---------- carte : nœuds de circulation (repère 760 x 564, tirés du plan) ---------- */
  var N = {

var AC = null, lastSndT = 0, sndTimer = 0;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function beep(freq, dur) {
  ensureAudio();
  var vol = (cfg.volume / 100) * 0.1;
  if (!AC || vol < 0.002) return;
  var o = AC.createOscillator(), gn = AC.createGain(), now = AC.currentTime;
  o.type = 'triangle'; o.frequency.value = freq;
  gn.gain.setValueAtTime(vol, now); gn.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(gn); gn.connect(AC.destination); o.start(now); o.stop(now + dur);
}

var CAT_HZ = { weapon: 170, grenade: 90, melee: 250, equipment: 520, voice: 340 };

}

}
function layout() {
  var mq = $('mq').offsetHeight, ih = window.innerHeight, f = ses.frame, chrome;
  $('shell').style.setProperty('--mqh', mq + 'px');
  if (f === 'standard') chrome = mq + 48 + 64 + 176 + 40;
  else if (f === 'cinema') chrome = mq + 52 + 42 + 68 + 22;
  else chrome = mq + 12 + 6 + 52 + 42 + (cfg.thinBar ? 0 : 68) + 8;
  var h = clamp(ih - chrome, 360, 720);
  $('shell').style.setProperty('--cvh', h + 'px');
  resizeCanvas();
  var col = $('col');
  col.style.height = f === 'standard' ? ($('mapblock').offsetHeight + 'px') : '';
  positionPanel();
}
function setZoom(z) {
  z = clamp(z, 1, 3); ses.zoom = z;
  ses.followId = null;
  if (z === 1) ses.pan = null; else if (!ses.pan) ses.pan = { x: vw.cx, y: vw.cy };
  renderZoomBox(); renderPov(); if (ses.frame !== 'standard') renderBars();
}
function stepZoom(d) { var i = ZOOMS.indexOf(ses.zoom); setZoom(ZOOMS[clamp(i + d, 0, ZOOMS.length - 1)]); }
function panBy(dir) {
  if (ses.zoom <= 1) return;
  var step = 0.18 * Math.min(MAPW, MAPH) / ses.zoom, p = ses.pan || { x: vw.cx, y: vw.cy };
  var d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[dir];
  ses.followId = null;
  /* le sens se lit à l'écran : on le ramène dans le repère de la carte */
  var ux = d[0] * step, uy = d[1] * step;
  ses.pan = { x: clamp(p.x + ux * vw.c + uy * vw.s, 0, MAPW), y: clamp(p.y - ux * vw.s + uy * vw.c, 0, MAPH) };
}
function setFollow(id) {
  ses.followId = id;
  if (id != null) { ses.hidden[id] = false; ses.solo = null; if (ses.zoom < 1.5) ses.zoom = 2; ses.pan = null; followPos = null; }
  refreshAll({ bars: true });
}
function setPov(id) { ses.povId = id; refreshAll({ bars: true }); }
function openSheet(i) { ses.sheet = i; colKey = ''; refreshAll(); }
function closeSheet() { ses.sheet = null; if (cfg.floorFollow) { cfg.floorFollow = false; saveCfg(); } colKey = ''; refreshAll(); }
function toggleHide(i) {
  ses.hidden[i] = !ses.hidden[i]; ses.solo = null; if (ses.hidden[i] && ses.followId === i) ses.followId = null;
  refreshAll({ bars: true });
}
function toggleSolo(i) {
  if (ses.solo === i) { ses.solo = null; ses.hidden = {}; }
  else { ses.solo = i; ses.hidden = {}; PL.forEach(function (p, k) { if (k !== i) ses.hidden[k] = true; }); ses.hidden[i] = false; }
  refreshAll({ bars: true });
}
function followFloor(force) {
  if (!cfg.floorFollow || ses.sheet == null) return;
  var q = posAt(ses.sheet, ses.t);
  if (!q.al) return;
  var f = floorOfPos(q.x, q.y);
  if (force || ses.floor !== f) { ses.floor = f; invalidateCaches(); renderPov(); if (ses.panelOpen) renderPanel(); }
}
function setFloor(v) {
  cfg.floorFollow = false;
  ses.floor = v === 'all' ? null : parseFloat(v);
  if (ses.floor == null) cfg.floorFollow = false;
  invalidateCaches(); refreshAll();
}
function closeMenus() {
  var had = ses.menu || ses.feedMenu;
  ses.menu = null; ses.feedMenu = false;
  if (had) { renderBars(); colKey = ''; renderColumn(true); }
}
function toggleMenu(name) { ses.menu = ses.menu === name ? null : name; ses.feedMenu = false; renderBars(); colKey = ''; renderColumn(true); }
function openPanel() {
  ses.panelOpen = true; renderTop(); renderPanel();
  var x = $('panelhost').querySelector('.xbtn'); if (x) x.focus();
}
function closePanel(returnFocus) {
  if (!ses.panelOpen) return;
  ses.panelOpen = false; ses.saving = false; ses.confirmReset = false;
  renderPanel(); renderTop();
  if (returnFocus) { var b = $('vbtn'); if (b) b.focus(); }
}

/* ---------- vues enregistrées ---------- */
function newViewId() { return 'v' + Date.now().toString(36) + Math.floor(Math.random() * 99); }
function saveViewDo() {
  var inp = $('viewname'), name = (inp ? inp.value : '').trim();
  if (!name) { toast('Donnez un nom à la vue.'); if (inp) inp.focus(); return; }
  if (ui.views.length >= C.VIEW_MAX) { toast('3 vues au plus.'); return; }
  var v = { id: newViewId(), name: name.slice(0, 24), values: C.snapshotValues(cfg), mode: '' };
  ui.views.push(v); ui.activeId = v.id; ses.saving = false; ses.saveName = '';
  saveUi(); refreshAll(); toast('Vue « ' + v.name + ' » enregistrée.');
}
function applyOpenView() {
  var linked = ui.views.filter(function (v) { return v.mode === ui.mode; })[0];
  if (linked) { applyView(linked.id); return linked.name + ' (rattachée à ce mode)'; }
  if (ui.defaultViewId && viewValues(ui.defaultViewId)) { applyView(ui.defaultViewId); return viewName(ui.defaultViewId) + ' (vue d’ouverture)'; }
  return null;
}
function reopenReplay(silent) {
  var keepPanel = ses.panelOpen, frame = ses.frame;
  ses = freshSes(); ses.frame = frame; ses.panelOpen = keepPanel;
  invalidateCaches();
  var applied = applyOpenView();
  ses.t = 0; ses.playing = !!cfg.autoplay; lastSndT = 0; followPos = null;
  $('shell').className = 'f-' + ses.frame;
  renderHeader(); renderBars(); layout(); refreshAll();
  if (!silent) toast(applied ? 'Rejeu rouvert avec la vue : ' + applied : 'Rejeu rouvert : vos réglages sont conservés.');
}
function resetMaquette() {
  lsClear(); loadAll(); document.documentElement.setAttribute('data-theme', ui.theme); readTokens();
  invalidateCaches(); $('shell').className = 'f-standard';
  ses.playing = !!cfg.autoplay;
  renderHeader(); renderBars(); layout(); refreshAll(); toast('Maquette réinitialisée.');
}

/* ---------- actions ---------- */
function act(name, el, ev) {
  var id = el.dataset.id, v = el.dataset.v, pid = el.dataset.pid != null ? parseInt(el.dataset.pid, 10) : null, d;
  switch (name) {
    case 'back': toast('Retour à la liste des matchs (décor de la maquette)'); break;
    case 'sheetlink': toast('Fiche du match (décor de la maquette)'); break;
    case 'quit': setFrame('standard'); break;
    case 'frame': setFrame(v); break;
    case 'fullscreen':
      try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { toast('Plein écran indisponible ici'); }
      break;
    case 'play': togglePlay(); break;
    case 'restart': seek(0); break;
    case 'skip': seek(ses.t + parseInt(v, 10)); break;
    case 'speed-menu': toggleMenu('speed'); break;
    case 'speed-set': cfg.speed = parseFloat(v); ses.menu = null; setCfg('speed', cfg.speed); break;
    case 'autoplay': setCfg('autoplay', !cfg.autoplay); toast(cfg.autoplay ? 'Lecture automatique : le rejeu démarre seul à l’ouverture.' : 'Lecture automatique éteinte : le rejeu s’ouvre en pause.'); break;
    case 'sound': if (!cfg.sound) ensureAudio(); setCfg('sound', !cfg.sound); break;
    case 'cam-menu': toggleMenu('cam'); break;
    case 'cam-follow': ses.menu = null; setFollow(pid < 0 ? null : pid); break;
    case 'cam-pov': ses.menu = null; setPov(pid); break;
    case 'tracks-toggle': ses.tracksOpen = !ses.tracksOpen; renderBars(); layout(); break;
    case 'zoom-in': stepZoom(1); break;
    case 'zoom-out': stepZoom(-1); break;
    case 'pan': panBy(el.dataset.d); break;
    case 'home': ses.zoom = 1; ses.pan = null; ses.followId = null; renderZoomBox(); renderPov(); if (ses.frame !== 'standard') renderBars(); break;
    case 'upright': setCfg('orientation', '0'); renderBars(); break;
    case 'capture': toast('Image capturée (maquette : aucun fichier écrit)'); break;
    case 'export': ses.exportOpen = true; $('dlghost').innerHTML = exportHTML(); { var xb = $('dlghost').querySelector('.xbtn'); if (xb) xb.focus(); } break;
    case 'export-close': ses.exportOpen = false; $('dlghost').innerHTML = ''; break;
    case 'export-do': ses.exportOpen = false; $('dlghost').innerHTML = ''; toast('Export lancé (maquette : aucun fichier écrit)'); break;
    case 'vue': if (ses.panelOpen) closePanel(false); else openPanel(); break;
    case 'panel-close': closePanel(true); break;
    case 'quick': if (C.isVisible(id, ctx())) setCfg(id, !cfg[id]); break;
    case 'feedmenu': ses.feedMenu = !ses.feedMenu; ses.menu = null; colKey = ''; renderColumn(true); break;
    case 'feed-set': cfg.feedFilter = id; ses.feedMenu = false; afterCfg(false); break;
    case 'open': openSheet(pid); break;
    case 'follow': setFollow(ses.followId === pid ? null : pid); break;
    case 'hide': toggleHide(pid); break;
    case 'showall': ses.hidden = {}; ses.solo = null; refreshAll({ bars: true }); break;
    case 'solo': toggleSolo(pid); break;
    case 'fiche-close': case 'fiche-back': closeSheet(); break;
    case 'pov': setPov(pid); break;
    /* panneau proposé */
    case 'tog': if (id === 'floorFollow' && ses.sheet == null) break; if (id === 'sound' && !cfg.sound) ensureAudio(); setCfg(id, !cfg[id]); if (id === 'floorFollow') followFloor(true); break;
    case 'seg': setCfg(id, v); break;
    case 'floor': setFloor(v); break;
    case 'master': d = C.masterState(id = el.dataset.rub, ctx()); C.setMaster(id, ctx(), d.state !== 'all'); afterCfg(id === 'son'); break;
    case 'tab': ui.tab = id; saveUi(); renderPanel(); updateBanner(); break;
    case 'acc': ui.open[id] = !ui.open[id]; saveUi(); renderPanel(); updateBanner(); break;
    case 'preset': applyView(id); refreshAll({ bars: true }); break;
    case 'revert': applyView(ui.activeId); refreshAll({ bars: true }); toast('Vue rétablie : ' + viewName(ui.activeId)); break;
    case 'update-view': {
      var u = ui.views.filter(function (x) { return x.id === ui.activeId; })[0];
      if (u) { u.values = C.snapshotValues(cfg); saveUi(); refreshAll(); toast('Vue « ' + u.name + ' » mise à jour.'); }
      break;
    }
    case 'save-open': ses.saving = true; renderPanel(); { var vi = $('viewname'); if (vi) vi.focus(); } break;
    case 'save-do': saveViewDo(); break;
    case 'save-cancel': ses.saving = false; renderPanel(); break;
    case 'mgr-toggle': ui.mgrOpen = !ui.mgrOpen; saveUi(); renderPanel(); break;
    case 'view-del': {
      var dv = ui.views.filter(function (x) { return x.id === id; })[0];
      ui.views = ui.views.filter(function (x) { return x.id !== id; });
      if (ui.defaultViewId === id) ui.defaultViewId = null;
      if (ui.activeId === id) ui.activeId = 'complet';
      saveUi(); refreshAll(); if (dv) toast('Vue « ' + dv.name + ' » supprimée.'); break;
    }
    case 'view-default': ui.defaultViewId = ui.defaultViewId === id ? null : id; saveUi(); refreshAll(); break;
    case 'pin': {
      var at = ui.pins.indexOf(id);
      if (at >= 0) ui.pins.splice(at, 1);
      else if (ui.pins.length >= C.PIN_MAX) { toast('5 réglages au plus dans l’accès rapide : retirez-en un d’abord.'); break; }
      else ui.pins.push(id);
      saveUi(); refreshAll(); break;
    }
    case 'reset': ses.confirmReset = true; renderPanel(); break;
    case 'reset-cancel': ses.confirmReset = false; renderPanel(); break;
    case 'reset-do': {
      var keep = { speed: cfg.speed };
      cfg = freshCfg(); cfg.speed = keep.speed; ui.activeId = 'complet'; ses.confirmReset = false; ses.floor = null;
      invalidateCaches(); afterCfg(true); toast('Réglages d’usine rétablis. Vos vues et vos épingles sont conservées.'); break;
    }
    /* ancien panneau */
    case 'old-preset': C.oldApply(cfg, id); afterCfg(false); break;
    case 'old-lives': ui.oldLivesOpen = !ui.oldLivesOpen; saveUi(); renderPanel(); updateBanner(); break;
  }
}

function onClick(ev) {
  var t = ev.target, el = t.closest ? t.closest('[data-act]') : null;
  if (!el) return;
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  act(el.dataset.act, el, ev);
}
function onChange(ev) {
  var el = ev.target;
  if (el.id === 'mq-mode') { ui.mode = el.value; saveUi(); reopenReplay(); return; }
  var a = el.dataset ? el.dataset.act : null;
  if (el.dataset && el.dataset.viewName) {
    var v = ui.views.filter(function (x) { return x.id === el.dataset.viewName; })[0], nm = el.value.trim().slice(0, 24);
    if (v && nm) { v.name = nm; saveUi(); refreshAll(); } else if (v) { refreshAll(); }
    return;
  }
  if (el.dataset && el.dataset.viewMode) {
    var vv = ui.views.filter(function (x) { return x.id === el.dataset.viewMode; })[0];
    if (vv) { vv.mode = el.value; saveUi(); renderPanel(); toast(vv.mode ? 'Vue « ' + vv.name + ' » rattachée aux matchs de ' + (vv.mode === 'ctf' ? 'Capture du drapeau' : 'Assassin') + '.' : 'Rattachement retiré.'); }
    return;
  }
  if (a === 'sel') { cfg.feedFilter = el.value; afterCfg(false); }
  else if (a === 'default-view') { ui.defaultViewId = el.value || null; saveUi(); refreshAll(); }
  else if (a === 'pov-sel') setPov(parseInt(el.value, 10));
  else if (a === 'volume') { cfg.volume = parseInt(el.value, 10); saveCfg(); refreshAll({ bars: true }); }
  else if (a === 'floor-range') { renderPanel(); }
}
function onInput(ev) {
  var el = ev.target, a = el.dataset ? el.dataset.act : null;
  if (a === 'volume') {
    cfg.volume = parseInt(el.value, 10); el.style.setProperty('--played', cfg.volume + '%');
    var nx = el.nextElementSibling; if (nx && nx.classList.contains('v')) nx.textContent = cfg.volume + ' %';
    document.querySelectorAll('input.vol').forEach(function (o) { if (o !== el) { o.value = cfg.volume; o.style.setProperty('--played', cfg.volume + '%'); } });
    saveCfg();
  } else if (a === 'floor-range') {
    cfg.floorFollow = false; ses.floor = parseFloat(el.value); invalidateCaches();
    var n2 = el.nextElementSibling; if (n2) n2.textContent = String(ses.floor).replace('.', ',');
    renderPov();
  } else if (a === 'search') {
    ses.q = el.value; $('accitems').innerHTML = accItemsHTML();
  } else if (a === 'viewname') ses.saveName = el.value;
}

/* ---------- pointeur : frise et carte ---------- */
var drag = null, seekEl = null;
function seekFromEvent(el, ev) {
  var r = el.getBoundingClientRect();
  seek(clamp((ev.clientX - r.left) / r.width, 0, 1) * TMAX);
}
function onPointerDown(ev) {
  var t = ev.target;
  /* fermeture des couches ouvertes par un clic à l'extérieur */
  if (ses.menu && !t.closest('[data-menu-root]') && !t.closest('[data-act="speed-menu"],[data-act="cam-menu"]')) closeMenus();
  if (ses.feedMenu && !t.closest('[data-menu-root]') && !t.closest('[data-act="feedmenu"]')) closeMenus();
  if (ses.panelOpen && !t.closest('.panel') && !t.closest('#vbtn') && !t.closest('.quick') && !t.closest('#toast') && !t.closest('#mq')) closePanel(false);
  var s = t.closest ? t.closest('[data-seek]') : null;
  if (s) { seekEl = s; try { s.setPointerCapture(ev.pointerId); } catch (e) { /* ignoré */ } seekFromEvent(s, ev); ev.preventDefault(); return; }
  if (t === cv) {
    drag = { x: ev.clientX, y: ev.clientY, moved: false, pan: ses.pan ? { x: ses.pan.x, y: ses.pan.y } : { x: vw.cx, y: vw.cy } };
    try { cv.setPointerCapture(ev.pointerId); } catch (e2) { /* ignoré */ }
  }
}
function onPointerMove(ev) {
  if (seekEl) { seekFromEvent(seekEl, ev); return; }
  if (!drag) return;
  var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; cv.classList.add('drag'); }
  if (drag.moved && ses.zoom > 1) {
    ses.followId = null;
    var mx = (dx * vw.c + dy * vw.s) / vw.sc, my = (-dx * vw.s + dy * vw.c) / vw.sc;
    ses.pan = { x: clamp(drag.pan.x - mx, 0, MAPW), y: clamp(drag.pan.y - my, 0, MAPH) };
  }
}
function onPointerUp(ev) {
  if (seekEl) { seekEl = null; return; }
  if (!drag) return;
  var wasClick = !drag.moved, rect = cv.getBoundingClientRect();
  drag = null; cv.classList.remove('drag');
  if (wasClick) {
    var sx = ev.clientX - rect.left, sy = ev.clientY - rect.top, best = -1, bd = 16;
    PL.forEach(function (p, i) {
      if (!visiblePlayer(i)) return;
      var q = posAt(i, ses.t); if (!q.al) return;
      var s = P(q.x, q.y), dd = Math.hypot(s[0] - sx, s[1] - sy);
      if (dd < bd) { bd = dd; best = i; }
    });
    if (best >= 0) openSheet(best);
  }
}
function onWheel(ev) {
  if (ev.target !== cv) return;
  ev.preventDefault();
  stepZoom(ev.deltaY < 0 ? 1 : -1);
}

/* ---------- clavier ---------- */
function onKey(ev) {
  var t = ev.target, tag = t && t.tagName;
  if (ev.key === 'Escape') {
    if (ses.exportOpen) { ses.exportOpen = false; $('dlghost').innerHTML = ''; ev.preventDefault(); return; }
    if (ses.menu || ses.feedMenu) { closeMenus(); ev.preventDefault(); return; }
    if (ses.panelOpen) { closePanel(true); ev.preventDefault(); return; }
    if (ses.sheet != null) { closeSheet(); ev.preventDefault(); return; }
    if (ses.frame === 'full') { setFrame('standard'); ev.preventDefault(); }
    return;
  }
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  var k = ev.key, handled = true;
  if (k === ' ' || k === 'Spacebar') { if (tag === 'BUTTON') return; togglePlay(); }
  else if (k === 'k' || k === 'K') togglePlay();
  else if (k === 'ArrowLeft') { if (ev.shiftKey) panBy('left'); else seek(ses.t - 10); }
  else if (k === 'ArrowRight') { if (ev.shiftKey) panBy('right'); else seek(ses.t + 10); }
  else if (k === 'ArrowUp' && ev.shiftKey) panBy('up');
  else if (k === 'ArrowDown' && ev.shiftKey) panBy('down');
  else if (k === 'j' || k === 'J') seek(ses.t - 10);
  else if (k === 'l' || k === 'L') seek(ses.t + 10);
  else if (k === ',') seek(ses.t - 0.1);
  else if (k === '.') seek(ses.t + 0.1);
  else if (k === 'r' || k === 'R') seek(0);
  else if (k === 'f' || k === 'F') setFrame(ses.frame === 'full' ? 'standard' : 'full');
  else if (k === 't' || k === 'T') setFrame(ses.frame === 'cinema' ? 'standard' : 'cinema');
  else if (k === 'm' || k === 'M') { if (!cfg.sound) ensureAudio(); setCfg('sound', !cfg.sound); }
  else if (k === '+' || k === '=') stepZoom(1);
  else if (k === '-' || k === '_') stepZoom(-1);
  else if (k === '0') { ses.zoom = 1; ses.pan = null; ses.followId = null; renderZoomBox(); renderPov(); }
  else handled = false;
  if (handled) ev.preventDefault();
}

/* ---------- bandeau de la maquette ---------- */
function onBanner(ev) {
  var el = ev.target.closest ? ev.target.closest('[data-mq]') : null;
  if (!el) return;
  var k = el.dataset.mq;
  if (k === 'variant') { ui.variant = el.dataset.v; ui.compare = false; saveUi(); refreshAll(); }
  else if (k === 'theme') { ui.theme = el.dataset.v; document.documentElement.setAttribute('data-theme', ui.theme); readTokens(); invalidateCaches(); saveUi(); updateBanner(); }
  else if (k === 'compare') { ui.compare = !ui.compare; saveUi(); refreshAll(); }
  else if (k === 'reopen') reopenReplay();
  else if (k === 'reset') resetMaquette();
}

/* ---------- boucle ---------- */
var lastTs = 0, lastSlow = 0, lastAutoRot = false;
function loop(ts) {
  requestAnimationFrame(loop);
  var dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0;
  lastTs = ts;
  var prev = ses.t;
  if (ses.playing && !seekEl) {
    ses.t += dt * cfg.speed;
    if (ses.t >= TMAX) { ses.t = 0; prev = 0; followPos = null; }
    checkSounds(prev, ses.t);
  }
  try { render(ses.t); } catch (e) { if (!loop.warned) { loop.warned = true; if (window.console) console.error('Dessin de la carte :', e); } }
  if (ts - lastSlow > 100) {
    lastSlow = ts;
    tickBars(); updateStats(); renderColumn(false); refreshCards(false); renderPlanFeed();
    if (ses.frame === 'full') updateThin();
    followFloor(false);
    if (ses.frame !== 'standard' && ses.autoRot !== lastAutoRot) { lastAutoRot = ses.autoRot; renderBars(); }
  }
}

function start() {
  loadAll();
  document.documentElement.setAttribute('data-theme', ui.theme);
  readTokens();
  var host = $('host'); host.innerHTML = '<div id="panelhost"></div><div id="dlghost"></div>';
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('keydown', onKey);
  document.addEventListener('wheel', onWheel, { passive: false });
  document.addEventListener('fullscreenchange', function () { renderBars(); });
  $('mq').addEventListener('click', onBanner);
  $('barin').addEventListener('pointerenter', function () { ses.barHover = true; updateThin(); });
  $('barin').addEventListener('pointerleave', function () { ses.barHover = false; updateThin(); });
  window.addEventListener('resize', function () { layout(); });
  var applied = applyOpenView();
  ses.playing = !!cfg.autoplay;
  renderHeader(); renderBars(); layout(); refreshAll();
  if (applied) toast('Vue appliquée à l’ouverture : ' + applied);
  loadImages(function () { prepareTerrain(); invalidateCaches(); requestAnimationFrame(loop); });
}
window.MQ_START = start;

})();

</script>
