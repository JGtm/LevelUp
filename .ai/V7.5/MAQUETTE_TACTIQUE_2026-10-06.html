<title>Tactique avant après</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Jetons de l'app (styles/globals.css + lib/accessibility/palettes/default.ts), repris des
     maquettes validées (Vue match, Sessions) ; ajouts : primary, input, sidebar, destructive,
     heatmap-divergent-*, chart-series-2 (rampes du plan tactique). Aucune couleur hors de ces variables. */
  :root {
    --background: oklch(0.985 0.004 255); --foreground: oklch(0.255 0.02 255);
    --card: oklch(0.995 0.002 255); --border: oklch(0.9 0.01 255); --muted: oklch(0.96 0.008 255);
    --muted-foreground: oklch(0.52 0.015 255); --popover: oklch(0.995 0.002 255);
    --primary: oklch(0.56 0.22 262); --primary-foreground: oklch(0.985 0 0); --input: oklch(0.93 0.01 255);
    --sidebar: oklch(0.95 0.01 255); --sidebar-foreground: oklch(0.255 0.02 255); --accent: oklch(0.92 0.02 255); --accent-foreground: oklch(0.24 0.02 255);
    --warning: #F59E0B; --info: #3B82F6; --destructive: #EF4444; --extreme: #C026D3;
    --heatmap-divergent-low: #FF4B4B; --heatmap-divergent-high: #00DC82; --divergent-neutral: #60A5FA;
    --outcome-win: #10B981; --outcome-loss: #EF4444; --outcome-draw: #3B82F6; --outcome-dnf: #8B5CF6;
    --chart-series-2: #6366F1; --success: #10B981;
    --on-ink: #FFFFFF;
    --shadow: rgba(0, 0, 0, .25);
    --radius: 0.5rem;
    --hatch: repeating-linear-gradient(45deg, transparent 0 3px, color-mix(in oklab, var(--muted-foreground) 30%, transparent) 3px 4px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0); --card: oklch(0.205 0 0);
    --border: oklch(0.275 0 0); --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
    --popover: oklch(0.269 0 0); color-scheme: dark;
    --primary: oklch(0.922 0 0); --primary-foreground: oklch(0.205 0 0); --input: oklch(0.325 0 0);
    --sidebar: oklch(0.205 0 0); --sidebar-foreground: oklch(0.985 0 0); --accent: oklch(0.371 0 0); --accent-foreground: oklch(0.985 0 0);
  } }
  :root[data-theme="dark"] {
    --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0); --card: oklch(0.205 0 0);
    --border: oklch(0.275 0 0); --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
    --popover: oklch(0.269 0 0); color-scheme: dark;
    --primary: oklch(0.922 0 0); --primary-foreground: oklch(0.205 0 0); --input: oklch(0.325 0 0);
    --sidebar: oklch(0.205 0 0); --sidebar-foreground: oklch(0.985 0 0); --accent: oklch(0.371 0 0); --accent-foreground: oklch(0.985 0 0);
  }
  .ico-d { display: none; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ico-l { display: none; } :root:not([data-theme="light"]) .ico-d { display: inline; } }
  :root[data-theme="dark"] .ico-l { display: none; } :root[data-theme="dark"] .ico-d { display: inline; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--background); color: var(--foreground); font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

  /* ── Page de maquette (gabarit des précédents) ─────────────────────────── */
  .page { padding: 20px 16px 72px; max-width: 1952px; margin: 0 auto; }
  .topbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .crumb { font-size: 12px; color: var(--muted-foreground); }
  .toolbar { display: inline-flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .toolbar.right { margin-left: auto; }
  button { font: inherit; font-size: 12px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--foreground); font-weight: 500; }
  .switch button { font-size: 13px; padding: 5px 16px; }
  button:focus-visible, [tabindex]:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
  h1 { font-size: 21px; margin: 14px 0 4px; text-wrap: balance; }
  .switches { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 10px; }
  .switches .lab { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); margin-right: 2px; }
  .cover { margin: 8px 0 0; font-size: 12.5px; color: var(--muted-foreground); }
  .cover b { color: var(--foreground); font-weight: 500; }
  .info { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--muted-foreground); color: var(--muted-foreground); font-size: 10px; font-weight: 700; cursor: help; font-style: normal; flex: none; line-height: 1; }
  .repl { flex: none; font-size: 9px; line-height: 12px; color: var(--muted-foreground); padding: 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .budget { margin-top: 10px; font-size: 12px; color: var(--muted-foreground); display: flex; flex-direction: column; gap: 3px; max-width: 1920px; margin-inline: auto; }
  .budget b { color: var(--foreground); font-weight: 500; font-variant-numeric: tabular-nums; }
  section.gaps { margin: 36px auto 0; max-width: 1920px; }
  section.gaps h2 { font-size: 17px; margin: 0 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  section.gaps ul { margin: 0; padding-left: 18px; font-size: 13px; display: flex; flex-direction: column; gap: 5px; max-width: 110ch; }
  section.gaps b { font-weight: 500; }
  section.gaps code { font-size: 12px; }
  #tip { position: fixed; z-index: 10; pointer-events: none; display: none; background: var(--popover); color: var(--foreground); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px var(--shadow); max-width: 340px; line-height: 1.4; }

  /* ── Le cadre 1920 × 1080 : navigateur (130 px) + fenêtre (950 px) ───────── */
  .screen { margin: 14px auto 0; max-width: 1920px; height: 1080px; display: flex; flex-direction: column; overflow: hidden; border-radius: 10px; box-shadow: 0 0 0 1px var(--border), 0 6px 24px var(--shadow); background: var(--background); }
  .osband { flex: 0 0 130px; height: 130px; display: flex; align-items: center; justify-content: center; gap: 8px; background-color: var(--muted); background-image: var(--hatch); color: var(--muted-foreground); font-size: 12px; border-bottom: 1px solid var(--border); }
  .vp { flex: 0 0 950px; height: 950px; display: flex; flex-direction: column; overflow: hidden; position: relative; container-type: inline-size; container-name: vp; background: var(--background); color: var(--foreground); }
  .nav1 { flex: 0 0 48px; height: 48px; display: flex; align-items: center; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--sidebar); color: var(--sidebar-foreground); font-size: 13px; overflow: hidden; white-space: nowrap; }
  .nav1 .logo { width: 28px; height: 28px; border-radius: 6px; background: var(--primary); margin-right: 6px; flex: none; }
  .nav1 .brand { font-weight: 700; font-size: 14px; margin-right: 14px; }
  .nav1 .sec { padding: 6px 10px; border-radius: 6px; color: var(--muted-foreground); }
  .nav1 .sec.on { color: var(--foreground); background: color-mix(in oklab, var(--foreground) 8%, transparent); font-weight: 500; }
  .nav1 .grow { flex: 1; }
  .nav1 .who { border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 12.5px; }
  .shellgap { flex: 0 0 16px; height: 16px; }
  .vpmain { flex-grow: 1; flex-shrink: 1; flex-basis: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative; }
  .vpmain.ckmode { overflow: hidden; }
  .appshell { max-width: 1320px; margin: 0 auto; position: relative; min-height: 100%; }
  .ckmode .appshell { height: 100%; }
  main.asc { display: flex; flex-direction: column; padding: 24px; }
  main.asc.actuelle { max-width: 1152px; margin: 0 auto; padding: 24px 16px; }
  main.asc > * + * { margin-top: 24px; }
  .ckmode main.asc { height: 100%; }
  /* En-tête partagé d'Ascension (AscensionLayout.tsx) — hauteurs Tailwind reproduites. */
  .ahead { flex: none; }
  .ahead h2 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; }
  .ahead p { margin: 4px 0 0; font-size: 14px; line-height: 20px; color: var(--muted-foreground); }
  .ticker { flex: none; min-height: 56px; }
  .ticker .tp { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 16.5px; }
  .ticker .ti { width: 12px; height: 12px; margin-top: 1px; flex: none; border: 1.5px solid var(--muted-foreground); border-radius: 50% 50% 40% 40%; }
  .ticker .tt { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ticker .tt b { font-weight: 600; }
  .ticker .tt span { color: var(--muted-foreground); }
  .atabs { flex: none; display: flex; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .atabs span { padding: 8px 16px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--muted-foreground); border-bottom: 2px solid transparent; white-space: nowrap; }
  .atabs span.on { color: var(--foreground); border-bottom-color: var(--primary); }
  /* Barre de filtres L2 (useLocalFilterBar) : px-6, min-h-10, une rangée. */
  .fbar { flex: none; padding: 0 24px; }
  .fbar .fin { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 40px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .pill { font-size: 12px; line-height: 16px; padding: 4px 8px; border: 1px solid var(--input); border-radius: 5px; background: var(--background); color: var(--muted-foreground); white-space: nowrap; display: inline-flex; gap: 5px; align-items: center; }
  .pill.val { color: var(--foreground); }
  .pill small { font-size: 9px; opacity: .6; }
  .fbar .sp { flex: 1; }
  .pill.go { font-weight: 500; }

  /* Composants de l'app (SectionCard, Button, Select, EmptyStateNotice). */
  .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); min-width: 0; display: flex; flex-direction: column; position: relative; }
  .card > h3 { margin: 0; flex: none; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 14px; line-height: 20px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 32px; padding: 0 12px; font-size: 14px; border-radius: 6px; border: 1px solid var(--input); background: var(--background); color: var(--foreground); }
  .btn[aria-pressed="true"], .btn.def { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); font-weight: 400; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .sel { height: 36px; border: 1px solid var(--input); border-radius: 6px; background: var(--background); color: var(--foreground); font: inherit; font-size: 14px; padding: 0 10px; }
  .esn { border: 1px solid var(--border); border-radius: 12px; padding: 20px 16px; text-align: center; background: var(--card); }
  .esn b { display: block; font-size: 14px; font-weight: 600; }
  .esn span { display: block; margin-top: 4px; font-size: 14px; color: var(--muted-foreground); }

  /* ── AVANT : les deux écrans de features/tactical ───────────────────────── */
  .sw { display: flex; gap: 4px; padding: 12px 12px 0; flex: none; }
  .h2a { margin: 0; padding: 12px 12px 0; font-size: 18px; line-height: 28px; font-weight: 600; }
  .tbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px; border-bottom: 1px solid var(--border); padding: 8px 12px; }
  .tbar label, .tbar .grp { display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
  .tbar .sel { width: 192px; }
  .tbar .row { display: flex; gap: 4px; }
  .abody { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
  .kpis { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  @container vp (min-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @container vp (min-width: 1024px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .kpi { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; }
  .kpi .kl { font-size: 12px; line-height: 16px; font-weight: 500; text-transform: uppercase; letter-spacing: .025em; color: var(--muted-foreground); }
  .kpi .kv { display: flex; align-items: baseline; gap: 8px; }
  .kpi .kv b { font-size: 20px; line-height: 20px; font-weight: 600; }
  .kpi .kv span, .kpi .kc { font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
  .kpi .kc { margin-top: 4px; font-size: 10px; line-height: 15px; }
  .pwrap { padding: 12px; position: relative; }
  .pframe { position: relative; width: 100%; overflow: hidden; border-radius: 6px; background: var(--muted); }
  .pframe img, .tthumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pframe svg, .tthumb svg, .mthumb svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .pframe .ov { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; }
  .plegA { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .plegA .b { font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 10px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .plegA .rp { height: 8px; min-width: 128px; flex: 1; border-radius: 999px; }
  .cfoot { border-top: 1px solid var(--border); padding: 8px 12px; font-size: 12px; line-height: 16px; color: var(--muted-foreground); }
  .cfoot p { margin: 0; } .cfoot p + p { margin-top: 4px; }
  .foldmark { position: absolute; left: 0; right: 0; height: 0; border-top: 2px dashed var(--warning); z-index: 3; pointer-events: none; }
  .foldmark span, .planmark span { position: absolute; right: 8px; top: -22px; font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--warning); color: var(--background); font-weight: 500; white-space: nowrap; }
  .planmark { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--warning); z-index: 3; pointer-events: none; }
  .planmark span { top: 4px; }
  .ccell { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
  .ccell .v { display: flex; align-items: baseline; gap: 8px; margin: 0; }
  .ccell .v b { font-size: 24px; line-height: 32px; font-weight: 600; }
  .ccell .v span { font-size: 14px; color: var(--muted-foreground); }
  .ccell .m { margin: 4px 0 0; font-size: 12px; color: var(--muted-foreground); }
  .contrib { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
  .contrib h4 { margin: 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .025em; color: var(--muted-foreground); }
  .contrib ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .contrib li { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--border); padding: 4px 0; font-size: 12px; }
  .contrib li:last-child { border-bottom: 0; }
  .contrib li .d { color: var(--muted-foreground); }
  .contrib li .o { font-weight: 500; }
  .contrib li a { margin-left: auto; color: var(--primary); white-space: nowrap; text-decoration: none; cursor: pointer; }
  .coord { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
  .coord dl { margin: 0; display: flex; flex-direction: column; }
  .coord dl div { display: flex; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--border); padding: 4px 0; font-size: 12px; }
  .coord dl div:last-child { border-bottom: 0; }
  .coord dt { color: var(--muted-foreground); } .coord dd { margin: 0 0 0 auto; font-family: 'Roboto Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .coord .notes { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--border); padding-top: 8px; font-size: 11px; color: var(--muted-foreground); }
  .coord .notes p { margin: 0; }
  .hist .ax { font-size: 10.5px; fill: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .hist .grd { stroke: var(--border); }
  .hist .thr { stroke: var(--warning); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .hist .ttl { font-size: 12px; fill: var(--foreground); }
  .tgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  @container vp (min-width: 640px) { .tgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @container vp (min-width: 1024px) { .tgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @container vp (min-width: 1280px) { .tgrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .tile { display: flex; flex-direction: column; overflow: hidden; border-radius: var(--radius); background: var(--card); text-align: left; border: 1px solid var(--border); padding: 0; font-size: 14px; }
  .tile.on { border: 2px solid var(--primary); }
  .tile.floor { opacity: .6; filter: grayscale(1); cursor: not-allowed; }
  .tthumb { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--muted); }
  .tinfo { display: flex; flex-direction: column; gap: 4px; padding: 12px; }
  .tinfo .n { font-size: 14px; font-weight: 500; }
  .tinfo .s { font-family: 'Roboto Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .wl { display: flex; height: 6px; width: 100%; overflow: hidden; border-radius: 999px; background: var(--muted); margin-top: 4px; }
  .wl.thin { height: 4px; margin-top: 3px; }
  .more { font-size: 12px; color: var(--muted-foreground); margin: 10px 0 0; }

  /* ── APRÈS : la vue cockpit ─────────────────────────────────────────────── */
  .ck { flex: none; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  /* Plan et zone dans une même rangée : la zone prend la hauteur de la carte du plan (contain: size + stretch). */
  .ckgrp { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; align-items: start; min-width: 0; }
  .ckcol.czone { align-self: stretch; contain: size; }
  .ckcol.cplan > .card { flex-grow: 0; flex-shrink: 0; flex-basis: auto; }
  .ckcol { display: flex; flex-direction: column; gap: 3px; min-height: 0; min-width: 0; }
  .ckcol > .card { flex-grow: 1; flex-shrink: 1; flex-basis: 0; min-height: 0; }
  .ckcol.cmaps > .card { flex-grow: 0; flex-shrink: 0; flex-basis: auto; }
  .mlist { display: flex; flex-direction: row; gap: 6px; padding: 6px; overflow-x: auto; overflow-y: hidden; min-height: 0; }
  .mitem { flex: 0 0 208px; display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 8px; align-items: center; padding: 4px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); color: var(--foreground); text-align: left; font-size: 12px; cursor: pointer; }
  .mitem.on { border: 2px solid var(--primary); padding: 3px; }
  .mitem.floor { opacity: .6; filter: grayscale(1); }
  .mthumb { position: relative; width: 100px; aspect-ratio: 16 / 9; background: var(--muted); border-radius: 4px; overflow: hidden; }
  .mtext { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .mtext .mn { font-size: 12.5px; font-weight: 500; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mtext .ms { font-size: 10.5px; line-height: 14px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .msearch { flex: none; margin: 8px 8px 2px; height: 28px; border: 1px solid var(--input); border-radius: 6px; padding: 0 8px; font: inherit; font-size: 12px; background: var(--background); color: var(--foreground); min-width: 0; }
  .mother { flex: none; margin: 0; padding: 6px 10px 0; font-size: 11px; line-height: 14px; color: var(--muted-foreground); }
  .uf { flex: none; border-top: 1px solid var(--border); margin-top: 6px; padding: 6px 10px 8px; font-size: 12px; }
  .uf summary { cursor: pointer; color: var(--muted-foreground); }
  .uf ul { list-style: none; margin: 6px 0 0; padding: 0 2px 0 0; max-height: 180px; overflow-y: auto; }
  .uf li { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; line-height: 19px; border-bottom: 1px solid var(--border); }
  .uf li:last-child { border-bottom: 0; }
  .uf .fn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .uf .fn small { color: var(--muted-foreground); font-size: 10.5px; }
  .uf .fc { flex: none; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .mmore { flex: none; margin: 0; font-size: 11px; line-height: 14px; color: var(--muted-foreground); padding: 4px 6px; align-self: center; }
  @container vp (min-width: 1400px) {
    .ck { grid-template-columns: 208px minmax(0, 1fr); }
    .ckcol.cmaps { height: 551px; } /* hauteur de la v2, inchangée */
    .ckcol.cmaps > .card { flex-grow: 1; flex-shrink: 1; flex-basis: 0; }
    .mlist { flex-direction: column; overflow-x: hidden; overflow-y: auto; flex-grow: 1; flex-shrink: 1; flex-basis: 0; }
    .mitem { flex: none; }
  }

  .ctl { display: inline-flex; align-items: stretch; height: 28px; border: 1px solid var(--input); border-radius: 6px; overflow: hidden; background: var(--background); font-size: 11.5px; }
  .ctl .cl { display: flex; align-items: center; padding: 0 6px; color: var(--muted-foreground); background: var(--muted); border-right: 1px solid var(--input); white-space: nowrap; }
  .ctl select { border: 0; background: transparent; color: var(--foreground); font: inherit; font-size: 11.5px; padding: 0 2px 0 5px; }
  .ctl select.selL { width: 146px; } .ctl select.selR { width: 72px; }
  .ctl button { border: 0; border-radius: 0; height: auto; padding: 0 7px; font-size: 11.5px; background: transparent; color: var(--foreground); }
  .ctl button + button { border-left: 1px solid var(--input); }
  .ctl button[aria-pressed="true"] { background: var(--primary); color: var(--primary-foreground); font-weight: 500; }
  .ctl button:disabled { color: var(--muted-foreground); opacity: .55; cursor: not-allowed; }
  .pstat { flex: none; padding: 6px 12px 0; font-size: 12px; line-height: 16px; color: var(--warning); }
  .pc { container-type: inline-size; container-name: plan; }
  .pbody { flex: none; position: relative; display: flex; justify-content: center; align-items: stretch; gap: 8px; margin: 10px 12px 12px; padding-right: 90px; }
  /* Boîte au rapport du fond : 800 px de haut au plus, bornée par la largeur de la carte moins la rampe (90 px). */
  .pbox { --pw: calc(100cqw - 24px - 90px); flex: none; position: relative; width: min(var(--pw), calc(800px * var(--ar))); height: min(800px, calc(var(--pw) / var(--ar))); }
  /* Rampe de légende : au bord DROIT du bloc, hauteur propre (220 px), centrée verticalement — indépendante de la hauteur du fond (retour utilisateur 2026-10-06). */
  .vleg { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 82px; height: 220px; font-size: 11px; line-height: 14px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .vleg .rp { position: absolute; left: 0; top: 0; bottom: 0; width: 8px; border-radius: 999px; }
  .vleg .vh, .vleg .vl { position: absolute; left: 14px; right: 0; }
  .vleg .vh { top: 0; } .vleg .vl { bottom: 0; }
  .vleg b { display: block; color: var(--foreground); font-weight: 500; }
  .pbox > svg { width: 100%; height: 100%; display: block; }
  .zlabel { position: absolute; z-index: 2; font-size: 11px; line-height: 14px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); white-space: nowrap; pointer-events: none; }
  .pbox .ov, .pbody .ov { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 12px; font-size: 12.5px; color: var(--muted-foreground); pointer-events: none; }

  .zc .zv { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }

  .zc .rl li.mt { position: relative; display: flex; align-items: center; gap: 6px; min-height: 56px; padding: 6px 6px 6px 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; font-variant-numeric: tabular-nums; transition: background-color .15s; }

  // Étiquette du nom de zone posée à côté du cadre de la cellule, du côté où elle tient.
  function zoneLabel(cell, cal, name) {
    var r = RL.cellRect(cell, cal), cx = (r.x + r.s / 2) / cal.w, cy = (r.y + r.s / 2) / cal.h, right = cx < 0.55;
    var left = right ? (r.x + r.s) / cal.w * 100 : r.x / cal.w * 100;
    var ty = cy < 0.04 ? '0' : cy > 0.96 ? '-100%' : '-50%';
    return el('span', { class: 'zlabel', id: 'zonelabel', style: 'left:' + left.toFixed(2) + '%;top:' + (cy * 100).toFixed(2) + '%;transform:translate(' + (right ? '4px' : 'calc(-100% - 4px)') + ',' + ty + ')' }, esc(name));
  }
  // Mini-tuile d'un instant (grammaire de la tuile de match de l'app) : bande d'issue, ligne 1 mode · score ·
  // issue · date, ligne 2 instant · fait (tueur ou victime, arme) · placement ; bouton de rejeu à droite.
  var OC = { 2: 'outcome-win', 3: 'outcome-loss', 1: 'outcome-draw' };
  function matchTile(w, m, e, frag, lab) {
    var oc = OC[m.o] ? v(OC[m.o]) : v('muted-foreground');
    var who = frag ? (e[12] >= 0 ? w.gts[e[12]] : null) : (e[11] >= 0 ? w.gts[e[11]] : null);
    var fait = who ? (frag ? 'A tué ' : 'Tué par ') + who : (frag ? 'Frag' : 'Mort');
    var armeTxt = e[13] >= 0 ? ' · ' + w.armes[e[13]] : '';
    fait += armeTxt;
    var bd = frag || e[14] === -2 ? '' : e[14] === -1 ? 'seul' : (e[14] >= 18 ? 'seul · ' : 'près · ') + (e[14] < 1 ? '< 1' : NF0.format(Math.floor(e[14]))) + ' m'; // tronqué : 17,9 m reste « près · 17 m »
    var score = (m.sm >= 0 && m.se >= 0) ? m.sm + '\u2009–\u2009' + m.se : '';
    var full = [m.mode + (m.vari ? ' (' + m.vari + ')' : ''), score, outcomeFr(m.o), m.quand, clock2(e[1]), fait, bd].filter(Boolean).join(' · ');
    var li = el('li', { class: 'mt', style: '--oc:' + oc, title: full });
    li.innerHTML = '<div class="mb"><div class="l1">' + (m.mode ? '<span class="md">' + esc(m.mode) + '</span>' : '') + (score ? '<span class="sc">' + score + '</span>' : '') + '<span class="is">' + outcomeFr(m.o) + '</span>' + (m.quand ? '<span class="dt">' + esc(m.quand) + '</span>' : '') + '</div>' +
      '<div class="l2"><span class="ti">' + clock2(e[1]) + '</span><span class="fa">' + esc(fait.slice(0, fait.length - armeTxt.length)) + '</span>' + (armeTxt ? '<span class="fw">' + esc(armeTxt.trim()) + '</span>' : '') + '' + (bd ? '<span class="bd">' + bd + '</span>' : '') + '</div></div>' +
      '<button type="button" class="rbtn" aria-label="' + lab + '" title="' + lab + '"><img class="ico-l" src="' + ICON_L + '" alt="" aria-hidden="true"><img class="ico-d" src="' + ICON_D + '" alt="" aria-hidden="true"></button>';
    return li;
  }
  function faceFrag(e, qui, cell) { var side = qui === 'adv' ? 2 : 0; return e[2] === side && e[4] === cell.c && e[5] === cell.l; }
