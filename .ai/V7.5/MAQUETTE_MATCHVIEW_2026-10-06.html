<title>Vue match avant après</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Jetons de l'app (styles/globals.css + lib/accessibility/palettes/default.ts) et de la maquette
     v18 de l'onglet Emprise. Aucune couleur hors de ces variables. */
  :root {
    --background: oklch(0.985 0.004 255); --foreground: oklch(0.255 0.02 255);
    --card: oklch(0.995 0.002 255); --border: oklch(0.9 0.01 255); --muted: oklch(0.96 0.008 255);
    --muted-foreground: oklch(0.52 0.015 255); --popover: oklch(0.995 0.002 255);
    --warning: #F59E0B; --info: #3B82F6;
    --team-ally: #3B82F6; --team-enemy: #EF4444;
    --squad-player-1: #2563EB; --squad-player-2: #D97706; --squad-player-3: #DB2777; --squad-player-4: #0891B2; --zone-neutral: #9CA3AF;
    --frag-shoulder: #06B6D4; --frag-sidearm: #10B981; --frag-heavy: #7C3AED; --frag-melee: #EC4899; --frag-grenade: #F59E0B; --frag-vehicle: #D55E00; --frag-equipment: #C026D3; --frag-environmental: #0072B2; --frag-unattributed: #60A5FA;
    --outcome-win: #10B981; --outcome-loss: #EF4444; --outcome-dnf: #8B5CF6;
    --divergent-pos: #22C55E; --divergent-neutral: #60A5FA; --divergent-neg: #EF4444;
    --resource-powerup: #0D9488; --resource-power-weapon: #7C3AED; --resource-vehicle: #D55E00; --resource-rack: #0072B2;
    --usage-grapple: #10B981; --usage-camo: #0D9488; --usage-wall: #06B6D4; --usage-dropped: #EC4899;
    --stat-kills: #059669; --stat-deaths: #F43F5E; --chart-series-1: #93C5FD;
    --perf-tier-1: #10B981; --perf-tier-2: #06B6D4; --perf-tier-4: #F97316; --perf-tier-5: #EF4444;
    --extreme: #C026D3; --success: #10B981; --chart-series-6: #10B981; --chart-series-7: #F59E0B; --chart-series-8: #EC4899; --compare-a: #818CF8; --narrative-dominant: #00DC82; --narrative-humiliation: #7C3AED; --narrative-debacle: #D55E00; --narrative-contre-remontada: #33D6FF;
    --on-ink: #FFFFFF;
    --shadow: rgba(0, 0, 0, .25);
    --radius: 0.5rem;
    --hatch: repeating-linear-gradient(45deg, transparent 0 3px, color-mix(in oklab, var(--muted-foreground) 30%, transparent) 3px 4px);
    --team-rest: color-mix(in oklab, var(--muted-foreground) 55%, var(--muted));
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0); --card: oklch(0.205 0 0);
    --border: oklch(0.275 0 0); --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
    --popover: oklch(0.269 0 0); color-scheme: dark;
    --resource-powerup: #0FA697; --resource-power-weapon: #8B5CF6; --resource-vehicle: #DD5F14; --resource-rack: #3B8FD0;
    --usage-camo: #0FA697;
  } }
  :root[data-theme="dark"] {
    --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0); --card: oklch(0.205 0 0);
    --border: oklch(0.275 0 0); --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
    --popover: oklch(0.269 0 0); color-scheme: dark;
    --resource-powerup: #0FA697; --resource-power-weapon: #8B5CF6; --resource-vehicle: #DD5F14; --resource-rack: #3B8FD0;
    --usage-camo: #0FA697;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--background); color: var(--foreground); font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .page { max-width: 1180px; margin: 0 auto; padding: 20px 16px 72px; }
  .topbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .crumb { font-size: 12px; color: var(--muted-foreground); }
  .toolbar { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .toolbar.right { margin-left: auto; }
  button { font: inherit; font-size: 12px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--foreground); font-weight: 500; }
  .switch button { font-size: 13px; padding: 5px 16px; }
  button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
  h1 { font-size: 21px; margin: 14px 0 4px; text-wrap: balance; }
  p.lede { margin: 0; font-size: 13px; color: var(--muted-foreground); max-width: 96ch; }
  .appframe { border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px); background: var(--background); padding: 0 16px 22px; margin-top: 16px; min-width: 0; }
  .tabs { display: flex; border-bottom: 1px solid var(--border); margin: 0 -16px 4px; padding: 0 16px; overflow-x: auto; }
  .tabs span { padding: 9px 14px; font-size: 13.5px; font-weight: 500; color: var(--muted-foreground); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs span.on { color: var(--foreground); border-bottom-color: var(--foreground); }
  h3.st { margin: 26px 0 10px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  h3.st small { font-size: 11px; font-weight: 400; color: var(--muted-foreground); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: stretch; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .cardwrap { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .card { border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); min-width: 0; display: flex; flex-direction: column; flex: 1; }
  .card > h4 { margin: 0; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .card > .body { padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
  .card .cmain { display: flex; flex-direction: column; gap: 10px; margin-block: auto; min-width: 0; }
  .num { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 4px; font-size: 10.5px; font-weight: 700; background: var(--muted); color: var(--muted-foreground); }
  .info { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--muted-foreground); color: var(--muted-foreground); font-size: 10px; font-weight: 700; cursor: help; font-style: normal; flex: none; }
  .repl { font-size: 9px; line-height: 1.3; color: var(--muted-foreground); padding: 0 2px; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; font-size: 11.5px; color: var(--muted-foreground); padding-top: 4px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
  .legend i.hatch { background-color: var(--muted); background-image: var(--hatch); }
  .legend i.parity { width: 2px; height: 12px; border-radius: 0; background: repeating-linear-gradient(to bottom, var(--warning) 0 3px, transparent 3px 5px); }
  .legend i.solidline { width: 3px; border-radius: 0; }
  .legend i.dash { width: 3px; border-radius: 0; background: repeating-linear-gradient(to bottom, var(--foreground) 0 3px, transparent 3px 5px); }
  .legend i.thin { height: 4px; vertical-align: 2px; }
  .legend i.round { border-radius: 50%; }
  .legend i.ring { border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 2px var(--chart-series-1); }
  .legend.left { justify-content: flex-start; }
  .line1 { font-size: 12.5px; color: var(--muted-foreground); padding: 8px 10px; border: 1px dashed var(--border); border-radius: var(--radius); }
  .line1 b { color: var(--foreground); font-weight: 500; }
  .mnote { border: 1px dashed var(--info); border-radius: var(--radius); padding: 7px 11px; font-size: 11.5px; color: var(--muted-foreground); background: color-mix(in oklab, var(--info) 5%, transparent); }
  .mnote b { color: var(--foreground); font-weight: 500; }
  .empty { border: 1px dashed var(--border); border-radius: 12px; background: var(--muted); padding: 18px 14px; text-align: center; }
  .empty b { display: block; font-size: 14px; font-weight: 600; color: var(--foreground); }
  .empty span { font-size: 12.5px; color: var(--muted-foreground); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .tile { border: 1px solid var(--border); border-left: 3px solid var(--acc); border-radius: var(--radius); background: var(--card); padding: 10px 12px; min-width: 0; }
  .tile .tl { font-size: 12px; color: var(--muted-foreground); }
  .tile .tv { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin: 2px 0; }
  .tile .ts { font-size: 11px; color: var(--muted-foreground); }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .ax { font-size: 10.5px; fill: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .axt { font-size: 10.5px; fill: var(--muted-foreground); }
  .grd { stroke: var(--border); stroke-width: 1; }
  .par { stroke: var(--warning); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .lbl { font-size: 12px; fill: var(--foreground); }
  .lbls { font-size: 11px; fill: var(--muted-foreground); }

  /* Pistes de l'Emprise (PisteCampsForm) */
  .prow { display: grid; grid-template-columns: var(--lw, 118px) minmax(0, 1fr); gap: 12px; align-items: center; }
  @media (max-width: 640px) { .prow { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
  .plabel { font-size: 12.5px; line-height: 1.25; min-width: 0; }
  .plabel small { display: block; color: var(--muted-foreground); font-size: 11px; }
  .rdot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 0; background: var(--rc); }
  .pbar { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pcamps { display: none; justify-content: space-between; gap: 8px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted-foreground); }
  .pcamps.show { display: flex; }
  .pcamps b { color: var(--foreground); font-weight: 700; font-size: 13px; }
  .csw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .track { position: relative; height: 22px; border-radius: 3px; background: var(--muted); }
  .track.thin { height: 8px; }
  .track.mid { height: 15px; }
  .track.pending { background: transparent; border: 1px dashed var(--muted-foreground); display: grid; place-items: center; font-size: 11px; color: var(--muted-foreground); height: auto; min-height: 22px; padding: 2px 8px; text-align: center; }
  .track.zero { background: transparent; border-top: 1px dashed var(--border); height: 0; margin: 10px 0; }
  .seg { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; overflow: hidden; }
  .seg + .seg { box-shadow: -2px 0 0 var(--card); }
  .seg.l { justify-content: flex-start; padding-left: 7px; }
  .seg.r { justify-content: flex-end; padding-right: 7px; }
  .seg.c { justify-content: center; }
  .sl { font-size: 12px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--on-ink); pointer-events: none; }
  .sl b { font-weight: 800; }
  .sl.dark { color: var(--foreground); }
  .parity { position: absolute; top: -3px; bottom: -3px; left: 50%; width: 0; border-left: 2px dashed var(--warning); pointer-events: none; }
  .zeroline { position: absolute; top: -3px; bottom: -3px; left: 50%; width: 0; border-left: 2px solid var(--muted-foreground); transform: translateX(-1px); pointer-events: none; }
  .pexpo { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .axis { position: relative; height: 14px; font-size: 10.5px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .tiplab { position: absolute; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 700; color: var(--foreground); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rawlab { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--muted-foreground); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .btoggle { all: unset; cursor: pointer; font-size: 12.5px; color: var(--foreground); line-height: 1.2; }
  .btoggle small { color: var(--muted-foreground); font-size: 11px; }
  .btoggle:focus-visible { outline: 2px solid var(--info); outline-offset: 2px; border-radius: 3px; }

  /* Grille carte par carte (ResourceMatchGridCard) */
  .bandwrap { overflow-x: auto; max-width: 100%; }
  .band { display: grid; gap: 4px; align-items: stretch; min-width: 600px; }
  .bh { font-size: 11px; line-height: 1.25; color: var(--muted-foreground); text-align: center; padding-bottom: 3px; }
  .bh b { display: block; color: var(--foreground); font-weight: 500; font-size: 12px; }
  .rec { display: inline-block; margin-top: 3px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
  .rec .w { color: var(--outcome-win); } .rec .d { color: var(--outcome-loss); }
  .bl { font-size: 12.5px; display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }
  .bl small { color: var(--muted-foreground); font-size: 11px; }
  .cell { border-radius: 3px; display: grid; place-items: center; font-size: 12px; font-variant-numeric: tabular-nums; min-height: 34px; cursor: default; color: var(--foreground); }
  .cell.none { background: var(--muted); color: var(--muted-foreground); }
  .cell.nofilm { background-color: var(--muted); background-image: var(--hatch); color: var(--muted-foreground); font-size: 10.5px; }
  .bsep { grid-column: 1 / -1; border-top: 1px solid var(--border); margin: 5px 0 2px; }

  /* Formes d'avant */
  .ugrid { display: flex; flex-direction: column; gap: 9px; min-width: 0; }
  .urow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 12.5px; }
  @media (max-width: 560px) { .urow { grid-template-columns: 110px minmax(0, 1fr) 52px; gap: 6px; } }
  .urow .uv { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted-foreground); }
  .utrack { position: relative; height: 15px; background: var(--muted); border-radius: 2px; }
  .ufill { position: absolute; left: 0; top: 0; bottom: 0; display: flex; overflow: visible; }
  .ufill span { display: block; height: 100%; }
  .uref { position: absolute; top: -4px; bottom: -4px; width: 0; }
  .uref.solid { border-left: 2px solid var(--team-ally); }
  .uref.dashed { border-left: 2px dashed var(--foreground); }
  .jgrid { display: grid; grid-template-columns: 140px 92px minmax(0, 1fr) 118px; gap: 4px 10px; align-items: center; min-width: 560px; }
  .jgrid .jl { text-align: right; font-size: 12px; }
  .jgrid .js { text-align: right; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); }
  .jgrid .jt { position: relative; height: 15px; background: var(--muted); }
  .jgrid .jv { font-size: 10.5px; color: var(--muted-foreground); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .jgrid .jv b { font-size: 12px; color: var(--foreground); }
  .jgrid .gap { grid-column: 1 / -1; height: 6px; }
  .scrollx { overflow-x: auto; max-width: 100%; }
  .ggrid { display: grid; gap: 3px 8px; align-items: center; font-size: 12px; min-width: 760px; }
  .ggrid .gh { font-size: 10.5px; color: var(--muted-foreground); line-height: 1.2; }
  .ggrid .gh b { display: block; color: var(--foreground); font-weight: 500; font-size: 11px; }
  .ggrid .gn { line-height: 1.15; border-left: 3px solid var(--squad-player-1); padding-left: 6px; }
  .ggrid .gn small { display: block; color: var(--muted-foreground); font-size: 10.5px; }
  .gcell { display: grid; grid-template-columns: minmax(0, 1fr) 22px; gap: 5px; align-items: center; }
  .gcell .gb { height: 9px; background: var(--muted); position: relative; border-radius: 2px; }
  .gcell .gb span { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }
  .gcell .gvv { font-variant-numeric: tabular-nums; text-align: right; font-size: 11.5px; }
  .gcell.zero .gvv { color: var(--muted-foreground); }
  .bgrid { display: grid; grid-template-columns: 150px minmax(0, 1fr) 110px; gap: 8px 10px; align-items: center; font-size: 12px; }
  @media (max-width: 560px) { .bgrid { grid-template-columns: 100px minmax(0, 1fr) 84px; } }
  .bt { position: relative; height: 16px; }
  .bt::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--border); }
  .bt .bb { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; }
  .bt .bm { position: absolute; top: -2px; bottom: -2px; width: 0; border-left: 3px solid var(--warning); transform: translateX(-1.5px); }
  .bgrid .bv { font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .bgrid .bv b { color: var(--foreground); font-size: 12px; }
  .blocktitle { margin: 26px 0 8px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .hidden-note { font-size: 11.5px; color: var(--muted-foreground); border-left: 2px solid var(--border); padding: 4px 10px; margin-top: 18px; }
  .progband { margin-top: 26px; border: 1px dashed var(--border); border-radius: var(--radius); padding: 10px 12px; font-size: 12px; color: var(--muted-foreground); }
  .progband b { color: var(--foreground); font-weight: 500; }
  section.gaps { margin-top: 36px; }
  section.gaps h2 { font-size: 17px; margin: 0 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  section.gaps ul { margin: 0; padding-left: 18px; font-size: 13px; display: flex; flex-direction: column; gap: 5px; max-width: 100ch; }
  section.gaps b { font-weight: 500; }
  #tip { position: fixed; z-index: 10; pointer-events: none; display: none; background: var(--popover); color: var(--foreground); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px var(--shadow); max-width: 320px; line-height: 1.4; }
  /* Ajouts v2 : second interrupteur, formes d'avant remplies, fiches. */
  .switches { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 10px; }
  .switches .lab { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); margin-right: 2px; }
  .cover { margin-top: 8px; font-size: 12.5px; color: var(--muted-foreground); }
  .cover b { color: var(--foreground); font-weight: 500; }
  .egrid { display: grid; grid-template-columns: 150px 96px minmax(0, 1fr) 128px; gap: 6px 10px; align-items: center; font-size: 12px; min-width: 560px; }
  .egrid .el { text-align: right; line-height: 1.15; }
  .egrid .el small { display: block; color: var(--muted-foreground); font-size: 10.5px; }
  .egrid .es { text-align: right; font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted-foreground); }
  .egrid .et { position: relative; height: 15px; background: var(--muted); }
  .egrid .ev { font-size: 10.5px; color: var(--muted-foreground); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .egrid .ev b { font-size: 12px; color: var(--foreground); }
  .ecenter { position: absolute; top: -3px; bottom: -3px; left: 50%; width: 3px; transform: translateX(-1.5px); background: var(--warning); }
  .sub3 { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted-foreground); margin: 14px 0 6px; }
  .sub3:first-child { margin-top: 0; }
  .bandcells { display: grid; gap: 3px; min-width: 560px; }
  .bandcells .bc { height: 22px; border-radius: 2px; }
  .bandcells .bch { font-size: 9.5px; color: var(--muted-foreground); text-align: center; line-height: 1.1; }
  .mrow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 96px; gap: 10px; align-items: center; font-size: 12px; }
  @media (max-width: 560px) { .mrow { grid-template-columns: 104px minmax(0, 1fr) 70px; gap: 6px; } }
  .mrow .mv { text-align: right; font-size: 11px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mrow .mv b { color: var(--foreground); }
  .losses { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted-foreground); padding: 6px 10px; border-radius: var(--radius); background: var(--muted); }
  .losses b { color: var(--foreground); font-weight: 600; }
  .ofam { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

    var ncol = sum(groups.map(function (g) { return g.cols.length; })), cw = 64, gap = 18, L = 30, T = 26, B = 52, H = 230;

    '<b>Vies</b> : seuil de 18 m (arène) et 30 m (BTB) dans la maquette ; portée du radar du match dans l’app.'
  ].forEach(function (t) { document.getElementById('gaps-list').appendChild(el('li', null, t)); });

  // Deux interrupteurs, un état dans l'URL : #<apres|avant>-<2209|2407>.
  function readState() {
    var h = location.hash.replace('#', '').split('-');
    return { view: h[0] === 'avant' ? 'avant' : 'apres', match: MS[h[1]] ? h[1] : '2209' };
  }
  function setState(st) { var target = '#' + st.view + '-' + st.match; if (location.hash !== target) location.hash = target; else applyState(); }
  function modeFr(md) { return md.replace(/^Arena:/, 'Arène · ').replace(/^BTB:/, 'Grande bataille en équipe · ').replace('CTF', 'Drapeau'); }
  function applyState() {
    var st = readState(), s = MS[st.match];
    ['avant', 'apres'].forEach(function (vw) { Object.keys(MS).forEach(function (k) { document.getElementById('view-' + vw + '-' + k).hidden = !(vw === st.view && k === st.match); }); });
    document.querySelectorAll('[data-view]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-view') === st.view)); });
    document.querySelectorAll('[data-match]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-match') === st.match)); });
    var M = s.meta;
    document.getElementById('title').textContent = 'Vue match — JGtm, ' + M.d + ' ' + M.h.replace(':', ' h ') + ' · Drapeau à ' + M.map;
    document.getElementById('cover').innerHTML = '<b>' + outcomeFr(M.outcome) + ' ' + M.ms + '–' + M.es + '</b> · ' + modeFr(M.mode) + ', ' + M.playlist + ' · ' + dur(M.durS * 1000) + ' · ' + s.nPresent + ' joueurs présents à la fin (' + s.teamSizes.us + ' contre ' + s.teamSizes.them + ') · film décodé · journal des morts : ' + s.pubCount + ' lignes publiables sur ' + s.journal;
    fitLabels();
  }
  document.querySelectorAll('[data-view]').forEach(function (b) { b.addEventListener('click', function () { var st = readState(); st.view = b.getAttribute('data-view'); setState(st); }); });
  document.querySelectorAll('[data-match]').forEach(function (b) { b.addEventListener('click', function () { var st = readState(); st.match = b.getAttribute('data-match'); setState(st); }); });
  window.addEventListener('hashchange', applyState);

  // Valeurs dans les segments quand elles tiennent ; sinon repli au-dessus (barre de frags) ou en ligne (pistes).
  function fitLabels() {
    document.querySelectorAll('.pcamps.fallback').forEach(function (p) { p.classList.remove('show'); });
    document.querySelectorAll('.fbrep').forEach(function (r) { r.innerHTML = ''; });
    document.querySelectorAll('.seg > .sl').forEach(function (sl) {
      sl.style.visibility = 'visible';
      var box = sl.parentElement.getBoundingClientRect();
      if (box.width === 0) return;
      var lab = sl.getBoundingClientRect();
      if (lab.width > box.width - 12) {
        sl.style.visibility = 'hidden';
        var rep = sl.getAttribute('data-repli');
        if (rep) { var host = sl.closest('.fbrow').querySelector('.fbrep'); host.appendChild(el('span', { style: 'left:' + sl.getAttribute('data-at') + '%' }, rep)); return; }
        var pbar = sl.closest('.pbar');
        var fb = pbar && pbar.querySelector('.pcamps.fallback');
        if (fb) fb.classList.add('show');
      }
    });
  }
  var fitPending = false;
  window.addEventListener('resize', function () { if (fitPending) return; fitPending = true; requestAnimationFrame(function () { fitPending = false; fitLabels(); }); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLabels);
  applyState();

  var tip = document.getElementById('tip');
  function show(target, x, y) {
    tip.innerHTML = target.getAttribute('data-tip');
    tip.style.display = 'block';
    var r = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(x + 14, window.innerWidth - r.width - 8)) + 'px';
    tip.style.top = Math.max(8, y + 14 + r.height > window.innerHeight ? y - r.height - 10 : y + 14) + 'px';
  }
  document.addEventListener('mousemove', function (e) { var t = e.target.closest ? e.target.closest('[data-tip]') : null; if (t && t.getAttribute('data-tip')) show(t, e.clientX, e.clientY); else tip.style.display = 'none'; });
  document.addEventListener('focusin', function (e) { var t = e.target.closest ? e.target.closest('[data-tip]') : null; if (!t) return; var r = t.getBoundingClientRect(); show(t, r.left, r.bottom); });
  document.addEventListener('focusout', function () { tip.style.display = 'none'; });

  document.querySelectorAll('[data-theme-set]').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-theme-set');
      if (t === 'auto') document.documentElement.removeAttribute('data-theme');
      else document.documentElement.setAttribute('data-theme', t);
      document.querySelectorAll('[data-theme-set]').forEach(function (o) { o.setAttribute('aria-pressed', String(o === b)); });
    });
  });
})();
</script>
