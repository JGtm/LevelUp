# lefthook.yml — LevelUp
# Remplace .pre-commit-config.yaml (zéro Python requis, binaire Go)
#
# Installation  : lefthook install
# Run manuel    : lefthook run pre-commit
# Run pre-push  : lefthook run pre-push
#
# IMPORTANT : lefthook mange les quotes/parenthèses des commandes inline
# (il enveloppe `run` dans sh -c en quotes simples). Toute logique non triviale
# (pipes, $(), &&, quotes) vit donc dans un script dédié sous
# scripts/git-hooks/lefthook/ appelé via `bash <script>`. Les `run` ne
# contiennent que des tokens simples + le template {staged_files}.

pre-commit:
  parallel: true
  commands:

    # ── Go ────────────────────────────────────────────────────────────────────

    gofmt:
      glob: "apps/go-api/**/*.go"
      run: bash scripts/git-hooks/lefthook/gofmt.sh {staged_files}

    go-vet:
      glob: "apps/go-api/**/*.go"
      run: bash scripts/git-hooks/lefthook/go-vet.sh

    golangci-lint:
      glob: "apps/go-api/**/*.go"
      run: bash scripts/git-hooks/lefthook/golangci-lint.sh

    # ── TypeScript / React ────────────────────────────────────────────────────

    lint-no-hardcoded-fields:
      glob: "apps/web/src/**/*.{ts,tsx}"
      run: node tools/lint-no-hardcoded-fields.mjs

    lint-no-hardcoded-colors:
      glob: "apps/web/src/**/*.{ts,tsx,js,jsx}"
      run: node tools/lint-no-hardcoded-colors.mjs

    lint-cross-feature-imports:
      glob: "apps/web/src/**/*.{ts,tsx}"
      run: node tools/lint-cross-feature-imports.mjs

    # ── Général ───────────────────────────────────────────────────────────────

    check-merge-conflict:
      run: bash scripts/git-hooks/lefthook/check-merge-conflict.sh

pre-push:
  parallel: false
  commands:

    go-test-short:
      glob: "apps/go-api/**/*.go"
      run: bash scripts/git-hooks/lefthook/go-test-short.sh

    govulncheck:
      glob: "apps/go-api/**/*.go"
      run: bash scripts/git-hooks/lefthook/govulncheck.sh

    deploy-dry-run:
      run: bash scripts/test_deploy_dry_run.sh
