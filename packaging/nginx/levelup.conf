# /etc/nginx/sites-available/levelup
#
# Config Nginx pour LevelUp sur lvelup.info
# Architecture : tout est proxifié vers le serveur Go LevelUp (:8000), qui sert
# l'API /api/v1, le SPA React (dist Vite), les assets et les fichiers /static.
# nginx ne sert localement que le challenge ACME (Certbot).
#
# Déployer avec :
#   sudo cp packaging/nginx/levelup.conf /etc/nginx/sites-available/levelup
#   sudo ln -s /etc/nginx/sites-available/levelup /etc/nginx/sites-enabled/levelup
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ensuite générer le certificat SSL :
#   sudo certbot --nginx -d lvelup.info -d www.lvelup.info
#   (Certbot ajoute alors les lignes ssl_certificate + la redirection 301 du bloc :80)

server {
    listen 80;
    server_name lvelup.info www.lvelup.info;

    # Validation Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lvelup.info www.lvelup.info;

    # Certbot complétera ces lignes automatiquement
    # ssl_certificate     /etc/letsencrypt/live/lvelup.info/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lvelup.info/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # -----------------------------------------------------------------------
    # En-têtes de sécurité — COMPLÈTENT le middleware Go, sans le doublonner.
    # Le serveur Go pose déjà, sur toutes les réponses : X-Frame-Options DENY,
    # X-Content-Type-Options nosniff, Referrer-Policy, Cross-Origin-Opener-Policy,
    # et Strict-Transport-Security (HSTS) sur requête HTTPS. nginx n'ajoute donc
    # QUE l'en-tête que Go ne pose pas (vérifié en prod le 2026-07-16 : sans ce
    # tri, X-Frame-Options sortait en double, DENY + SAMEORIGIN).
    # -----------------------------------------------------------------------
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Auth applicative (sessions) gérée côté serveur Go — pas d'auth_basic nginx.

    # -----------------------------------------------------------------------
    # Proxy vers le serveur Go (LevelUp :8000) — upstream unique : API /api/v1,
    # SPA React (dist Vite), assets et fichiers /static.
    # X-Forwarded-Proto est requis : le Go en dérive le flag Secure des cookies
    # et l'émission du HSTS (LEVELUP_TRUST_PROXY_HEADERS actif en prod).
    # -----------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts par défaut — le SPA et les statiques répondent en millisecondes.
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # OAuth Xbox : garder le code (query du callback) hors des access logs.
    # Défense en profondeur — PKCE rend déjà un code intercepté inutilisable.
    location /auth/xbox/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
    }

    # -----------------------------------------------------------------------
    # API Go. Corps volumineux + timeouts longs UNIQUEMENT ici, pour l'upload de
    # clips vidéo (POST /api/v1/players/{slug}/media/upload) : le Go cape à 500 Mo
    # par requête, mais la réception du corps + la sauvegarde disque + le probe HLS
    # synchrone peuvent durer plusieurs minutes sur un gros fichier ou un uplink
    # lent (le transcodage HLS lui-même tourne en tâche de fond, hors requête).
    # Couvre aussi l'import multipart .db OpenSpartan.
    # -----------------------------------------------------------------------
    location /api/ {
        client_max_body_size 2g;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8000;
    }

    # -----------------------------------------------------------------------
    # SPA React + assets Vite + fichiers statiques — tout le reste, servi par le Go.
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
