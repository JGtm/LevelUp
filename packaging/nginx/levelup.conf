# /etc/nginx/sites-available/levelup
#
# Config Nginx pour LevelUp sur lvelup.info
# Architecture : React SPA (dist Vite) servie par le serveur Go LevelUp :8000
#
# Déployer avec :
#   sudo cp packaging/nginx/levelup.conf /etc/nginx/sites-available/levelup
#   sudo ln -s /etc/nginx/sites-available/levelup /etc/nginx/sites-enabled/levelup
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ensuite générer le certificat SSL :
#   sudo certbot --nginx -d lvelup.info -d www.lvelup.info

server {
    listen 80;
    server_name lvelup.info www.lvelup.info;

    # Validation Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lvelup.info www.lvelup.info;

    # Certbot complétera ces lignes automatiquement
    # ssl_certificate     /etc/letsencrypt/live/lvelup.info/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lvelup.info/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Empêche l'accès à l'API depuis des origines tierces (ajuster si multi-domaine)
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Protection basique par mot de passe (HTTP Basic Auth)
    # Créer avec : sudo htpasswd -c /etc/nginx/.htpasswd <login>
    auth_basic "LevelUp - Accès restreint";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # -----------------------------------------------------------------------
    # API Go — tous les appels /api/ sont proxifiés vers le serveur Go :8000
    # -----------------------------------------------------------------------
    location /api/ {
        # Pas d'auth_basic ici (JWT sessionné géré par le serveur Go)
        auth_basic off;

        # Uploads vidéo (clips gameplay) — autoriser un corps de requête volumineux
        client_max_body_size 2g;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout élevé (requêtes DuckDB potentiellement longues)
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # -----------------------------------------------------------------------
    # Assets Vite — fichiers hashés (cache agressif 1 an)
    # Le serveur Go sert ces fichiers depuis /app/apps/web/dist/assets/
    # -----------------------------------------------------------------------
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache navigateur 1 an — les noms de fichiers Vite incluent le hash
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Désactiver auth_basic pour les assets (performance)
        auth_basic off;
    }

    # -----------------------------------------------------------------------
    # SPA fallback — tout le reste est géré par le React Router
    # Le serveur Go retourne index.html pour toutes les routes non-API
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # index.html ne doit pas être mis en cache (le navigateur doit toujours
        # récupérer la dernière version pour détecter les nouveaux assets hashés)
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
