# /etc/nginx/sites-available/levelup
#
# Config Nginx pour LevelUp sur lvelup.info
# Architecture : tout est proxifié vers le serveur Go LevelUp (:8000), qui sert
# l'API /api/v1, le SPA React (dist Vite), les assets et les fichiers /static.
# nginx ne sert localement que le challenge ACME (Certbot).
#
# Déployer avec :
#   sudo cp packaging/nginx/levelup.conf /etc/nginx/sites-available/levelup
#   sudo ln -s /etc/nginx/sites-available/levelup /etc/nginx/sites-enabled/levelup
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ensuite générer le certificat SSL :
#   sudo certbot --nginx -d lvelup.info -d www.lvelup.info
#   (Certbot ajoute alors les lignes ssl_certificate + la redirection 301 du bloc :80)
#
# Pré-requis hors de ce fichier :
#   - packaging/nginx/rate_limit.conf copié dans /etc/nginx/conf.d/ (bloc http : zones lvl_api, lvl_auth) ;
#   - `ssl_protocols TLSv1.2 TLSv1.3;` dans /etc/nginx/nginx.conf ;
#   - packaging/nginx/snippets/levelup-assets-v.conf copié dans /etc/nginx/snippets/
#     (filtre du paramètre v des images d'assets, inclus par la location /api/v1/assets/).
#
# Garde-rails : apps/go-api/internal/archlint/nginx_conf_test.go (en-têtes d'IP, version
# masquée, tailles de corps, limites de débit) et nginx_assets_v_test.go (filtre de v).

server {
    listen 80;
    server_name lvelup.info www.lvelup.info;

    # Validation Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name lvelup.info www.lvelup.info;

    # Certbot complétera ces lignes automatiquement
    # ssl_certificate     /etc/letsencrypt/live/lvelup.info/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lvelup.info/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # -----------------------------------------------------------------------
    # En-têtes de sécurité — COMPLÈTENT le middleware Go, sans le doublonner.
    # Le serveur Go pose déjà, sur toutes les réponses : X-Frame-Options DENY,
    # X-Content-Type-Options nosniff, Referrer-Policy, Cross-Origin-Opener-Policy,
    # et Strict-Transport-Security (HSTS) sur requête HTTPS. nginx n'ajoute donc
    # QUE l'en-tête que Go ne pose pas (vérifié en prod le 2026-07-16 : sans ce
    # tri, X-Frame-Options sortait en double, DENY + SAMEORIGIN).
    # -----------------------------------------------------------------------
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Auth applicative (sessions) gérée côté serveur Go — pas d'auth_basic nginx.

    # -----------------------------------------------------------------------
    # Proxy vers le serveur Go (LevelUp :8000) — upstream unique : API /api/v1,
    # SPA React (dist Vite), assets et fichiers /static.
    # X-Forwarded-Proto est requis : le Go en dérive le flag Secure des cookies
    # et l'émission du HSTS (LEVELUP_TRUST_PROXY_HEADERS actif en prod).
    # -----------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Le Go lit l'IP cliente dans X-Real-IP seul, écrasé ci-dessus à chaque requête.
    # True-Client-IP est vidé (valeur vide = en-tête retiré de la requête proxifiée) :
    # transmis tel quel, il laisserait le client choisir son IP auprès de tout
    # composant qui le lirait. Aucune location ci-dessous ne déclare de
    # proxy_set_header : une seule déclaration couperait l'héritage de ce bloc.
    proxy_set_header True-Client-IP "";

    # Version de nginx masquée ; 429 (et non 503) quand une limite de débit refuse.
    server_tokens off;
    limit_req_status 429;

    # Timeouts par défaut — le SPA et les statiques répondent en millisecondes.
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # OAuth Xbox : garder le code (query du callback) hors des access logs.
    # Défense en profondeur — PKCE rend déjà un code intercepté inutilisable.
    location /auth/xbox/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
    }

    # -----------------------------------------------------------------------
    # API Go. nginx met le corps d'une requête en tampon disque AVANT toute garde
    # Go : il est borné à 1 Mo par défaut. Seules deux routes reçoivent de gros
    # corps :
    #   - envoi de clips vidéo (le Go plafonne à 500 Mo par requête) ;
    #   - import multipart .db OpenSpartan (le Go plafonne à 1 Gio).
    # La réception + la sauvegarde disque + le probe HLS synchrone peuvent durer
    # plusieurs minutes : timeouts longs.
    # -----------------------------------------------------------------------
    location ~ ^/api/v1/players/[^/]+/media/upload$ {
        client_max_body_size 600m;
        limit_req zone=lvl_api burst=200 nodelay;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/v1/import/openspartan {
        client_max_body_size 1100m;
        limit_req zone=lvl_api burst=200 nodelay;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8000;
    }

    # Connexion, inscription, mot de passe, démarrage du device-flow : limite
    # stricte par IP (10 essais d'affilée, puis 1 toutes les 6 s).
    location ~ ^/api/v1/auth/(login|register|password|device-flow/start)$ {
        client_max_body_size 16k;
        limit_req zone=lvl_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }

    # Protocole ouvrier (jeton bearer) : dépôt d'artefact jusqu'à 16 Mio côté Go.
    location /api/v1/internal/ {
        # Protocole ouvrier réservé à csstat (son IP publique) : le jeton ne suffit pas seul.
        allow 82.165.167.179;
        deny all;
        client_max_body_size 20m;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8000;
    }

    # Images servies par l'API : des dizaines par page, aucune limite par requête
    # (même raison que sur la démo : un refus casse les images).
    location /api/v1/assets/ {
        client_max_body_size 16k;
        # Paramètre v refusé s'il porte une traversée (copie : snippets/levelup-assets-v.conf).
        include /etc/nginx/snippets/levelup-assets-v.conf;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        client_max_body_size 1m;
        limit_req zone=lvl_api burst=200 nodelay;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:8000;
    }

    # -----------------------------------------------------------------------
    # SPA React + assets Vite + fichiers statiques — tout le reste, servi par le Go.
    # -----------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
