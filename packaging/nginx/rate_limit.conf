# /etc/nginx/conf.d/rate_limit.conf — zones de limite de débit par IP cliente (bloc http).
#
# Déployer avec :
#   sudo cp packaging/nginx/rate_limit.conf /etc/nginx/conf.d/rate_limit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Zones citées par demo.conf (demo_limit) et levelup.conf (lvl_api, lvl_auth). Garde-rail :
# apps/go-api/internal/archlint/nginx_conf_test.go (toute zone citée est déclarée ici).
limit_req_zone $binary_remote_addr zone=demo_limit:10m rate=10r/s;
# Site principal : API générale et routes d'authentification.
limit_req_zone $binary_remote_addr zone=lvl_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=lvl_auth:10m rate=10r/m;
