# /etc/nginx/sites-available/demo-levelup
#
# Config Nginx pour le sous-domaine démo public de LevelUp (demo.lvelup.info)
# Aucune authentification — accès public.
#
# Déployer avec :
#   sudo cp packaging/nginx/demo.conf /etc/nginx/sites-available/demo-levelup
#   sudo ln -s /etc/nginx/sites-available/demo-levelup /etc/nginx/sites-enabled/demo-levelup
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot (à lancer la première fois, ou si demo.lvelup.info n'était pas encore dans le cert) :
#   sudo certbot --nginx -d lvelup.info -d www.lvelup.info -d demo.lvelup.info

server {
    listen 80;
    server_name demo.lvelup.info;

    # Validation Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name demo.lvelup.info;

    # Certbot complétera/mettra à jour ces lignes automatiquement
    ssl_certificate /etc/letsencrypt/live/www.lvelup.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.lvelup.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Headers de sécurité
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting (défini dans le bloc http via /etc/nginx/conf.d/rate_limit.conf)
    # Appliqué ci-dessous dans location /

    # WebSocket requis pour Streamlit
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout élevé (requêtes DuckDB potentiellement longues)
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    # Pas de auth_basic → accès public sans mot de passe
    location / {
        limit_req zone=demo_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8502;
    }
}
