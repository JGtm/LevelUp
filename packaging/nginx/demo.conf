# /etc/nginx/sites-available/demo-levelup
#
# Config Nginx pour le sous-domaine démo public de LevelUp (demo.lvelup.info)
# Aucune authentification — accès public.
#
# Déployer avec :
#   sudo cp packaging/nginx/demo.conf /etc/nginx/sites-available/demo-levelup
#   sudo ln -s /etc/nginx/sites-available/demo-levelup /etc/nginx/sites-enabled/demo-levelup
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certbot (à lancer la première fois, ou si demo.lvelup.info n'était pas encore dans le cert) :
#   sudo certbot --nginx -d lvelup.info -d www.lvelup.info -d demo.lvelup.info

server {
    listen 80;
    server_name demo.lvelup.info;

    # Validation Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name demo.lvelup.info;

    # Certbot complétera/mettra à jour ces lignes automatiquement
    ssl_certificate /etc/letsencrypt/live/www.lvelup.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.lvelup.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Headers de sécurité
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting (défini dans le bloc http via /etc/nginx/conf.d/rate_limit.conf)
    # Appliqué ci-dessous dans location /

    # WebSocket requis pour Streamlit
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeout élevé (requêtes DuckDB potentiellement longues)
    proxy_read_timeout 300s;
    proxy_connect_timeout 10s;

    # Assets Vite — fichiers hashés, AUCUN rate-limit.
    # Le navigateur tire ~50 chunks de modules d'un coup au chargement d'une page ;
    # avec limit_req le débordement prend un 503 et l'import ES échoué (non réessayé)
    # casse la page. Les assets sont hashés → cache navigateur agressif sûr.
    location /assets/ {
        proxy_pass http://127.0.0.1:8001;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Ressources statiques (maps, rangs, medals, commendations, prestige) — AUCUN
    # rate-limit. Même raison : une page tire des dizaines d'images d'un coup, le
    # burst saute et nginx renvoie des 503 (images cassées).
    location /static/ {
        proxy_pass http://127.0.0.1:8001;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Assets servis par l'API (battlepass, rangs carrière, badges, emblèmes) — AUCUN
    # rate-limit. La page season-pass tire ~40 images d'un coup via /api/v1/assets/* ;
    # sous le limit_req de location / le burst saute → 503. Ce sont des images
    # cacheables, pas des mutations à protéger.
    location /api/v1/assets/ {
        proxy_pass http://127.0.0.1:8001;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Pas de auth_basic → accès public sans mot de passe.
    # Rate-limit conservé sur l'app + API (protège la démo publique des abus).
    location / {
        limit_req zone=demo_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001;
    }
}
