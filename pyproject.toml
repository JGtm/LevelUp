[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "levelup-halo"
version = "5.7.0"
description = "Dashboard d'analyse de statistiques Halo Infinite avec architecture DuckDB v5 (shared matches)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Guillaume", email = "guillaume@example.com"}
]
keywords = ["halo", "infinite", "stats", "visualization", "streamlit", "duckdb", "analytics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Streamlit",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: First Person Shooters",
]

dependencies = [
    "streamlit>=1.37.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "polars>=0.20.0",
    "duckdb>=0.10.0",
    "pydantic>=2.5.0",
    "msal>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.6.1",
    "black>=23.0.0",
    "isort>=5.12.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "pyright>=1.1.0",
    "pandas-stubs>=2.0.0",
    "pre-commit>=3.7.0",
    "vulture>=2.11",
    "watchdog>=4.0.0",
    "detect-secrets>=1.4.0",
]
spnkr = [
    "spnkr>=0.9.0",
    "aiohttp>=3.8.0",
    "aiohttp-client-cache>=0.11.0",
    "aiosqlite>=0.19.0",  # Backend SQLite pour aiohttp-client-cache
]
# msal est dans les dépendances principales — cet extra est conservé pour
# la rétrocompatibilité (pip install levelup-halo[msal] continue de fonctionner)
msal = []

[project.scripts]
levelup = "launcher:main"

[project.urls]
Homepage = "https://github.com/username/levelup-halo"
Repository = "https://github.com/username/levelup-halo"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.css", "*.json"]

# =============================================================================
# Black - Formatage du code
# =============================================================================

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | __pycache__
    | build
    | dist
)/
'''

# =============================================================================
# Ruff - Linting
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "scripts/_archive",      # Scripts archivés, non maintenus
    "scripts/migration",     # Scripts de migration legacy, non maintenus
    "scripts/experimental",  # Scripts de recherche/exploration, non soumis aux règles qualité
]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "UP",      # pyupgrade
    "ARG",     # flake8-unused-arguments
    "SIM",     # flake8-simplify
    "C9",      # McCabe complexity (C901 — max-complexity dans [tool.ruff.lint.mccabe])
    "PLR0912", # too-many-branches  (cible : <= 12, voir [tool.ruff.lint.pylint])
    "PLR0913", # too-many-arguments (cible : <= 5)
    "PLR0915", # too-many-statements (cible : <= 60)
    # "TID",  # flake8-tidy-imports - DÉSACTIVÉ pour tolérance Pandas transitoire
]
ignore = [
    "E501",   # line too long (handled by black)
    "E402",   # module level import not at top of file (needed for sys.path manipulation)
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument
    # C901 / PLR0912 / PLR0913 / PLR0915 : ACTIFS
    # Violations existantes annotées avec # noqa: <CODE> (dette documentée visible).
    # Chaque # noqa restant = une dette à réduire via refactoring.
]

# NOTE: Règle anti-Pandas (TID251 banned-api) préparée mais non activée
# Politique actuelle = "tolérance contrôlée transitoire" :
# - Pas de NOUVEAU import pandas dans le code métier (analysis, data, sync)
# - Imports existants tolérés à la frontière UI/Viz (Streamlit/Plotly)
# - Migration complète vers Polars planifiée pour la prochaine major version
# [tool.ruff.lint.flake8-tidy-imports.banned-api]
# "pandas".msg = "Pandas est interdit. Utilisez Polars."

[tool.ruff.lint.mccabe]
max-complexity = 12  # Complexité cyclomatique max. Violations existantes = # noqa: C901.

[tool.ruff.lint.pylint]
max-args = 5        # Cible. Violations existantes = # noqa: PLR0913.
max-branches = 12   # Cible. Violations existantes = # noqa: PLR0912.
max-statements = 60 # Cible. Violations existantes = # noqa: PLR0915.
max-returns = 4

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001", "ARG002", "UP038"]
# Scripts utilitaires — complexité tolérée (pas du code applicatif)
"scripts/*" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"launcher.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]


[tool.ruff.lint.isort]
known-first-party = ["src"]

# =============================================================================
# Mypy - Type checking
# =============================================================================

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "streamlit.*",
    "plotly.*",
]
ignore_missing_imports = true

# =============================================================================
# Pytest - Tests
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
norecursedirs = ["_archive", ".git", "__pycache__", ".venv", "node_modules"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "visualization: marks tests for visualization functions (charts, graphs)",
    "regression: marks tests as regression tests (e.g. media suite)",
    "e2e_browser: tests E2E navigateur réel (Playwright), désactivés par défaut",
    "asyncio: marks tests as async (use pytest-asyncio)",
    "quality: tests de qualité structurelle (taille, complexité, SRP) — ratchet mode",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
