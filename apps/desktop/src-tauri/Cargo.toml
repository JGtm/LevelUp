[package]
name = "levelup-desktop"
# Meme numero que `version` de tauri.conf.json (A9) : c'est ce fichier-la qui fait foi, la
# verification d'egalite avec le tag git est une etape de release.yml (lot L17).
version = "8.1.3"
description = "Coquille Tauri de LevelUp : fenetre, mise a jour et installeur, aucune logique metier (ADR 0045 D-18)."
authors = ["Guillaume Sitbon"]
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.88"
publish = false

# Deux crates dans un paquet : la bibliotheque porte tout ce qui se decide sans fenetre (machine
# d'etats, sidecar, catalogue) et ne depend PAS de tauri, ce qui permet de la tester par
# `cargo test` sans WebView ; le binaire lie ces briques a la fenetre.
[lib]
name = "levelup_desktop"
path = "src/lib.rs"

[[bin]]
name = "levelup-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
toml = "0.9"
serde_json = "1"

[dependencies]
# `tray-icon` : l'icone de la zone de notification (L21.c) ; `image-png` : decoder l'icone embarquee.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
# Sans la fonctionnalite `zip` : l'installeur NSIS se met a jour par son .exe signe (jamais une
# archive .zip, format v1 retire) ; le crate `zip` 4.x de l'extraction porte trois avis RUSTSEC
# (SUID, liens symboliques) sans correctif possible tant que le plugin le fige. A reactiver si un
# jour une mise a jour en archive est livree, avec un `zip` >= 9.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde_json = "1"
getrandom = "0.3"
url = "2"
sys-locale = "0.3"
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }
# Notifications Windows relayees depuis la cloche (L21.b). La 2.4 est la derniere compatible avec
# `rust-version = 1.88` ci-dessus ; la resolution suit l'outillage, `Cargo.lock` fait foi.
tauri-plugin-notification = "2.4"
tauri-plugin-autostart = "2"

# Lecture de l'entree de demarrage (presence et approbation) : le plugin d'autostart ne les distingue pas.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[profile.release]
# Binaire plus petit : la coquille ne calcule rien, elle attend.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
