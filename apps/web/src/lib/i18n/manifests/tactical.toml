# n'est la règle d'aucun match.
[tactical.coordination.radius_value]
fr = "{rayon, number} m"
en = "{rayon, number} m"

[tactical.coordination.radius_join]
fr = " ou "
en = " or "

# ── Section « Coordination d'équipe » ─────────────────────────────────────────
[tactical.coordination.title]
