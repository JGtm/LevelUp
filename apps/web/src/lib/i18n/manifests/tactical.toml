en = "Source: replay artifacts"

[tactical.plan.source_journal]
fr = "Source : journal des morts"
en = "Source: death log"

# Plancher par cellule : 3 matchs distincts (calibration mesurée de `mappos-build`,
# section 6 du plan Tactique) — même seuil que le serveur applique pour publier une
# cellule, jamais recalculé côté client.
[tactical.plan.footer_floor]
fr = "Plancher : {n, plural, one {# match distinct} other {# matchs distincts}} par cellule"
en = "Floor: {n, plural, one {# distinct match} other {# distinct matches}} per cell"

# Pas de la grille : PUBLIÉ par le serveur (`TacticalRaster.pas_m`), jamais choisi ici.
# Il varie de 0,5 à 2 m selon la densité des positions (pas adaptatif, décision D6) : un
# plan plus grossier doit se voir, sans quoi deux cartes ne se comparent plus.
[tactical.plan.footer_grid]
fr = "Grille : {pas, number} m par cellule"
en = "Grid: {pas, number} m per cell"

# ── Les trois états vides du plan, et pourquoi ils ne disent pas la même chose ──
# Le message générique « pas assez de matchs mesurés » a menti sur Illusion (point 21) :
# 38 matchs étaient retenus et mesurés, mais aucune zone n'atteignait le plancher de
# 3 matchs distincts par cellule. Trois causes, trois messages.

# 1. Aucun match dans le filtre sur cette carte : le périmètre est vide, pas la mesure.
[tactical.plan.empty_no_match_title]
fr = "Aucun match sur cette carte dans ce filtre"
en = "No match on this map within this filter"

[tactical.plan.empty_no_match_description]
fr = "Élargis la période ou la composition pour retrouver des matchs sur cette carte."
en = "Widen the period or the squad to find matches on this map."

# 2. Des matchs, mais aucun mesuré (film jamais décodé, journal des morts illisible).
[tactical.plan.empty_title]
fr = "Pas assez de matchs mesurés sur cette carte"
en = "Not enough measured matches on this map"

[tactical.plan.empty_description]
fr = "Élargis la période, la composition ou change de spawn de départ pour mesurer plus de matchs."
en = "Widen the period, the squad, or change the starting spawn to measure more matches."

# 3. Des matchs mesurés, mais trop dispersés : la densité par cellule ne suffit pas.
[tactical.plan.empty_density_title]
fr = "Densité insuffisante pour dessiner un plan"
en = "Not enough density to draw a plan"

[tactical.plan.empty_density_description]
fr = "{matchs, plural, one {# match mesuré} other {# matchs mesurés}} sur cette carte, mais aucune zone n'atteint {plancher, plural, one {# match distinct} other {# matchs distincts}}, même avec une grille de {pas, number} m. Élargis la période ou la composition."
en = "{matchs, plural, one {# measured match} other {# measured matches}} on this map, but no area reaches {plancher, plural, one {# distinct match} other {# distinct matches}}, even with a {pas, number} m grid. Widen the period or the squad."

# ── KPI génériques (taux + compte brut, jamais un taux seul) ──────────────────
[tactical.kpi.secondary]
fr = "{brut, number} sur {n, number}"
en = "{brut, number} out of {n, number}"

[tactical.kpi.low_sample]
fr = "échantillon faible"
en = "small sample"

[tactical.kpi.no_radius_note]
fr = "{n, plural, one {# match sans rayon connu, écarté} other {# matchs sans rayon connu, écartés}}"
en = "{n, plural, one {# match with unknown radius, excluded} other {# matches with unknown radius, excluded}}"

# ══════════════════════════════════════════════════════════════════════════════
# Conformité à la maquette 034b1915 (lot F, 2026-09-13). Chaque clé ci-dessous
# porte un ÉLÉMENT de la maquette, dans les mots de la maquette.
# ══════════════════════════════════════════════════════════════════════════════

# ── Écran 1 : la phrase d'introduction du pied de la grille ───────────────────
# Elle REMPLACE la paire couverture + note de plancher : c'était la même chose
# dite en deux temps, et la maquette la dit en une phrase.
[tactical.maps.intro]
fr = "{maps, plural, one {# carte jouée} other {# cartes jouées}} sur la période, {matches, plural, one {# match} other {# matchs}}. Les cartes sous {floor} matchs sont affichées mais pas ouvrables : sous ce plancher, une zone chaude ne distingue pas une habitude d'un hasard."
en = "{maps, plural, one {# map played} other {# maps played}} over the period, {matches, plural, one {# match} other {# matches}}. Maps under {floor} matches are shown but cannot be opened: below that floor, a hot zone tells a habit from a coincidence."

# Résumé d'une vignette, SUR UNE SEULE LIGNE (maquette) : le compte de matchs et
# le bilan victoires / défaites.
[tactical.maps.tile_summary]
fr = "{n, plural, one {# match} other {# matchs}} · {wins} V / {losses} D"
en = "{n, plural, one {# match} other {# matches}} · {wins} W / {losses} L"

# ── Bascule d'écran (deux boutons aria-pressed) ───────────────────────────────
[tactical.screen.label]
fr = "Écran"
en = "Screen"

[tactical.screen.grid]
fr = "Grille des cartes"
en = "Map grid"

[tactical.screen.map]
fr = "Analyse d'une carte"
en = "Single map analysis"

# ── Légende et pied du plan ───────────────────────────────────────────────────
# Nom accessible de la rampe de légende : elle porte les deux bornes et l'unité.
[tactical.plan.legend_label]
fr = "Échelle de la lecture, de {lo} à {hi}"
en = "Reading scale, from {lo} to {hi}"

# Phrase d'échelle — DEUX formes, parce que les deux lectures ne se lisent pas pareil.
[tactical.plan.scale_quantile]
fr = "Échelle quantile p50 vers p95, saturée au-delà. Une cellule jamais atteinte reste vide — elle n'est pas peinte en froid."
en = "Quantile scale p50 to p95, saturated beyond. A cell never reached stays empty — it is not painted cold."

[tactical.plan.scale_divergent]
fr = "Échelle divergente : le vert est joué davantage en victoire, le rouge en défaite. Sous {plancher, plural, one {# match distinct} other {# matchs distincts}} la cellule ne s'affiche pas."
en = "Divergent scale: green is played more in wins, red in losses. Below {plancher, plural, one {# distinct match} other {# distinct matches}} the cell is not shown."

# Ligne de dénominateurs du pied : combien de matchs la lecture a retenus, sur
# combien le filtre en comptait, et d'où viennent les positions.
[tactical.plan.footer_retained]
fr = "{retenus, plural, one {# match retenu} other {# matchs retenus}} sur {filtres} filtrés · {source}"
en = "{retenus, plural, one {# retained match} other {# retained matches}} out of {filtres} filtered · {source}"

# ── Cellule sélectionnée ──────────────────────────────────────────────────────
# « Mes routes de spawn » n'a pas de cellule : la lecture est un empilement de
# trajets, pas une grandeur par cellule.
[tactical.cell.placeholder_routes]
fr = "Les routes n'ont pas de cellule"
en = "Routes have no cell"

[tactical.cell.placeholder_routes_description]
fr = "Choisis une autre question pour ouvrir un match depuis le plan."
en = "Pick another question to open a match from the plan."

# Lien d'une contribution, forme de la maquette : « ouvrir à mm:ss ».
[tactical.cell.contribution_open]
fr = "ouvrir à {instant}"
en = "open at {instant}"

# ── Bandeau de KPI : les sous-titres de la maquette ───────────────────────────
[tactical.kpi.matches_retained_secondary]
fr = "sur {n} filtrés"
en = "out of {n} filtered"

[tactical.kpi.coverage_replay]
fr = "rejeux cuits"
en = "baked replays"

[tactical.kpi.coverage_shared]
