en = "Team coordination"

[tactical.coordination.median]
fr = "Distance médiane à l'équipier"
en = "Median distance to teammate"

[tactical.coordination.chart_title]
fr = "Distance à l'équipier le plus proche, au moment de ma mort"
en = "Distance to the nearest teammate, at the moment of my death"

[tactical.coordination.chart_y]
fr = "Morts"
en = "Deaths"

[tactical.coordination.bucket]
