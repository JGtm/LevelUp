en = "Isolation threshold"

[tactical.coordination.note_rules]
fr = "Échange : un équipier tue mon tueur dans les {secondes} s. Isolement : plus proche équipier au-delà de {rayon}."
en = "Trade: a teammate kills my killer within {secondes} s. Isolation: nearest teammate beyond {rayon}."

[tactical.coordination.note_coverage]
fr = "Lecture sur {retenus} matchs mesurés sur {filtres} — les positions viennent du journal des morts, jamais d'une estimation."
en = "Read on {retenus} measured matches out of {filtres} — positions come from the death log, never from an estimate."

# Les morts SANS distance mesurée : aucun coéquipier VISIBLE à cet instant, donc
# aucune distance à mesurer. Une absence de mesure, JAMAIS une distance infinie —
# la distinction porte tout le verdict (cf. domain.MortAExaminer.PlusProcheM).
[tactical.coordination.no_distance]
fr = "{n, plural, one {# mort sans coéquipier visible} other {# morts sans coéquipier visible}} : aucune distance à mesurer, elles comptent dans l'isolement mais pas dans la distribution."
en = "{n, plural, one {# death with no visible teammate} other {# deaths with no visible teammate}}: no distance to measure; they count as isolation but not in the distribution."

[tactical.coordination.empty]
fr = "Aucune mort mesurée dans ce filtre"
en = "No measured death within this filter"

[tactical.coordination.empty_description]
fr = "La coordination se lit sur les morts dont le voisinage a été mesuré. Élargis la période ou la composition."
en = "Coordination is read on deaths whose surroundings were measured. Widen the period or the squad."

# Sens SOUHAITABLE de la grandeur, pas une variation : aucune periode de
# comparaison n'est servie sur cet onglet, et une fleche de tendance sans
# reference dirait une evolution qu'on ne mesure pas.
[tactical.kpi.lower_is_better]
fr = "▼ moins c'est mieux"
en = "▼ lower is better"
