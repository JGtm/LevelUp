# Manifest i18n de l'onglet TACTIQUE (Ascension) — écran unique : cartes jouées, carte du plan,
# zone sélectionnée. Chaque clé porte fr ET en (contrôlé par build_i18n_manifests.mjs).
#
# VOCABULAIRE FR ARRÊTÉ : « carte », « matchs », « victoires », « défaites », « frags »,
# « plancher », « réapparition ». Jamais « map », jamais « heatmap » (garde
# lib/i18n/no-anglicisms.guard.test.ts). Du factuel et du neutre : aucun conseil adressé au joueur.

