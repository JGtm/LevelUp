# Match View i18n manifest — strings de la page Match View.
#
# Format ICU MessageFormat. Régénérer via :
#   node apps/web/scripts/build_i18n_manifests.mjs
#
# Phase 1 méta-plan § 6.1.3 — pilote MatchView. Initialement focalisé sur les
# clés narrative (dominance badges) consommées par le header. Les sections
# Combat / Team / Citations / Media seront enrichies dans des chunks ultérieurs
# (MV2/MV3) au fur et à mesure de la migration ECharts + LoadHighlightEvents.

# ─── Header — badges dominance (5 narratifs) ────────────────────────────────

[narrative.dominance.domination]
fr = "Domination"
en = "Domination"

[narrative.dominance.humiliation]
fr = "Humiliation"
en = "Humiliation"

[narrative.dominance.remontada]
fr = "Remontada"
en = "Comeback"

[narrative.dominance.debandade]
fr = "Débandade"
en = "Collapse"

[narrative.dominance.contre_remontada]
fr = "Contre-remontada"
en = "Counter-comeback"

