[profile.insufficient.cta]
fr = "Joue encore {missing, plural, =1 {1 match} other {# matchs}} pour débloquer ton profil complet (style, engagement, leviers d'amélioration)."
en = "Play {missing, plural, =1 {1 more match} other {# more matches}} to unlock your full profile (style, engagement, improvement leverages)."

