# ─── Etats globaux du profil ─────────────────────────────────────────────────

[profile.loading]
fr = "Chargement du profil…"
en = "Loading profile…"

[profile.load_error]
fr = "Le profil n'a pas pu être chargé. Réessaie plus tard."
en = "Unable to load the profile. Try again later."

[profile.insufficient.title]
fr = "Profil en construction"
en = "Profile in progress"

[profile.insufficient.subtitle]
fr = "{n, plural, =0 {Aucun match analysé} =1 {1 match analysé} other {# matchs analysés}} sur cette fenêtre."
