# Home i18n manifest — strings de la page Accueil (Mission Control).
#
# Format ICU MessageFormat. Regenerer via :
#   node apps/web/scripts/build_i18n_manifests.mjs
#
# Phase 2 meta-plan § 6.2.1 — chunk P2.F. Couvre les strings hardcodees
# de HomePage.tsx qui ne sont PAS deja gerees par les modules
# `kpi.i18n.ts`, `highlights.i18n.ts`, `spartanIdentity.i18n.ts`,
# `fallback.i18n.ts`. Migration progressive : ces modules legacy seront
# absorbes en Phase 3.

# ─── États globaux page ────────────────────────────────────────────────────

[home.empty.error_title]
fr = "Accueil indisponible"
en = "Home unavailable"

[home.empty.error_description]
fr = "La page d'accueil n'a pas pu être chargée pour ce joueur. Vérifie la session ou relance la requête."
en = "Home page could not be loaded for this player. Check session or retry."

[home.empty.no_data_title]
fr = "Accueil vide"
en = "Empty home"

[home.empty.no_data_description]
fr = "Aucune donnée d'accueil n'a été renvoyée pour ce joueur. Vérifie le bootstrap ou les données locales avant de continuer."
en = "No home data returned for this player. Check bootstrap or local data before continuing."

[home.errors.retry]
fr = "Réessayer"
en = "Retry"

[home.errors.reload]
fr = "Relancer"
en = "Reload"

