# ─── La frise, soirée par soirée ────────────────────────────────────────────
#
# Grammaire reprise de « Performance d'escouade par session »
# (`charts/squadSessionTimelineChart.ts`) : bâtons à 18 px, courbe pleine 2 px non
# lissée, légende systématique, axes en 10 px gris. UN SEUL AXE Y : tout est en
# points de pourcentage, deux axes seraient une faute de lecture. Le volume de
# chaque soirée (morts mesurées) est un RANG D'ÉTIQUETTES sous l'axe, pas un second
# graphe — c'est le dénominateur, il n'a pas d'échelle propre.
#
# LA FRISE N'A PLUS DE TITRE PROPRE (2026-09-22) : elle EST le bloc « Riposte », dont le
# bandeau porte déjà ce nom. Elle couvre TOUTES les soirées de la composition, celles du
# filtre courant en encre pleine et les autres atténuées.

[squad.riposte.frise_above]
fr = "soirée au-dessus de l'habituel"
en = "evening above usual"

[squad.riposte.frise_below]
fr = "en dessous"
en = "below"

[squad.riposte.frise_trend]
fr = "tendance sur {n, number} soirées"
en = "trend over {n, number} evenings"

[squad.riposte.frise_usual]
fr = "habituel {rate}"
en = "usual {rate}"

[squad.riposte.frise_y_axis]
fr = "Part des morts ripostées"
en = "Share of riposted deaths"

[squad.riposte.frise_volume]
fr = "{n, plural, one {# mort mesurée} other {# morts mesurées}}"
en = "{n, plural, one {# measured death} other {# measured deaths}}"

[squad.riposte.frise_volume_axis]
