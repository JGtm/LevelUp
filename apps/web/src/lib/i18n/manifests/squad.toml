# ─── LA RIPOSTE (section « Coordination » de l'Escouade, D19 du 2026-09-21) ──
#
# Une RIPOSTE est une mort de notre camp dont le tueur est abattu par un coéquipier
# dans les 5 s. Vocabulaire FR arrêté (D19) : « riposte », « riposter », « taux de
# riposte ». Jamais « échange », jamais « vengeance », jamais « trade ». L'autre
# notion de la section est l'APPUI (qui prépare les frags de qui) — et elle seule
# garde le mot « assistance », parce qu'elle compte des assistances.

[squad.riposte.coordination_title]
fr = "Coordination"
en = "Coordination"

[squad.riposte.coordination_help_riposte]
fr = "La riposte : quand un des nôtres tombe, son tueur est-il abattu par un coéquipier dans les {seconds, number} s qui suivent ?"
en = "Riposte: when one of us falls, is their killer taken down by a teammate within the next {seconds, number} s?"

[squad.riposte.coordination_help_appui]
fr = "L'appui : qui prépare les frags de qui — une assistance n'a ni fenêtre de temps ni mort de notre camp, c'est une autre mesure."
en = "Support: who sets up whose kills — an assist has neither a time window nor a death on our side; it is a different measure."

[squad.riposte.title]
fr = "Riposte"
en = "Riposte"

[squad.riposte.label]
fr = "La riposte après une mort de notre camp"
en = "Riposte after a death on our side"

[squad.riposte.definition]
fr = "Une riposte : un coéquipier abat votre tueur dans les {seconds, number} s qui suivent votre mort."
en = "A riposte: a teammate takes down your killer within {seconds, number} s of your death."

[squad.riposte.help_usual]
fr = "L'habituel est le même taux sur tout l'historique de la composition. Quand le filtre couvre déjà tout l'historique, l'écart vaut zéro par construction et n'est pas affiché."
en = "Usual is the same rate over the composition's whole history. When the filter already covers the whole history, the deviation is zero by construction and is not displayed."

[squad.riposte.low_sample]
fr = "échantillon faible"
en = "small sample"

[squad.riposte.low_sample_hint]
fr = "Moins de {floor, number} morts mesurées : la valeur existe, elle ne classe personne."
en = "Fewer than {floor, number} measured deaths: the value exists, it ranks no one."

[squad.riposte.badge_most_covered]
fr = "Le plus couvert : {player}"
en = "Most covered: {player}"

[squad.riposte.badge_least_covered]
fr = "Le moins couvert : {player}"
en = "Least covered: {player}"

[squad.riposte.no_pairs]
fr = "Aucune riposte entre membres de l'escouade sur cette sélection."
en = "No riposte between squad members in this selection."

[squad.riposte.empty_title]
fr = "Aucune riposte mesurée"
en = "No riposte measured"

[squad.riposte.matrix_tooltip]
fr = "{auteur} a riposté pour {pour} {n, plural, one {# fois} other {# fois}} ({perMatch} par match)."
en = "{auteur} riposted for {pour} {n, plural, one {# time} other {# times}} ({perMatch} per match)."

# ─── La phrase de lecteur, TOUJOURS rendue ──────────────────────────────────
#
# Elle est faite de deux morceaux : le fait (toujours), puis l'écart à l'habituel —
# qui SE TAIT quand le périmètre couvre tout l'historique (l'écart y est nul par
# construction, et l'annoncer ferait croire à une mesure là où il n'y a qu'une
# tautologie).





# ─── Les deux BLOCS de tête : « Morts ripostées » et « Temps de riposte » ───
#
# Chacun est une SectionCard de plein droit depuis le 2026-09-22 : son titre est
# TACTIQUE (ce que la mesure dit), et la MÉTHODE — dénominateur, fenêtre, barres hors
# fenêtre — vit dans son infobulle (i). Un titre qui porte son dénominateur (« Sur
# 511 morts des nôtres ») nomme l'échantillon, pas la mesure.

[squad.riposte.donut_title]
fr = "Morts ripostées"
en = "Riposted deaths"

[squad.riposte.donut_help]
fr = "Sur {n, plural, one {# mort des nôtres} other {# morts des nôtres}}, la part ripostée dans les {seconds, number} s."
en = "Out of {n, plural, one {# death on our side} other {# deaths on our side}}, the share riposted within {seconds, number} s."

[squad.riposte.appel_unit]
fr = "ripostées"
en = "riposted"

[squad.riposte.donut_unanswered]
fr = "sans réponse"
en = "unanswered"

[squad.riposte.donut_alt]
fr = "{rate} des {morts, number} morts des nôtres sont ripostées : {ripostes, number} ripostées, {sans, number} sans réponse."
en = "{rate} of our {morts, number} deaths are riposted: {ripostes, number} riposted, {sans, number} unanswered."

[squad.riposte.delai_title]
fr = "Temps de riposte"
