# ─── Nuage « Pourquoi la riposte ne vient pas » (SquadEchange.nuage_isolement) ────────
#
# Contrat refondu le 2026-09-19 (PLAN_AJUSTEMENTS_PRE_V75, décision 4) : UN PETIT POINT PAR
# MORT, un gros point par joueur. En abscisse la distance au coéquipier visible le plus
# proche rapportée à la portée du radar du match (1,0 = à la portée) ; en ordonnée le délai
# avant la riposte. Une mort sans coéquipier visible va dans la bande « hors de vue », une
# mort jamais ripostée dans la bande « jamais ripostée ».

[squad.isolement.section_title]
fr = "Isolement et couverture"
en = "Isolation and coverage"

[squad.isolement.section_label]
fr = "Une mort par point, distance au coéquipier contre délai avant que le tueur tombe"
en = "One death per dot, distance to teammate versus delay before the killer goes down"

[squad.isolement.x_axis]
fr = "Distance au coéquipier le plus proche (× la portée du radar)"
en = "Distance to nearest teammate (× radar range)"

[squad.isolement.y_axis]
fr = "Délai avant que le tueur tombe (s)"
en = "Delay before the killer goes down (s)"

[squad.isolement.help]
fr = "Chaque petit point est une mort : à gauche un coéquipier était tout près, à droite il était hors de portée du radar. L’axe vertical est logarithmique et court de 0,2 s à une minute — sous la fenêtre tiretée c’est une riposte, au-dessus la mort se dessine en losange et ne compte dans aucun taux, et passé une minute elle rejoint la bande « jamais ripostée ». Le gros point est la médiane des ripostes du joueur, sa taille dit combien de morts."
en = "Each small dot is one death: on the left a teammate was close by, on the right they were beyond radar range. The vertical axis is logarithmic and runs from 0.2 s to one minute — below the dashed window that is a riposte, above it the death is drawn as a diamond and counts in no rate, and past one minute it joins the “never riposted” band. The large dot is the player’s median riposte, its size says how many deaths."

[squad.isolement.radar_line]
fr = "Portée du radar"
en = "Radar range"

[squad.isolement.band_out_of_sight]
fr = "Hors de vue"
en = "Out of sight"

[squad.isolement.band_never]
fr = "Jamais ripostée"
en = "Never riposted"

# LA RÈGLE DES 5 s SE TRACE (décision utilisateur du 2026-09-22). Le nuage continue de
# montrer les morts dont le tueur est tombé bien après (60 s, 100 s) — l'axe des délais
# reste libre —, mais la fenêtre de riposte y est posée en repère tireté, MÊME GRAMMAIRE
# que le `windowMark` de l'histogramme des délais : le lecteur voit d'un coup d'œil ce qui
# compte comme riposte et ce qui n'en est pas une. La valeur vient du contrat
# (`fenetre_ms`), jamais d'un 5 codé en dur côté web. Et la matière de dessin a un PLAFOND
# (`plafond_ms`, 60 s) : au-delà, le tueur est mort de sa propre vie, le serveur ne publie
# plus de délai et la mort rejoint la bande « jamais ripostée ».
[squad.isolement.window_line]
fr = "Fenêtre de riposte {seconds, number} s"
en = "Riposte window {seconds, number} s"

# Légende de la FORME des points (décision du 2026-09-22) : l'encre reste celle du joueur
# et tous les points sont PLEINS, c'est la silhouette qui dit l'état — disque dans la
# fenêtre, LOSANGE au-dessus. Un encodage qu'on ne nomme pas ne se lit pas.
[squad.isolement.legend_out_of_window]
fr = "tueur tombé hors fenêtre"
en = "killer downed outside the window"

[squad.isolement.low_sample]
fr = "échantillon faible"
en = "small sample"

# Infobulles, LIGNE PAR LIGNE : le retour à la ligne HTML est posé par le composant, jamais
# dans le message — un `<br>` isolé fait échouer le parseur ICU, qui rend alors le gabarit
# brut à l'écran (constaté le 2026-09-20). « Couverture » se lit ici comme une PROXIMITÉ
# rapportée à la portée du radar (décision 4), jamais comme un taux.
[squad.isolement.tooltip_death_coverage]
fr = "Couverture : coéquipier à {ratio} × la portée du radar"
en = "Coverage: teammate at {ratio} × radar range"

[squad.isolement.tooltip_death_out_of_sight]
fr = "Couverture : aucun coéquipier en vue"
en = "Coverage: no teammate in sight"

[squad.isolement.tooltip_riposted]
fr = "Ripostée en {seconds} s"
en = "Riposted in {seconds} s"

# Le tueur EST tombé, mais trop tard : le délai se dit quand même (c'est pour le voir que
# ces morts restent dessinées), et le verdict tranche — ce n'est pas une riposte.
[squad.isolement.tooltip_out_of_window]
fr = "Tueur tombé à {seconds} s, hors fenêtre : sans riposte"
en = "Killer downed at {seconds} s, outside the window: no riposte"

[squad.isolement.tooltip_never]
fr = "Jamais ripostée"
en = "Never riposted"

# Infobulle du GROS point par joueur : les deux médianes, le volume, et les deux taux.
[squad.isolement.tooltip_repere_head]
fr = "{gamertag} — médiane ({n, plural, one {# mort} other {# morts}})"
en = "{gamertag} — median ({n, plural, one {# death} other {# deaths}})"

[squad.isolement.tooltip_repere_iso]
fr = "Isolement : {isoRate}"
en = "Isolation: {isoRate}"

[squad.isolement.tooltip_repere_cov]
fr = "Taux de riposte : {covRate}"
en = "Riposte rate: {covRate}"

[squad.isolement.empty_title]
fr = "Aucune mort mesurée"
en = "No death measured"

[squad.isolement.empty_description]
fr = "Aucune mort de la sélection n'est localisée sur un match dont la portée du radar est connue."
en = "No death in the selection is located on a match with a known radar range."

