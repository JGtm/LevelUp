# ─── L'ECHANGE (plan tactique 2026-09-06, phase 3) ──────────────────────────
#
# Un ECHANGE est une mort vengee : un coequipier abat le tueur dans les 5 s.
# Vocabulaire FR arrete : « echange », « vengeance », « riposte ». Jamais
# « trade ». Aucune chaine FR de ce chantier ne contient le mot anglais des
# cartes de chaleur (garde anti-anglicismes, lot C.4).

[squad.echange.section_title]
fr = "Qui échange pour qui"
en = "Who trades for whom"

[squad.echange.section_label]
fr = "Échanges entre membres de l'escouade"
en = "Trades between squad members"

[squad.echange.axis_avenger]
fr = "Vengeur"
en = "Avenger"

[squad.echange.axis_avenged]
fr = "Vengé"
en = "Avenged"

[squad.echange.definition]
fr = "Un échange : un coéquipier abat votre tueur dans les {seconds, number} s qui suivent votre mort."
en = "A trade: a teammate takes down your killer within {seconds, number} s of your death."

[squad.echange.coverage]
fr = "Mesuré sur {measured, number} des {total, plural, one {# match} other {# matchs}} de la sélection."
en = "Measured on {measured, number} of the {total, plural, one {# match} other {# matches}} in the selection."

[squad.echange.coverage_hint]
fr = "Le journal des morts vient du film du match, et les films expirent côté serveur : ce qui manque ne reviendra pas."
en = "The death log comes from the match film, and films expire server-side: what is missing will not come back."

[squad.echange.narrative]
fr = "Sur {matches, plural, one {# match} other {# matchs}}, {brut, number} des {n, plural, one {# mort} other {# morts}} de votre camp ont été vengées dans les {seconds, number} s — soit {rate}."
en = "Over {matches, plural, one {# match} other {# matches}}, {brut, number} of your side's {n, plural, one {# death} other {# deaths}} were avenged within {seconds, number} s — that is {rate}."

[squad.echange.low_sample]
fr = "échantillon faible"
en = "small sample"

[squad.echange.low_sample_hint]
fr = "Moins de {floor, number} morts mesurées : la valeur existe, elle ne classe personne."
en = "Fewer than {floor, number} measured deaths: the value exists, it ranks no one."

[squad.echange.badge_most_covered]
fr = "Le plus couvert : {player}"
en = "Most covered: {player}"

[squad.echange.badge_least_covered]
fr = "Le moins couvert : {player}"
en = "Least covered: {player}"

[squad.echange.badge_covered_detail]
fr = "{n, plural, one {# vengeance} other {# vengeances}}"
en = "{n, plural, one {# avenging kill} other {# avenging kills}}"

[squad.echange.no_pairs]
fr = "Aucune vengeance entre membres de l'escouade sur cette sélection."
en = "No avenging kill between squad members in this selection."

[squad.echange.empty_title]
fr = "Aucun échange mesuré"
en = "No trade measured"

[squad.echange.empty_description]
fr = "Aucun match de la sélection ne porte de journal des morts exploitable."
en = "No match in the selection carries a usable death log."

[squad.echange.matrix_tooltip]
fr = "{avenger} a vengé {avenged} {n, plural, one {# fois} other {# fois}} ({perMatch} par match)."
en = "{avenger} avenged {avenged} {n, plural, one {# time} other {# times}} ({perMatch} per match)."

