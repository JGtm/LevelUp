# ─── La frise, soirée par soirée ────────────────────────────────────────────
#
# Grammaire reprise de « Performance d'escouade par session »
# (`charts/squadSessionTimelineChart.ts`) : bâtons à 18 px, courbe pleine 2 px non
# lissée, légende systématique, axes en 10 px gris. UN SEUL AXE Y : tout est en
# points de pourcentage, deux axes seraient une faute de lecture. Le volume de
# chaque soirée (morts mesurées) est un RANG D'ÉTIQUETTES sous l'axe, pas un second
# graphe — c'est le dénominateur, il n'a pas d'échelle propre.

[squad.riposte.frise_title]
fr = "Soirée par soirée — part des nôtres ripostée dans les {seconds, number} s"
en = "Evening by evening — share of our deaths riposted within {seconds, number} s"

[squad.riposte.frise_above]
fr = "soirée au-dessus de l'habituel"
en = "evening above usual"

[squad.riposte.frise_below]
fr = "en dessous"
en = "below"

[squad.riposte.frise_trend]
