# ─── Nuage « Pourquoi la riposte ne vient pas » (SquadEchange.nuage_isolement) ────────
#
# Contrat refondu le 2026-09-19 (PLAN_AJUSTEMENTS_PRE_V75, décision 4) : UN PETIT POINT PAR
# MORT, un gros point par joueur. En abscisse la distance au coéquipier visible le plus
# proche rapportée à la portée du radar du match (1,0 = à la portée) ; en ordonnée le délai
# avant la riposte. Une mort sans coéquipier visible va dans la bande « hors de vue », une
# mort jamais ripostée dans la bande « jamais ripostée ».

[squad.isolement.section_title]
fr = "Isolement et couverture"
en = "Isolation and coverage"

[squad.isolement.section_label]
fr = "Une mort par point, distance au coéquipier contre délai de riposte"
en = "One death per dot, distance to teammate versus riposte delay"

[squad.isolement.x_axis]
fr = "Distance au coéquipier le plus proche (× la portée du radar)"
en = "Distance to nearest teammate (× radar range)"

[squad.isolement.y_axis]
fr = "Délai avant la riposte (s)"
en = "Delay before the riposte (s)"

[squad.isolement.help]
fr = "Chaque petit point est une mort : à gauche un coéquipier était tout près, à droite il était hors de portée du radar. Plus le point est haut, plus la riposte a tardé. Le gros point est la médiane du joueur, sa taille dit combien de morts."
en = "Each small dot is one death: on the left a teammate was close by, on the right they were beyond radar range. The higher the dot, the longer the riposte took. The large dot is the player's median, its size says how many deaths."

[squad.isolement.radar_line]
fr = "Portée du radar"
en = "Radar range"

[squad.isolement.band_out_of_sight]
fr = "Hors de vue"
en = "Out of sight"

[squad.isolement.band_never]
fr = "Jamais ripostée"
en = "Never riposted"

[squad.isolement.low_sample]
fr = "échantillon faible"
en = "small sample"

# Infobulles, LIGNE PAR LIGNE : le retour à la ligne HTML est posé par le composant, jamais
# dans le message — un `<br>` isolé fait échouer le parseur ICU, qui rend alors le gabarit
# brut à l'écran (constaté le 2026-09-20). « Couverture » se lit ici comme une PROXIMITÉ
# rapportée à la portée du radar (décision 4), jamais comme un taux.
[squad.isolement.tooltip_death_coverage]
fr = "Couverture : coéquipier à {ratio} × la portée du radar"
en = "Coverage: teammate at {ratio} × radar range"

[squad.isolement.tooltip_death_out_of_sight]
fr = "Couverture : aucun coéquipier en vue"
en = "Coverage: no teammate in sight"

[squad.isolement.tooltip_riposted]
fr = "Ripostée en {seconds} s"
en = "Riposted in {seconds} s"

[squad.isolement.tooltip_never]
fr = "Jamais ripostée"
en = "Never riposted"

# Infobulle du GROS point par joueur : les deux médianes, le volume, et les deux taux.
[squad.isolement.tooltip_repere_head]
