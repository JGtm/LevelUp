# Palmares i18n manifest — strings de la page Palmarès.
#
# Format ICU MessageFormat. Regenerer via :
#   node apps/web/scripts/build_i18n_manifests.mjs
#
# Phase 3 P3.C — consolidation de `palmares/i18n.ts` (251L) vers le manifest.
# Le module legacy reste comme adapter mince (preservation de la signature
# `PalmaresText` pour minimiser la churn dans les pages).

# ─── Locale Intl ───────────────────────────────────────────────────────────

[palmares.intl_locale]
fr = "fr-FR"
en = "en-GB"

# ─── Page header ───────────────────────────────────────────────────────────

[palmares.page.title]
fr = "Palmarès"
en = "Palmares"

[palmares.page.subtitle]
fr = "Classements, relations de jeu, passes saisonniers et comparaison joueur à joueur regroupés dans un même hub."
en = "Ranked standings, play relationships, seasonal passes and player-vs-player comparison grouped into one hub."

