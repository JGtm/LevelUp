[admin.titles.register_help_title]
fr = "Enregistrer un nouveau titre"
en = "Register a new title"

[admin.titles.register_help_body]
fr = "Aucune écriture via l'interface — la préparation d'un titre est un flux en ligne de commande. 1) Lancer « levelup add-title --name \"…\" [--slug s] [--capabilities c1,c2] » : la commande crée l'arborescence de données data/titles/{slug}/ (entrepôt + joueurs), ajoute la section dans db_profiles.json et imprime le bloc TitleDescriptor à coller. 2) Créer les manifests config/titles/{slug}/ : title.toml + mappings/{fields,assets,outcomes,capabilities}.toml (le brouillon capabilities.toml ci-dessus sert de point de départ). 3) Déclarer le titre dans internal/domain/title/registry.go, puis « make build ». Procédure détaillée : docs/RUNBOOK_ADD_TITLE.md."
en = "No write via the UI — preparing a title is a command-line workflow. 1) Run \"levelup add-title --name \\\"…\\\" [--slug s] [--capabilities c1,c2]\": the command creates the data tree data/titles/{slug}/ (warehouse + players), adds the section to db_profiles.json, and prints the TitleDescriptor block to paste. 2) Create the manifests under config/titles/{slug}/: title.toml + mappings/{fields,assets,outcomes,capabilities}.toml (the capabilities.toml draft above is a starting point). 3) Declare the title in internal/domain/title/registry.go, then \"make build\". Full procedure: docs/RUNBOOK_ADD_TITLE.md."

