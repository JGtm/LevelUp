# Coaching tips i18n manifest — conseils concrets Halo Infinite par axe.
#
# Format ICU MessageFormat (aligné sur les autres manifests). Regénérer via :
#   node apps/web/scripts/build_i18n_manifests.mjs
#
# Structure : 6 axes du radar narrative (cf. internal/analysis/narrative/participation.go)
#   - title             : libellé axe
#   - related_signals   : indicateurs qualitatifs (aide à l'interprétation,
#                         pas un mapping technique vers performance_score.go)
#   - ingame.N          : mécanique pure (compétences de base, scoring,
#                         comportement du jeu lui-même)
#   - tactical.N        : décisions à l'engagement (échelle seconde / duel /
#                         situation immédiate)
#   - strategic.N       : décisions macro (échelle match / carte / mode /
#                         équipe / score adverse)
#   - settings.N        : paramètres (sensi, FOV, audio, bindings) — pas de
#                         valeurs absolues inventées, direction du curseur
#   - routine.N         : méta (entraînement, revue, structure de session)
#
# Cible : intégration future dans le coach proactif V2
#   (cf. .ai/PLAN_PROGRESSION_TRACKING_ASCENSION.md §6).
#
# Sources de référence (au-delà de l'expertise interne) :
#   - thegamer.com, sirusgaming.com, gamerant.com, retbit.com
#     (guides beginner / settings vérifiés, fetché 2026-05-18)
#   - r/CompetitiveHalo et r/halo (URLs fournies mais Reddit bloqué par
#     WebFetch — contenu non récupéré directement)
#   - Chaîne YouTube @B1OChemist (non récupérée, consent redirect YouTube)
#
# Règles éditoriales :
#   - pas de termes anglais quand un équivalent français existe
#   - pas de valeurs chiffrées inventées (sensibilité, FOV, %, etc.)
#   - pas de suppositions sur des fonctionnalités du jeu non vérifiées
#   - mécaniques de jeu citées : vérifiées via sources ci-dessus

# ─── Combat ────────────────────────────────────────────────────────────────

[coaching_tips.combat.title]
fr = "Combat"
en = "Combat"

[coaching_tips.combat.related_signals]
fr = "Tirs propres, précision, finition de duels, médailles de tir"
en = "Clean shots, accuracy, duel finishing, marksman medals"

[coaching_tips.combat.ingame.1]
fr = "Apprends par cœur combien de tirs propres chaque arme demande pour casser le bouclier puis finir au corps ou à la tête : Fusil de combat, Commando, Bandit, Sidekick, Pistolet à plasma. Connaître ce nombre change tous tes duels — tu sais quand pousser, quand reculer, quand changer d'arme."
en = "Memorize how many clean shots each weapon needs to crack shields then finish, body or headshot: Battle Rifle, Commando, Bandit, Sidekick, Plasma Pistol. Knowing this number changes every duel — you know when to push, fall back, or switch weapons."

[coaching_tips.combat.ingame.2]
fr = "Les types de dégâts en Halo Infinite ont une logique simple : armes cinétiques UNSC (BR, Commando, Bandit) sont faibles contre le bouclier mais fortes contre la santé ; armes plasma (Pistolet à plasma surchargé, Carabine à impulsions) sont fortes contre le bouclier mais faibles contre la santé ; armes Forerunner / hard light (Heatwave, Pulse Carbine version sentinelle) font des dégâts égaux. Le combo Plasma Pistol surchargé puis Sidekick à la tête est imbattable."
en = "Damage types in Halo Infinite follow a simple logic: UNSC kinetic weapons (BR, Commando, Bandit) are weak vs shield but strong vs health; plasma weapons (overcharged Plasma Pistol, Pulse Carbine) are strong vs shield but weak vs health; Forerunner / hard-light weapons (Heatwave, Sentinel Pulse) deal equal damage. The overcharged Plasma Pistol + Sidekick headshot combo is unbeatable."

[coaching_tips.combat.ingame.3]
fr = "Tant que le bouclier ennemi n'est pas brisé, un tir à la tête fait exactement les mêmes dégâts qu'un tir au corps. Vise donc la masse centrale tant que le bouclier tient (plus facile à toucher), puis switch tête au moment de la rupture pour la finition instantanée. Ça économise des balles et accélère la mise à mort."
en = "As long as the enemy shield is intact, a headshot deals the exact same damage as a body shot. Aim center mass while shields hold (easier to hit), then switch to headshot the moment shields break for the instant finish. Saves bullets, speeds up the kill."

[coaching_tips.combat.tactical.1]
fr = "Pré-engage avec la bonne arme : Fusil de combat / Commando pour mi-distance, Sidekick / Bulldog au près, Aiguilleur ou combo Pistolet à plasma surchargé + Sidekick pour décharger un duel. Sortir la mauvaise arme coûte le duel avant le premier tir."
en = "Pre-engage with the right weapon: Battle Rifle / Commando at mid-range, Sidekick / Bulldog up close, Needler or overcharged Plasma Pistol + Sidekick combo to dump a duel. Pulling the wrong weapon loses the duel before the first shot."

[coaching_tips.combat.tactical.2]
fr = "Ne fonce pas tête baissée après un ennemi qui fuit blessé. Neuf fois sur dix il te ramène sur un coéquipier, un Sur-bouclier ou une arme spéciale. Recharge, repositionne-toi, ré-engage avec l'avantage."
en = "Don't blindly chase a fleeing wounded enemy. Nine times out of ten he's pulling you onto a teammate, an Overshield, or a power weapon. Reload, reposition, re-engage with the advantage."

[coaching_tips.combat.tactical.3]
fr = "Les grenades ne sont actives qu'après leur premier rebond au sol. Lance-les avant l'engagement (pour les placer en zone de retraite ennemie) ou après (pour finir une cible blessée qui se cache), jamais pendant — pendant le tir tu ne fais qu'utiliser ta main pour autre chose que viser."
en = "Grenades are only live after their first bounce on the ground. Throw them before the engagement (to land in the enemy's retreat zone) or after (to finish a wounded hidden target), never during — mid-fight you're just taking your hand off the aim."

[coaching_tips.combat.tactical.4]
fr = "Termine au tir à la tête quand l'arme le permet (Sidekick, Bandit, Fusil de combat sur l'avant-dernière rafale puis transition). Une fois le bouclier brisé, le headshot transforme un duel de 4 rafales en duel de 3."
en = "Finish with a headshot when the weapon allows it (Sidekick, Bandit, Battle Rifle on the second-to-last burst then transition). Once shields break, a headshot turns a 4-burst duel into a 3-burst duel."

[coaching_tips.combat.strategic.1]
fr = "Identifie le top fragger adverse dans les 2 premières minutes : sur quelle arme il joue, sur quel angle. Ton équipe doit alors le dénier en priorité — soit en lui niant son arme préférée, soit en pré-aimant son angle favori. Casser le 1er du match adverse vaut 3 kills sur les autres."
en = "Identify the enemy top fragger in the first 2 minutes: which weapon, which angle. Your team must then deny him first — either denying his preferred weapon or pre-aiming his favorite angle. Breaking the enemy #1 is worth 3 kills on others."

[coaching_tips.combat.strategic.2]
fr = "Adapte ton rythme au mode : Grosse Équipe (BTB) demande de la patience et du positionnement long, l'Arène 4v4 demande de la vitesse et du switch d'arme, le Classé demande de la discipline (pas de prise de risque inutile). Jouer du Slayer Arène comme du BTB perd tous les duels."
en = "Match your rhythm to the mode: BTB demands patience and long positioning, 4v4 Arena demands speed and weapon switching, Ranked demands discipline (no unnecessary risk-taking). Playing Arena like BTB loses every duel."

[coaching_tips.combat.settings.1]
fr = "Réduis la zone morte intérieure de la manette jusqu'à ce que le stick réponde au moindre mouvement sans drifter. Pas de valeur universelle, c'est par essais — l'objectif est de pouvoir corriger un tir d'un demi-pixel."
en = "Reduce your controller inner deadzone until the stick responds to the smallest move without drifting. No universal value, only trial — the goal is to nudge aim by half a pixel."

[coaching_tips.combat.settings.2]
fr = "Augmente le champ de vision tant que les cibles à distance restent lisibles. Plus tu vois, plus tu réagis vite à un flanquement ou à un coéquipier en danger. Trouve ta valeur de confort et n'en bouge plus."
en = "Increase the field of view as long as distant targets remain readable. The more you see, the faster you react to a flank or a teammate in trouble. Lock in your comfort value and stop tweaking."

[coaching_tips.combat.settings.3]
fr = "Désactive flou de mouvement, secousses d'écran et lignes de vitesse. Ces effets esthétiques masquent les ennemis pendant les explosions et peuvent être confondus avec des tirs reçus. Pousse l'épaisseur et l'opacité du contour de réticule au maximum — voir clairement sa mire vaut plus que l'immersion."
en = "Disable motion blur, screen shake, and speed lines. These cosmetic effects hide enemies during explosions and can be confused with incoming fire. Max out reticle outline thickness and opacity — clearly seeing your crosshair beats immersion."

[coaching_tips.combat.routine.1]
fr = "Avant chaque session, fais quelques minutes des drills d'armes de l'Académie, ou un Match personnalisé contre des bots difficulté Spartan avec une seule arme imposée. La playlist Bot Bootcamp n'existe plus, mais l'entraînement reste possible via ces deux modes — la mire se cale en quelques minutes et le premier match en multijoueur n'est plus un échauffement perdu."
en = "Before each session, do a few minutes of Academy weapon drills, or a Custom Game vs Spartan-difficulty bots with one forced weapon. The Bot Bootcamp playlist is gone, but both these modes still allow training — aim calibrates in minutes and the first multiplayer match stops being a wasted warm-up."

# ─── Survie ────────────────────────────────────────────────────────────────

[coaching_tips.survival.title]
fr = "Survie"
en = "Survival"

[coaching_tips.survival.related_signals]
fr = "Morts évitées, écart morts attendues / morts réelles, dégâts encaissés par mort"
en = "Deaths avoided, expected-vs-actual deaths, damage taken per death"

[coaching_tips.survival.ingame.1]
fr = "Le radar est ta ressource d'information principale, surtout sur petites cartes. Regarde-le plusieurs fois par seconde, pas seulement quand tu es au calme. Un point rouge à 5m que tu n'as pas vu = ta prochaine mort."
en = "The radar is your main info resource, especially on small maps. Glance at it several times per second, not only when you're safe. A red dot at 5m you missed = your next death."

[coaching_tips.survival.tactical.1]
fr = "Bouclier brisé = casse la ligne de vue avant le tir suivant. Saut latéral, recoin, escalade — peu importe, mais jamais recharger à découvert. Le Sidekick fait moins de dégâts qu'un Spartan qui te voit recharger."
en = "Shields broken = break line of sight before the next shot. Lateral jump, corner, clamber — anything, but never reload in the open. A Sidekick does less damage than a Spartan watching you reload."

[coaching_tips.survival.tactical.2]
fr = "Sprinter te met sur le radar adverse. Approche les angles de duel à pied en pré-aimant le coin — tu arrives en surprise, mire déjà calée. Réserve le sprint aux rotations longues et aux zones sûres."
en = "Sprinting puts you on the enemy radar. Approach duel corners walking and pre-aiming the angle — you arrive in stealth, crosshair already placed. Save sprint for long rotations and safe zones."

[coaching_tips.survival.tactical.3]
fr = "Identifie les menaces à un coup : Embrochoir (un tir au corps tue), Fusil de précision (tête), Disrupteur à choc (tête), Marteau gravitationnel et Épée à énergie (mêlée), Bobines de fusion explosives. Dès que tu en entends une ou en vois une, casse la ligne de vue immédiatement et préviens ton équipe."
en = "Identify one-shot threats: Skewer (one body shot kills), Sniper (headshot), Shock Rifle (headshot), Gravity Hammer and Energy Sword (melee), exploding Fusion Coils. The moment you hear or see one, break line of sight immediately and callout to your team."

[coaching_tips.survival.tactical.4]
fr = "Utilise l'équipement défensif systématiquement : Répulseur sur un projectile (roquette, embrochoir, grenade en l'air), Mur déployable pour casser une ligne de vue — mais attention, on peut détruire un Mur en tirant sur sa base. Grappin pour décoller d'un duel perdu. Un équipement gardé en réserve qui meurt avec toi est gaspillé."
en = "Use defensive equipment systematically: Repulsor on a projectile (rocket, skewer, mid-air grenade), Drop Wall to break line of sight — but careful, a Drop Wall can be destroyed by shooting its base. Grappleshot to disengage from a losing duel. Equipment hoarded and dying with you is wasted."

[coaching_tips.survival.tactical.5]
fr = "Après une mort, ne re-pousse pas ton tueur. Prends quelques secondes posé, regarde la carte radar, choisis un autre vecteur d'engagement. Le revenge push est la première cause de séries de morts."
en = "After a death, don't re-push your killer. Sit still a few seconds, check the radar, pick a new engagement vector. Revenge pushing is the #1 cause of death streaks."

[coaching_tips.survival.strategic.1]
fr = "Si tu portes une arme spéciale (Lance-roquettes, Fusil de précision, Embrochoir), ta priorité absolue change : ne plus chercher le kill, mais survivre pour la garder. La mort donne l'arme à l'adversaire et inverse la dynamique du match."
en = "If you're carrying a power weapon (Rocket Launcher, Sniper, Skewer), your top priority flips: no more seeking kills, just survive to keep it. Dying hands the weapon to the enemy and flips the match dynamic."

[coaching_tips.survival.strategic.2]
fr = "Quand deux coéquipiers tombent au même endroit en peu de temps, change de couloir. Ne sois pas la troisième croix : soit contourne, soit recule sur un point de respawn d'arme spéciale ou de bonus. Lire le pattern de morts est une compétence stratégique."
en = "When two teammates fall in the same spot within seconds, change lanes. Don't be the third X: flank, or fall back to a power-weapon spawn or power-up. Reading the death pattern is a strategic skill."

[coaching_tips.survival.settings.1]
fr = "Audio en casque, effets prioritaires sur la musique : entendre les pas, les rechargements, les déclenchements de Sur-bouclier ou de grappin change la lecture de chaque combat."
en = "Audio on headphones, effects priority over music: hearing footsteps, reloads, Overshield triggers, grapple sounds changes how you read every fight."

[coaching_tips.survival.settings.2]
fr = "Bascule le mode audio sur « Compressé » : ça remonte le volume des sons faibles (pas, recharges discrètes). Réduis les effets d'environnement pour distinguer les sons de joueurs du décor."
en = "Switch audio mode to « Compressed »: it raises the volume of quiet sounds (footsteps, soft reloads). Reduce environmental effects to distinguish player sounds from ambient noise."

[coaching_tips.survival.routine.1]
fr = "Sur une partie sur deux, force-toi à ne jamais re-pousser ton tueur direct. Au bout de quelques sessions, regarde ton nombre de morts par match sur la page Synthese : la baisse est mesurable."
en = "On every other match, force yourself never to re-push your direct killer. After a few sessions, check your deaths per match on the Synthesis page: the drop is measurable."

# ─── Support ───────────────────────────────────────────────────────────────

[coaching_tips.support.title]
fr = "Support"
en = "Support"

[coaching_tips.support.related_signals]
fr = "Assistances, dégâts qui mènent à un kill allié, présence en croisement de tir"
en = "Assists, damage leading to teammate kills, crossfire presence"

[coaching_tips.support.tactical.1]
fr = "Si un coéquipier tombe en duel dans ton champ de vision et que tu peux placer un tir, fais-le même si tu pensais aller ailleurs. Un seul tir transforme son 1c1 en 2c1 — c'est la définition de l'avantage de tir croisé Halo."
en = "If a teammate is dueling in your line of sight and you can land one shot, take it even if you were going elsewhere. One shot turns his 1v1 into a 2v1 — that's the textbook Halo crossfire advantage."

[coaching_tips.support.tactical.2]
fr = "Reste à portée de vue d'un coéquipier autant que possible. Un Spartan isolé meurt presque toujours en duel, un duo en croisement de tir gagne presque toujours — la géométrie du combat fait plus que la mire."
en = "Stay within sight of a teammate as much as possible. A lone Spartan almost always loses a duel, a crossfire duo almost always wins — combat geometry beats aim."

[coaching_tips.support.tactical.3]
fr = "Halo Infinite a deux commandes d'information distinctes — c'est le premier titre de la série à les proposer. Le marquage / ping pour pointer un ennemi, une arme ou un point de pression à ton équipe. Le scan IA pour révéler temporairement les armes, équipements et alliés autour de toi. Spam le ping, utilise le scan quand tu cherches l'arme spéciale ou un équipement."
en = "Halo Infinite has two distinct info commands — the first title in the series to ship them. Marker / ping to point out an enemy, weapon, or pressure point to your team. AI scan to temporarily reveal weapons, equipment, and teammates around you. Spam the ping, use the scan when hunting power weapons or equipment."

[coaching_tips.support.tactical.4]
fr = "Au-dessus de chaque support d'arme spéciale, une jauge bleue indique le temps avant respawn. Communique systématiquement le timer à ton équipe (« Sniper dans 15 »). C'est l'info la plus actionnable du match — elle déclenche les rotations gagnantes."
en = "Above every power-weapon rack, a blue bar shows time to respawn. Always callout the timer to your team (« Sniper in 15 »). It's the most actionable info of the match — it triggers winning rotations."

[coaching_tips.support.strategic.1]
fr = "Apprends à utiliser le Capteur de menace : posé sur un point de pression (couloir vers une zone Strongholds, salle d'arme spéciale, drapeau adverse), il donne à toute ton équipe une lecture parfaite des positions ennemies pendant plusieurs secondes — c'est un marquage automatique de zone."
en = "Learn to use the Threat Sensor: dropped on a pressure point (lane to a Strongholds zone, power-weapon room, enemy flag), it gives your whole team perfect enemy position read for several seconds — automatic area marking."

[coaching_tips.support.strategic.2]
fr = "En escouade, distribuez les rôles dès le début du match : un joueur prend systématiquement le Fusil de précision, un autre tient la zone, un troisième floate sur les armes spéciales et bonus. Quatre Spartans qui font tous la même chose se gênent ; quatre Spartans en rôles complémentaires contrôlent la carte."
en = "In a stack, distribute roles early: one player always takes the Sniper, one holds the zone, a third floats on power weapons and power-ups. Four Spartans doing the same thing get in each other's way; four Spartans in complementary roles control the map."

[coaching_tips.support.settings.1]
fr = "Place la commande de marquage et celle de scan sur des boutons accessibles sans lever le pouce du stick de visée. Si elles sont sur une combinaison difficile, tu ne les utiliseras pas en duel — exactement le moment où l'info compte le plus pour ton équipe."
en = "Bind both mark and scan commands to buttons reachable without lifting your aim-stick thumb. If they're on awkward combos, you won't use them in a duel — exactly when team info matters most."

[coaching_tips.support.routine.1]
fr = "Joue une partie sur trois en escouade vocale, même avec des inconnus. L'oreille s'éduque aux callouts (« Sniper en haut », « Roquette dans 10 », « je contourne par S2 »), et ces réflexes restent quand tu reviens jouer seul."
en = "Play 1 in 3 matches in voice party, even with strangers. Your ear learns callouts (« Sniper top », « Rocket in 10 », « I flank from S2 »), and those reflexes carry over to solo play."

# ─── Score ─────────────────────────────────────────────────────────────────

[coaching_tips.score.title]
fr = "Score"
en = "Score"

[coaching_tips.score.related_signals]
fr = "Score personnel par minute, exploit médailles, dégâts par minute"
en = "Personal score per minute, medal exploit, damage per minute"

[coaching_tips.score.ingame.1]
fr = "Halo récompense la variété, pas le volume. Un match avec multi-kills, tueries enchaînées, tirs à la tête et finitions à l'arme spéciale donne plus de score qu'un match avec deux fois plus de kills mais tous au Fusil d'assaut au corps."
en = "Halo rewards variety, not volume. A match with multi-kills, killing sprees, headshots, and power-weapon finishes scores more than a match with twice as many kills but all Assault Rifle body shots."

[coaching_tips.score.strategic.1]
fr = "Quand une arme spéciale apparaît (Lance-roquettes, Fusil de précision, Embrochoir, Épée à énergie, Marteau gravitationnel, Cindershot, Ravager utilisable en déni de zone), va la chercher ou fais en sorte qu'elle ne tombe pas dans les mains adverses. Chaque kill à l'arme spéciale vaut bien plus en médailles — et chaque déni protège ton score collectif."
en = "When a power weapon spawns (Rocket Launcher, Sniper, Skewer, Energy Sword, Gravity Hammer, Cindershot, Ravager for area denial), go get it or make sure it doesn't fall in enemy hands. Each power-weapon kill is worth far more in medals — and each denial protects your collective score."

[coaching_tips.score.strategic.2]
fr = "En mode objectif (Strongholds, CTF, Oddball), le score personnel inclut les actions d'objectif (capture, escorte, hold). Si tu joues mentalement le mode comme du Slayer, tu laisses la moitié de ton score sur la table — c'est mathématique."
en = "In objective modes (Strongholds, CTF, Oddball), personal score includes objective actions (capture, escort, hold). If you mentally play the mode like Slayer, you leave half your score on the table — pure math."

[coaching_tips.score.routine.1]
fr = "Après chaque session, regarde ton score personnel par minute sur la page Synthese. Si tu joues un mode objectif et que ce chiffre stagne, c'est que ton mindset est encore Slayer — corrige avant la session suivante."
en = "After each session, check your personal score per minute on the Synthesis page. If you're playing an objective mode and this number is flat, your mindset is still Slayer — fix it before next session."

# ─── Objectif ──────────────────────────────────────────────────────────────

[coaching_tips.objective.title]
fr = "Objectif"
en = "Objective"

[coaching_tips.objective.related_signals]
fr = "Captures, temps de hold, escortes, score lié à l'objectif"
en = "Captures, hold time, escorts, objective-linked score"

[coaching_tips.objective.strategic.1]
fr = "Strongholds : la première capture dicte tout le rythme du match. Cours sur la zone neutre dès le départ plutôt que de chercher un kill, même si tu te fais shoot — la zone prise vaut plus que la mort évitée."
en = "Strongholds: the first capture dictates the whole match rhythm. Run to the neutral zone from spawn rather than seeking a kill, even if you get shot — a captured zone is worth more than an avoided death."

[coaching_tips.objective.strategic.2]
fr = "CTF / Capture du drapeau : tu n'es pas obligé d'être le porteur. Escorter, ouvrir un couloir, tuer les chasseurs vaut autant qu'un carry. Un porteur sans escorte meurt à mi-chemin, deux escortes sans porteur ne marquent jamais."
en = "CTF / Capture the Flag: you don't have to be the carrier. Escorting, clearing a lane, killing chasers is worth as much as a carry. A carrier without escort dies halfway, two escorts without a carrier never score."

[coaching_tips.objective.strategic.3]
fr = "Oddball : porte le crâne par séquences courtes puis passe-le à un coéquipier en meilleure position. Un solo carry qui meurt brise la chaîne et offre le crâne à l'adversaire ; deux porteurs alternés tiennent indéfiniment. Reste en position élevée avec tes coéquipiers pour contrôler les respawns."
en = "Oddball: carry the skull in short bursts then pass to a better-positioned teammate. A solo carry that dies breaks the chain and hands the skull over; two alternating carriers hold indefinitely. Stay elevated with your teammates to control spawns."

[coaching_tips.objective.strategic.4]
fr = "Astuce Oddball : si tu es entouré sans issue, saute volontairement de la carte pour suicide. Le crâne se réinitialise au point neutre au lieu d'être ramassé par l'adversaire en pleine pression. C'est une concession de tempo qui sauve un round."
en = "Oddball trick: if you're surrounded with no escape, deliberately jump off the map to suicide. The skull resets to the neutral spawn instead of being picked up by the pressing enemy. It's a tempo concession that saves a round."

[coaching_tips.objective.strategic.5]
fr = "Gestion du snowball : si tu mènes largement, joue passif et contrôle les bonus (Sur-bouclier, Camouflage actif, armes spéciales) pour empêcher l'adversaire de remonter ; si tu es mené, force le stack sur un kill décisif ou sur un push d'objectif coordonné. Le rythme doit changer avec le score."
en = "Snowball management: if you're leading by a lot, play passive and control power-ups (Overshield, Active Camo, power weapons) to prevent comebacks; if you're trailing, force a stack on a decisive kill or a coordinated objective push. Rhythm must change with the score."

[coaching_tips.objective.strategic.6]
fr = "Apprends les timings et les couloirs spécifiques à chaque mode sur chaque carte : où respawne le drapeau, quelle zone Strongholds est la plus contestable, où se cache le porteur d'Oddball en fin de manche. Le mode objectif est un jeu de positionnement avant d'être un jeu de tir."
en = "Learn mode-specific timings and lanes on each map: where the flag respawns, which Strongholds zone is most contested, where the Oddball carrier hides late game. Objective modes are positional games before they're shooters."

[coaching_tips.objective.routine.1]
fr = "Si tu joues souvent les modes objectif sans jamais finir dans le haut du tableau « Score Objectif » de ton équipe, ton instinct te pousse vers le Slayer. Force-toi consciemment à toucher l'objectif au moins une fois par minute de jeu."
en = "If you often play objective modes but never finish high on your team's « Objective Score » board, your instinct pulls you toward Slayer. Consciously force yourself to touch the objective at least once per minute."

# ─── Impact ────────────────────────────────────────────────────────────────

[coaching_tips.impact.title]
fr = "Impact"
en = "Impact"

[coaching_tips.impact.related_signals]
fr = "Ratio K/D/A, kills face à des adversaires plus forts, moments décisifs"
en = "K/D/A ratio, kills vs stronger opponents, decisive moments"

[coaching_tips.impact.tactical.1]
fr = "En fin de manche ou dernière vie alliée, passe en mode patient. Le clutch ne se gagne pas en agressivité mais en lecture du bruit, en patience et en positionnement défensif. Laisse l'adversaire venir te chercher — il commet l'erreur avant toi."
en = "Late round or last teammate alive, switch to patient mode. Clutches aren't won through aggression but through sound reading, patience, and defensive positioning. Let the enemy come find you — he'll make the mistake first."

[coaching_tips.impact.tactical.2]
fr = "Quand un coéquipier meurt à côté de toi, ne fuis pas systématiquement — si l'adversaire a son bouclier entamé et que tu peux trader le kill, fais-le. Un trade (1 pour 1) est neutre, mais il casse le combo killing spree adverse et ramène le combat à zéro."
en = "When a teammate dies next to you, don't always flee — if the enemy's shield is cracked and you can trade the kill, take it. A trade (1 for 1) is neutral, but it breaks the enemy killing-spree combo and resets the fight."

[coaching_tips.impact.strategic.1]
fr = "Les armes spéciales et les bonus de carte (Sur-bouclier, Camouflage actif) gagnent les matchs. Apprends leur horaire d'apparition sur chaque carte (visible sur la jauge bleue au-dessus des supports d'armes) : soit tu les prends, soit tu empêches l'adversaire de les prendre — le déni vaut autant qu'un kill."
en = "Power weapons and map power-ups (Overshield, Active Camo) win matches. Learn their spawn timing on each map (visible on the blue bar above weapon racks): either you grab them, or you deny the enemy — denial is worth as much as a kill."

[coaching_tips.impact.strategic.2]
fr = "Un Spartan avec Sur-bouclier ou Camouflage actif vaut deux Spartans normaux. Quand le bonus est sur le point d'apparaître, ton équipe doit en faire une priorité absolue — quitte à perdre une zone Strongholds dix secondes pour s'assurer qu'il ne va pas en face."
en = "A Spartan with Overshield or Active Camo is worth two normal Spartans. When a power-up is about to spawn, your team must make it top priority — even if it means giving up a Strongholds zone for ten seconds to make sure it doesn't go to the enemy."

[coaching_tips.impact.strategic.3]
fr = "Prends le temps de connaître la carte : noms des lieux utilisés par la communauté, raccourcis (escalade, glissade, sauts latéraux qui économisent quelques secondes), angles où tu vois sans être vu, positions de respawn d'arme spéciale. La connaissance de la carte vaut plus que la mire en haut niveau."
en = "Take the time to learn the map: community callouts, shortcuts (clamber, slide, side jumps that save seconds), angles where you see without being seen, power-weapon spawn positions. Map knowledge beats aim at high level."

[coaching_tips.impact.strategic.4]
fr = "Vois chaque match comme une succession de moments-clés (apparition d'arme spéciale, point de bascule de score, dernier round). Ces moments comptent plus que la moyenne du match. Reconnaître qu'on est dans un moment-clé permet d'élever son niveau d'attention juste quand il faut."
en = "See each match as a series of key moments (power-weapon spawn, score swing, final round). These moments matter more than the match average. Recognizing you're in a key moment lets you raise your focus exactly when it counts."

[coaching_tips.impact.strategic.5]
fr = "BTB uniquement : le Grappin peut t'envoyer dans un véhicule ennemi et éjecter le pilote. Garde ce vol de véhicule en tête quand un Mongoose, un Warthog ou un Wasp passe à portée — c'est un retournement instantané de tempo et de score d'équipe."
en = "BTB only: the Grappleshot can launch you into an enemy vehicle and eject the pilot. Keep this vehicle hijack in mind when a Mongoose, Warthog, or Wasp passes within range — it's an instant tempo and team-score reversal."

[coaching_tips.impact.settings.1]
fr = "Si tu rates régulièrement les tirs décisifs en clutch, essaie de désactiver la vibration manette. Le bruit kinesthésique perturbe la micro-précision quand les mains sont déjà tendues."
en = "If you regularly miss clutch shots, try turning off controller vibration. Kinesthetic noise disturbs micro-precision when your hands are already tense."

[coaching_tips.impact.routine.1]
fr = "Une fois par semaine, revois une de tes meilleures séquences sur la page Match. Identifie un seul détail répétable (un positionnement, un choix d'arme, un timing de grappin) et essaie de le reproduire la session suivante. La progression vient de la répétition consciente."
en = "Once a week, review one of your best sequences on the Match page. Identify a single repeatable detail (positioning, weapon choice, grapple timing) and try to reproduce it next session. Progress comes from conscious repetition."
