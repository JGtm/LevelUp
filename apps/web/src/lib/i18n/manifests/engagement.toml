# ─── Glossaire applicatif ───────────────────────────────────────────────────

[engagement.glossary.title]
fr = "Engagement"
en = "Engagement"

[engagement.glossary.definition]
fr = "Mesure votre dynamisme dans un match : ecart entre votre engagement observe et votre engagement attendu (vu votre style historique et le contexte equipe), normalise en percentile vs votre propre historique. 50 = comme d'habitude. >50 = plus engage. <50 = moins engage."
en = "Measures your dynamism in a match: gap between your observed engagement and your expected engagement (based on your historical style and team context), normalized as a percentile vs your own history. 50 = as usual. >50 = more engaged. <50 = less engaged."

[engagement.glossary.skill_vs_engagement]
fr = "Distinct du Performance Score : le PerfScore mesure la qualite de vos actions, l'Engagement mesure leur quantite, leur regularite et votre etat d'esprit. Les deux axes sont independants."
en = "Distinct from the Performance Score: PerfScore measures the quality of your actions, Engagement measures their quantity, regularity and your state of mind. The two axes are independent."

[engagement.glossary.coef_explanation]
fr = "L'attendu est ancre sur le lobby : ce que vous faites D'HABITUDE dans un match d'intensite similaire (calme / standard / chaotique). La courbe « Joueur attendu » basse vs l'equipe reelle traduit un trait structurel ; l'ecart reel - attendu traduit votre forme du jour."
en = "Expected engagement is lobby-anchored: what you USUALLY do in a match of similar intensity (calm / standard / chaotic). A low « Player (expected) » curve vs the actual team reflects a structural trait; the actual - expected gap reflects your form on the day."

