# Manifest i18n PARTAGÉ « Répartition des frags » v2 (sunburst classe→rôle +
# breakdown par arme). Réutilisé par 4 surfaces : Synthesis, Match view,
# Timeseries, Sessions. Cf. .ai/V7/PLAN_FRAG_DISTRIBUTION_V2.md P1.6.
# Chaque clé DOIT porter fr ET en (contrôlé par build_i18n_manifests.mjs).

# ── Titres de cartes ──────────────────────────────────────────────────────────
[frags.charts.sunburst_title]
fr = "Répartition des frags"
en = "Frag distribution"

[frags.charts.weapon_breakdown_title]
fr = "Frags par arme"
en = "Kills by weapon"

# Titre du bloc « Outils de destruction » (armes du registre + détail mêlée/grenade/
# capacités via buildFragDetailBreakdown). Clé PARTAGÉE par 4 surfaces : Match view +
# Synthesis + Sessions + Timeseries (onglet Résumé). Les autres surfaces gardent
# weapon_breakdown_title (« Frags par arme »).
[frags.charts.detail_title]
fr = "Outils de destruction"
en = "Tools of destruction"

[frags.charts.center_total_label]
fr = "Frags"
en = "Kills"

[frags.empty.no_data]
fr = "Aucun frag sur ce périmètre"
en = "No kills in this scope"

# ── Badge d'autorité de la donnée ─────────────────────────────────────────────
[frags.authority.exact]
fr = "exact"
en = "exact"

[frags.authority.estimated]
fr = "estimé"
en = "estimated"

# ── Fragments de tooltip (pourcentages) ───────────────────────────────────────
[frags.tooltip.share_total]
fr = "{pct} % du total"
en = "{pct}% of total"

[frags.tooltip.share_class]
fr = "{pct} % de {className}"
en = "{pct}% of {className}"

# ── Classes (niveau 1 du sunburst — axe manipulation) ─────────────────────────
[frags.class.shoulder]
fr = "Arme d'épaule"
en = "Shoulder"

[frags.class.sidearm]
fr = "Arme de poing"
en = "Sidearm"

[frags.class.heavy]
fr = "Lourde"
en = "Heavy"

[frags.class.melee]
fr = "Mêlée"
en = "Melee"

[frags.class.grenade]
fr = "Grenade"
en = "Grenade"

[frags.class.spartan_ability]
fr = "Capacités spartanes"
en = "Spartan abilities"

# Classes d'ENGIN (V73-3.2) : seul le nom de la CLASSE est traduit ici (il est
# title-agnostic). Les libellés du niveau 2 nomment CHAQUE engin (Warthog, Ghost,
# Tourelle Gauss…) et viennent du TOML du titre —
# config/titles/{slug}/mappings/weapon_names.toml, servi par l'API dans
# FragRoleEntry.label. Les recopier ici dupliquerait ce TOML et ferait enfler ce
# manifeste partagé à chaque titre ajouté.
[frags.class.vehicle]
fr = "Véhicule"
en = "Vehicle"

[frags.class.turret]
fr = "Tourelle"
en = "Turret"

# Equipement et environnement (lot « kills hors arme a feu », 2026-08-29) : servis par la
# SOURCE DE DEGAT du film, pas par le registre d armes. Leur niveau 2 est un OBJET
# (« Bobine a plasma », « Repulseur ») dont le libelle vient du TOML du titre, comme les
# engins ci-dessus — rien a recopier ici.
[frags.class.equipment]
fr = "Équipement"
en = "Equipment"

[frags.class.environmental]
fr = "Environnement"
en = "Environment"

[frags.class.unattributed]
fr = "Non attribué"
en = "Unattributed"

