# Manifest i18n PARTAGÉ « Répartition des frags » v2 (sunburst classe→rôle +
# breakdown par arme). Réutilisé par 4 surfaces : Synthesis, Match view,
# Timeseries, Sessions. Cf. .ai/V7/PLAN_FRAG_DISTRIBUTION_V2.md P1.6.
# Chaque clé DOIT porter fr ET en (contrôlé par build_i18n_manifests.mjs).

# ── Titres de cartes ──────────────────────────────────────────────────────────
[frags.charts.sunburst_title]
fr = "Répartition des frags"
en = "Frag distribution"

[frags.charts.weapon_breakdown_title]
fr = "Frags par arme"
en = "Kills by weapon"

# Titre du bloc « Détails des frags » — UNIQUEMENT le Match view (armes + mêlée/grenade/
# capacités). Les autres surfaces gardent weapon_breakdown_title (« Frags par arme »).
[frags.charts.detail_title]
fr = "Détails des frags"
en = "Frag details"

[frags.charts.center_total_label]
fr = "Frags"
en = "Kills"

[frags.empty.no_data]
fr = "Aucun frag sur ce périmètre"
en = "No kills in this scope"

