en = "You'll be redirected to GitHub to finalize the submission. An automated analysis will enrich the issue."

[feedback_drawer.rate_limit]
fr = "Merci, tu as déjà envoyé 5 retours dans la dernière heure."
en = "Thanks, you already sent 5 feedbacks in the last hour."

[feedback_drawer.popup_blocked]
fr = "Lien copié dans le presse-papier — collez-le dans un onglet pour ouvrir GitHub."
en = "Link copied to clipboard — paste it in a tab to open GitHub."

[feedback_drawer.classification.preview]
fr = "Type {type} · Sévérité {severity} · Zone {area}"
en = "Type {type} · Severity {severity} · Area {area}"
