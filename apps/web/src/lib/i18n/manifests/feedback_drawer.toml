# Feedback Drawer i18n manifest — strings du panneau de retour utilisateur.
# Format : ICU MessageFormat (cf. PLAN_META_FOUNDATIONS_GO § 3.4).
#
# Pour ajouter une clé :
#   1. Définir [feedback_drawer.section.subkey] avec fr et en
#   2. Lancer `node apps/web/scripts/build_i18n_manifests.mjs` pour
#      régénérer le module TS dans lib/i18n/generated/

[feedback_drawer.mini_tab.aria_open]
fr = "Envoyer un retour"
en = "Send feedback"

[feedback_drawer.mini_tab.aria_close]
fr = "Fermer le panneau de retour"
en = "Close feedback panel"

[feedback_drawer.title]
fr = "Envoyer un retour"
en = "Send feedback"

[feedback_drawer.type.aria]
fr = "Type de retour"
en = "Feedback type"

[feedback_drawer.type.bug]
fr = "Bug"
en = "Bug"

[feedback_drawer.type.idea]
fr = "Idée"
en = "Idea"

[feedback_drawer.type.question]
fr = "Question"
en = "Question"

[feedback_drawer.field.title]
fr = "Titre"
en = "Title"

[feedback_drawer.field.title_placeholder]
fr = "Résume ton retour en quelques mots"
en = "Sum up your feedback in a few words"

[feedback_drawer.field.description]
fr = "Description"
en = "Description"

[feedback_drawer.field.description_placeholder]
fr = "Ce qui s'est passé, ce que tu attendais, étapes pour reproduire…"
en = "What happened, what you expected, steps to reproduce…"

[feedback_drawer.similar.label]
