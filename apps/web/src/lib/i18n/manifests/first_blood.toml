# Manifest i18n PARTAGÉ du chart « Premier frag / première mort » (FirstBloodLanes).
# Composant transverse (components/charts/FirstBloodLanes.tsx) destiné aux surfaces
# Escouade / Timeseries / Sessions — même vocabulaire partout, une seule source.
# Chaque clé DOIT porter fr ET en (contrôlé par build_i18n_manifests.mjs).

# ── Titre / état vide ─────────────────────────────────────────────────────────
[first_blood.title]
fr = "Premier frag / première mort"
en = "First kill / first death"

[first_blood.empty]
fr = "Aucun premier frag ni première mort sur ce périmètre"
en = "No first kill or first death in this scope"

# ── Colonne de libellés (à gauche du tracé) ───────────────────────────────────
# Ligne 2 : « méd. 50s → 1m04 » (préfixe + les deux temps colorés).
[first_blood.label.median_prefix]
fr = "méd."
en = "med."

# Ligne 3 : « +14s d'avance » / « −22s d'avance ». {gap} est déjà signé et formaté.
[first_blood.label.advance]
fr = "{gap} d'avance"
en = "{gap} ahead"

# ── Tooltips ──────────────────────────────────────────────────────────────────
# {map}/{mode}/{date} (DEC-4, retours utilisateur 2026-08-29) : le tooltip d'un
# point de nuage doit dire carte · mode · date, plus jamais l'uuid du match
# (ancien placeholder {match}, supprimé). Dégradation propre côté composant si
# carte/mode manquent (placeholder — jamais une clé brute ni l'uuid).
[first_blood.tooltip.first_kill]
fr = "{player} · {map} · {mode} · {date} · premier frag {time}"
en = "{player} · {map} · {mode} · {date} · first kill {time}"

[first_blood.tooltip.first_death]
fr = "{player} · {map} · {mode} · {date} · première mort {time}"
en = "{player} · {map} · {mode} · {date} · first death {time}"

[first_blood.tooltip.median_kill]
fr = "médiane premier frag {time} ({n}/{total, plural, one {# match} other {# matchs}})"
en = "median first kill {time} ({n}/{total, plural, one {# match} other {# matches}})"

[first_blood.tooltip.median_death]
fr = "médiane première mort {time} ({n}/{total, plural, one {# match} other {# matchs}})"
en = "median first death {time} ({n}/{total, plural, one {# match} other {# matches}})"

[first_blood.tooltip.gap]
fr = "fenêtre d'avance médiane : {gap}"
en = "median advance window: {gap}"
