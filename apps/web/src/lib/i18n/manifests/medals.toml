# Medals i18n manifest — strings de la page Médailles (sous-page Carrière).
#
# Format ICU MessageFormat. Regenerer via :
#   node apps/web/scripts/build_i18n_manifests.mjs
#
# Les cles de categorie / super-section / rarete sont les CLES STABLES emises par
# le backend (POST /pages/medals). Le rendu est title-agnostic : une cle inconnue
# (medal_type d'un futur titre) retombe sur la cle brute cote front (labels.ts).
# Terminologie FR canonique reutilisee de l'app (asset_labels_fr) pour les modes
# Halo : « Capture du drapeau », « Corps a corps », « Tireur d'elite », « Reserve ».

[medals.header.title]
fr = "Médailles — {earned}/{total} obtenues"
en = "Medals — {earned}/{total} earned"

# ─── Barre de filtre (obtenues / non-obtenues / toutes) ──────────────────────

[medals.filter.label]
fr = "Affichage"
en = "Display"

[medals.filter.all]
fr = "Toutes"
en = "All"

[medals.filter.obtained]
fr = "Obtenues"
en = "Earned"

[medals.filter.not_obtained]
fr = "Non obtenues"
en = "Not earned"

# ─── Tri ─────────────────────────────────────────────────────────────────────

[medals.sort.label]
fr = "Trier par"
en = "Sort by"

[medals.sort.category_total]
fr = "Total par catégorie"
en = "Category total"

[medals.sort.medal_count]
fr = "Nombre par médaille"
en = "Medal count"

[medals.sort.medal_name]
fr = "Nom de médaille"
en = "Medal name"

# ─── En-tête de catégorie ────────────────────────────────────────────────────

[medals.category.mastery]
fr = "{earned}/{total} obtenues"
en = "{earned}/{total} earned"

[medals.category.total_awarded]
fr = "{count} au total"
en = "{count} total"

# ─── Carte médaille ──────────────────────────────────────────────────────────

[medals.card.never_earned_aria]
fr = "Jamais obtenue"
en = "Never earned"

[medals.card.earned_aria]
fr = "Obtenue {count, plural, one {# fois} other {# fois}}"
en = "Earned {count, plural, one {# time} other {# times}}"

# ─── États transverses ───────────────────────────────────────────────────────

[medals.errors.load_failed]
fr = "Erreur lors du chargement des médailles"
en = "Failed to load medals"

[medals.errors.retry]
fr = "Réessayer"
en = "Retry"

[medals.empty.no_data]
fr = "Médailles indisponibles"
en = "Medals unavailable"

[medals.empty.no_data_description]
fr = "Aucune réponse exploitable n'a été renvoyée pour cette page."
en = "No exploitable response returned for this page."

[medals.empty.no_items]
fr = "Aucune médaille à afficher"
en = "No medal to display"

[medals.empty.no_items_description]
fr = "Aucune médaille ne correspond au filtre sélectionné."
en = "No medal matches the selected filter."

