# État vide de la carte : toutes les armes sous le seuil de publication. La section reste
# affichée (tuiles, armes nommées, note de couverture) — c'est le GRAPHE qui n'a rien à
# tracer, et il le DIT. Un graphe vide sans explication se lirait « bug ».
[synthesis.weapon_range.empty_below_threshold]
fr = "Aucune arme n'atteint le seuil de {min, number} mesures sur cette période : les portées mesurées restent trop rares pour être publiées arme par arme."
en = "No weapon reaches the {min, number} measurement threshold over this period: measured ranges are still too rare to publish weapon by weapon."

# État vide NOMMÉ de la carte « Hauteur d'engagement ». Le nuage (D25) ne dépend d'AUCUN seuil de
# publication — la dimension arme ne compte pas (D23-b) — donc la seule cause d'une carte
# vide est l'absence de frag mesuré sur la fenêtre : un film non décodé, jamais un seuil.
# L'ancienne phrase (« aucune arme n'atteint le seuil de N mesures ») décrivait les barres
# empilées par arme, qui n'existent plus.
[synthesis.weapon_range.elevation_empty]
fr = "Aucun engagement mesuré sur cette période : les positions des frags ne sont pas encore décodées pour ces matchs."
en = "No measured engagement over this period: kill positions are not decoded yet for these matches."

