# ─── Portée des engagements (lot 5, plan .ai/PLAN_DUELS_PORTEE_2026-09-06.md) ─
#
# Une portée d'USAGE et jamais une portée d'arme (décision D8) : aucune clé ne dit
# « portée de l'arme ». Vocabulaire FR sans anglicismes — « frags », « morts »,
# « hauteur d'engagement », « en surplomb / à niveau / en contrebas », « distance
# d'entame ». « Dénivelé » est PROSCRIT des chaînes FR depuis la décision D26 (2026-09-22) —
# garde-rail `vocabulaireHauteur.guard.test.ts`.

[synthesis.weapon_range.heading]
fr = "Portée des engagements"
en = "Engagement range"

[synthesis.weapon_range.card_title]
fr = "Portée par arme"
en = "Range by weapon"

[synthesis.weapon_range.range_subtitle_detail]
fr = "Le bâton court du 10e au 90e centile ; le losange marque la médiane. Frags au-dessus, morts en dessous — sur les morts, l'arme est celle du tueur."
en = "The bar runs from the 10th to the 90th percentile; the diamond marks the median. Kills on top, deaths below — on deaths, the weapon is the killer's."

[synthesis.weapon_range.elevation_subtitle]
fr = "Hauteur d'engagement"
en = "Engagement height"

[synthesis.weapon_range.elevation_subtitle_detail]
fr = "La hauteur d'engagement est votre hauteur moins celle de l'adversaire au moment du coup fatal. Le signe est toujours le vôtre : positif, vous étiez en surplomb, pour un frag comme pour une mort. Seuls les engagements dont les deux positions sont décodées y figurent, et le pied de carte en donne le compte."
en = "Engagement height is your height minus your opponent's at the moment of the killing blow. The sign is always yours: positive means you were on high ground, for a kill as for a death. Only engagements whose two positions are decoded appear here, and the card footer gives the count."

