# Common i18n manifest — strings transverses utilisees sur plusieurs pages.
# Format : ICU MessageFormat (cf. PLAN_META_FOUNDATIONS_GO § 3.4).
#
# Cle = identifiant stable namespace.subkey.detail.
# Chaque section porte les variantes de locale (fr, en pour l'instant).
#
# Pour ajouter une cle :
#   1. Definir [common.section.subkey] avec fr et en
#   2. Lancer `node apps/web/scripts/build_i18n_manifests.mjs` pour
#      regenerer les modules TS dans lib/i18n/generated/
#   3. Consommer via `t('common.section.subkey')` dans le composant

