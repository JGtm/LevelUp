# Common i18n manifest — strings transverses utilisees sur plusieurs pages.
# Format : ICU MessageFormat (cf. PLAN_META_FOUNDATIONS_GO § 3.4).
#
# Cle = identifiant stable namespace.subkey.detail.
# Chaque section porte les variantes de locale (fr, en pour l'instant).
#
# Pour ajouter une cle :
#   1. Definir [common.section.subkey] avec fr et en
#   2. Lancer `node apps/web/scripts/build_i18n_manifests.mjs` pour
#      regenerer les modules TS dans lib/i18n/generated/
#   3. Consommer via `t('common.section.subkey')` dans le composant

[common.period.all]
fr = "Toutes les périodes"
en = "All periods"

[common.period.last_2y]
fr = "2 dernières années"
en = "Last 2 years"

[common.period.last_1y]
fr = "Dernière année"
en = "Last year"

[common.period.last_1m]
fr = "Dernier mois"
en = "Last month"

[common.period.last_1w]
fr = "Dernière semaine"
en = "Last week"

[common.outcome.win]
fr = "Victoire"
en = "Win"

[common.outcome.loss]
fr = "Défaite"
en = "Loss"

[common.outcome.tie]
fr = "Égalité"
en = "Tie"

[common.outcome.dnf]
fr = "Non terminé"
en = "DNF"

# Pluralisation ICU MessageFormat : {n, plural, one {...} other {...}}
[common.kpi.matches_count]
fr = "{n, plural, one {# match} other {# matchs}}"
en = "{n, plural, one {# match} other {# matches}}"

[common.kpi.kills]
fr = "Frags"
en = "Kills"

[common.kpi.deaths]
fr = "Morts"
en = "Deaths"

[common.kpi.assists]
fr = "Assistances"
en = "Assists"

[common.kpi.kda]
fr = "K/D/A"
en = "K/D/A"

[common.kpi.accuracy]
fr = "Précision"
en = "Accuracy"

[common.empty.no_data]
fr = "Aucune donnée à afficher"
en = "No data to display"

[common.empty.loading]
fr = "Chargement…"
en = "Loading…"

[common.empty.error]
fr = "Erreur de chargement"
en = "Loading error"
