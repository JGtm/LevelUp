[explorer.briefing.tip_dimensions]
fr = "Où vous performez le mieux et le moins bien selon la carte, le mode ou la sélection."
en = "Where you perform best and worst by map, mode, or selection."

[explorer.briefing.tip_context]
fr = "Vos résultats selon que vous jouiez seul ou en escouade : nombre de matchs, taux de victoire et FDA de chaque contexte."
en = "Your results depending on whether you played solo or in a squad: number of matches, win rate and KDA for each context."

[explorer.briefing.tip_win_rate]
fr = "Part de matchs gagnés sur les matchs affichés. Le ruban sous la valeur répartit victoires, nuls, abandons et défaites ; survolez-le pour le détail chiffré."
en = "Share of matches won over the shown matches. The ribbon below the value splits wins, draws, DNFs and losses; hover it for the detailed counts."

[explorer.briefing.tip_fda]
fr = "Frags, Décès, Assistances : un indicateur d'impact par match qui valorise les frags et les assistances et pénalise les décès — ce n'est pas une simple division des frags par les décès."
en = "Kills, Deaths, Assists: a per-match impact indicator that rewards kills and assists and penalises deaths — it is not a plain division of kills by deaths."

[explorer.briefing.tip_perf]
fr = "Score de performance de 0 à 100, calculé par rapport à votre propre historique : 50 correspond à votre niveau habituel."
en = "Performance score from 0 to 100, computed against your own history: 50 is your usual level."

[explorer.briefing.tip_duration]
fr = "Temps de jeu total cumulé sur les matchs affichés."
en = "Total play time across the shown matches."

[explorer.briefing.tip_peak_fda]
fr = "Votre meilleur FDA sur un seul match parmi les matchs affichés."
en = "Your best KDA in a single match among the shown matches."

[explorer.briefing.tip_peak_rank]
fr = "Le meilleur palier de classement atteint sur les matchs affichés — pas votre palier final."
en = "The highest ranking tier reached over the shown matches — not your final tier."

[explorer.briefing.tip_peak_mmr]
fr = "Le meilleur niveau de compétence estimé (MMR) atteint sur les matchs affichés."
en = "The highest estimated skill level (MMR) reached over the shown matches."

[explorer.briefing.tip_ranked]
fr = "Votre palier de classement à la fin des matchs affichés, le palier de départ, et la moyenne de points de classement gagnés ou perdus par match."
en = "Your ranking tier at the end of the shown matches, the starting tier, and the average ranking points gained or lost per match."

[explorer.briefing.tip_streaks]
fr = "Vos séries extrêmes sur les matchs affichés : la plus longue suite de victoires et la plus longue suite de défaites."
en = "Your extreme streaks over the shown matches: the longest run of wins and the longest run of losses."

[explorer.briefing.tip_highlights]
fr = "Vos matchs marquants : dominations (large victoire), humiliations (large défaite), remontadas (victoire après avoir été mené), débandades (défaite après avoir mené), contre-remontadas (remontée adverse stoppée après avoir mené)."
en = "Your standout matches: dominations (large win), humiliations (large loss), comebacks (win after trailing), collapses (loss after leading), counter-comebacks (opponent's comeback stopped after you led)."
