# Explorer i18n manifest — strings de la page Explorer.
#
# Format ICU MessageFormat. Regenerer via :
#   node apps/web/scripts/build_i18n_manifests.mjs
#
# Phase 2 meta-plan § 6.2.1 — chunk P2.F. Page Explorer (recherche +
# filtres cascade matchs / face-a-face joueur).

# ─── Tabs mode ─────────────────────────────────────────────────────────────

[explorer.mode.matches]
fr = "Matchs"
en = "Matches"

[explorer.mode.player]
fr = "Joueur"
en = "Player"

# ─── Mode Joueur ───────────────────────────────────────────────────────────

[explorer.player.no_selection_title]
fr = "Aucun joueur sélectionné"
en = "No player selected"

[explorer.player.no_selection_description]
fr = "Recherche un gamertag pour afficher les matchs communs et le bilan face à ce joueur."
en = "Search a gamertag to view shared matches and head-to-head record."

[explorer.player.searching]
fr = "Recherche en cours…"
en = "Searching…"

[explorer.player.error_title]
