# Coordination dans le temps (lot Q, D22-3 et D22-6/7 du 2026-09-21) — deux cartes, un
# seul graphe chacune : deux séries de bâtons par soirée sur un axe en %, un repère
# d'habituel par série. D22-verbosité : AUCUNE phrase de lecteur, l'explication tient
# dans l'infobulle ⓘ du titre, trois phrases au plus.
[timeseries.progression.coord_riposte_title]
fr = "Riposte"
en = "Riposte"

[timeseries.progression.coord_riposte_tooltip]
fr = "Chaque bâton est l'écart de la soirée à son propre repère : « je suis couvert » (tes morts ripostées sur tes morts, une riposte étant une mort de ton camp dont le tueur tombe dans les {seconds} s) face à ton habituel, « je riposte » (tes ripostes sur toutes les morts de ton camp) face à la part équitable 1/n."
en = "Each bar is the session's gap to its own reference: \"I am covered\" (your avenged deaths over your deaths, a riposte being a team death whose killer falls within {seconds}s) against your usual, \"I riposte\" (your ripostes over every team death) against the 1/n fair share."

[timeseries.progression.coord_appui_title]
fr = "Appui reçu"
en = "Support received"

[timeseries.progression.coord_appui_tooltip]
fr = "Chaque bâton est l'écart de la soirée à son propre repère : « on me prépare » (tes frags appuyés sur tes frags, un appui étant une assistance reçue sur l'un de tes frags) face à ton habituel, « ma part des appuis » (les assistances qui te reviennent sur toutes celles de ton camp) face à la part équitable 1/n."
en = "Each bar is the session's gap to its own reference: \"Set up for me\" (your assisted kills over your kills, support being an assist received on one of your kills) against your usual, \"my share of support\" (the assists coming to you over every team assist) against the 1/n fair share."

[timeseries.progression.coord_covered]
fr = "Je suis couvert"
en = "I am covered"

[timeseries.progression.coord_i_riposte]
fr = "Je riposte"
en = "I riposte"

[timeseries.progression.coord_prepared]
fr = "On me prépare"
en = "Set up for me"

[timeseries.progression.coord_my_share]
fr = "Ma part des appuis"
en = "My share of support"

[timeseries.progression.coord_usual]
fr = "habituel {rate}"
