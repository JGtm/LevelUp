# golangci-lint configuration v2 — LevelUp Go API
#
# Equivalences Python -> Go :
#   ruff (lint)                -> golangci-lint + staticcheck
#   black / ruff-format        -> gofmt (standard Go, pas de config)
#   pyright / mypy             -> compilateur Go (verification statique a la compile)
#   McCabe C901 max 12         -> gocyclo max-complexity 12
#   PLR0913 max 5 args         -> revive argument-limit 5
#   enforce_size_limits.py     -> funlen (80 lignes) + lll (100 chars)
#   isort                      -> goimports (no config needed)
#   detect-secrets             -> hook pre-commit universel (inchange)
#
# Seuils (identiques Python) :
#   Complexite cyclomatique : 12
#   Longueur de fonction     : 80 lignes  / 60 statements
#   Longueur de ligne        : 100 caracteres
#   Nombre d'arguments       : 5
#
# Migration v1 -> v2 (chore/ci-stabilization, 2026-05-20) :
#   - branche v1 abandonnee depuis mars 2025 (derniere = v1.64.8)
#   - go.mod cible Go 1.26.1 ; v1.62 (compile Go 1.23) refusait de lire la config
#   - structure restructuree : linters-settings -> linters.settings,
#     issues.exclude-rules -> linters.exclusions.rules, gofmt/goimports -> formatters

version: "2"

linters:
  default: standard

  enable:
    - revive
    - gocyclo
    - funlen
    - lll
    - goconst
    - unconvert
    - unparam
    - bodyclose
    - noctx
    - prealloc

  disable:
    - misspell        # Desactive : codebase en francais, faux positifs massifs
    - godot           # Ponctuation des commentaires : commentaires FR acceptes
    - wsl             # Whitespace stricte : trop verbeux pour migration
    - nlreturn        # Lignes vides avant return : cosmetique

  settings:
    gocyclo:
      min-complexity: 15  # Relaxe de 12 a 15 : fonctions de routing/sync naturellement complexes

    funlen:
      lines: 80  # Standard projet (seuils Python) ; dette gelee via only-new-issues (L3, 2026-07-05)
      statements: 80

    lll:
      line-length: 220  # Relaxe progressive : 120 -> 150 -> 220 (2026-05-20).
                        # SQL multiplexe, messages d'erreur i18n FR + EN avec
                        # contexte, URLs cache-buster, et tags struct multiplent
                        # depassent regulierement 150. Le but de lll n'est pas
                        # une largeur d'ecran (on a wrap editor), c'est juste
                        # un signal contre les lignes pathologiques (300+).

    revive:
      rules:
        - name: argument-limit
          # L3 (2026-07-05) : exclusion blanket 'argument-limit' RETIREE -> la regle
          # (jusqu'ici DESACTIVEE, cf. audit CR A20) est desormais ACTIVE. Seuil 7 (et
          # non 5-Python) : mesure sur pieces = distribution 89 fonctions a 6 args + 29
          # a 7 (idiome orchestration ctx+params), PUIS une queue nette de 33 a >=8
          # (les vrais monstres, jusqu'a 14 args). 7 cible cette queue sans refactorer
          # l'idiome 6-7 etabli. Dette gelee via only-new-issues ; nouveau code borne a 7.
          arguments: [7]
        - name: exported
          arguments: ["checkPrivateReceivers"]
        - name: var-naming

    goconst:
      min-len: 4
      min-occurrences: 4  # Relaxe : evite les faux positifs sur mots-cles SQL courts

    staticcheck:
      checks: ["all", "-SA1019"]  # Tout sauf "deprecated" (migration progressive)

  exclusions:
    # En v2, omettre `presets` = pas de regles d'exclusion par defaut (equivalent
    # v1 `exclude-use-default: false`). Si besoin de reactiver, ajouter ici :
    #   presets:
    #     - comments
    #     - common-false-positives
    #     - legacy
    #     - std-error-handling

    paths:
      - vendor
      - bin
      - scripts
      - apps  # dossier duplique accidentel (apps/go-api/apps/go-api/...) — a nettoyer hors lint

    rules:
      # defer db.Close() / rows.Close() : pattern idiomatique Go, l'erreur est informationnelle
      - linters: [errcheck]
        text: "Error return value of `(.*\\.Close|rows\\.Close|stmt\\.Close)` is not checked"

      # Exported WriteHeader sur types ResponseWriter/writer internes (pattern middleware standard)
      - linters: [revive]
        text: "exported method.*Writer.*WriteHeader should have comment"

      # Constantes et variables exportees sans commentaire : acceptable pour SQL queries et domaine
      - linters: [revive, staticcheck]
        text: "(exported.*should have comment|ST1020|ST1021|ST1000)"

      # Commentaire doc pas au bon format (ex: constantes SQL Q1…Q99)
      - linters: [revive, staticcheck]
        text: 'comment on exported .* should be of the form'

      # Stutter : noms type/func repetant le package (sync.SyncEngine, notify.NotifyConfig...)
      # Renommage trop risque sans API stable — accepte pour v1
      - linters: [revive]
        text: 'that stutters'

      # Tests : permissifs sur fonctions longues + lll + complexite + setup DB
      # sans context + duplication de constantes (patterns idiomatiques tests).
      # noctx : tests de setup utilisent db.Ping()/db.Exec() sans ctx — acceptable.
      # goconst : tests dupliquent souvent des constantes (gamertag, xuid, slug)
      # pour la lisibilite case par case ; deduplication nuit a la clarte.
      # unparam : test helpers ont souvent des params toujours egaux (fixtures).
      # bodyclose : tests HTTP mock, vie courte, body.Close non critique.
      # prealloc / ineffassign : minor perf/style, sans impact en test.
      - path: "_test\\.go"
        linters:
          - funlen
          - lll
          - gocyclo
          - noctx
          - goconst
          - errcheck
          - unparam
          - bodyclose
          - prealloc
          - ineffassign
          - revive
          - unconvert
          - staticcheck     # ST1003 (underscore vars), SA4006/SA9003 cosmetique en tests

      # cmd/ (CLI tools / scripts ponctuels) : permissifs sur tout
      # Les scripts de diag/migration/seed/repair n'ont pas vocation a etre
      # production-grade (utilises rarement, manipules manuellement).
      - path: "^cmd/"
        linters:
          - funlen
          - lll
          - gocyclo
          - noctx
          - goconst
          - errcheck
          - prealloc
          - revive
          - unused
          - unparam
          - ineffassign
          - staticcheck

      # Moteur de sync : fonctions algorithmiques complexes (portage Python -> Go fidele)
      - path: "internal/sync/"
        linters:
          - gocyclo
          - funlen
          - lll

      # Analyses stats : algorithmes multi-metriques (fidelite portage Python)
      - path: "internal/analysis/"
        linters:
          - gocyclo
          - funlen
          - lll

      # handlers : setup + sync complexes par conception (orchestration I/O)
      - path: "internal/api/handlers/"
        linters:
          - gocyclo

      # server.go : routeur principal inevitablement long
      - path: "internal/api/server.go"
        linters:
          - funlen

      # Platform settings : Apply() complexe par sa nature de validation multi-champs
      - path: "internal/platform/settings/"
        linters:
          - gocyclo

      # ops : archive et seed algorithmiques (SQL verbeux, lignes longues acceptees)
      - path: "internal/ops/"
        linters:
          - gocyclo
          - lll

      # service : filtres de matchs multi-criteres
      - path: "internal/service/"
        linters:
          - gocyclo

      # cmd/server/main.go : init server inevitablement long
      - path: "cmd/server/main.go"
        linters:
          - funlen
          - gocyclo

      # validation : gate check multi-etapes
      - path: "internal/validation/"
        linters:
          - funlen
          - gocyclo
          - unused

      # Steps de migration : SQL verbeux, funlen + gocyclo permissifs
      - path: "internal/migration/steps_"
        linters:
          - funlen
          - gocyclo
          - lll

      # Backfill : 96 champs -> argument-limit non applicable
      - path: "internal/sync/backfill"
        linters:
          - revive

      # main.go CLI : switch volumineux accepte
      - path: "cmd/levelup/main\\.go"
        linters:
          - funlen
          - gocyclo

      # Multi-titres : packages Go nommes avec underscore par convention produit
      # (coherence avec title.DefaultSlug = "halo_infinite" et les configs
      # config/titles/{slug}/). Renommer ferait perdre la lisibilite 1-pour-1
      # avec les slugs canoniques. Couvre revive (var-naming) + staticcheck (ST1003).
      - path: "internal/games/(halo_infinite|synthetic_title_b)/"
        linters: [revive, staticcheck]
        text: "(var-naming: don't use an underscore in package name|ST1003)"

formatters:
  enable:
    - gofmt
    - goimports
  # gci desactive : doublon avec goimports, gere les groupes d'imports automatiquement

issues:
  max-same-issues: 0
  max-issues-per-linter: 0

output:
  formats:
    text:
      path: stdout
      colors: true
  # sort-results: retire en v2 (n'est plus une propriete `output` valide ;
  # le tri est gere par `sort-order` dans `linters` mais pas active ici).
