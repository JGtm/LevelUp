# ranked_playlists_labels.toml — libellés EN/FR des playlists CLASSÉES de référence
# (rankedplaylists.go). Embarqué (go:embed) DANS le package, pas dans
# config/titles/halo_infinite/mappings/ : ce fichier alimente un usage interne
# Go (sync/leaderboard/migrations, fallback quand asset_translations n'a pas
# encore la traduction) et n'est pas — à ce jour — exposé au web via
# /api/v1/titles/{slug}/field-mappings (cf. .ai/PLAN_LIBELLES_EN_DUR_GO_2026-09-07.md
# §11, découverte M5 L3 : un lot futur peut le déplacer vers le assets.toml
# canonique du titre + brancher useAssetLabel('playlist_ranked', id) côté web
# si ce besoin apparaît).
#
# Parsé par internal/games/mappings.LoadAssetsFromBytes (même format que
# config/titles/{slug}/mappings/assets.toml : [assets.{kind}.{id}], labels.en/fr
# obligatoires, display_order unique par kind) — réutilise le loader et sa
# validation de parité FR/EN au lieu d'un parseur ad hoc.
#
# Source des données : mesure 2026-05 via le proxy public SpartanRecord
# (HaloDotAPI metadata, ranked=true) — identique à rankedplaylists.go avant ce
# lot (aucun changement de valeur, seulement de source).

