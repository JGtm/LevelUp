# citation_texts.toml - noms et descriptions des citations (citation_mappings), une table par langue
# et par entrée. Source des textes écrits par le seed `levelup seed citation-mappings` dans
# asset_translations (type `citation`, ADR 0040 D-15) : une ligne par langue et par texte.
#
# Embarqué (go:embed) DANS le paquet ops, comme les libellés des playlists classées
# (rankedplaylists/ranked_playlists_labels.toml) : le seed tourne aussi sans arborescence de
# configuration (seed de démonstration synthétique).
#
# Clé = citation_name_norm (celle de defaultCitationMappings, seed_citation_data.go). Chaque entrée
# porte `name` et `description` dans CHAQUE langue `required` de config/locales.toml ; le chargement
# refuse une langue manquante ou hors liste (i18n.Text.Validate). Une langue de plus = une clé de
# plus dans chaque table, sans toucher au code Go.
#
# Origine. Les citations Infinite sont des copies de commendations Halo 5 (seul le calcul de
# progression diffère). Noms : le français vient des libellés curés ; l'anglais, par ordre de
# fiabilité, du name_en OFFICIEL H5 quand le nom français correspond exactement (38), de
# « <arme> Mastery » pour les maîtrises d'armes Infinite (armes absentes de H5), du Norm lui-même
# qui encode l'anglais (grand_theft -> Grand Theft). Descriptions anglaises, par ordre de
# fiabilité : la description OFFICIELLE H5 (API Metadata /commendations) pour les citations qui
# reprennent une commendation H5 in-match (57), la page Halopedia des commendations Halo 5 (section
# Spartan Company) pour les 15 citations Spartan Companies, une traduction fidèle du français dans
# l'idiome officiel « Kill enemy Spartans with the <arme> » pour les 24 maîtrises d'armes Infinite
# et les 4 citations Infinite-only (avenger, sentinel/brute/skimmer slayer).

