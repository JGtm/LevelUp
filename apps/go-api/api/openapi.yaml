openapi: "3.1.0"
info:
  title: LevelUp API
  version: "1.0.0"
  description: |
    API backend Go pour le dashboard LevelUp Halo Infinite.

    Ce fichier est la **source de vérité contractuelle** entre le backend Go et le frontend React.
    Il est dérivé des contrats FastAPI Python figés au Sprint 1 (2026-04-15).
    Toute évolution de contrat doit passer par ce fichier en premier.

    Priorités d'endpoints :
    - **P0** : bootstrap, players, session/context, filters/resolve
    - **P1** : career, match-history, explorer, match-view
    - **P2+** : home, timeseries, teammates, synthesis, citations, settings, setup, sync (Sprints 8+)

servers:
  - url: /api/v1
    description: "Préfixe API v1 (tous les endpoints métier)"
  - url: /
    description: "Racine (health, static)"

# ---------------------------------------------------------------------------
# Tags
# ---------------------------------------------------------------------------
tags:
  - name: health
    description: Health check du service
  - name: bootstrap
    description: "Bootstrap shell React (P0)"
  - name: filters
    description: "Résolution de filtres cascade (P0)"
  - name: career
    description: "Page Carrière (P1)"
  - name: match-history
    description: "Historique des parties (P1)"
  - name: explorer
    description: "Explorer matchs + joueurs (P1)"
  - name: match-view
    description: "Détail d'un match (P1)"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # -------------------------------------------------------------------------
  # Health
  # -------------------------------------------------------------------------
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check
      description: |
        Vérifie l'état du service et de ses dépendances critiques
        (metadata.duckdb, shared_matches_v2.duckdb, db_profiles.json).
      responses:
        "200":
          description: Service opérationnel ou dégradé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  summary: Tout opérationnel
                  value:
                    status: ok
                    match_count: 1544
                    db_version: "v1.5.2"
                degraded:
                  summary: DB manquante
                  value:
                    status: degraded
                    match_count: 0
                    db_version: "v1.5.2"

  # -------------------------------------------------------------------------
  # Bootstrap / Players / Session
  # -------------------------------------------------------------------------
  /bootstrap:
    get:
      tags: [bootstrap]
      operationId: getBootstrap
      summary: "Bootstrap du shell React"
      description: |
        Point d'entrée unique du shell React. Retourne l'état complet de l'application :
        configuration du setup, état auth, joueur courant, capacités, feature flags.

        Le frontend appelle cet endpoint au démarrage et après chaque action
        susceptible de changer l'état global (auth, changement de joueur, etc.).

        **Invariants :**
        - `auth_state` ∈ {missing, partial, ready}
        - `setup_state` ∈ {no_halo_link, halo_linked_no_profile, profile_ready_no_sync, ready}
        - `available_players` ne doit jamais être null si la liste est connue
        - `current_player` peut être null
      responses:
        "200":
          description: Bootstrap complet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /players:
    get:
      tags: [bootstrap]
      operationId: getPlayers
      summary: "Liste des joueurs disponibles"
      description: |
        Retourne la liste de tous les joueurs configurés dans db_profiles.json.
        En DEMO_MODE, retourne le joueur de démo pointant sur les fixtures.
      responses:
        "200":
          description: Liste des joueurs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayersListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /session/context:
    post:
      tags: [bootstrap]
      operationId: updateSessionContext
      summary: "Mise à jour du contexte de session"
      description: |
        Met à jour le joueur courant, la locale ou les hints dans la session web.
        N'expose jamais le contenu complet de session.

        **Invariants :**
        - `locale` ∈ {fr, en} si fourni
        - `player_slug` doit référencer un slug existant
        - Retourne 404 si le slug est inconnu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionContextRequest"
      responses:
        "200":
          description: Contexte de session mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionContextResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Filters
  # -------------------------------------------------------------------------
  /players/{player_slug}/filters/resolve:
    post:
      tags: [filters]
      operationId: resolveFilters
      summary: "Résoudre le contexte de filtres"
      description: |
        Normalise FilterContextInput, calcule les options disponibles
        (playlists/modes/cartes/sessions) et retourne le contexte résolu.

        **Invariants :**
        - `filter_mode` ∈ {period, sessions}
        - `effective` est le FilterContextInput normalisé, pas un echo brut
        - Les listes vides dans cascade = « tout coché » (pas de filtre restrictif)
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilterContextInput"
      responses:
        "200":
          description: Contexte de filtres résolu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterContextResolved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Career (P1)
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/career:
    get:
      tags: [career]
      operationId: getCareerPage
      summary: "Page Carrière complète"
      description: |
        Retourne la page Carrière complète pour un joueur :
        rang, XP, projections, graphes, historique, rating LUSR, top matchs, encounters.

        **Invariants :**
        - `charts` peut contenir des valeurs null ciblées
        - `summary` et `lusr` restent optionnels si la donnée manque
        - Le contrat est page-oriented, pas une projection brute du canonique Halo
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Page Carrière
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/pages/career/top-matches:
    get:
      tags: [career]
      operationId: getCareerTopMatches
      summary: "Top matchs du joueur"
      description: Retourne les meilleurs et pires matchs du joueur (tous critères confondus).
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Top matchs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerTopMatchesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/pages/career/encounters:
    get:
      tags: [career]
      operationId: getCareerEncounters
      summary: "Encounters du joueur"
      description: Retourne les adversaires et coéquipiers fréquents.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Encounters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEncountersResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Match History (P1)
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/match-history/query:
    post:
      tags: [match-history]
      operationId: queryMatchHistory
      summary: "Requête paginée de l'historique des parties"
      description: |
        Retourne la page paginée de l'historique des parties pour un joueur.

        **Invariants :**
        - `table` est une PaginatedResponse avec `items` et `pagination`
        - `export_hint` est optionnel
        - `match_url` est porté par chaque ligne, pas reconstruit côté frontend
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchHistoryQueryRequest"
      responses:
        "200":
          description: Historique paginé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchHistoryPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/pages/match-history/export:
    post:
      tags: [match-history]
      operationId: exportMatchHistory
      summary: "Export CSV de l'historique"
      description: |
        Génère un jeton d'export CSV pour l'historique filtré des parties.
        Le MVP renvoie un token/tunnel d'export, pas un flux fichier direct sur cette route.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchHistoryExportRequest"
      responses:
        "200":
          description: Jeton d'export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Explorer (P1)
  # -------------------------------------------------------------------------
  /directory/gamertags/search:
    get:
      tags: [explorer]
      operationId: searchGamertags
      summary: "Recherche floue de gamertags"
      description: |
        Recherche floue de gamertags dans la base partagée.
        Accessible sans joueur courant (endpoint global).

        **Invariants :**
        - Une recherche sans résultat renvoie 200 avec items = []
        - q minimum 2 caractères pour retourner des résultats
      parameters:
        - name: q
          in: query
          description: Requête de recherche (min. 2 caractères)
          schema:
            type: string
            default: ""
        - name: limit
          in: query
          description: Nombre maximal de suggestions
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 8
      responses:
        "200":
          description: Suggestions de gamertags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamertagSearchResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/pages/explorer/matches-query:
    post:
      tags: [explorer]
      operationId: queryExplorerMatches
      summary: "Requête paginée des matchs Explorer"
      description: Retourne la liste paginée et filtrée des matchs pour la vue Explorer.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplorerMatchesQueryRequest"
      responses:
        "200":
          description: Matchs Explorer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorerMatchesQueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/pages/explorer/player-query:
    post:
      tags: [explorer]
      operationId: queryExplorerPlayer
      summary: "Profil d'encounter avec un joueur cible"
      description: Retourne le profil d'encounter et les matchs communs avec un joueur cible.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplorerPlayerQueryRequest"
      responses:
        "200":
          description: Profil encounter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorerPlayerQueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Match View (P1)
  # -------------------------------------------------------------------------
  /players/{player_slug}/matches/{match_id}:
    get:
      tags: [match-view]
      operationId: getMatchView
      summary: "Détail complet d'un match"
      description: |
        Retourne le détail complet d'un match (header + rank + 5 onglets).

        **Invariants :**
        - La vue match est un contrat par onglets/blocs métier, pas un dump du MatchDetail canonique
        - Un match introuvable renvoie 404 avec code = match_not_found
        - Les blocs partiels sont autorisés si le contrat principal est servable
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
        - name: match_id
          in: path
          required: true
          description: UUID du match Halo Infinite
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Détail du match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchViewResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Auth (Sprint 15) — ajoutés au contrat sprint 29
  # -------------------------------------------------------------------------
  /auth/device-flow/start:
    post:
      tags: [setup]
      operationId: postAuthDeviceFlowStart
      summary: Initier un Device Code Flow Microsoft
      description: |
        Lance un Device Code Flow pour l'authentification Halo (MSAL).
        Non disponible en DEMO_MODE.
      responses:
        "200":
          description: Flow initié (user_code + verification_uri)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFlowStartResponse"
        "422":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/device-flow/{attempt_id}:
    get:
      tags: [setup]
      operationId: getAuthDeviceFlowStatus
      summary: Statut d'un Device Code Flow en cours
      parameters:
        - name: attempt_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Statut du flow (pending / authorized / provisioned / failed / expired)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceFlowStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Setup (Sprint 16) — ajoutés au contrat sprint 29
  # -------------------------------------------------------------------------
  /setup/players:
    post:
      tags: [setup]
      operationId: postSetupPlayers
      summary: Créer un profil joueur
      responses:
        "201":
          description: Profil créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePlayerProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /setup/smoke-test:
    post:
      tags: [setup]
      operationId: postSetupSmokeTest
      summary: "Lancer un smoke test (Go-only — à valider Sprint 31)"
      description: |
        Endpoint Go uniquement — absent de FastAPI.
        Vérifie la configuration de bout en bout (connexion DB + API Halo).
        Son maintien versus intégration dans `/sync/initial` sera décidé au Sprint 31.
      responses:
        "202":
          description: Smoke test démarré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobStatus"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Sync (Sprint 17) — ajoutés au contrat sprint 29
  # -------------------------------------------------------------------------
  /sync/initial:
    post:
      tags: [sync]
      operationId: postSyncInitial
      summary: Lancer la synchronisation initiale
      responses:
        "202":
          description: Sync démarrée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobStatus"
        "409":
          description: Une sync est déjà en cours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorSchema"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Settings (Sprint 16) — ajoutés au contrat sprint 29
  # -------------------------------------------------------------------------
  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Lire la configuration
      responses:
        "200":
          description: Configuration actuelle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [settings]
      operationId: patchSettings
      summary: Mettre à jour la configuration
      responses:
        "200":
          description: Configuration mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /settings/media/reset-index:
    post:
      tags: [settings]
      operationId: postSettingsMediaResetIndex
      summary: Réinitialiser l'index médias
      responses:
        "202":
          description: Reset démarré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobStatus"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Jobs (Sprint 17) — ajoutés au contrat sprint 29
  # -------------------------------------------------------------------------
  /jobs/{job_id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: Statut d'un job long
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Statut du job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobStatus"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Home (Sprint 11) — ajoutés au contrat sprint 29
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/home:
    get:
      tags: [home]
      operationId: getHomePage
      summary: Page Accueil
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Page accueil (hero card, timeline, médias récents)
          content:
            application/json:
              schema:
                type: object
                description: "TODO Sprint 32 : schéma HomePageResponse complet"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/battlepass:
    get:
      tags: [home]
      operationId: getBattlePass
      summary: Battle Pass courant
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: "Battle Pass (auth_required si non connecté)"
          content:
            application/json:
              schema:
                type: object
                description: "TODO Sprint 32 : schéma BattlePassResponse complet"
        "404":
          $ref: "#/components/responses/NotFound"

  /players/{player_slug}/challenges:
    get:
      tags: [home]
      operationId: getChallenges
      summary: Challenges actifs
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: "Challenges (auth_required si non connecté)"
          content:
            application/json:
              schema:
                type: object
                description: "TODO Sprint 32 : schéma ChallengesResponse complet"
        "404":
          $ref: "#/components/responses/NotFound"

  # -------------------------------------------------------------------------
  # Sessions (Sprint 9) — ajoutées au contrat sprint 29
  # Go-only : FastAPI expose /pages/timeseries (POST) qui couvre session-compare.
  # À réconcilier lors du Sprint 32.
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/sessions:
    get:
      tags: [timeseries]
      operationId: getSessions
      summary: "Sessions (Go-only — à réconcilier avec /pages/timeseries FastAPI au Sprint 32)"
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Liste des sessions avec stats agrégées
          content:
            application/json:
              schema:
                type: object
                description: "TODO Sprint 32 : aligner avec TimeseriesPageResponse FastAPI"
        "404":
          $ref: "#/components/responses/NotFound"

  # -------------------------------------------------------------------------
  # Stats/Séries temporelles (Sprint 10) — ajoutées au contrat sprint 29
  # Go: POST /pages/stats/query | FastAPI: POST /pages/timeseries
  # À réconcilier (renommage ou alias) lors du Sprint 32.
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/stats/query:
    post:
      tags: [timeseries]
      operationId: postStatsQuery
      summary: "Séries temporelles (Go: /pages/stats/query — à renommer /pages/timeseries au Sprint 32)"
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: "Données séries temporelles (win/loss, précision, forme, objectif)"
          content:
            application/json:
              schema:
                type: object
                description: "TODO Sprint 32 : aligner avec TimeseriesPageResponse FastAPI"
        "400":
          $ref: "#/components/responses/BadRequest"

  # -------------------------------------------------------------------------
  # Escouade (Sprint 12) — ajoutées au contrat sprint 29
  # Go: GET /pages/squad | FastAPI: POST /pages/teammates
  # À réconcilier (méthode + nom) lors du Sprint 32.
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/squad:
    get:
      tags: [teammates]
      operationId: getSquadPage
      summary: "Escouade (Go: GET /pages/squad — FastAPI: POST /pages/teammates, à réconcilier Sprint 32)"
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Analyse escouade / coéquipiers
          content:
            application/json:
              schema:
                type: object
                description: "TODO Sprint 32 : aligner avec TeammatesPageResponse FastAPI"
        "404":
          $ref: "#/components/responses/NotFound"

  # -------------------------------------------------------------------------
  # Synthèse (Sprint 12) — ajoutées au contrat sprint 29
  # Go: GET /pages/synthesis | FastAPI: POST /pages/synthesis
  # Divergence méthode HTTP à corriger lors du Sprint 32.
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/synthesis:
    get:
      tags: [synthesis]
      operationId: getSynthesisPage
      summary: "Synthèse globale (Go: GET — FastAPI: POST, divergence à corriger Sprint 32)"
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Synthèse globale (heatmap, top semaines, comparaison KPIs)
          content:
            application/json:
              schema:
                type: object
                description: "TODO Sprint 32 : aligner avec SynthesisPageResponse FastAPI"
        "404":
          $ref: "#/components/responses/NotFound"

  # -------------------------------------------------------------------------
  # Citations + Commendations (Sprint 13) — ajoutées au contrat sprint 29
  # Go: GET /pages/citations + GET /pages/commendations
  # FastAPI: POST /pages/citations (inclut commendations dans la réponse)
  # Divergence méthode + split à corriger lors du Sprint 32.
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/citations:
    get:
      tags: [career]
      operationId: getCitations
      summary: "Citations (Go: GET — FastAPI: POST, divergence à corriger Sprint 32)"
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Citations calculées (Triple Kill, Clutch, etc.)
          content:
            application/json:
              schema:
                type: object
                description: "TODO Sprint 32 : aligner avec CitationsPageResponse FastAPI"
        "404":
          $ref: "#/components/responses/NotFound"

  /players/{player_slug}/pages/commendations:
    get:
      tags: [career]
      operationId: getCommendations
      summary: "Commendations (Go-only — FastAPI intègre dans /pages/citations, à réconcilier Sprint 32)"
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Commendations et médailles par catégorie
          content:
            application/json:
              schema:
                type: object
                description: "TODO Sprint 32 : fusionner dans CitationsPageResponse FastAPI"
        "404":
          $ref: "#/components/responses/NotFound"

  # -------------------------------------------------------------------------
  # Médias (Sprint 13) — ajoutées au contrat sprint 29
  # Go: GET /pages/media | FastAPI: POST /pages/media
  # Divergence méthode HTTP à corriger lors du Sprint 32.
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/media:
    get:
      tags: [media]
      operationId: getMediaLibrary
      summary: "Galerie médias (Go: GET — FastAPI: POST, divergence à corriger Sprint 32)"
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Galerie médias paginée
          content:
            application/json:
              schema:
                type: object
                description: "TODO Sprint 32 : aligner avec MediaPageResponse FastAPI"
        "404":
          $ref: "#/components/responses/NotFound"

  # -------------------------------------------------------------------------
  # Session Compare (Sprint 9) — ajoutée au contrat sprint 29
  # FastAPI: POST /players/{player_slug}/pages/session-compare — absent Go.
  # TODO Sprint 32 : implémenter dans Go.
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/session-compare:
    post:
      tags: [timeseries]
      operationId: postSessionCompare
      summary: "Comparaison de sessions A/B (TODO Sprint 32 : implémenter en Go)"
      description: |
        Endpoint présent en FastAPI uniquement (absent Go).
        Retournera 501 Not Implemented jusqu'au Sprint 32.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Comparaison sessions A/B
          content:
            application/json:
              schema:
                type: object
                description: "TODO Sprint 32 : SessionCompareResponse"
        "501":
          description: Non implémenté (Go)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorSchema"

  # -------------------------------------------------------------------------
  # Last Match (Sprint 8) — ajoutée au contrat sprint 29
  # FastAPI: POST /players/{player_slug}/pages/last-match/resolve
  # TODO Sprint 32 : implémenter en Go.
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/last-match/resolve:
    post:
      tags: [explorer]
      operationId: postLastMatchResolve
      summary: "Résoudre le dernier match (TODO Sprint 32 : implémenter en Go)"
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Dernier match résolu
          content:
            application/json:
              schema:
                type: object
                description: "TODO Sprint 32 : LastMatchResolveResponse"
        "501":
          description: Non implémenté (Go)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorSchema"

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:

  # -------------------------------------------------------------------------
  # Parameters
  # -------------------------------------------------------------------------
  parameters:
    PlayerSlug:
      name: player_slug
      in: path
      required: true
      description: Slug du joueur (dérivé du gamertag, ex. "Chocoboflor")
      schema:
        type: string

  # -------------------------------------------------------------------------
  # Responses réutilisables
  # -------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
          example:
            code: bad_request
            message: "Paramètre invalide."
            retryable: false
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
          example:
            code: player_not_found
            message: "Joueur introuvable."
            retryable: false
    InternalError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
          example:
            code: internal_error
            message: "Erreur interne du serveur."
            retryable: true

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:

    # --- Erreurs ---
    FieldErrorSchema:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
          nullable: true

    ApiErrorSchema:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: Code d'erreur stable (snake_case)
          example: player_not_found
        message:
          type: string
          description: Message humain localisé
        retryable:
          type: boolean
          default: false
        details:
          nullable: true
          oneOf:
            - type: object
            - type: array
        field_errors:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/FieldErrorSchema"

    # --- Health ---
    HealthResponse:
      type: object
      required: [status, match_count, db_version]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        match_count:
          type: integer
          description: Nombre de matchs dans shared_matches_v2
        db_version:
          type: string
          description: Version DuckDB embarquée
        checks:
          type: object
          additionalProperties:
            type: string
          description: Résultats individuels par dépendance

    # --- Common ---
    PlayerSummary:
      type: object
      required: [player_slug, gamertag, xuid, waypoint_player]
      properties:
        player_slug:
          type: string
          example: Chocoboflor
        gamertag:
          type: string
          example: Chocoboflor
        xuid:
          type: string
          example: "2535412781684883"
        waypoint_player:
          type: string
        is_demo:
          type: boolean
          default: false

    CapabilityMap:
      type: object
      required:
        - can_read_local_data
        - can_run_sync
        - can_use_live_halo
        - can_manage_settings
        - can_reset_media_index
        - can_view_media
      properties:
        can_read_local_data:
          type: boolean
        can_run_sync:
          type: boolean
        can_use_live_halo:
          type: boolean
        can_manage_settings:
          type: boolean
        can_reset_media_index:
          type: boolean
        can_view_media:
          type: boolean
        can_self_provision:
          type: boolean
          default: false
        can_start_initial_sync:
          type: boolean
          default: false
        can_manage_instance:
          type: boolean
          default: false

    LabelValue:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
        disabled:
          type: boolean
          nullable: true
        count:
          type: integer
          nullable: true

    SortSpec:
      type: object
      required: [field]
      properties:
        field:
          type: string
        direction:
          type: string
          enum: [asc, desc]
          default: desc

    PaginationRequest:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 500
          default: 50

    PaginationMeta:
      type: object
      required: [total, page, page_size, has_next, has_prev]
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean

    FreshnessInfo:
      type: object
      properties:
        source:
          type: string
          enum: [live, cached, mixed]
          default: cached
        sync_status:
          type: string
          enum: [fresh, stale, unknown]
          default: unknown
        warnings:
          type: array
          items:
            type: string

    PlotlyFigurePayload:
      type: object
      required: [figure]
      properties:
        figure:
          type: object
          description: fig.to_plotly_json() — data + layout + frames
        config_key:
          type: string
          enum: [clean, static]
          default: clean
        revision_key:
          type: string
          nullable: true

    # --- Bootstrap ---
    FeatureFlags:
      type: object
      properties:
        v7_enabled:
          type: boolean
          default: true
        media_enabled:
          type: boolean
          default: true
        demo_mode:
          type: boolean
          default: false
        discord_configured:
          type: boolean
          default: false
        tailscale_enabled:
          type: boolean
          default: false

    SettingsExcerpt:
      type: object
      properties:
        lang:
          type: string
          default: fr
        user_timezone:
          type: string
          default: "Europe/Paris"
        show_records:
          type: boolean
          default: true
        normalize_mode_labels:
          type: boolean
          default: true

    HaloIdentitySummary:
      type: object
      required: [gamertag, xuid]
      properties:
        gamertag:
          type: string
        xuid:
          type: string

    BootstrapResponse:
      type: object
      required:
        - setup_required
        - auth_state
        - setup_state
        - available_players
        - feature_flags
        - capabilities
        - settings_excerpt
      properties:
        setup_required:
          type: boolean
        auth_state:
          type: string
          enum: [missing, partial, ready]
        setup_state:
          type: string
          enum:
            - no_halo_link
            - halo_linked_no_profile
            - profile_ready_no_sync
            - ready
        current_player:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlayerSummary"
        available_players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        locale:
          type: string
          default: fr
        hints_visible_default:
          type: boolean
          default: true
        feature_flags:
          $ref: "#/components/schemas/FeatureFlags"
        capabilities:
          $ref: "#/components/schemas/CapabilityMap"
        settings_excerpt:
          $ref: "#/components/schemas/SettingsExcerpt"
        linked_halo_identity:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HaloIdentitySummary"
        active_sync_job_id:
          type: string
          nullable: true

    PlayersListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        default_player_slug:
          type: string
          nullable: true

    SessionContextRequest:
      type: object
      properties:
        player_slug:
          type: string
          nullable: true
        locale:
          type: string
          enum: [fr, en]
          nullable: true
        hints_visible:
          type: boolean
          nullable: true

    SessionContextResponse:
      type: object
      required: [locale, hints_visible, capabilities]
      properties:
        current_player:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlayerSummary"
        locale:
          type: string
          default: fr
        hints_visible:
          type: boolean
          default: true
        capabilities:
          $ref: "#/components/schemas/CapabilityMap"

    # --- Filters ---
    PeriodInput:
      type: object
      properties:
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true

    SessionsInput:
      type: object
      properties:
        picked_session_label:
          type: string
          nullable: true
        picked_solo_session_label:
          type: string
          nullable: true
        picked_squad_session_label:
          type: string
          nullable: true
        picked_sessions:
          type: array
          items:
            type: string
        gap_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 120
          description: "Invariant: toujours 120 dans le code actuel."

    CascadeInput:
      type: object
      description: Listes vides = « tout coché » (pas de filtre restrictif)
      properties:
        experience_types:
          type: array
          items:
            type: string
        playlists:
          type: array
          items:
            type: string
        modes:
          type: array
          items:
            type: string
        maps:
          type: array
          items:
            type: string

    FilterContextInput:
      type: object
      properties:
        filter_mode:
          type: string
          enum: [period, sessions]
          default: period
        period:
          $ref: "#/components/schemas/PeriodInput"
        sessions:
          $ref: "#/components/schemas/SessionsInput"
        cascade:
          $ref: "#/components/schemas/CascadeInput"

    AvailableOptions:
      type: object
      properties:
        experience_types:
          type: array
          items:
            $ref: "#/components/schemas/LabelValue"
        playlists:
          type: array
          items:
            $ref: "#/components/schemas/LabelValue"
        modes:
          type: array
          items:
            $ref: "#/components/schemas/LabelValue"
        maps:
          type: array
          items:
            $ref: "#/components/schemas/LabelValue"

    SessionOption:
      type: object
      required: [label, session_id, match_count, is_squad]
      properties:
        label:
          type: string
        session_id:
          type: string
        match_count:
          type: integer
        is_squad:
          type: boolean

    SessionOptions:
      type: object
      properties:
        all_sessions:
          type: array
          items:
            $ref: "#/components/schemas/SessionOption"
        solo_labels:
          type: array
          items:
            type: string
        squad_labels:
          type: array
          items:
            type: string

    FilterCounts:
      type: object
      required: [total_matches_before_filters, total_matches_after_filters]
      properties:
        total_matches_before_filters:
          type: integer
        total_matches_after_filters:
          type: integer

    FilterContextResolved:
      type: object
      required: [effective, available_options, session_options, counts]
      properties:
        effective:
          $ref: "#/components/schemas/FilterContextInput"
        available_options:
          $ref: "#/components/schemas/AvailableOptions"
        session_options:
          $ref: "#/components/schemas/SessionOptions"
        counts:
          $ref: "#/components/schemas/FilterCounts"

    # --- Career ---
    CareerSummary:
      type: object
      required:
        - rank_number
        - rank_label
        - rank_name_raw
        - rank_tier
        - current_xp
        - xp_for_next_rank
        - xp_total
        - progress_pct
        - is_max_rank
      properties:
        rank_number:
          type: integer
        rank_label:
          type: string
        rank_name_raw:
          type: string
        rank_tier:
          type: string
        current_xp:
          type: integer
        xp_for_next_rank:
          type: integer
        xp_total:
          type: integer
        progress_pct:
          type: number
          format: float
        is_max_rank:
          type: boolean
        recorded_at:
          type: string
          format: date-time
          nullable: true

    HeroProgress:
      type: object
      required: [xp_total_required, xp_remaining, percentage, current_rank]
      properties:
        xp_total_required:
          type: integer
        xp_remaining:
          type: integer
        percentage:
          type: number
          format: float
        current_rank:
          type: integer

    CareerProjections:
      type: object
      required: [xp_per_day_active, xp_per_day_fallback]
      properties:
        xp_per_day_active:
          type: number
          format: float
        xp_per_day_fallback:
          type: number
          format: float
        estimated_hero_date:
          type: string
          format: date
          nullable: true
        estimated_rank_cap_date:
          type: string
          format: date
          nullable: true

    CareerCharts:
      type: object
      description: Graphes Plotly serialisés — peut contenir des null ciblés
      properties:
        rank_progress_gauge:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlotlyFigurePayload"
        hero_progress_gauge:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlotlyFigurePayload"
        xp_history_figure:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlotlyFigurePayload"
        lusr_rating_figure:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlotlyFigurePayload"

    CareerHistoryPoint:
      type: object
      required: [recorded_at, rank, xp_total]
      properties:
        recorded_at:
          type: string
          format: date-time
        rank:
          type: integer
        xp_total:
          type: integer

    CareerLusrCheckpoint:
      type: object
      required: [recorded_at, rating_value, playlist_group]
      properties:
        recorded_at:
          type: string
          format: date-time
        rating_value:
          type: number
          format: float
        playlist_group:
          type: string

    CareerLusrSection:
      type: object
      required: [checkpoints]
      properties:
        current_rating:
          type: number
          format: float
          nullable: true
        current_tier_label:
          type: string
          nullable: true
        current_playlist_group:
          type: string
          nullable: true
        trend_label:
          type: string
          nullable: true
        checkpoints:
          type: array
          items:
            $ref: "#/components/schemas/CareerLusrCheckpoint"

    CareerTopMatch:
      type: object
      required: [match_id]
      properties:
        match_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
          nullable: true
        map_ui:
          type: string
          nullable: true
        mode_ui:
          type: string
          nullable: true
        playlist_label:
          type: string
          nullable: true
        performance_score:
          type: number
          format: float
          nullable: true
        badge_type:
          type: string
          nullable: true
        score_label:
          type: string
          nullable: true
        outcome_label:
          type: string
          nullable: true
        kills:
          type: integer
          nullable: true
        deaths:
          type: integer
          nullable: true
        assists:
          type: integer
          nullable: true
        kd_ratio:
          type: number
          format: float
          nullable: true
        variant:
          type: string
          enum: [best, worst]
          nullable: true

    CareerEncounter:
      type: object
      required: [encounter_key, opponent_gamertag, count_matches, wins, losses]
      properties:
        encounter_key:
          type: string
        opponent_gamertag:
          type: string
        count_matches:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        last_seen_at:
          type: string
          format: date-time
          nullable: true

    CareerPageResponse:
      type: object
      required: [charts, xp_history, top_matches_preview, encounters_preview]
      properties:
        summary:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CareerSummary"
        hero_progress:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HeroProgress"
        projections:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CareerProjections"
        charts:
          $ref: "#/components/schemas/CareerCharts"
        xp_history:
          type: array
          items:
            $ref: "#/components/schemas/CareerHistoryPoint"
        lusr:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CareerLusrSection"
        top_matches_preview:
          type: array
          items:
            $ref: "#/components/schemas/CareerTopMatch"
        encounters_preview:
          type: array
          items:
            $ref: "#/components/schemas/CareerEncounter"

    CareerTopMatchesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CareerTopMatch"

    CareerEncountersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CareerEncounter"

    # --- Match History ---
    MatchHistoryRow:
      type: object
      required:
        - match_id
        - start_time
        - start_time_label
        - outcome_label
        - score_label
        - map_ui
        - mode_ui
        - playlist_label
        - average_life_mmss
        - match_url
      properties:
        match_id:
          type: string
          format: uuid
        start_time:
          type: string
          format: date-time
        start_time_label:
          type: string
        outcome_code:
          type: integer
          nullable: true
        outcome_label:
          type: string
        score_label:
          type: string
        map_ui:
          type: string
        mode_ui:
          type: string
        playlist_label:
          type: string
        team_mmr:
          type: number
          format: float
          nullable: true
        enemy_mmr:
          type: number
          format: float
          nullable: true
        delta_mmr:
          type: number
          format: float
          nullable: true
        win_rate_hist:
          type: number
          format: float
          nullable: true
        win_rate_hist_total:
          type: integer
          nullable: true
        performance_score_relative:
          type: integer
          nullable: true
        average_life_mmss:
          type: string
        match_url:
          type: string

    MatchHistoryQuerySummary:
      type: object
      required:
        - total_matches_scoped
        - total_matches_unfiltered
        - active_filter_mode
      properties:
        total_matches_scoped:
          type: integer
        total_matches_unfiltered:
          type: integer
        period_label:
          type: string
          nullable: true
        active_filter_mode:
          type: string

    ExportHint:
      type: object
      required: [file_name, estimated_rows]
      properties:
        file_name:
          type: string
        estimated_rows:
          type: integer
        token:
          type: string
          nullable: true

    PaginatedMatchHistoryResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MatchHistoryRow"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
        freshness:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FreshnessInfo"

    MatchHistoryPageResponse:
      type: object
      required: [summary, table, available_sort_fields]
      properties:
        summary:
          $ref: "#/components/schemas/MatchHistoryQuerySummary"
        table:
          $ref: "#/components/schemas/PaginatedMatchHistoryResponse"
        available_sort_fields:
          type: array
          items:
            type: string
        export_hint:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ExportHint"

    MatchHistoryQueryRequest:
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/FilterContextInput"
        pagination:
          $ref: "#/components/schemas/PaginationRequest"
        columns:
          type: array
          items:
            type: string
          nullable: true
        include_export_hint:
          type: boolean
          default: false

    MatchHistoryExportRequest:
      type: object
      properties:
        filters:
          $ref: "#/components/schemas/FilterContextInput"
        sort:
          type: array
          items:
            $ref: "#/components/schemas/SortSpec"
          nullable: true
        columns:
          type: array
          items:
            type: string
          nullable: true
        format:
          type: string
          default: csv

    FileTokenResponse:
      type: object
      required: [file_token, file_name, content_type, download_path, expires_at]
      properties:
        file_token:
          type: string
        file_name:
          type: string
        content_type:
          type: string
        download_path:
          type: string
        expires_at:
          type: string
          format: date-time
        estimated_rows:
          type: integer
          nullable: true

    # --- Explorer ---
    GamertagSuggestion:
      type: object
      required: [gamertag]
      properties:
        gamertag:
          type: string
        xuid:
          type: string
          nullable: true
        score:
          type: number
          format: float
          default: 1.0
        exact_match:
          type: boolean
          default: false

    GamertagSearchResponse:
      type: object
      required: [query, items]
      properties:
        query:
          type: string
        items:
          type: array
          items:
