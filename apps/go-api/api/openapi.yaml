    post:
      description: |
        Sync initiale title-aware. title_slug cible la bonne DB (lève l'ambiguïté
        d'un gamertag présent sous plusieurs titres) ; à défaut, le titre du
        contexte. max_matches : 1-2000 ; 0 = défaut du profil (initial_max_matches)
        puis 200.
      operationId: postSyncInitial
      requestBody:
        content:
          application/json:
            schema:
              properties:
                max_matches:
                  description: 1-2000 ; 0 = défaut profil puis 200
                  type: integer
                player_slug:
                  type: string
