          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        current_step:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result:
          type: object
          additionalProperties: true
          nullable: true
        error:
          type: string
          nullable: true

