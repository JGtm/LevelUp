        "200": { description: "Scan démarré" }

  /settings/sessions/recalculate:
    post:
      tags: [settings]
      operationId: postSettingsSessionsRecalculate
      summary: "Recalcule les sessions à partir de la base actuelle"
      responses:
        "200": { description: "Recalcul démarré" }

  /settings/backup/status:
    get:
      tags: [settings]
      operationId: getBackupStatus
      summary: "Statut du scheduler de sauvegarde"
      responses:
        "200":
          description: Statut courant (enabled, last backup, DBs exportées, config)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatusResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /settings/backup/run:
    post:
      tags: [settings]
      operationId: postBackupRun
      summary: "Déclenche un cycle de sauvegarde immédiat"
      responses:
        "200":
          description: Résultat du cycle (snapshot_id, bases exportées, durée)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRunResult"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Scheduler non initialisé (backup désactivé)

  # Sync
  /players/{player_slug}/sync:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
    post:
      tags: [sync]
      operationId: postPlayerSync
      summary: "Sync delta par joueur"
      responses:
        "200": { description: "Sync démarré" }

  /sync/all:
    post:
      tags: [sync]
      operationId: postSyncAll
      summary: "Sync delta global (tous les joueurs configurés)"
      responses:
        "200": { description: "Sync global démarré" }

  /backfill/start:
    post:
      tags: [sync]
      operationId: postBackfillStart
      summary: "Lance un backfill (job long)"
      responses:
        "200": { description: "Job créé, voir GET /jobs/{job_id}" }

  # -------------------------------------------------------------------------
  # Diagnostics (admin/dev — lecture seule)
  # -------------------------------------------------------------------------
  /_diag/csr-coverage/{player_slug}:
    get:
      tags: [diagnostics]
      operationId: getDiagCSRCoverage
      summary: "Diag couverture CSR pour un joueur"
      description: |
        Phase 9 du plan pipeline CSR. Permet de vérifier en 1 ligne si le
        pipeline CSR a bien capturé les données (snapshots Waypoint + MSR
        matured/placement) ou s'il faut lancer un backfill.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: "Couverture CSR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSRCoverage"
        "404": { $ref: "#/components/responses/NotFound" }

  /_diag/progression/{player_slug}:
    get:
      tags: [diagnostics]
      operationId: getDiagProgression
      summary: "Diag pipeline progression V2 (Ascension)"
      description: |
        Phase 4 plan stabilisation 2026-05-22. Compte les rows dans les
        tables V2 (streak, player_records, record_history, milestone_earned,
        milestone_catalog) pour vérifier que EvaluateProgressionAfterSync
        tourne bien sur l'auto-sync. Si tous les counts joueur sont à 0
        après plusieurs cycles auto-sync (15 min × N), le pipeline V2
        n'est pas câblé correctement.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: "État pipeline progression V2"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressionDiag"
        "404": { $ref: "#/components/responses/NotFound" }

  /_diag/prestige/telemetry/{player_slug}:
    get:
      tags: [diagnostics]
      operationId: getDiagPrestigeTelemetry
      summary: "Diag agrégation télémétrie Prestige par origine du défi"
      description: |
        ADR 0020 (coach→pont Prestige). Agrège la table append-only
        prestige_telemetry d'un joueur par origine du défi (coach / user /
        pilot_mode / unknown) : compteurs created/rejected/completed/expired/
        abandoned + taux d'acceptation et de complétion. Permet de mesurer si
        les défis proposés par le coach sont acceptés/complétés davantage que
        ceux d'autres origines. Les défis créés avant le plumbing (source NULL)
        sont agrégés sous "unknown". Les taux valent -1 quand non calculables
        (dénominateur nul).
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: "Agrégats télémétrie Prestige par origine"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrestigeTelemetryDiag"
        "404": { $ref: "#/components/responses/NotFound" }

  /_admin/progression/backfill/{player_slug}:
    post:
      tags: [diagnostics]
      operationId: backfillProgression
      summary: "Backfill progression V2 (Ascension) pour un joueur"
      description: |
        Fix 2026-05-30. Force une évaluation progression V2 in-process
        (détecteurs streaks/records/milestones, idempotents) pour un joueur
        dont l'historique existe déjà mais dont le pipeline post-sync n'avait
        jamais abouti (incident timeout shared reader pendant la fenêtre de
        swap RO↔RW). N'émet pas de notifications coach. Renvoie le diag
        (counts) post-exécution pour vérifier que les tables se peuplent.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: "Diag pipeline progression V2 après backfill"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressionDiag"
        "404": { $ref: "#/components/responses/NotFound" }

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:

  # -------------------------------------------------------------------------
  # Parameters
  # -------------------------------------------------------------------------
  parameters:
    PlayerSlug:
      name: player_slug
      in: path
      required: true
      description: Slug du joueur (dérivé du gamertag, ex. "Chocoboflor")
      schema:
        type: string

  # -------------------------------------------------------------------------
  # Responses réutilisables
  # -------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
          example:
            code: bad_request
            message: "Paramètre invalide."
            retryable: false
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
          example:
            code: auth_required
            message: "Authentification requise."
            retryable: false
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
          example:
            code: player_not_found
            message: "Joueur introuvable."
            retryable: false
    InternalError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
          example:
            code: internal_error
            message: "Erreur interne du serveur."
            retryable: true
    Conflict:
      description: Conflit avec l'état courant de la ressource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
          example:
            code: last_active_title
            message: "Au moins un titre doit rester actif pour ce joueur."
            retryable: false

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:

    # --- Backup ---
    IntegrityCheckResult:
      type: object
      properties:
        ok:
          type: boolean
          description: Vrai si PRAGMA integrity_check a retourné "ok"
        detail:
          type: string
          description: Premier message d'erreur (absent si ok ou pragma non supporté)
        checked_at:
          type: string
          format: date-time
          description: Horodatage UTC de la vérification

    BackupStatusResponse:
      type: object
      required: [enabled, available]
      properties:
        enabled:
          type: boolean
          description: Backup activé dans app_settings.json
        available:
          type: boolean
          description: Binaire restic trouvé dans le PATH
        last_backup_at:
          type: string
          format: date-time
          description: Date du dernier backup réussi (absente si jamais sauvegardé)
        last_snapshot_id:
          type: string
          description: ID du dernier snapshot restic
        last_exported:
          type: array
          items:
            type: string
          description: Clés des bases exportées lors du dernier cycle
        last_duration_ms:
          type: integer
          description: Durée du dernier cycle en millisecondes
        integrity_checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/IntegrityCheckResult"
          description: Résultats PRAGMA integrity_check par base (clé = DB key, présent après le premier cycle)
        config:
          type: object
          properties:
            interval:
              type: string
              description: Intervalle entre cycles (ex. "6h0m0s")
            keep_daily:
              type: integer
            keep_weekly:
              type: integer
            keep_monthly:
              type: integer

    BackupRunResult:
      type: object
      required: [skipped]
      properties:
        snapshot_id:
          type: string
          description: ID du snapshot créé (vide si skipped)
        skipped:
          type: boolean
          description: Vrai si aucune DB n'a changé depuis le dernier backup
        exported:
          type: array
          items:
            type: string
          description: Clés des bases exportées
        duration_ms:
          type: integer
          description: Durée du cycle en millisecondes

    # --- Career CSR ---
    CareerCSRRank:
      additionalProperties: false
      properties:
          badge_image_url:
              type: string
          measurement_matches_remaining:
              format: int64
              type: integer
          placement_total:
              format: int64
              type: integer
          sub_tier:
              format: int64
              type: integer
          tier:
              type: string
          value:
              format: double
              type: number
      required:
          - value
          - tier
          - sub_tier
          - measurement_matches_remaining
          - placement_total
      type: object
    CSRSeasonOption:
      additionalProperties: false
      properties:
          is_current:
              type: boolean
          label:
              type: string
          season_id:
              type: string
      required:
          - season_id
          - label
      type: object
    # --- Erreurs ---
    FieldErrorSchema:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
          nullable: true

    ApiErrorSchema:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: Code d'erreur stable (snake_case)
          example: player_not_found
        message:
          type: string
          description: Message humain localisé
        retryable:
          type: boolean
          default: false
        details:
          nullable: true
          oneOf:
            - type: object
            - type: array
        field_errors:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/FieldErrorSchema"

    # --- Health ---
    HealthResponse:
      additionalProperties: false
      properties:
          app_version:
              type: string
          db_version:
              type: string
          go_version:
              type: string
          last_sync_at:
              format: date-time
              type: string
          match_count:
              format: int64
              type: integer
          media_tooling:
              $ref: '#/components/schemas/MediaToolingStatus'
          player_count:
              format: int64
              type: integer
          status:
              type: string
          uptime:
              type: string
      required:
          - status
          - match_count
          - player_count
          - media_tooling
      type: object
    MediaToolingStatus:
      additionalProperties: false
      properties:
          ffmpeg:
              type: boolean
          ffmpeg_version:
              type: string
          ffprobe:
              type: boolean
      required:
          - ffmpeg
          - ffprobe
      type: object
    # --- Common ---
    PlayerSummary:
      additionalProperties: false
      properties:
          gamertag:
              type: string
          initial_max_matches:
              format: int64
              type: integer
          is_demo:
              type: boolean
          player_slug:
              type: string
          steam_id:
              type: string
          sync_enabled:
              type: boolean
          title_slug:
              type: string
          waypoint_player:
              type: string
          xuid:
              type: string
      required:
          - player_slug
          - gamertag
          - xuid
          - waypoint_player
          - is_demo
          - sync_enabled
      type: object
    CapabilityMap:
      additionalProperties: false
      properties:
          can_manage_instance:
              type: boolean
          can_manage_settings:
              type: boolean
          can_read_local_data:
              type: boolean
          can_reset_media_index:
              type: boolean
          can_run_sync:
              type: boolean
          can_self_provision:
              type: boolean
          can_start_initial_sync:
              type: boolean
          can_use_live_halo:
              type: boolean
          can_view_media:
              type: boolean
      required:
          - can_read_local_data
          - can_run_sync
          - can_use_live_halo
          - can_manage_settings
          - can_reset_media_index
          - can_view_media
          - can_self_provision
          - can_start_initial_sync
          - can_manage_instance
      type: object
    LabelValue:
      additionalProperties: false
      properties:
          count:
              format: int64
              type: integer
          label:
              type: string
          parent:
              type: string
          value:
              type: string
      required:
          - label
          - value
          - count
      type: object
    SortSpec:
      type: object
      required: [field]
      properties:
        field:
          type: string
        direction:
          type: string
          enum: [asc, desc]
          default: desc

    PaginationRequest:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 500
          default: 50

    PaginationMeta:
      additionalProperties: false
      properties:
          has_next:
              type: boolean
          has_prev:
              type: boolean
          page:
              format: int64
              type: integer
          page_size:
              format: int64
              type: integer
          total:
              format: int64
              type: integer
      required:
          - total
          - page
          - page_size
          - has_next
          - has_prev
      type: object
    FreshnessInfo:
      type: object
      properties:
        source:
          type: string
          enum: [live, cached, mixed]
          default: cached
        sync_status:
          type: string
          enum: [fresh, stale, unknown]
          default: unknown
        warnings:
          type: array
          items:
            type: string

    PlotlyFigurePayload:
      type: object
      required: [figure]
      properties:
        figure:
          type: object
          description: fig.to_plotly_json() — data + layout + frames
        config_key:
          type: string
          enum: [clean, static]
          default: clean
        revision_key:
          type: string
          nullable: true

    # --- Bootstrap ---
    FeatureFlags:
      additionalProperties: false
      properties:
          demo_mode:
              type: boolean
          discord_configured:
              type: boolean
          media_enabled:
              type: boolean
          tailscale_enabled:
              type: boolean
          v7_enabled:
              type: boolean
      required:
          - v7_enabled
          - media_enabled
          - demo_mode
          - discord_configured
          - tailscale_enabled
      type: object
    SettingsExcerpt:
      additionalProperties: false
      properties:
          lang:
              type: string
          normalize_mode_labels:
              type: boolean
          show_records:
              type: boolean
          user_timezone:
              type: string
      required:
          - lang
          - user_timezone
          - show_records
          - normalize_mode_labels
      type: object
    HaloIdentitySummary:
      additionalProperties: false
      properties:
          gamertag:
              type: string
          xuid:
              type: string
      required:
          - gamertag
          - xuid
      type: object
    BootstrapResponse:
      type: object
      required:
        - setup_required
        - auth_state
        - setup_state
        - current_player
        - available_players
        - current_title_slug
        - available_titles
        - locale
        - hints_visible_default
        - feature_flags
        - capabilities
        - settings_excerpt
        - auth_mode
        - registration_mode
        - instance_locked
        - reauth_required
        - has_password
        - is_admin
        - current_username
        - first_launch
        - oauth_code_flow_enabled
        - demo_mode
      properties:
        setup_required:
          type: boolean
        auth_state:
          type: string
          enum: [missing, partial, ready]
        setup_state:
          type: string
          enum:
            - no_halo_link
            - halo_linked_no_profile
            - profile_ready_no_sync
            - ready
        current_player:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PlayerSummary"
        available_players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        locale:
          type: string
          default: fr
        hints_visible_default:
          type: boolean
          default: true
        feature_flags:
          $ref: "#/components/schemas/FeatureFlags"
        capabilities:
          $ref: "#/components/schemas/CapabilityMap"
        settings_excerpt:
          $ref: "#/components/schemas/SettingsExcerpt"
        linked_halo_identity:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/HaloIdentitySummary"
        active_sync_job_id:
          type: string
          nullable: true
        privacy:
          description: "Sprint 54-B : informations de confidentialité des matchs du joueur actif."
          nullable: true
          allOf:
            - $ref: "#/components/schemas/MatchPrivacyInfo"
        current_title_slug:
          type: string
          description: "Sprint 44 : slug du titre courant de la session."
        available_titles:
          type: array
          description: "Sprint 44 : titres disponibles (title switcher) — active + coming_soon."
          items:
            $ref: "#/components/schemas/TitleSummary"
        auth_mode:
          type: string
          enum: [none, password, xbox]
        registration_mode:
          type: string
          enum: [invite, open, closed]
        instance_locked:
          type: boolean
        reauth_required:
          type: boolean
        has_password:
          type: boolean
        is_admin:
          type: boolean
        current_username:
          type: string
          nullable: true
        first_launch:
          type: boolean
        oauth_code_flow_enabled:
          type: boolean
        demo_mode:
          type: boolean

    PlayersListResponse:
      additionalProperties: false
      properties:
          default_player_slug:
              type: string
              nullable: true
          items:
              items:
                  $ref: '#/components/schemas/PlayerSummary'
              type: array
              nullable: true
      required:
          - items
          - default_player_slug
      type: object
    SessionContextRequest:
      type: object
      properties:
        player_slug:
          type: string
          nullable: true
        title_slug:
          type: string
          nullable: true
        locale:
          type: string
          enum: [fr, en]
          nullable: true
        hints_visible:
          type: boolean
          nullable: true

    TitleSummary:
      type: object
      required: [slug, name, status, capabilities, is_default, effective_hp_to_kill]
      properties:
        slug:
          type: string
        name:
          type: string
        icon_url:
          type: string
        status:
          type: string
          enum: [active, coming_soon, archived]
        capabilities:
          type: array
          items:
            type: string
        is_default:
          type: boolean
        effective_hp_to_kill:
          type: number
          format: double
        offensive_conversion_p80:
          type: number
          format: double
        provides_damage_taken:
          type: boolean
          description: "false si l'API du titre ne fournit pas damage_taken (Halo 5) — le front neutralise la Résistance défensive (N/A) au lieu d'afficher 0."
        provides_team_mmr:
          type: boolean
          description: "false si l'API du titre ne fournit pas de MMR d'équipe/adverse par match (Halo 5) — le front masque la colonne MMR du tableau Escouade/Explorer au lieu d'afficher 0."
        provides_max_killing_spree:
          type: boolean
          description: "true si le titre supporte le max killing spree par match — valeur native (Infinite) ou calculée depuis les events kill/death horodatés (Halo 5). Le front masque la série « Folie meurtrière max » uniquement si false (titre sans events horodatés)."

    TitleSyncInputBody:
      additionalProperties: false
      properties:
          enabled:
              type: boolean
      required:
          - enabled
      type: object
    TitleSyncOutputBody:
      additionalProperties: false
      properties:
          gamertag:
              type: string
          sync_enabled:
              type: boolean
          title_slug:
              type: string
      required:
          - gamertag
          - title_slug
          - sync_enabled
      type: object
    TitlePurgeOutputBody:
      additionalProperties: false
      properties:
          data_removed:
              type: boolean
          gamertag:
              type: string
          title_slug:
              type: string
      required:
          - gamertag
          - title_slug
          - data_removed
      type: object

    SessionContextResponse:
      additionalProperties: false
      properties:
          auth_ready:
              type: boolean
          available_titles:
              items:
                  $ref: '#/components/schemas/TitleSummary'
              type: array
              nullable: true
          current_player_slug:
              type: string
          current_title_slug:
              type: string
          hints_visible:
              type: boolean
          locale:
              type: string
      required:
          - current_title_slug
          - available_titles
          - locale
          - hints_visible
          - auth_ready
      type: object
    # --- Filters ---
    PeriodInput:
      additionalProperties: false
      properties:
          end_date:
              format: date-time
              type: string
              nullable: true
          start_date:
              format: date-time
              type: string
              nullable: true
      required:
          - start_date
          - end_date
      type: object
    SessionsInput:
      type: object
      properties:
        picked_session_label:
          type: string
          nullable: true
        picked_solo_session_label:
          type: string
          nullable: true
        picked_squad_session_label:
          type: string
          nullable: true
        picked_sessions:
          type: array
          items:
            type: string
        gap_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 120
          description: "Invariant: toujours 120 dans le code actuel."

    CascadeInput:
      type: object
      description: Listes vides = « tout coché » (pas de filtre restrictif)
      properties:
        experience_types:
          type: array
          items:
            type: string
        playlists:
          type: array
          items:
            type: string
        modes:
          type: array
          items:
            type: string
        maps:
          type: array
          items:
            type: string

    FilterContextInput:
      additionalProperties: false
      properties:
          cascade:
              $ref: '#/components/schemas/CascadeFilter'
          filter_mode:
              type: string
          match_context:
              type: string
          period:
              $ref: '#/components/schemas/PeriodInput'
          sessions:
              $ref: '#/components/schemas/SessionsFilter'
      required:
          - filter_mode
          - period
          - sessions
          - cascade
      type: object
    AvailableOptions:
      type: object
      properties:
        experience_types:
          type: array
          items:
            $ref: "#/components/schemas/LabelValue"
        playlists:
          type: array
          items:
            $ref: "#/components/schemas/LabelValue"
        modes:
          type: array
          items:
            $ref: "#/components/schemas/LabelValue"
        maps:
          type: array
          items:
            $ref: "#/components/schemas/LabelValue"

    SessionOption:
      additionalProperties: false
      properties:
          ended_at_utc:
              format: date-time
              type: string
          is_squad:
              type: boolean
          label:
              type: string
          match_count:
              format: int64
              type: integer
          match_count_filtered:
              format: int64
              type: integer
          session_id:
              type: string
          started_at_utc:
              format: date-time
              type: string
      required:
          - label
          - session_id
          - match_count
          - match_count_filtered
          - is_squad
