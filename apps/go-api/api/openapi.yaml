# FICHIER GÉNÉRÉ — NE PAS ÉDITER À LA MAIN.
#
# Source : document OpenAPI PARTAGÉ de Huma (routes + schémas dérivés des types Go)
# fusionné avec le fragment manuel versionné api/openapi_manual_fragment.yaml
# (tout ce qui n'est PAS dérivable : routes chi-brut, corps RawBody, sémantique
# d'opération, descriptions de schéma racine, schémas sans type Go).
#
# Régénérer :  make openapi-gen
# Verrouillé par : TestOpenAPIYAMLIsUpToDate (internal/api) — golden byte-à-byte.
openapi: 3.1.0
info:
  description: |
    API backend Go pour le dashboard LevelUp (Halo Infinite, Halo 5).

    Contrat **GÉNÉRÉ** (`make openapi-gen`) : les routes et les schémas sont dérivés
    des types Go par Huma ; la sémantique non dérivable vient du fragment manuel
    `api/openapi_manual_fragment.yaml`. Le code Go fait foi — pour faire évoluer le
    contrat, modifier le handler ou son DTO, puis régénérer.

    Priorités d'endpoints :
    - **P0** : bootstrap, players, session/context, filters/resolve
    - **P1** : career, match-history, explorer, match-view
    - **P2+** : home, timeseries, teammates, synthesis, citations, settings, setup, sync
  title: LevelUp API
  version: 1.0.0
servers:
  - description: Préfixe API v1 (tous les endpoints métier)
    url: /api/v1
  - description: Racine (health, static)
    url: /
tags:
  - description: Health check du service
    name: health
  - description: Bootstrap shell React (P0)
    name: bootstrap
  - description: Résolution de filtres cascade (P0)
    name: filters
  - description: Page Carrière (P1)
    name: career
  - description: Historique des parties (P1)
    name: match-history
  - description: Explorer matchs + joueurs (P1)
    name: explorer
  - description: Détail d'un match (P1)
    name: match-view
  - description: Page d'accueil et palmarès (P2+)
    name: home
  - description: Pages Escouade / Synthèse (P2+)
    name: squad
  - description: Galerie médias (P2+)
    name: media
  - description: Notifications joueur (P3)
    name: notifications
  - description: Settings utilisateur
    name: settings
  - description: Sync delta + backfill (P3)
    name: sync
  - description: Authentification, session, watcher (P3)
    name: auth
  - description: Routes administration (auth admin requis)
    name: admin
  - description: Servir des assets binaires (images, médias)
    name: assets
  - description: Endpoints diagnostic admin/dev (lecture seule)
    name: diagnostics
  - description: 'Onboarding : déclaration des joueurs et premières synchronisations'
    name: setup
  - description: Groupes de joueurs (création, invitations, membres)
    name: groups
  - description: Suivi des tâches asynchrones (jobs)
    name: jobs
  - description: 'Progression V2 (Ascension) : paliers et diagnostic'
    name: progression
  - description: Exclusion de matchs des agrégats d'un joueur
    name: match-exclusion
  - description: Comparaison de joueurs sur une période
    name: compare
  - description: Classements (catalogue, saisons, monde)
    name: leaderboard
  - description: 'Palmarès joueur : relations, moments, faits marquants'
    name: palmares
  - description: Séries temporelles agrégées (courbes)
    name: timeseries
  - description: Coéquipiers et escouades
    name: teammates
  - description: Synthèse narrative (coach)
    name: synthesis
  - description: 'Titres supportés (multi-titre) : capacités, mappings, catalogue'
    name: titles
paths:
  /_admin/progression/backfill/{player_slug}:
    post:
      description: |
        Fix 2026-05-30. Force une évaluation progression V2 in-process
        (détecteurs streaks/records/milestones, idempotents) pour un joueur
        dont l'historique existe déjà mais dont le pipeline post-sync n'avait
        jamais abouti (incident timeout shared reader pendant la fenêtre de
        swap RO↔RW). N'émet pas de notifications coach. Renvoie le diag
        (counts) post-exécution pour vérifier que les tables se peuplent.
      operationId: backfillProgression
      parameters:
        - description: Slug du joueur (dérivé du gamertag, ex. "Chocoboflor")
          in: path
          name: player_slug
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressionDiag'
          description: Diag pipeline progression V2 après backfill
        "404":
          $ref: '#/components/responses/NotFound'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Backfill progression V2 (Ascension) pour un joueur
      tags:
        - diagnostics
  /_diag/auto-sync/probe:
    get:
      operationId: getDiagAutoSyncProbe
      parameters:
        - explode: false
          in: query
          name: gamertag
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenProbeResult'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Diag sonde la résolution des tokens auth d'un joueur (loopback + admin)
      tags:
        - diagnostics
  /_diag/auto-sync/run:
    post:
      operationId: postDiagAutoSyncRun
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerSnapshot'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Diag force un cycle auto-sync (loopback + admin)
      tags:
        - diagnostics
  /_diag/auto-sync/snapshot:
    get:
      operationId: getDiagAutoSyncSnapshot
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerSnapshot'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Diag snapshot de l'ordonnanceur auto-sync
      tags:
        - diagnostics
  /_diag/csr-coverage/{player_slug}:
    get:
      description: |
        Phase 9 du plan pipeline CSR. Permet de vérifier en 1 ligne si le
        pipeline CSR a bien capturé les données (snapshots Waypoint + MSR
        matured/placement) ou s'il faut lancer un backfill.
      operationId: getDiagCSRCoverage
      parameters:
        - description: Slug du joueur (dérivé du gamertag, ex. "Chocoboflor")
          in: path
          name: player_slug
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CSRCoverage'
          description: Couverture CSR
        "404":
          $ref: '#/components/responses/NotFound'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Diag couverture CSR pour un joueur
      tags:
        - diagnostics
  /_diag/prestige/telemetry/{player_slug}:
    get:
      description: |
        ADR 0020 (coach→pont Prestige). Agrège la table append-only
        prestige_telemetry d'un joueur par origine du défi (coach / user /
        pilot_mode / unknown) : compteurs created/rejected/completed/expired/
        abandoned + taux d'acceptation et de complétion. Permet de mesurer si
        les défis proposés par le coach sont acceptés/complétés davantage que
        ceux d'autres origines. Les défis créés avant le plumbing (source NULL)
        sont agrégés sous "unknown". Les taux valent -1 quand non calculables
        (dénominateur nul).
      operationId: getDiagPrestigeTelemetry
      parameters:
        - description: Slug du joueur (dérivé du gamertag, ex. "Chocoboflor")
          in: path
          name: player_slug
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrestigeTelemetryDiag'
          description: Agrégats télémétrie Prestige par origine
        "404":
          $ref: '#/components/responses/NotFound'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Diag agrégation télémétrie Prestige par origine du défi
      tags:
        - diagnostics
  /_diag/progression/{player_slug}:
    get:
      description: |
        Phase 4 plan stabilisation 2026-05-22. Compte les rows dans les
        tables V2 (streak, player_records, record_history, milestone_earned,
        milestone_catalog) pour vérifier que EvaluateProgressionAfterSync
        tourne bien sur l'auto-sync. Si tous les counts joueur sont à 0
        après plusieurs cycles auto-sync (15 min × N), le pipeline V2
        n'est pas câblé correctement.
      operationId: getDiagProgression
      parameters:
        - description: Slug du joueur (dérivé du gamertag, ex. "Chocoboflor")
          in: path
          name: player_slug
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressionDiag'
          description: État pipeline progression V2
        "404":
          $ref: '#/components/responses/NotFound'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Diag pipeline progression V2 (Ascension)
      tags:
        - diagnostics
  /admin/actions/auto-sync/run:
    post:
      operationId: postAdminActionAutoSyncRun
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobStatus'
          description: Job créé (suivre via GET /jobs/{job_id})
        "409":
          description: Un cycle forcé est déjà en vol (job_id en details)
        "503":
          description: Scheduler indisponible
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Action admin — force un cycle auto-sync complet, suivi via le JobStore (auth admin requis)
      tags:
        - admin
  /admin/actions/catalog/refresh:
    post:
      operationId: postAdminActionCatalogRefresh
      parameters:
        - explode: false
          in: query
          name: title
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRefreshResult'
          description: Compteurs d'upserts par table catalog
        "409":
          description: Refresh déjà en cours
        "503":
          description: Metadata ou shared inaccessibles
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Action admin — seed les tables catalog metadata (playlists/maps/pairs/variants) depuis match_registry, zéro réseau (le drain DiscoveryUGC reste CLI-only) (auth admin requis)
      tags:
        - admin
  /admin/actions/catalog/ugc-drain:
    post:
      operationId: postAdminActionCatalogUGCDrain
      parameters:
        - explode: false
          in: query
          name: title
          schema:
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobStatus'
          description: Job créé (suivre via GET /jobs/{job_id})
        "409":
          description: Drain déjà en cours pour ce titre (job_id en details)
        "503":
          description: Drain indisponible (jobs non câblés)
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Action admin — recense les asset IDs vus en jeu (catalog_fetch_queue) puis les résout via l'API DiscoveryUGC (réseau, rate-limité) ; complète le catalog/refresh zéro-réseau pour les assets absents de match_registry ; job asynchrone (auth admin requis)
      tags:
        - admin
  /admin/actions/convergence/run:
    post:
      operationId: postAdminActionConvergenceRun
      parameters:
        - explode: false
          in: query
          name: title
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                player_slug:
                  description: Slug du joueur à faire converger
                  type: string
                title_slug:
                  description: Slug du titre (défaut = titre par défaut)
                  type: string
              required:
                - player_slug
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobStatus'
          description: Job créé (suivre via GET /jobs/{job_id})
        "400":
          description: player_slug requis
        "409":
          description: Convergence déjà en cours pour ce joueur (job_id en details)
        "503":
          description: Scheduler indisponible
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Action admin — relance la convergence d'un joueur (RunDelta + post-sync, claim SyncGate) via le JobStore (auth admin requis)
      tags:
        - admin
  /admin/actions/data-health/run:
    post:
      operationId: postAdminActionDataHealthRun
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringDataHealth'
          description: Compteurs de l'audit (UUIDs bruts, lying bits, orphelins, garbage URLs)
        "503":
          description: Health scheduler non câblé
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Action admin — exécute l'audit data health immédiatement (lectures RO, synchrone) (auth admin requis)
      tags:
        - admin
  /admin/actions/initial-sync/run:
    post:
      operationId: postAdminActionInitialSyncRun
      parameters:
        - description: Titre cible (fallback du title_slug du corps, sinon titre par défaut).
          explode: false
          in: query
          name: title
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                max_matches:
                  description: Plafond de matchs (1..2000) ; 0/absent → défaut profil (initial_max_matches) puis 200.
                  maximum: 2000
                  minimum: 1
                  type: integer
                player_slug:
                  description: Slug (ou gamertag) du joueur suivi à re-importer.
                  type: string
                title_slug:
                  description: Titre cible explicite (multi-titre) ; vide → paramètre title puis titre par défaut.
                  type: string
              required:
                - player_slug
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobStatus'
          description: Job créé (suivre via GET /jobs/{job_id})
        "400":
          description: player_slug requis
        "409":
          description: Synchronisation initiale déjà en cours pour ce joueur (job_id en details)
        "503":
          description: Scheduler indisponible
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Action admin — re-import complet (RunFull, plafonné à max_matches) d'un joueur au choix, tokens via le pool unifié, claim SyncGate, via le JobStore (auth admin requis)
      tags:
        - admin
  /admin/actions/journal:
    get:
      operationId: getAdminActionsJournal
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionJournalResponse'
          description: Journal des actions globales
          headers:
            Cache-Control:
              schema:
                type: string
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Dashboard monitoring — journal des actions globales (dernière exécution/issue/déclencheur par action, survit au reboot) (auth admin requis)
      tags:
        - admin
  /admin/actions/lying-bits/reset:
    post:
      operationId: postAdminActionLyingBitsReset
      parameters:
        - explode: false
          in: query
          name: title
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyingBitsResetResult'
          description: Compteurs de matchs clearés par catégorie (ou détectés en dry-run)
        "409":
          description: Reset déjà en cours
        "503":
          description: Writer shared occupé ou shared absente
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Action admin — clear les bits backfill_completed menteurs de match_registry (events/weapons posés mais tables vides) + events_loaded menteur, débloque le heal au prochain sync (dry_run supporté, writer shared sérialisé dblease) (auth admin requis)
      tags:
        - admin
  /admin/actions/registry-names/backfill:
    post:
      operationId: postAdminActionRegistryNamesBackfill
      parameters:
        - explode: false
          in: query
          name: title
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryNamesBackfillResult'
          description: Compteurs scanned/fixed par type d'asset
        "409":
          description: Backfill déjà en cours
        "503":
          description: Writer shared occupé ou metadata absente
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Action admin — résout les assets UUID bruts de match_registry via metadata.asset_translations (dry_run supporté, writer shared sérialisé dblease) (auth admin requis)
      tags:
        - admin
  /admin/actions/replay-build/enqueue:
    post:
      operationId: postAdminActionReplayBuildEnqueue
      parameters:
        - explode: false
          in: query
          name: title
          schema:
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayBuildEnqueueResponse'
          description: Accepted
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: 'Action admin — met la construction du rejeu 2D d''un match dans la file durable : le manifeste du film est résolu ici (tokens) et les URL CDN pré-signées partent dans le job, qu''un ouvrier distant prendra (auth admin requis)'
      tags:
        - admin
  /admin/actions/replay-build/run:
    post:
      operationId: postAdminActionReplayBuildRun
      parameters:
        - explode: false
          in: query
          name: title
          schema:
            type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncJobStatus'
          description: Accepted
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Action admin — construit l'artefact de rejeu 2D d'un match depuis le cache film local (job asynchrone, décodage hors ligne, auth admin requis)
      tags:
        - admin
  /admin/actions/translations/asset:
    post:
      operationId: postAdminActionAssetTranslation
      parameters:
        - explode: false
          in: query
          name: title
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveResult'
          description: created | updated + langues écrites
        "400":
          description: Entrées invalides
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Action admin — upsert asset_translations (en-US et/ou fr-FR) pour un asset playlist/map/pair/game_variant (résolution effective des UUID inconnus) (auth admin requis)
      tags:
        - admin
  /admin/actions/translations/mode:
    post:
      operationId: postAdminActionModeTranslation
      parameters:
        - explode: false
          in: query
          name: title
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveResult'
          description: created | updated + clé normalisée écrite
        "400":
          description: Entrées invalides
        "503":
          description: Metadata indisponible
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Action admin — upsert mode_name_tr[fr] pour un mode normalisé (résout un mode non traduit, effet immédiat) (auth admin requis)
      tags:
        - admin
  /admin/db-contention:
    get:
      operationId: getAdminDBContention
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DBContentionResponse'
          description: Compteurs de contention (swaps, durées, lectures rejetées en 503)
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Contention DB — compteurs du shared provider B-swap (auth admin requis)
      tags:
        - admin
  /admin/diag/appearance/{player_slug}:
    get:
      operationId: getAdminDiagAppearance
      parameters:
        - description: Slug du joueur suivi (db_profiles.json).
          in: path
          name: player_slug
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppearanceDiagnosisResponse'
          description: Diagnostic apparence par composant
        "404":
          description: Joueur suivi introuvable
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Diagnostic apparence Spartan ID — verdict par composant (bannière/emblème/backdrop/service tag) d'un joueur suivi, à la demande (auth admin requis)
      tags:
        - admin
  /admin/invariants:
    get:
      operationId: getAdminInvariants
      parameters:
        - explode: false
          in: query
          name: title
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInvariantsResponse'
          description: Rapports d'invariants par joueur
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Intégrité des données — invariants du pipeline sync par joueur (auth admin requis)
      tags:
        - admin
  /admin/invites:
    get:
      operationId: listAdminInvites
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdminInviteSummary'
                type:
                  - array
                  - "null"
          description: Liste des invitations
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Liste des invitations admin (auth admin requis)
      tags:
        - admin
    post:
      operationId: createAdminInvite
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCode'
          description: Invitation créée
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Crée une invitation
      tags:
        - admin
  /admin/invites/{code}:
    delete:
      operationId: deleteAdminInvite
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Invitation supprimée
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Révoque une invitation
      tags:
        - admin
  /admin/monitoring/build-queue:
    get:
      operationId: getAdminMonitoringBuildQueue
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBuildQueueResponse'
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
