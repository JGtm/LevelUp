          type: string
          format: uri
          nullable: true
        expires_in:
          type: integer
          description: Durée de validité en secondes
        poll_interval_seconds:
          type: integer
          default: 5

    DeviceFlowStatusResponse:
      type: object
      description: Réponse de GET /auth/device-flow/{attempt_id}
      required: [attempt_id, status]
      properties:
        attempt_id:
          type: string
        status:
          type: string
          enum: [pending, authorized, provisioned, failed, expired]
        gamertag:
