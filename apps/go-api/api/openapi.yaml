openapi: "3.1.0"
info:
  title: LevelUp API
  version: "1.0.0"
  description: |
    API backend Go pour le dashboard LevelUp Halo Infinite.

    Ce fichier est la **source de vérité contractuelle** entre le backend Go et le frontend React.
    Il est dérivé des contrats FastAPI Python figés au Sprint 1 (2026-04-15).
    Toute évolution de contrat doit passer par ce fichier en premier.

    Priorités d'endpoints :
    - **P0** : bootstrap, players, session/context, filters/resolve
    - **P1** : career, match-history, explorer, match-view
    - **P2+** : home, timeseries, teammates, synthesis, citations, settings, setup, sync (Sprints 8+)

servers:
  - url: /api/v1
    description: "Préfixe API v1 (tous les endpoints métier)"
  - url: /
    description: "Racine (health, static)"

# ---------------------------------------------------------------------------
# Tags
# ---------------------------------------------------------------------------
tags:
  - name: health
    description: Health check du service
  - name: bootstrap
    description: "Bootstrap shell React (P0)"
  - name: filters
    description: "Résolution de filtres cascade (P0)"
  - name: career
    description: "Page Carrière (P1)"
  - name: match-history
    description: "Historique des parties (P1)"
  - name: explorer
    description: "Explorer matchs + joueurs (P1)"
  - name: match-view
    description: "Détail d'un match (P1)"
  - name: home
    description: "Page d'accueil et palmarès (P2+)"
  - name: squad
    description: "Pages Escouade / Synthèse (P2+)"
  - name: media
    description: "Galerie médias (P2+)"
  - name: notifications
    description: "Notifications joueur (P3)"
  - name: settings
    description: "Settings utilisateur"
  - name: sync
    description: "Sync delta + backfill (P3)"
  - name: auth
    description: "Authentification, session, watcher (P3)"
  - name: admin
    description: "Routes administration (auth admin requis)"
  - name: assets
    description: "Servir des assets binaires (images, médias)"
  - name: diagnostics
    description: "Endpoints diagnostic admin/dev (lecture seule)"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # -------------------------------------------------------------------------
  # Health
  # -------------------------------------------------------------------------
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Health check
      description: |
        Vérifie l'état du service et de ses dépendances critiques
        (metadata.duckdb, shared_matches_v2.duckdb, db_profiles.json).
      responses:
        "200":
          description: Service opérationnel ou dégradé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                ok:
                  summary: Tout opérationnel
                  value:
                    status: ok
                    match_count: 1544
                    db_version: "v1.5.2"
                degraded:
                  summary: DB manquante
                  value:
                    status: degraded
                    match_count: 0
                    db_version: "v1.5.2"

  # -------------------------------------------------------------------------
  # Bootstrap / Players / Session
  # -------------------------------------------------------------------------
  /bootstrap:
    get:
      tags: [bootstrap]
      operationId: getBootstrap
      summary: "Bootstrap du shell React"
      description: |
        Point d'entrée unique du shell React. Retourne l'état complet de l'application :
        configuration du setup, état auth, joueur courant, capacités, feature flags.

        Le frontend appelle cet endpoint au démarrage et après chaque action
        susceptible de changer l'état global (auth, changement de joueur, etc.).

        **Invariants :**
        - `auth_state` ∈ {missing, partial, ready}
        - `setup_state` ∈ {no_halo_link, halo_linked_no_profile, profile_ready_no_sync, ready}
        - `available_players` ne doit jamais être null si la liste est connue
        - `current_player` peut être null
      responses:
        "200":
          description: Bootstrap complet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /players:
    get:
      tags: [bootstrap]
      operationId: getPlayers
      summary: "Liste des joueurs disponibles"
      description: |
        Retourne la liste de tous les joueurs configurés dans db_profiles.json.
        En DEMO_MODE, retourne le joueur de démo pointant sur les fixtures.
      responses:
        "200":
          description: Liste des joueurs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayersListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /session/context:
    post:
      tags: [bootstrap]
      operationId: updateSessionContext
      summary: "Mise à jour du contexte de session"
      description: |
        Met à jour le joueur courant, la locale ou les hints dans la session web.
        N'expose jamais le contenu complet de session.

        **Invariants :**
        - `locale` ∈ {fr, en} si fourni
        - `player_slug` doit référencer un slug existant
        - Retourne 404 si le slug est inconnu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionContextRequest"
      responses:
        "200":
          description: Contexte de session mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionContextResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Filters
  # -------------------------------------------------------------------------
  /players/{player_slug}/filters/resolve:
    post:
      tags: [filters]
      operationId: resolveFilters
      summary: "Résoudre le contexte de filtres"
      description: |
        Normalise FilterContextInput, calcule les options disponibles
        (playlists/modes/cartes/sessions) et retourne le contexte résolu.

        **Invariants :**
        - `filter_mode` ∈ {period, sessions}
        - `effective` est le FilterContextInput normalisé, pas un echo brut
        - Les listes vides dans cascade = « tout coché » (pas de filtre restrictif)
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilterContextInput"
      responses:
        "200":
          description: Contexte de filtres résolu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilterContextResolved"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # Drive-by : route existante (server.go) non documentée sur main —
  # documentée ici pour passer TestContractRoutesDocumented (plafond 0).
  # NB : même ajout sur la branche feat/admin-titles-pmt14 (prendre l'un au merge).
  /players/{player_slug}/filters/match-ids:
    post:
      tags: [filters]
      operationId: filtersMatchIDs
      summary: "Résoudre la liste des match_ids correspondant à un contexte de filtres"
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilterContextInput"
      responses:
        "200": { description: "Liste des match_ids filtrés" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------------------
  # Career (P1)
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/career:
    get:
      tags: [career]
      operationId: getCareerPage
      summary: "Page Carrière complète"
      description: |
        Retourne la page Carrière complète pour un joueur :
        rang, XP, projections, graphes, historique, rating LUSR, top matchs, encounters.

        **Invariants :**
        - `charts` peut contenir des valeurs null ciblées
        - `summary` et `lusr` restent optionnels si la donnée manque
        - Le contrat est page-oriented, pas une projection brute du canonique Halo
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Page Carrière
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/pages/career/top-matches:
    get:
      tags: [career]
      operationId: getCareerTopMatches
      summary: "Top matchs du joueur"
      description: Retourne les meilleurs et pires matchs du joueur (tous critères confondus).
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Top matchs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerTopMatchesResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/pages/career/encounters:
    get:
      tags: [career]
      operationId: getCareerEncounters
      summary: "Encounters du joueur"
      description: Retourne les adversaires et coéquipiers fréquents.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Encounters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerEncountersResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/pages/career/highlight-matches:
    get:
      tags: [career]
      operationId: getCareerHighlightMatches
      summary: "Matchs marquants — 15 best + 15 worst (format Explorer)"
      description: |
        Retourne les 15 meilleurs et 15 pires matchs du joueur au format
        ExplorerMatchesRow (mêmes colonnes que la page Explorer). Tri par
        priorité dominance puis performance_score (DESC pour best, ASC pour worst).
        Filtres d'éligibilité : performance_score NOT NULL, time_played≥180s,
        is_firefight=FALSE. Asymétrie WIN/LOSS sur had_bot_teammate : les WIN
        avec bot coéquipier sont conservés (perf personnelle méritoire malgré
        le handicap), les LOSS avec bot coéquipier sont exclus (responsabilité
        du joueur non isolable d'un déséquilibre 4v3).

        Query params optionnels filtrent côté SQL :
          - `experience` : "all" / "ranked" / "unranked"
          - `season_ids` : CSV des saisons (ex. "season6,season7")

        La réponse inclut les cascade counts (`available_experience`,
        `available_seasons`) qui respectent l'autre filtre actif (cascade-aware).
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
        - in: query
          name: experience
          schema: { type: string, enum: [all, ranked, unranked] }
          required: false
        - in: query
          name: season_ids
          schema: { type: string }
          description: CSV des IDs de saison à filtrer (ex. "season6,season7")
          required: false
      responses:
        "200":
          description: Highlight matches
          content:
            application/json:
              schema:
                type: object
                required: [best_matches, worst_matches, available_experience, available_seasons]
                properties:
                  best_matches:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  worst_matches:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  available_experience:
                    type: array
                    items:
                      type: object
                      required: [value, count]
                      properties:
                        value: { type: string, enum: [all, ranked, unranked] }
                        count: { type: integer }
                  available_seasons:
                    type: array
                    items:
                      type: object
                      required: [value, count]
                      properties:
                        value: { type: string }
                        count: { type: integer }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: MatchHistoryService factory indisponible (cas test)

  /players/{player_slug}/pages/career/top-encounters:
    get:
      tags: [career]
      operationId: getCareerTopEncounters
      summary: "Joueurs les plus croisés (hors amis)"
      description: |
        Retourne les 10 joueurs les plus fréquemment croisés au niveau
        carrière, hors amis configurés (`FriendGamertags` settings résolus
        en XUIDs via `v_gamertag_lookup`). Format MatchEncounterRow (mêmes
        8 colonnes que Match View > "Historique de rencontre"). Inclut les
        badges narratifs ally_plus / tough_enemy / ordinal.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Top encounters
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/pages/career/rivals:
    get:
      tags: [career]
      operationId: getCareerRivals
      summary: "Top némésis + Top souffre-douleur"
      description: |
        Retourne le top 10 némésis (joueurs qui ont le plus tué le joueur
        principal, tri par deaths DESC) et le top 10 souffre-douleur (joueurs
        que le principal a le plus tué, tri par frags DESC). Source :
        `shared.killer_victim_pairs`. Pas de seuil minimum d'interactions.
        Bots exclus. Le ratio frags/deaths est calculé côté backend
        (avec garde div-par-zéro : 0 morts → ratio = float64(frags)).
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Rivals
          content:
            application/json:
              schema:
                type: object
                required: [nemeses, victims]
                properties:
                  nemeses:
                    type: array
                    items:
                      type: object
                      required: [gamertag, frags, deaths, ratio, match_count]
                      properties:
                        gamertag: { type: string }
                        frags: { type: integer }
                        deaths: { type: integer }
                        ratio: { type: number }
                        match_count: { type: integer }
                  victims:
                    type: array
                    items:
                      type: object
                      required: [gamertag, frags, deaths, ratio, match_count]
                      properties:
                        gamertag: { type: string }
                        frags: { type: integer }
                        deaths: { type: integer }
                        ratio: { type: number }
                        match_count: { type: integer }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/pages/career/csrs:
    get:
      tags: [career]
      operationId: getCareerCSRs
      summary: "Classements CSR par playlist (snapshots current / season / all-time)"
      description: |
        Retourne pour chaque playlist ranked les snapshots CSR `current`,
        `season`, `all_time`, agrégés depuis `player_csr_snapshots` (Q26) pour la
        saison demandée. Si la table est absente, dégradation silencieuse (200
        avec liste vide).

        Le paramètre `season` sélectionne la saison CSR à afficher (vide → saison
        courante configurée). `available_seasons` liste les saisons proposables
        dans le menu déroulant (saisons ayant des données classées pour le joueur
        + saison courante). LUSR n'est pas concerné (cumulatif, hors saison).
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
        - name: season
          in: query
          required: false
          schema:
            type: string
          description: |
            Saison CSR à afficher (ex. "CsrSeason13-1"). Vide → saison courante.
      responses:
        "200":
          description: Classements CSR par playlist
          content:
            application/json:
              schema:
                type: object
                required: [playlists, season_id, available_seasons]
                properties:
                  season_id:
                    type: string
                    description: Saison effectivement retournée (sélectionnée ou courante)
                  available_seasons:
                    type: array
                    description: Saisons proposables dans le menu déroulant (CSR uniquement)
                    items:
                      $ref: "#/components/schemas/CSRSeasonOption"
                  playlists:
                    type: array
                    items:
                      type: object
                      required: [playlist_id, playlist_name, queue, input, current, season, all_time]
                      properties:
                        playlist_id: { type: string }
                        playlist_name: { type: string }
                        queue: { type: string }
                        input: { type: string }
                        current:
                          $ref: "#/components/schemas/CareerCSRRank"
                        season:
                          $ref: "#/components/schemas/CareerCSRRank"
                        all_time:
                          $ref: "#/components/schemas/CareerCSRRank"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Pattern Engine v3 — contextes / comportements / leviers
  # -------------------------------------------------------------------------
  /players/{player_slug}/patterns:
    get:
      tags: [progression]
      operationId: getPlayerPatterns
      summary: "Pattern Engine v3 — contextes, comportements, leviers calibrés"
      description: |
        Retourne le rapport Pattern Engine (PLAN_PATTERN_ENGINE_V3) pour le
        joueur : patterns contextuels (by mode/map/squad), patterns comportementaux
        (tilt/fatigue/engagement/plateau/plafond), et leviers calibrés p60
        (top 3 axes d'amélioration). Analyse sur les `n` derniers matchs.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
        - name: n
          in: query
          required: false
          description: "Nombre de matchs récents à analyser (10 ≤ n ≤ 200, défaut 50)."
          schema:
            type: integer
            minimum: 10
            maximum: 200
            default: 50
      responses:
        "200":
          description: Rapport patterns du joueur (peut être vide si aucun match)
          content:
            application/json:
              schema:
                type: object
                required: [window_size, context_patterns, behavior_patterns, levers, computed_at]
                properties:
                  window_size:
                    type: integer
                    description: Taille effective de la fenêtre analysée
                  context_patterns:
                    type: array
                    items:
                      type: object
                      description: "Pattern contextuel (mode/map/squad) — schéma libre côté frontend"
                  behavior_patterns:
                    type: array
                    items:
                      type: object
                      description: "Pattern comportemental (tilt/fatigue/...) — schéma libre"
                  levers:
                    type: array
                    items:
                      type: object
                      description: "Levier calibré (axe d'amélioration p60)"
                  computed_at:
                    type: string
                    format: date-time
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Achievements Xbox (bilingues EN/FR)
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/achievements:
    get:
      tags: [career]
      operationId: getAchievementsPage
      summary: "Page Achievements Xbox du joueur"
      description: |
        Retourne la liste fusionnée des achievements Xbox (référentiel bilingue
        EN/FR) avec la progression du joueur. Triés : unlocked en premier
        (UnlockedAt DESC), puis locked par gamerscore DESC.

        Données peuplées par le sync engine post-sync ou par la CLI
        `levelup sync-achievements`. Si la table est vide (backfill jamais lancé),
        renvoie une réponse `{summary: zeros, achievements: []}`.

        Capability requise : `achievements` — middleware retourne 405 si le
        titre courant ne supporte pas cette feature.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Page Achievements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AchievementsPageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Match History (P1)
  # -------------------------------------------------------------------------
  /players/{player_slug}/pages/match-history/query:
    post:
      tags: [match-history]
      operationId: queryMatchHistory
      summary: "Requête paginée de l'historique des parties"
      description: |
        Retourne la page paginée de l'historique des parties pour un joueur.

        **Invariants :**
        - `table` est une PaginatedResponse avec `items` et `pagination`
        - `export_hint` est optionnel
        - `match_url` est porté par chaque ligne, pas reconstruit côté frontend
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchHistoryQueryRequest"
      responses:
        "200":
          description: Historique paginé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchHistoryPageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/pages/match-history/export:
    get:
      tags: [match-history]
      operationId: exportMatchHistory
      summary: "Export CSV de l'historique"
      description: |
        Génère un jeton d'export CSV pour l'historique filtré des parties.
        Sprint 49 : aligné sur GET (chi) — l'export utilise les filtres de session,
        pas un body POST.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: Jeton d'export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Explorer (P1)
  # -------------------------------------------------------------------------
  /directory/gamertags/search:
    get:
      tags: [explorer]
      operationId: searchGamertags
      summary: "Recherche floue de gamertags"
      description: |
        Recherche floue de gamertags dans la base partagée.
        Accessible sans joueur courant (endpoint global).

        **Invariants :**
        - Une recherche sans résultat renvoie 200 avec items = []
        - q minimum 2 caractères pour retourner des résultats
      parameters:
        - name: q
          in: query
          description: Requête de recherche (min. 2 caractères)
          schema:
            type: string
            default: ""
        - name: limit
          in: query
          description: Nombre maximal de suggestions
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 8
      responses:
        "200":
          description: Suggestions de gamertags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamertagSearchResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/pages/explorer/matches-query:
    post:
      tags: [explorer]
      operationId: queryExplorerMatches
      summary: "Requête paginée des matchs Explorer"
      description: Retourne la liste paginée et filtrée des matchs pour la vue Explorer.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplorerMatchesQueryRequest"
      responses:
        "200":
          description: Matchs Explorer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorerMatchesQueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/pages/explorer/player-query:
    post:
      tags: [explorer]
      operationId: queryExplorerPlayer
      summary: "Profil d'encounter avec un joueur cible"
      description: Retourne le profil d'encounter et les matchs communs avec un joueur cible.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplorerPlayerQueryRequest"
      responses:
        "200":
          description: Profil encounter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplorerPlayerQueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # -------------------------------------------------------------------------
  # Match View (P1)
  # -------------------------------------------------------------------------
  /players/{player_slug}/matches/{match_id}:
    get:
      tags: [match-view]
      operationId: getMatchView
      summary: "Détail complet d'un match"
      description: |
        Retourne le détail complet d'un match (header + rank + 5 onglets).

        **Invariants :**
        - La vue match est un contrat par onglets/blocs métier, pas un dump du MatchDetail canonique
        - Un match introuvable renvoie 404 avec code = match_not_found
        - Les blocs partiels sont autorisés si le contrat principal est servable
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
        - name: match_id
          in: path
          required: true
          description: UUID du match Halo Infinite
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Détail du match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchViewResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /players/{player_slug}/matches/{match_id}/exclusion:
    patch:
      tags: [match-exclusion]
      operationId: setMatchExclusion
      summary: Marquer ou démarquer un match comme non pertinent
      description: |
        Positionne is_excluded pour un match donné dans player_match_enrichment.
        Un match exclu est ignoré partout dans l'app (stats, graphes, historique, export).
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
        - name: match_id
          in: path
          required: true
          description: UUID du match Halo Infinite
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [excluded]
              properties:
                excluded:
                  type: boolean
                  description: "true = ignorer ce match, false = réactiver"
      responses:
        "204":
          description: Exclusion mise à jour avec succès
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # NOTE : GET /players/{player_slug}/match-exclusions supprimé en revue
  # 2026-04-29 P0.2 Q6 (orphelin côté front, vue admin jamais implémentée).
  # PATCH /players/{player_slug}/matches/{match_id}/exclusion reste disponible.

