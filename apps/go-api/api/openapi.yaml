  /players/{player_slug}/engagement/timeseries:
    post:
      description: |
        Retourne les N derniers matchs PvP du scope avec leurs paces. Body aligné sur POST /pages/timeseries : `filters` honore period / cascade / sessions / match_context. `limit` optionnel (défaut 50, max 500). Un body vide équivaut à `{}` (compat smoke).
      operationId: postEngagementTimeseries
      parameters:
        - in: path
          name: player_slug
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                filters:
                  type: object
                limit:
                  maximum: 500
                  minimum: 1
                  type: integer
              type: object
        required: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementTimeseriesResponse'
          description: |
            EngagementTimeseriesResponse — granularity adaptative selon densité
            filtrée : match (≤ limit) → session → week → month. Au-delà de
            workCap=200 matchs filtrés, le binning ne couvre que les N plus
            récents et `truncated_to_recent` est positionné.
        "400":
          description: invalid_json ou invalid_filters
        "404":
          $ref: '#/components/responses/NotFound'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
      summary: Série temporelle de l'engagement filtrée (Mock 11)
      tags:
        - career
