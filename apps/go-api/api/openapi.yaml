      - $ref: "#/components/parameters/PlayerSlug"
      - name: notification_id
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [notifications]
      operationId: patchNotificationUnread
      summary: "Repasse une notification en non-lue"
      responses:
        "200": { description: "Notification mise à jour" }

  /players/{player_slug}/notifications/preferences:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
    get:
      tags: [notifications]
      operationId: getNotificationPreferences
      summary: "Préférences notifications du joueur"
      responses:
        "200": { description: "Préférences" }
    patch:
      tags: [notifications]
      operationId: patchNotificationPreferences
      summary: "Met à jour les préférences"
      responses:
        "200": { description: "Préférences mises à jour" }

  /players/{player_slug}/notifications/unread-count:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
    get:
      tags: [notifications]
      operationId: getNotificationUnreadCount
      summary: "Compteur de notifications non lues"
      responses:
        "200": { description: "Count" }

  /players/{player_slug}/notifications/mark-all-read:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
    post:
      tags: [notifications]
      operationId: postMarkAllRead
      summary: "Marque toutes les notifications comme lues"
      responses:
        "200": { description: "OK" }

  /players/{player_slug}/notifications/mark-read:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
    post:
      tags: [notifications]
      operationId: postMarkRead
      summary: "Marque une liste de notifications comme lues"
      responses:
        "200": { description: "OK" }

  /players/{player_slug}/notifications/test:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
    post:
      tags: [notifications]
      operationId: postNotificationTest
      summary: "Émet une notification de test (debug)"
      responses:
        "200": { description: "Notification émise" }

  # Couche progression V2 (Ascension) — streaks / records / milestones.
  # Cf. .ai/PLAN_PROGRESSION_TRACKING_ASCENSION.md §8.1.
  /players/{player_slug}/streaks:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
    get:
      tags: [progression]
      operationId: listProgressionStreaks
      summary: "Liste des streaks du joueur (active + historique)"
      responses:
        "200": { description: "Streaks" }

  /players/{player_slug}/records:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
      - name: history_limit
        in: query
        required: false
        schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        description: "Limite l'historique des PB battus (défaut 50, max 200)"
    get:
      tags: [progression]
      operationId: listProgressionRecords
      summary: "PB courants + timeline des records battus"
      responses:
        "200": { description: "Records" }

  /players/{player_slug}/milestones:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
    get:
      tags: [progression]
      operationId: listProgressionMilestones
      summary: "Catalogue de milestones + statut Earned par milestone"
      responses:
        "200": { description: "Milestones" }

  # PlayerProfile V1 (Ascension) — Sections A1/A2/B/C
  /players/{player_slug}/profile:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
      - name: window_days
        in: query
        required: false
        schema: { type: integer, minimum: 7, maximum: 120, default: 30 }
        description: "Fenêtre d'analyse en jours (clampé 7..120)"
    get:
      tags: [progression]
      operationId: getPlayerProfile
      summary: "Profil joueur complet (radar 6 axes, style FK/FD, tier LUSR + 8 composantes, leviers, suggestions)"
      responses:
        "200": { description: "PlayerProfile" }
        "404": { description: "Joueur inconnu" }

  # ImprovementCampaign V1 (§4.5) — boucle profil → objectif → suivi
  /players/{player_slug}/campaigns:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
    post:
      tags: [progression]
      operationId: startCampaign
      summary: "Démarrer une campagne d'amélioration sur un axe (snapshot des 100 derniers matchs)"
      responses:
        "201": { description: "Campagne créée" }
        "400": { description: "Axe invalide" }
        "409": { description: "Une campagne est déjà active" }

  /players/{player_slug}/campaigns/active:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
    get:
      tags: [progression]
      operationId: getActiveCampaign
      summary: "Campagne active du joueur (null si aucune)"
      responses:
        "200": { description: "Campagne ou null" }

  /players/{player_slug}/campaigns/{id}:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: "ID de la campagne"
    get:
      tags: [progression]
      operationId: getCampaignByID
      summary: "Détail d'une campagne + défis liés"
      responses:
        "200": { description: "Campagne" }
        "404": { description: "Campagne inconnue" }

  /players/{player_slug}/campaigns/{id}/pause:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [progression]
      operationId: pauseCampaign
      summary: "Mettre une campagne active en pause"
      responses:
        "204": { description: "Campagne mise en pause" }
        "404": { description: "Campagne inconnue" }
        "409": { description: "Transition d'état invalide" }

  /players/{player_slug}/campaigns/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [progression]
      operationId: resumeCampaign
      summary: "Reprendre une campagne en pause"
      responses:
        "204": { description: "Campagne reprise" }
        "404": { description: "Campagne inconnue" }
        "409": { description: "Transition d'état invalide" }

  /players/{player_slug}/campaigns/{id}/close:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [progression]
      operationId: closeCampaign
      summary: "Clôturer une campagne (status=completed)"
      responses:
        "204": { description: "Campagne clôturée" }
        "404": { description: "Campagne inconnue" }
        "409": { description: "Campagne déjà terminée" }

  /players/{player_slug}/campaigns/{id}/abandon:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [progression]
      operationId: abandonCampaign
      summary: "Abandonner une campagne (status=abandoned, sans pénalité)"
      responses:
        "204": { description: "Campagne abandonnée" }
        "404": { description: "Campagne inconnue" }
        "409": { description: "Campagne déjà terminée" }

  # Coach Advisor — pont coach proactif → Prestige (ADR 0020).
  # Lecture des proposals + actions accept/dismiss. La génération s'exécute
  # côté post-sync hook (lit settings.coach_proactive_mode pour opt-in).
  /players/{player_slug}/coach/proposals:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [pending, accepted, dismissed, superseded, obsoleted, stale]
        description: "Filtre par status (vide = toutes les proposals)"
    get:
      tags: [progression]
      operationId: listCoachProposals
      summary: "Liste des proposals coach (challenges/arcs Prestige calibrés sur signaux récents)"
      responses:
        "200": { description: "Proposals" }
        "404": { description: "Joueur inconnu" }
        "503": { description: "Coach advisor non configuré ou indisponible pour ce joueur" }

  /players/{player_slug}/coach/proposals/{id}/accept:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [progression]
      operationId: acceptCoachProposal
      summary: "Matérialise une proposal coach via prestige.CreateChallenge ou CreateArc (Source=\"coach\")"
      responses:
        "200": { description: "Accepted — challenge_id ou arc_id + challenge_ids dans la réponse" }
        "400": { description: "id manquant" }
        "404": { description: "Proposal ou joueur inconnu" }
        "409": { description: "Proposal n'est plus pending (déjà accepted/dismissed/superseded/obsoleted)" }
        "503": { description: "Coach advisor non configuré" }

  /players/{player_slug}/coach/proposals/{id}/dismiss:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [progression]
      operationId: dismissCoachProposal
      summary: "Marque une proposal comme dismissed (idempotent — no-op si déjà résolue)"
      responses:
        "200": { description: "Dismissed" }
        "400": { description: "id manquant" }
        "404": { description: "Joueur inconnu" }
        "503": { description: "Coach advisor non configuré" }

  # Watcher (présence Xbox/Steam)
  /watcher/auth/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [xbox, steam]
    get:
      tags: [auth]
      operationId: getWatcherAuthCallback
      summary: "Callback OAuth watcher (Xbox / Steam)"
      responses:
        "200": { description: "Callback OK" }

  /watcher/auth/start:
    post:
      tags: [auth]
      operationId: postWatcherAuthStart
      summary: "Démarre le flow d'auth watcher"
      responses:
        "200": { description: "URL de redirection OAuth" }

  /watcher/status:
    get:
      tags: [auth]
      operationId: getWatcherStatus
      summary: "Statut watcher (provider, token expiry, last_seen)"
      responses:
        "200": { description: "Watcher status" }

  /watcher/subscriptions:
    patch:
      tags: [auth]
      operationId: patchWatcherSubscriptions
      summary: "Mise à jour des abonnements watcher"
      responses:
        "200": { description: "Subscriptions mises à jour" }

  # Settings (étendu)
  /settings/media/scan:
    post:
      tags: [settings]
      operationId: postSettingsMediaScan
      summary: "Lance un scan du dossier médias"
      responses:
        "200": { description: "Scan démarré" }

  /settings/sessions/recalculate:
    post:
      tags: [settings]
      operationId: postSettingsSessionsRecalculate
      summary: "Recalcule les sessions à partir de la base actuelle"
      responses:
        "200": { description: "Recalcul démarré" }

  /settings/backup/status:
    get:
      tags: [settings]
      operationId: getBackupStatus
      summary: "Statut du scheduler de sauvegarde"
      responses:
        "200":
          description: Statut courant (enabled, last backup, DBs exportées, config)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatusResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /settings/backup/run:
    post:
      tags: [settings]
      operationId: postBackupRun
      summary: "Déclenche un cycle de sauvegarde immédiat"
      responses:
        "200":
          description: Résultat du cycle (snapshot_id, bases exportées, durée)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRunResult"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Scheduler non initialisé (backup désactivé)

  # Sync
  /players/{player_slug}/sync:
    parameters:
      - $ref: "#/components/parameters/PlayerSlug"
    post:
      tags: [sync]
      operationId: postPlayerSync
      summary: "Sync delta par joueur"
      responses:
        "200": { description: "Sync démarré" }

  /sync/all:
    post:
      tags: [sync]
      operationId: postSyncAll
      summary: "Sync delta global (tous les joueurs configurés)"
      responses:
        "200": { description: "Sync global démarré" }

  /backfill/start:
    post:
      tags: [sync]
      operationId: postBackfillStart
      summary: "Lance un backfill (job long)"
      responses:
        "200": { description: "Job créé, voir GET /jobs/{job_id}" }

  # -------------------------------------------------------------------------
  # Diagnostics (admin/dev — lecture seule)
  # -------------------------------------------------------------------------
  /_diag/csr-coverage/{player_slug}:
    get:
      tags: [diagnostics]
      operationId: getDiagCSRCoverage
      summary: "Diag couverture CSR pour un joueur"
      description: |
        Phase 9 du plan pipeline CSR. Permet de vérifier en 1 ligne si le
        pipeline CSR a bien capturé les données (snapshots Waypoint + MSR
        matured/placement) ou s'il faut lancer un backfill.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: "Couverture CSR"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSRCoverage"
        "404": { $ref: "#/components/responses/NotFound" }

  /_diag/progression/{player_slug}:
    get:
      tags: [diagnostics]
      operationId: getDiagProgression
      summary: "Diag pipeline progression V2 (Ascension)"
      description: |
        Phase 4 plan stabilisation 2026-05-22. Compte les rows dans les
        tables V2 (streak, player_records, record_history, milestone_earned,
        milestone_catalog) pour vérifier que EvaluateProgressionAfterSync
        tourne bien sur l'auto-sync. Si tous les counts joueur sont à 0
        après plusieurs cycles auto-sync (15 min × N), le pipeline V2
        n'est pas câblé correctement.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: "État pipeline progression V2"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressionDiag"
        "404": { $ref: "#/components/responses/NotFound" }

  /_admin/progression/backfill/{player_slug}:
    post:
      tags: [diagnostics]
      operationId: backfillProgression
      summary: "Backfill progression V2 (Ascension) pour un joueur"
      description: |
        Fix 2026-05-30. Force une évaluation progression V2 in-process
        (détecteurs streaks/records/milestones, idempotents) pour un joueur
        dont l'historique existe déjà mais dont le pipeline post-sync n'avait
        jamais abouti (incident timeout shared reader pendant la fenêtre de
        swap RO↔RW). N'émet pas de notifications coach. Renvoie le diag
        (counts) post-exécution pour vérifier que les tables se peuplent.
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
      responses:
        "200":
          description: "Diag pipeline progression V2 après backfill"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressionDiag"
        "404": { $ref: "#/components/responses/NotFound" }

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:

  # -------------------------------------------------------------------------
  # Parameters
  # -------------------------------------------------------------------------
  parameters:
    PlayerSlug:
      name: player_slug
      in: path
      required: true
      description: Slug du joueur (dérivé du gamertag, ex. "Chocoboflor")
      schema:
        type: string

  # -------------------------------------------------------------------------
  # Responses réutilisables
  # -------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
          example:
            code: bad_request
            message: "Paramètre invalide."
            retryable: false
    Unauthorized:
      description: Authentification requise
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
          example:
            code: auth_required
            message: "Authentification requise."
            retryable: false
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
          example:
            code: player_not_found
            message: "Joueur introuvable."
            retryable: false
    InternalError:
      description: Erreur interne
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorSchema"
          example:
            code: internal_error
            message: "Erreur interne du serveur."
            retryable: true

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:

    # --- Backup ---
    IntegrityCheckResult:
      type: object
      properties:
        ok:
          type: boolean
          description: Vrai si PRAGMA integrity_check a retourné "ok"
        detail:
          type: string
          description: Premier message d'erreur (absent si ok ou pragma non supporté)
        checked_at:
          type: string
          format: date-time
          description: Horodatage UTC de la vérification

    BackupStatusResponse:
      type: object
      required: [enabled, available]
      properties:
        enabled:
          type: boolean
          description: Backup activé dans app_settings.json
        available:
          type: boolean
          description: Binaire restic trouvé dans le PATH
        last_backup_at:
          type: string
          format: date-time
          description: Date du dernier backup réussi (absente si jamais sauvegardé)
        last_snapshot_id:
          type: string
          description: ID du dernier snapshot restic
        last_exported:
          type: array
          items:
            type: string
          description: Clés des bases exportées lors du dernier cycle
        last_duration_ms:
          type: integer
          description: Durée du dernier cycle en millisecondes
        integrity_checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/IntegrityCheckResult"
          description: Résultats PRAGMA integrity_check par base (clé = DB key, présent après le premier cycle)
        config:
          type: object
          properties:
            interval:
              type: string
              description: Intervalle entre cycles (ex. "6h0m0s")
            keep_daily:
              type: integer
            keep_weekly:
              type: integer
            keep_monthly:
              type: integer

    BackupRunResult:
      type: object
      required: [skipped]
      properties:
        snapshot_id:
          type: string
          description: ID du snapshot créé (vide si skipped)
        skipped:
          type: boolean
          description: Vrai si aucune DB n'a changé depuis le dernier backup
        exported:
          type: array
          items:
            type: string
          description: Clés des bases exportées
        duration_ms:
          type: integer
          description: Durée du cycle en millisecondes

    # --- Career CSR ---
    CareerCSRRank:
      type: object
      required: [value, tier, sub_tier, measurement_matches_remaining, placement_total]
      properties:
        value:
          type: number
          description: CSR numérique (peut être négatif en mesure)
        tier:
          type: string
          description: Tier Halo (Bronze / Silver / ... / Onyx)
        sub_tier:
          type: integer
          description: Sous-tier 1..6 (0 pour Onyx)
        measurement_matches_remaining:
          type: integer
          description: Nombre de matchs restants avant placement final
        badge_image_url:
          type: string
          nullable: true
          description: URL de l'image du badge (optionnel)
        placement_total:
          type: integer
          description: |
            Seuil placement de la saison du snapshot (5 depuis S3, 10 historique).
            Toujours présent depuis Phase 6 du pipeline CSR.

    CSRSeasonOption:
      type: object
      required: [season_id, label]
      description: |
        Saison CSR sélectionnable dans le menu déroulant "Classements" (page
        Carrière, colonne CSR). Une saison apparaît si le joueur y a des données
        classées (snapshot CSR), plus la saison courante.
      properties:
        season_id:
          type: string
          description: Identifiant saison CSR (ex. "CsrSeason13-1")
        label:
          type: string
          description: Libellé court (ex. "Saison 13")
        is_current:
          type: boolean
          description: Saison active du jour (optionnel)

    # --- Erreurs ---
    FieldErrorSchema:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
          nullable: true

    ApiErrorSchema:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: Code d'erreur stable (snake_case)
          example: player_not_found
        message:
          type: string
          description: Message humain localisé
        retryable:
          type: boolean
          default: false
        details:
          nullable: true
          oneOf:
            - type: object
            - type: array
        field_errors:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/FieldErrorSchema"

    # --- Health ---
    HealthResponse:
      type: object
      required: [status, match_count, db_version]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        match_count:
          type: integer
          description: Nombre de matchs dans shared_matches_v2
        db_version:
          type: string
          description: Version DuckDB embarquée
        checks:
          type: object
          additionalProperties:
            type: string
          description: Résultats individuels par dépendance

    # --- Common ---
    PlayerSummary:
      type: object
      required: [player_slug, gamertag, xuid, waypoint_player]
      properties:
        player_slug:
          type: string
          example: Chocoboflor
        gamertag:
          type: string
          example: Chocoboflor
        xuid:
          type: string
          example: "2535412781684883"
        waypoint_player:
          type: string
        is_demo:
          type: boolean
          default: false

    CapabilityMap:
      type: object
      required:
        - can_read_local_data
        - can_run_sync
        - can_use_live_halo
        - can_manage_settings
        - can_reset_media_index
        - can_view_media
      properties:
        can_read_local_data:
          type: boolean
        can_run_sync:
          type: boolean
        can_use_live_halo:
          type: boolean
        can_manage_settings:
          type: boolean
        can_reset_media_index:
          type: boolean
        can_view_media:
          type: boolean
        can_self_provision:
          type: boolean
          default: false
        can_start_initial_sync:
          type: boolean
          default: false
        can_manage_instance:
          type: boolean
          default: false

    LabelValue:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string
        disabled:
          type: boolean
          nullable: true
        count:
          type: integer
          nullable: true

    SortSpec:
      type: object
      required: [field]
      properties:
        field:
          type: string
        direction:
          type: string
          enum: [asc, desc]
          default: desc

    PaginationRequest:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          default: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 500
          default: 50

    PaginationMeta:
      type: object
      required: [total, page, page_size, has_next, has_prev]
      properties:
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        has_next:
          type: boolean
        has_prev:
          type: boolean

    FreshnessInfo:
      type: object
      properties:
        source:
          type: string
          enum: [live, cached, mixed]
          default: cached
        sync_status:
          type: string
          enum: [fresh, stale, unknown]
          default: unknown
        warnings:
          type: array
          items:
            type: string

    PlotlyFigurePayload:
      type: object
      required: [figure]
      properties:
        figure:
          type: object
          description: fig.to_plotly_json() — data + layout + frames
        config_key:
          type: string
          enum: [clean, static]
          default: clean
        revision_key:
          type: string
          nullable: true

    # --- Bootstrap ---
    FeatureFlags:
      type: object
      properties:
        v7_enabled:
          type: boolean
          default: true
