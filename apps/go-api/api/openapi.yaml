          description: player_slug inconnu
        "503":
          description: |
            Au moins une section est vide sans raison. Body :
            `{ok: false, player, checks: {section: 'ok'|'missing (raison)'},
            empty_sections: ['banner', 'highest_csr', ...]}`
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: Error
