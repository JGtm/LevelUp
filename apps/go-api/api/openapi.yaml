  # P8.8 (revue 2026-04-29) — Rattrapage OpenAPI delta → 0.
  # Documentation minimale (operationId + summary + 200) pour les ~45 routes
  # squad-v2 / engagement / multi-title / asset-drawer / prestige / admin /
  # auth / notifications / watcher / settings / media / sync ajoutées au
