      summary: Créer un profil joueur
      description: |
        Crée (ou met à jour) le couple (joueur, titre) dans db_profiles.json.
        Onboarding multi-titre : appeler une fois par titre choisi, avec son
        title_slug et son initial_max_matches. title_slug du body prime sur le
        titre du contexte (header X-LevelUp-Title).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gamertag]
              properties:
                gamertag:
                  type: string
                xuid:
                  type: string
                profile_mode:
                  type: string
                  description: "xbox | azure_manual"
                title_slug:
                  type: string
                  description: "Titre cible (défaut: titre du contexte puis halo_infinite)"
                initial_max_matches:
                  type: integer
                  description: "Nb de matchs à synchroniser à l'onboarding (0 = défaut)"
      responses:
        "201":
          description: Profil créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePlayerProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
