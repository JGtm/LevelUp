  # 2026-04-29 P0.2 Q6 (orphelin côté front, vue admin jamais implémentée).
  # PATCH /players/{player_slug}/matches/{match_id}/exclusion reste disponible.

  # -------------------------------------------------------------------------
  # Sélection par titre (Pass B.5) — activer / pause / purge un titre du joueur.
  # Owner-gated, SANS RequireActiveTitle (agit sur un titre coming_soon/archivé).
  # -------------------------------------------------------------------------
  /profiles/{player_slug}/titles/{slug}/sync:
    patch:
      tags: [setup]
      operationId: setTitleSync
      summary: Activer ou mettre en pause un titre pour un joueur
      description: |
        Bascule sync_enabled du couple (joueur, titre) dans db_profiles.json.
        Mettre en pause conserve les données sur disque (réactivable sans re-sync).
        Refuse de mettre en pause le DERNIER titre actif du joueur (409).
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
        - name: slug
          in: path
          required: true
          description: Slug du titre cible (ex. halo_infinite, halo_5)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TitleSyncInputBody"
      responses:
        "200":
          description: État de sync mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitleSyncOutputBody"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /profiles/{player_slug}/titles/{slug}/data:
    delete:
      tags: [setup]
      operationId: purgeTitleData
      summary: Purger les données d'un titre pour un joueur
      description: |
        Retire le couple (joueur, titre) de db_profiles.json et supprime les
        fichiers de données du joueur pour ce titre. Refuse de purger le DERNIER
        titre actif du joueur (409). data_removed=false si les fichiers n'ont pas
        pu être supprimés malgré le retrait du profil (verrou disque résiduel).
      parameters:
        - $ref: "#/components/parameters/PlayerSlug"
        - name: slug
          in: path
          required: true
          description: Slug du titre cible
          schema:
            type: string
      responses:
        "200":
          description: Titre purgé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TitlePurgeOutputBody"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

