components:
  parameters:
    PlayerSlug:
      description: Slug du joueur (dérivé du gamertag, ex. "Chocoboflor")
      in: path
      name: player_slug
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      content:
        application/json:
          example:
            code: bad_request
            message: Paramètre invalide.
            retryable: false
          schema:
            $ref: '#/components/schemas/ApiError'
      description: Requête invalide
    Conflict:
      content:
        application/json:
          example:
            code: last_active_title
            message: Au moins un titre doit rester actif pour ce joueur.
            retryable: false
          schema:
            $ref: '#/components/schemas/ApiError'
      description: Conflit avec l'état courant de la ressource
    InternalError:
      content:
        application/json:
          example:
            code: internal_error
            message: Erreur interne du serveur.
            retryable: true
          schema:
            $ref: '#/components/schemas/ApiError'
      description: Erreur interne
    NotFound:
      content:
        application/json:
          example:
            code: player_not_found
            message: Joueur introuvable.
            retryable: false
          schema:
            $ref: '#/components/schemas/ApiError'
      description: Ressource introuvable
    Unauthorized:
      content:
        application/json:
          example:
            code: auth_required
            message: Authentification requise.
            retryable: false
          schema:
            $ref: '#/components/schemas/ApiError'
      description: Authentification requise
