      description: |
        Sync initiale title-aware. title_slug cible la bonne DB (lève l'ambiguïté
        d'un gamertag présent sous plusieurs titres) ; à défaut, le titre du
        contexte. max_matches : 1-2000 ; 0 = défaut du profil (initial_max_matches)
        puis 200.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [player_slug]
              properties:
                player_slug:
                  type: string
                max_matches:
                  type: integer
                  description: "1-2000 ; 0 = défaut profil puis 200"
                title_slug:
                  type: string
                  description: "Titre cible (défaut: titre du contexte puis halo_infinite)"
      responses:
