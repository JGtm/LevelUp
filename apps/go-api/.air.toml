# .air.toml — configuration hot-reload pour github.com/air-verse/air
# Usage : air (depuis apps/go-api/) ou make go-api-dev

root = "."
tmp_dir = "tmp"

[build]
  # Commande de build — CGO_ENABLED est hérité de l'environnement (set dans le Makefile)
  cmd = "go build -o ./tmp/server.exe ./cmd/server/"
  # Binaire à exécuter après build (remplace l'ancien build.bin déprécié)
  entrypoint = "./tmp/server.exe"
  # Arguments passés au binaire (vide ici, config via env vars)
  args_bin = []

  # Fichiers déclenchant un rebuild
  include_ext = ["go"]
  # Répertoires exclus du watcher
  exclude_dir = [
    "tmp",
    "bin",
    "testdata",
    "vendor",
    "contracttest",
  ]
  # Briques Go (ADR 0041) surveillées EN PLUS de root : un include_dir hors de root est un
  # répertoire supplémentaire pour air (>= v1.65, runner/config.go normalizeIncludeDirs), il ne
  # restreint pas la surveillance de root. exclude_dir compare un chemin relatif EXACT à root :
  # il ne voit pas les testdata/ et research/ imbriqués des briques, d'où l'exclusion par motif
  # ci-dessous (séparateur / ou \ pour Windows).
  include_dir = [
    "../../libs/film",
    "../../libs/gamefiles",
    "../../libs/himap",
  ]
  # Fichiers exclus du watcher
  exclude_file = []
  # Patterns exclus (appliqués au chemin absolu du fichier modifié)
  exclude_regex = [
    "_test\\.go$",
    '[/\\]libs[/\\].*[/\\](testdata|research)[/\\]',
  ]

  # Délai avant rebuild (évite les rebuilds en rafale lors de sauvegardes multiples)
  delay = 500 # ms

  # Arrêt du process avant relance.
  #
  # ATTENTION Windows : air NE supporte PAS send_interrupt sur Windows — il fait un
  # `TASKKILL /F /T` (force-kill de l'arbre de process, cf. air runner/util_windows.go).
  # Le shutdown gracieux Go (signal handler → duckdb.CloseAll) n'est donc JAMAIS appelé
  # ici, et kill_delay est ignoré. Conséquence : au hot-reload, l'OS met ~1-2 s à libérer
  # les HANDLEs DuckDB de l'ancien process tué de force, et le nouveau peut les trouver
  # encore verrouillés. La mitigation est côté ouverture DB (retry borné sur lock) :
  #   - metadata/shared : cmd/server/main.go (metaOpenAttempts, 12×500 ms)
  #   - player DB        : internal/platform/duckdb/pool.go (openPlayerRWWithLockRetry)
  # send_interrupt + kill_delay ci-dessous ne servent donc QUE sur Linux (deploy/CI), où
  # air envoie bien SIGTERM et attend kill_delay → le shutdown gracieux Go s'exécute.
  send_interrupt = true
  kill_delay = "5s"

  # Afficher les logs du binaire dans le terminal
  log = "build-errors.log"

[log]
  # Préfixe des messages air
  time = false
  # Masquer les logs "watching..."
  main_only = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Nettoyer le binaire tmp à l'arrêt
  clean_on_exit = true
  # Masquer le banner ASCII air au démarrage
  startup_banner = ""
