# .air.toml — configuration hot-reload pour github.com/air-verse/air
# Usage : air (depuis apps/go-api/) ou make go-api-dev

root = "."
tmp_dir = "tmp"

[build]
  # Commande de build — CGO_ENABLED est hérité de l'environnement (set dans le Makefile).
  # Construit le serveur ET son lanceur de dev (cmd/devlaunch, cf. le bloc d'arrêt plus bas) :
  # avec -o <dossier>/, go écrit tmp/server.exe et tmp/devlaunch.exe (air exécute cette commande
  # par PowerShell 5.1 sous Windows, où && n'existe pas).
  cmd = "go build -o ./tmp/ ./cmd/server/ ./cmd/devlaunch/"
  # Air lance le LANCEUR, jamais le serveur directement ; le serveur est son premier argument.
  entrypoint = "./tmp/devlaunch.exe"
  # Arguments passés au lanceur : le chemin du serveur (le lanceur y ajoute -arret-sur-stdin).
  args_bin = ["./tmp/server.exe"]

  # Fichiers déclenchant un rebuild
  include_ext = ["go"]
  # Répertoires exclus du watcher
  exclude_dir = [
    "tmp",
    "bin",
    "testdata",
    "vendor",
    "contracttest",
  ]
  # Fichiers exclus du watcher
  exclude_file = []
  # Patterns exclus (appliqués au chemin absolu du fichier modifié)
  exclude_regex = [
    "_test\\.go$",
  ]

  # Délai avant rebuild (évite les rebuilds en rafale lors de sauvegardes multiples)
  delay = 500 # ms

  # Arrêt du process avant relance.
  #
  # WINDOWS (poste de dev) : air NE supporte PAS send_interrupt — il fait un
  # `TASKKILL /F /T` (force-kill de l'arbre de process, cf. air runner/util_windows.go), aucun
  # gestionnaire d'arrêt Go ne s'exécute, kill_delay est ignoré ; et pre_cmd tourne APRÈS ce
  # kill (air v1.65.1 : stopBin puis buildRun), il ne peut donc rien y changer. L'arrêt propre
  # passe par un lanceur : air lance cmd/devlaunch (entrypoint) et non le serveur. Le lanceur
  # tient le bout écrivain du stdin du serveur, lancé avec -arret-sur-stdin, et le serveur n'est
  # PAS son descendant (double lancement : le parent du serveur sort aussitôt), donc TASKKILL /T
  # ne l'atteint pas. Air tue le lanceur -> l'OS ferme le tube -> le serveur lit EOF et exécute sa
  # séquence d'arrêt complète (phases, CHECKPOINT, fermeture des bases ; journal
  # « arrêt: terminé » clean=true) -> le prochain lanceur attend (45 s au plus) que le port se
  # libère avant de lancer le nouveau serveur. C'est le contrat de la coquille desktop.
  # Le lanceur ne lit que l'environnement pour le port (LEVELUP_API_PORT, défaut 8000).
  #
  # LINUX (deploy/CI) : air envoie SIGTERM au lanceur et attend kill_delay ; le lanceur meurt,
  # le serveur s'arrête par EOF, avec le même résultat. send_interrupt + kill_delay restent pour
  # ce cas.
  send_interrupt = true
  kill_delay = "5s"

  # Afficher les logs du binaire dans le terminal
  log = "build-errors.log"

[log]
  # Préfixe des messages air
  time = false
  # Masquer les logs "watching..."
  main_only = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  # Nettoyer le binaire tmp à l'arrêt
  clean_on_exit = true
  # Masquer le banner ASCII air au démarrage
  startup_banner = ""
