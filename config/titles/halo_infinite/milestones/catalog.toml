icon      = "milestone_wins_50"

[[milestones]]
id        = "halo_infinite.wins.250"
metric    = "wins"
threshold = 250
title     = { en = "Victory Veteran", fr = "Vétéran de la victoire" }
icon      = "milestone_wins_250"

[[milestones]]
id        = "halo_infinite.wins.1000"
metric    = "wins"
threshold = 1000
title     = { en = "Champion", fr = "Champion" }
icon      = "milestone_wins_1000"

