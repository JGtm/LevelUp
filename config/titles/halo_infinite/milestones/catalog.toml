title     = { en = "Serial Killer", fr = "Tueur en série" }
icon      = "milestone_kills_10000"

# ─── Headshots ─────────────────────────────────────────────────────────────

[[milestones]]
id        = "halo_infinite.headshots.500"
metric    = "headshots"
threshold = 500
title     = { en = "Marksman", fr = "Tireur d'élite" }
icon      = "milestone_headshots_500"

