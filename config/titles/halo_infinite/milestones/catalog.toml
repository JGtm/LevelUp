# Halo Infinite — Catalogue de milestones (couche 2 du plan V2 Ascension).
#
# Chargé au boot dans `metadata.duckdb` via milestones.SyncCatalog.
# Schéma : cf. apps/go-api/internal/progression/milestones/catalog_loader.go.
#
# Conventions :
#  - id : préfixé par `halo_infinite.` + metric + threshold (ex: halo_infinite.matches.100)
#  - metric : clé snake_case alignée sur les agrégats du PlayerStats
#    (matches_played, wins, kills, headshots, assists, accuracy_threshold_days)
#  - threshold : > 0 obligatoire
#  - title : table par langue `{ en = "...", fr = "..." }`, toute langue `required` de config/locales.toml obligatoire (intégrée au manifest i18n notif)
#  - condition_text : idem, optionnelle ; `condition` reste la formule technique (hors langue)
#  - icon : nom logique (résolu côté front via le mapping assets)
#  - condition : descriptif libre, non évalué (purement UI)

[meta]
schema_version = 1
title_slug = "halo_infinite"

# ─── Volume : matchs joués ─────────────────────────────────────────────────

[[milestones]]
id        = "halo_infinite.matches.100"
metric    = "matches_played"
threshold = 100
title     = { en = "Centurion", fr = "Centurion" }
icon      = "milestone_matches_100"

[[milestones]]
id        = "halo_infinite.matches.500"
metric    = "matches_played"
threshold = 500
title     = { en = "Veteran", fr = "Vétéran" }
icon      = "milestone_matches_500"

[[milestones]]
id        = "halo_infinite.matches.1000"
metric    = "matches_played"
threshold = 1000
title     = { en = "Elite Spartan", fr = "Spartan d'élite" }
icon      = "milestone_matches_1000"

