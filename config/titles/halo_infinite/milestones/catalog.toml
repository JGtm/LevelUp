# ─── Assists (axe support) ─────────────────────────────────────────────────

[[milestones]]
id        = "halo_infinite.assists.500"
metric    = "assists"
threshold = 500
title     = { en = "Reliable Support", fr = "Soutien fidèle" }
icon      = "milestone_assists_500"

[[milestones]]
id        = "halo_infinite.assists.2500"
metric    = "assists"
threshold = 2500
title     = { en = "Team Pillar", fr = "Pilier d'équipe" }
icon      = "milestone_assists_2500"

# ─── Régularité (jours distincts avec performance) ────────────────────────
# Métrique compute par l'orchestrateur post-sync : nombre de jours distincts
# où le joueur a un match avec accuracy >= 0.50. Approche Duolingo-like.

[[milestones]]
id        = "halo_infinite.accuracy_consistent.30d"
metric    = "accuracy_threshold_days"
threshold = 30
title     = { en = "Steady Marksman", fr = "Tireur régulier" }
icon      = "milestone_accuracy_30days"
condition = "accuracy >= 0.50 sur 30 jours distincts"
condition_text = { en = "At least 50% accuracy on 30 distinct days", fr = "Précision d'au moins 50 % sur 30 jours distincts" }

[[milestones]]
id        = "halo_infinite.accuracy_consistent.90d"
metric    = "accuracy_threshold_days"
threshold = 90
title     = { en = "Daily Marksman", fr = "Tireur d'élite quotidien" }
icon      = "milestone_accuracy_90days"
condition = "accuracy >= 0.50 sur 90 jours distincts"
condition_text = { en = "At least 50% accuracy on 90 distinct days", fr = "Précision d'au moins 50 % sur 90 jours distincts" }

# ─── Profil de combat (OC/DR — Phase 5 PLAN_COMBAT_PROFILE_WIRING) ───────────
# Métrique compute par l'orchestrateur post-sync depuis match_participants :
#   combat_precision_matches  : matchs avec OC >= 0.83 (P80)
#   combat_endurance_matches  : matchs avec DR >= 1.59 (P80)
#   combat_excellence_matches : matchs avec OC >= 0.83 ET DR >= 1.59

[[milestones]]
id        = "halo_infinite.combat.precision_1"
metric    = "combat_precision_matches"
threshold = 10
title     = { en = "Precision Achieved", fr = "Précision acquise" }
icon      = "milestone_combat_precision_1"
condition = "10 matchs avec offensive_conversion >= 0.83"
condition_text = { en = "10 matches with high offensive conversion", fr = "10 matchs à forte conversion offensive" }

[[milestones]]
id        = "halo_infinite.combat.precision_2"
metric    = "combat_precision_matches"
threshold = 50
title     = { en = "Relentless Marksman", fr = "Tireur implacable" }
icon      = "milestone_combat_precision_2"
condition = "50 matchs avec offensive_conversion >= 0.83"
condition_text = { en = "50 matches with high offensive conversion", fr = "50 matchs à forte conversion offensive" }

[[milestones]]
id        = "halo_infinite.combat.precision_3"
metric    = "combat_precision_matches"
threshold = 200
title     = { en = "Predator", fr = "Predator" }
icon      = "milestone_combat_precision_3"
condition = "200 matchs avec offensive_conversion >= 0.83"
condition_text = { en = "200 matches with high offensive conversion", fr = "200 matchs à forte conversion offensive" }

[[milestones]]
id        = "halo_infinite.combat.endurance_1"
metric    = "combat_endurance_matches"
threshold = 25
title     = { en = "Armored", fr = "Blindé" }
icon      = "milestone_combat_endurance_1"
condition = "25 matchs avec defensive_resistance >= 1.59"
condition_text = { en = "25 matches with high defensive resistance", fr = "25 matchs à forte résistance défensive" }

[[milestones]]
id        = "halo_infinite.combat.consistency"
metric    = "combat_excellence_matches"
threshold = 10
title     = { en = "Elite Profile", fr = "Profil d'élite" }
icon      = "milestone_combat_excellence"
condition = "10 matchs avec OC >= 0.83 ET DR >= 1.59"
condition_text = { en = "10 matches combining offensive conversion and defensive resistance", fr = "10 matchs alliant conversion offensive et résistance défensive" }
