# ─────────────────────────────────────────────────────────────────────────────
# Halo Infinite — arcs preset (séquences narratives de défis).
#
# Chargé en metadata.duckdb (preset_arc + preset_arc_step) au boot.
# Chaque step référence un template_id défini dans templates.toml et
# spécifie le palier cible attendu pour valider l'étape.
# ─────────────────────────────────────────────────────────────────────────────

[meta]
schema_version = 1
title_slug     = "halo_infinite"

# ═════════════════════ Le Slayer ═════════════════════════════════════════════

[[arcs]]
id              = "halo_infinite.slayer"
title_en        = "The Slayer"
title_fr        = "L'assassin"
description_en  = "Become the offensive force your team needs."
description_fr  = "Deviens la force offensive dont ton équipe a besoin."

  [[arcs.steps]]
  position    = 1
  template_id = "halo_infinite.daily.kda_session"
  target_tier = "normal"

  [[arcs.steps]]
  position    = 2
  template_id = "halo_infinite.weekly.kda_3sessions"
  target_tier = "heroic"

  [[arcs.steps]]
  position    = 3
  template_id = "halo_infinite.weekly.kills_vs_expected"
  target_tier = "legendary"

# ═════════════════════ Le Support ════════════════════════════════════════════

[[arcs]]
id              = "halo_infinite.support"
