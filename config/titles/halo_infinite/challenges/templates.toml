# ─────────────────────────────────────────────────────────────────────────────
# Halo Infinite — catalogue de templates de défis.
#
# Chargé en metadata.duckdb (table challenge_template) au boot.
#
# Convention :
#   - id : slug stable, ne jamais réutiliser un id retiré
#   - metric : référence un FieldKey de internal/games/canonical/fields.go
#   - cibles monotones : normal < heroic < legendary < mythic
#   - mode_filter : universal | pvp | ranked | pve
# ─────────────────────────────────────────────────────────────────────────────

[meta]
schema_version = 1
title_slug     = "halo_infinite"

# ─────────────────────────────────────────────────────────────────────────
# V1 PlayerProfile §6.1 — nouveaux templates pour fermer les gaps de
# couverture LUSR (Deaths vs Expected = 24% du composite mais 0 templates
# directs avant, Defensive Resistance = 6% mais 0 templates).
# ─────────────────────────────────────────────────────────────────────────

[[templates]]
id              = "halo_infinite.monthly.deaths_vs_expected"
metric          = "deaths_vs_expected"
window_type     = "rolling_days"
window_value    = "30"
cadence         = "monthly"
eval_type       = "threshold"
mode_filter     = "pvp"
label           = { en = "Death below expectations", fr = "Meurs moins que prévu" }
description     = { en = "Die less often than your MMR predicts over 30 days.", fr = "Meurs moins souvent que prévu pour ton MMR sur 30 jours." }
normal_target   = 1.05
heroic_target   = 1.15
legendary_target = 1.25
mythic_target   = 1.40
lusr_components = ["deaths_vs_expected"]
radar_axes      = ["survival"]
is_long_term    = true

[[templates]]
id              = "halo_infinite.weekly.deaths_vs_expected"
metric          = "deaths_vs_expected"
window_type     = "session"
window_value    = "3"
cadence         = "weekly"
eval_type       = "threshold"
mode_filter     = "pvp"
label           = { en = "Stay alive (3 sessions)", fr = "Reste en vie (3 sessions)" }
description     = { en = "Die less often than expected across 3 sessions.", fr = "Meurs moins souvent que prévu sur 3 sessions." }
