# ─────────────────────────────────────────────────────────────────────────────
# Halo Infinite — catalogue de templates de défis.
#
# Chargé en metadata.duckdb (table challenge_template) au boot.
#
# Convention :
#   - id : slug stable, ne jamais réutiliser un id retiré
#   - metric : référence un FieldKey de internal/games/canonical/fields.go
#   - cibles monotones : normal < heroic < legendary < mythic
#   - mode_filter : universal | pvp | ranked | pve
#
# Les valeurs sont des points de départ — à recalibrer après alpha via
# scripts/analyze_prestige_tuning.py.
# ─────────────────────────────────────────────────────────────────────────────

[meta]
schema_version = 1
title_slug     = "halo_infinite"

# ═════════════════════ QUOTIDIENS (cadence=daily) ════════════════════════════

[[templates]]
id              = "halo_infinite.daily.kda_session"
metric          = "FieldKDA"
window_type     = "session"
window_value    = "1"
cadence         = "daily"
eval_type       = "threshold"
mode_filter     = "universal"
label_en        = "Stay sharp"
label_fr        = "Reste affûté"
description_en  = "Maintain a strong KDA across one full session."
description_fr  = "Maintiens un bon KDA sur une session complète."
normal_target   = 1.10
heroic_target   = 1.35
legendary_target = 1.65
mythic_target   = 2.10

