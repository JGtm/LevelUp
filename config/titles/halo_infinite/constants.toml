# config/titles/halo_infinite/constants.toml
#
# Constantes Halo-specific qui FUITENT aujourd'hui en littéraux dans le code
# cross-titre (SQL inline, Go const locaux). Source de vérité title-agnostic :
# un 2e titre déclare SES propres valeurs ici, sans toucher au code partagé.
#
# Consommation : prévue quand la couche de requêtes devient title-aware
# (Phase 2 du PLAN_TITLE_AGNOSTIC, cf. ADR 0025). En attendant, ce fichier est
# la référence documentaire unique — tout littéral `1512363953` / préfixe de
# mode dans le code doit pointer ici en commentaire.

[meta]
title_slug = "halo_infinite"
schema_version = 1
# game_prefix — segment d'URL de jeu injecté dans les chemins d'API d'ingestion
# (/hi/players/..., /hi/matches/{id}/stats, /hi/Progression/file/...). Externalisé
# du code (était hardcodé "hi" dans sync/platform/halo/assets). Un 2e titre déclare
# le sien (Halo 5 = "h5"). Consommé via games.GamePrefix(slug) ; fallback "hi".
game_prefix = "hi"

# ─── Hosts d'ingestion API (MT-01 / PMT-1) ──────────────────────────────────
# Source de vérité title-agnostic des hosts consommés par platform/halo +
# internal/sync. Valeurs ALIGNÉES byte-pour-byte sur les const Go actuels (le
# Contract PMT-1 retire ces const un axe à la fois en basculant sur
# EndpointResolver.HostFor). Deux clés peuvent partager un host (nameplate =
# gamecms) ; elles restent distinctes pour migrer chaque call-site sans présumer
# d'une fusion. Note : `stats` et `skill` portent `:443` explicite (halo_client),
# `challenges` ne le porte pas (provider.go defaultChallengesHost).
[endpoints]
stats = "https://halostats.svc.halowaypoint.com:443"          # sync/halo_client.go:46 haloStatsHost
gamecms = "https://gamecms-hacs.svc.halowaypoint.com"         # sync/halo_client.go:47 haloGameCMSHost
economy = "https://economy.svc.halowaypoint.com"              # platform/halo/provider.go:98 defaultEconomyHost
skill = "https://skill.svc.halowaypoint.com:443"              # sync/halo_skill.go:46 haloSkillHost
ugc_film = "https://discovery-infiniteugc.svc.halowaypoint.com"      # sync/halo_client_film.go:20 haloUGCHost
discovery_ugc = "https://discovery-infiniteugc.svc.halowaypoint.com" # sync/discovery_client.go:22 discoveryUGCHost
challenges = "https://halostats.svc.halowaypoint.com"         # platform/halo/provider.go:99 defaultChallengesHost
nameplate = "https://gamecms-hacs.svc.halowaypoint.com"       # sync/spartan_nameplate_resolver.go:34 nameplateHost

# ─── Médailles référencées par ID dans les requêtes ─────────────────────────
# medal_name_id (filmshell UBIGINT) des médailles dont l'agrégation est codée
# en dur côté queries (perfect_kills). Sites actuels (à migrer en Phase 2) :
#   platform/duckdb/{queries_match,queries_squad,queries_home_citations,
#                    compare_repo,explorer_repo,player_matches_repo}.go
#   service/match_view_builders_summary.go (const Go local)
[medals]
perfect_kill = 1512363953  # médaille "Perfect" → exposée en "frags parfaits"

# ─── Modèle de dégâts (baseline rendement / résistance) ─────────────────────
# effective_hp_to_kill = PV effectifs pour tuer un Spartan (bouclier + armure),
# sur l'échelle de dégâts de l'API. Baseline de offensive_conversion (= PV ×
# (frags + assists/3) / dégâts_infligés) et defensive_resistance (= dégâts_subis /
# (PV × morts)). Infinite = 225 (90 vie + 135 bouclier, convention officielle).
# Externalise le littéral `225` câblé en dur (combat_yield.go, squad_breakdown_canonical.go,
# SQL post_sync_progression_queries.go) — cf. PLAN_DAMAGE_MODEL_PER_TITLE.md.
[damage_model]
effective_hp_to_kill = 225
# offensive_conversion_p80 = 0.90 : frontière élite OC (80e percentile) Infinite, repère
# de normalisation des barres/radars de rendement. = la constante historique
# analysis.OffensiveConversionP80, externalisée par titre (h5 = 1.264, calibré data).
offensive_conversion_p80 = 0.90

# ─── Préfixes de mode (normalisation pair_name) ─────────────────────────────
# Réservé : les préfixes Assassin/Fiesta/BTB/Firefight/Ranked sont aujourd'hui
# dans internal/games/halo_infinite/mode_category.go (constantes PerfChain*).
# À externaliser ici lors de la Phase 1.5/2 (non bloquant pour le 2e titre tant
# que mode_category.go reste dans le package halo_infinite).

# ─── Poids d'events du score d'engagement (chantier F7, DE-4) ────────────────
# Coefficients DÉPENDANTS DU GAMEPLAY : importance relative de chaque famille
# d'action dans le RYTHME de la courbe d'engagement (pace pondéré). Externalisés
# par titre (un gameplay au rythme d'objectif / aux assists différents peut vouloir
# d'autres poids). Consommés via games.EngagementWeightsFor(slug) → EngagementScoreInput.
# Weights. Section absente (ou default absent) → temporal.DefaultEventWeights (défaut
# byte-identique). Infinite = valeurs historiques validées (mode 1.5 / assist 0.5 /
# death 0.0 / défaut 1.0, décisions user 2026-06-26 + 2026-07-07 modèle lobby-anchored).
[engagement]
objective = 1.5   # event_type "mode" (objectif, leadership — porter > fragger)
assist    = 0.5   # support (action menée, pas un double comptage du frag)
death     = 0.0   # mort subie (chaque affrontement compte une fois, côté acteur)
default   = 1.0   # kill, medal, first_kill/death, finisher, clutch…

# ─── Éras de multiplicateur d'XP de carrière (Career Rank) ───────────────────
# XP de carrière gagnée par match = multiplicateur(éra) × personal_score. La
# progression Career Rank d'Halo Infinite crédite le Personal/Applied Score du
# match (343). Depuis Operation: Infinite (18 novembre 2025), « the Applied Score
# multipliers for all matchmaking playlists will be doubled » (annonce officielle
# halowaypoint.com/news/operation-infinite-preview ; patch notes support.halowaypoint.com ;
# @HaloSupport 18/11/2025 = doublement permanent). Donc ×1 avant le 2025-11-18,
# ×2 depuis (borne à minuit UTC — l'imprécision d'heure de déploiement est
# négligeable à l'échelle d'un graphe par match). Validation empirique locale sur
# 3 joueurs suivis : 86/87 fenêtres à un seul match propres à ±1 % du delta
# xp_total réel (JGtm 28/29, Madina 28/28, Chocoboflor 30/30), toutes post-18/11.
#
# from/to : date UTC "YYYY-MM-DD" ; vide = borne ouverte (from vide = -inf,
# to vide = +inf). from INCLUSIF, to EXCLUSIF. multiplier > 0.
# v1 = multiplicateur UNIFORME par éra (pas de multiplicateur par playlist : BTB
# SpartanRecord ×1,8 et bots non calibrables sur nos données — raffinement backlog).
# Consommé via games.CareerXPErasFor(slug) → analysis.EstimateCareerXP. Un titre
# sans cette section retombe sur games.DefaultCareerXPEras (byte-identique Infinite).
[[career_xp_eras]]
from = ""
to = "2025-11-18"
multiplier = 1.0

[[career_xp_eras]]
from = "2025-11-18"
to = ""
multiplier = 2.0
