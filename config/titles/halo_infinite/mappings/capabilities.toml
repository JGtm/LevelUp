# config/titles/halo_infinite/mappings/capabilities.toml
#
# Source de vérité des capabilities produit d'un titre (Phase 1.7a).
# Lue au boot par internal/games/mappings/loader_capabilities.go et exposée via
# le Registry (GetCapabilities). Remplace la CapabilityMap codée en dur dans
# internal/games/halo_infinite/adapter_data.go (objectif : 0 hardcode, un 2e
# titre déclare ses capabilities ici sans toucher au Go).
#
# Clés = CapabilityKey canoniques (internal/games/adapter.go). Les points dans
# les clés imposent de les QUOTER (sinon TOML crée des tables imbriquées).
# Valeurs admises : "supported" | "degraded" | "not_exposed"
#   - supported   : exposée pleinement
#   - degraded    : exposée mais partielle/best-effort
#   - not_exposed : non exposée par ce titre (caller dégrade, cf. plan §5.7)
#
# Note : career.progression est déclarée "supported" (intention du titre) ; le
# runtime peut la rétrograder à not_exposed si aucune source carrière n'est
# câblée (cf. adapter_data.go capCareer).
#
# SÉMANTIQUE — éviter le malentendu adapter-vs-données (cf. HANDOFF_HALO5 §2) :
# Ces statuts décrivent ce que le NOUVEL ADAPTER CANONIQUE (adapter_data.go)
# expose, PAS les features de l'app ni le plafond de données du titre.
# Pour halo_infinite, certaines clés sont not_exposed/degraded parce que la
# migration de l'adapter (Phase 1.7a/B/C) ne les a pas encore câblées — l'app
# sert ces surfaces via les chemins LEGACY. Ce n'est PAS une absence de données
# (ex. la page timeseries et les citations tournent en prod via le legacy).
# Pour un titre servi UNIQUEMENT par l'adapter (ex. un 2e titre), ces statuts
# == son plafond RÉEL : à régler d'après ce que SA source fournit, pas en
# recopiant halo_infinite.
#
# Toute modification breaking incrémente schema_version.

[meta]
title_slug     = "halo_infinite"
schema_version = 1

[capabilities]
"match.history"          = "supported"
"match.detail.core"      = "supported"
"match.skill.snapshot"   = "degraded"
"career.progression"     = "supported"
"career.rank_catalog"    = "supported"
# XP de carrière estimée par match (série Timeseries) — XP = multiplicateur d'éra ×
# personal_score. Infinite uniquement (Career Rank fondé sur le Personal Score) ;
# absente pour un titre à système d'XP distinct (Halo 5 = Spartan Rank).
"analytics.career_xp_estimate" = "supported"
"pve.firefight_stats"    = "supported"
"analytics.timeseries"   = "not_exposed"
"match.scoreboard.extra" = "not_exposed"
"citations.engine"       = "not_exposed"
# engagement.score (chantier F7 — double porte) : reflete ce que le titre PEUT
# fournir. supported = coefficients calibres valides -> score servi avec
# calibration=validated ; degraded = signaux OK mais calibration provisoire ->
# score servi avec calibration=provisional (badge front) ; not_exposed = pas de
# score (503 capability_not_supported). Infinite = reference calibree = supported.
"engagement.score"       = "supported"
"battlepass.progression" = "supported"
"challenges.surface"     = "supported"
# Canonical MatchEvents (PLAN_CANONICAL_MATCH_EVENTS) — Phase 2 câblée : la
# timeline est reconstruite depuis highlight_events (+ appariement killer/victim,
# T0) par l'adapter canonique. timeline=degraded (reconstruction lossy : doubles
# simultanés possiblement omis, médailles sans id) ; killfeed.per_kill=degraded
# (kills appariés mais arme/headshot/melee absents — RE film non câblé) ;
# spatial=not_exposed (positions monde non extraites).
"match.events.timeline"  = "degraded"
"match.killfeed.per_kill" = "degraded"
"match.events.spatial"   = "not_exposed"
# Précision par arme : REMISÉE le 2026-09-01 (not_exposed). Le numérateur reconstruit du
# film par l'APPARIEMENT tir↔dégât (action_weapon_fire 0xD2 ↔ damage_aftermath 0xC0 du même
# attaquant, NOTE_ATTRIBUTION_ARME_TIR_2026-08-31) s'est révélé NON FIABLE au recalage : le
# pairing rate ~40 %+ des touches et les armes automatiques ressortent à 0,9-3,3 % vs ~40 %
# côté API (RECALAGE_WEAPON_ACCURACY_FILM_2026-09-01, commit 945c9fdb7). On REMISE : le code
# backend (décodeur, mapper killcollector/hits.go, persister, table match_weapon_hit_distance)
# est conservé, seule l'exposition est retirée. Cette clé data-level gate le numérateur film
# (collectHits) : not_exposed ⇒ la passe film ne s'exécute pas pour Infinite, et le front
# useCapability('weapon_accuracy') repasse à false (charts a/c masqués). La précision GLOBALE
# reste servie par l'API. Reprise : piste compteur ECS (cf. .ai/V7.5/REGISTRE_REPORTS.md).
# Cohérent avec la note « le taux est match.weapon.accuracy, et il est not_exposed » sur
# film.weapon_shots plus bas.
"match.weapon.accuracy"  = "not_exposed"
# Libellés de playlist préfixés d'une catégorie matchmaking ("Arène delta : Héritage")
# à retirer pour l'affichage (analysis.NormalizePlaylistLabel). Trait d'affichage du
# titre lu au site de résolution du libellé (match_view_repo) — absente pour un titre
# dont les noms de playlist officiels n'ont pas ce préfixe (Halo 5).
"playlist.label.strip_category" = "supported"
# Stats objectifs par joueur/match (CTF/Zones (Strongholds+KOTH)/Oddball) extraites
# nativement du payload GetMatchStats (Players[].PlayerTeamStats[0].Stats.<BlocMode>)
# → shared.match_objective_stats. Gouverne le JOIN _latest servi au scoreboard /
# synthesis / squad. Cf. PLAN_V72_OBJECTIVE_STATS.md.
"match.objective.stats"  = "supported"
# Source du dégât fatal PAR MORT, décodée du film Theater (dead-state de la
# victime) → shared.match_kill_events, avec le crédit du kill-feed à côté. Gouverne
# le collecteur internal/sync (passe SÉPARÉE du sync primaire : le film n'existe
# pas encore quand le match arrive). Infinite = supported (30 ancres Theater, 0
# étiquette fausse). ABSENTE pour Halo 5 : autre format de film, et ses mécaniques
# de kill sont déjà natives dans le carnage (commendations.native /
# CapNativeKillMechanics) — il n'a aucun besoin d'un décodeur de film pour ça.
# ⚠ Clé FINE : les tirs par arme et la précision par arme sont des familles
# DISTINCTES, chacune avec ses réserves. Ne pas élargir cette clé.
"film.kill_source"       = "supported"
# Ventilation des tirs PAR ARME décodée du MÊME film, dans la MÊME passe →
# shared.match_weapon_shots (joueur × arme × match, k = 1). Deuxième famille de données
# du film : elle répond à une autre question que le kill enrichi, et elle a ses propres
# réserves (Fiesta et BTB non livrables). ABSENTE pour Halo 5 : pas de décodeur de film,
# et ses compteurs de tirs sont natifs (match.weapon.accuracy).
# ⚠ CETTE CLÉ GOUVERNE LE STOCKAGE, PAS UNE PUBLICATION : la table stocke des COMPTES,
# elle ne publie aucun TAUX (le taux est match.weapon.accuracy, et il est not_exposed).
"film.weapon_shots"      = "supported"
# Positions monde (x,y,z) tueur/victime PAR KILL, décodées du MÊME film dans la MÊME
# passe → shared.kill_positions (G.2bis, sync/killcollector). Troisième famille de
# données du film : répond à OÙ, ni QUI (film.kill_source) ni QUOI (film.weapon_shots).
# Plancher de couverture mesuré 75,8 % (36 artefacts, 1 994 couples) ; positions
# absentes jamais approchées. ABSENTE pour Halo 5 : positions NATIVES dans le carnage
# (match.events.spatial = supported), aucun décodeur de film requis.
# ⚠ Clé FINE, même doctrine que ses deux sœurs — ne pas l'élargir.
# ⚠ GOUVERNE LA CAPTURE (l'écriture) : la lecture canonique (match.events.spatial)
# reste not_exposed tant qu'aucun consommateur ne lit kill_positions pour ce titre
# (G.3, hors périmètre G.2bis).
"film.kill_positions"    = "supported"
# Résumé d'usage PAR MATCH ET PAR JOUEUR dérivé de l'ARTEFACT DE REJEU (tractions de
# grappin, épisodes camo/surbouclier, poses et lâchers d'équipement, prises de socle
# d'arme et de bonus) → shared.match_usage_players + match_usage_films
# (décision utilisateur 2026-09-04 : persistance en BASE au sync, voie sidecar
# abandonnée). Quatrième famille dérivée du film — mais PAS de la même passe : elle se
# dérive de l'artefact QUI VIENT D'ÊTRE cuit (étape post-sync replaybuild), jamais d'un
# second décodage. ABSENTE pour Halo 5 : pas de décodeur de film, donc aucun artefact,
# donc rien à résumer — silence propre, pas une dégradation.
# ⚠ Clé FINE, même doctrine que les trois film.* ci-dessus : elle gouverne la
# PRODUCTION du résumé, pas ce qu'une page en affiche. Ne pas l'élargir.
"film.usage_summary"     = "supported"
# Les CINQ statistiques d'objectif de l'ASSAUT, reconstruites du FILM, par match et par
# joueur (bomb_detonations, bomb_arms, bomb_grabs, time_as_bomb_carrier_seconds,
# bomb_carriers_killed) → shared.match_bomb_stats (append-only + vue _latest).
# POURQUOI PAS match.objective.stats : celle-ci gouverne le JOIN sur match_objective_stats,
# table alimentée par le SYNC API — or l'API 343 ne publie AUCUNE statistique d'objectif
# pour l'Assaut (famille BombStats du moteur = télémétrie Bond, jamais répliquée dans le
# film ; mesure du 2026-09-04, cause unique du silence des deux côtés). Ces chiffres-là
# viennent du décodeur de film, et la convention préfixe film.* tout ce qui en vient.
# ABSENTE pour Halo 5 : pas de décodeur de film, donc rien à reconstruire — silence propre.
# ⚠ Clé FINE, même doctrine que les quatre film.* ci-dessus : elle gouverne la PRODUCTION
# et l'EXPOSITION de ces cinq statistiques, rien d'autre du mode Assaut. Ne pas l'élargir.
"film.bomb_stats"        = "supported"
# L'ARTEFACT DE REJEU 2D lui-même (data/cache/replays/halo_infinite/{match}.json) : trame de
# positions, kill-feed recalé, score, roster, calques d'objectif. C'est la SOURCE dont les
# quatre dérivés du film sont les projections (film.usage_summary, film.bomb_stats, la
# timeline d'objectif et les positions keyframe de la Match View).
# ABSENTE pour Halo 5 (not_exposed) : autre format de film, aucun décodeur, donc aucun
# artefact possible — silence propre, pas une dégradation.
# ⚠ ELLE GOUVERNE LA PRODUCTION, ET L'AFFICHAGE SUIT (décision utilisateur 2026-09-05) :
# sans la clé, l'étape post-sync sync/replayartifacts ne met RIEN en file et ne cuit RIEN,
# et les deux loaders du film de la Match View (/objective-events, /positions) ne sont pas
# câblés — les routes rendent un 503 capability_not_supported au lieu d'un 200 [] trompeur.
# La porte d'AFFICHAGE de la page de rejeu est la capability title-level `replay`
# (domain/title/registry.go), comme match.objective.stats / objective_stats.
# ⚠ Clé FINE, même doctrine que les cinq film.* ci-dessus : elle gouverne l'ARTEFACT, pas ce
# que tel ou tel dérivé en tire — chacun garde la sienne. Ne pas l'élargir.
"film.replay_artifact"   = "supported"
