# config/titles/halo_infinite/mappings/regulation.toml
#
# Temps RÉGLEMENTAIRE par variante de jeu (en secondes) — socle du flag
# « Prolongation » (overtime) exposé sur la Match View et l'Explorateur.
#
# CLÉ = `match_registry.game_variant_name`, c'est-à-dire le NOM D'ASSET UGC servi
# par l'API du titre. Ce nom N'EST PAS un identifiant stable : 343 le fait bouger
# au fil des saisons (renommage de variante, nouvelle déclinaison, suffixe de
# playlist). Conséquence assumée et SÛRE : une variante absente de cette table
# n'a pas de temps réglementaire connu → le match n'est JAMAIS flagué en
# prolongation (jamais de faux positif ; au pire un vrai overtime non signalé).
# Quand un renommage est constaté, ajouter la NOUVELLE clé à côté de l'ancienne
# (les matchs historiques gardent l'ancien nom en base).
#
# VALEUR = mur de temps réglementaire mesuré, en secondes. Contenu initial issu
# d'une mesure sur 1793 matchs : la durée de jeu se tasse sur un plateau net à
# 720 s (12 min) pour toutes les variantes listées ci-dessous.
#
# PÉRIMÈTRE — ce qui est VOLONTAIREMENT absent :
#   - BTB (Big Team Battle) : aucun mur de temps mesurable dans l'échantillon
#     (distribution étalée, pas de plateau) → pas de temps réglementaire fiable.
#   - Modes à manches (Élimination, Attrition, Extraction...) : la durée totale
#     est la somme de N manches de longueur variable ; un seuil unique n'a pas
#     de sens. Un futur support demanderait la durée PAR MANCHE, non disponible.
# Ne rien ajouter ici « au jugé » : une entrée non mesurée produit des faux
# positifs sur toute la surface produit.
#
# Consommation : mappings.LoadRegulationFromFile → Registry.GetRegulation(slug)
# → service (Match View header / Explorateur) → analysis.ComputeOvertime.

[meta]
title_slug     = "halo_infinite"
schema_version = 4

[regulation_seconds]
"CTF:Arena"                   = 720
"CTF:Arena Neutral Flag"      = 720
"Team Slayer:Arena"           = 720
"Slayer:Arena"                = 720
"Slayer:Arena Super Fiesta"   = 720
"Slayer:Arena Tactical"       = 720
"Strongholds:Arena"           = 720
"Arena:Slayer"                = 720
"Arena:Team Slayer"           = 720

# ---------------------------------------------------------------------------------------
# CIBLE DE VICTOIRE par variante (score qui termine le match quand il est atteint) —
# socle du remplissage des barres du bandeau de score du rejeu 2D (schema_version 2).
#
# MEME DOCTRINE QUE regulation_seconds : cle = game_variant_name exact, valeur MESUREE,
# jamais « au juge ». Mesure du 2026-08-24 sur le registre complet : pour chaque variante,
# la distribution de GREATEST(team_0_score, team_1_score) presente (ou non) un PLATEAU —
# la valeur maximale observee, atteinte par >= 2 matchs, sans aucun match au-dessus.
# Les valeurs sous le plateau sont les victoires au chrono (le cas que la cible sert
# precisement a bien afficher : barre non pleine a la fin).
#
# GARDE COTE PRODUCTEUR : une cible n'est publiee dans l'artefact que si AUCUN score
# final du film ne la depasse — une table perimee (343 change une regle) se tait au lieu
# de publier une cible fausse.
#
# VOLONTAIREMENT ABSENTS :
#   - Oddball : mode a MANCHES — le total du match deborde le plateau d'une manche
#     (Ranked:Oddball observe a 286-287 au-dessus du 200). Une cible unique n'a pas de
#     sens sur le TOTAL.
#   - "Arena:King of the Hill" : le plateau n'est atteint que par UN SEUL match (3 sur
#     3 matchs, les deux autres finissent a 2) — la regle des >= 2 matchs au plateau
#     n'est pas tenue. Ses matchs gardent le repli du bandeau.
#   - Attrition, Extraction, Land Grab, Sentry Defense, Escalation BTB, variantes UUID,
#     Firefight PvE : plateau non mesurable (n < 2 au plateau, ou distribution etalee).
#
# Exception justifiee : "Ranked:CTF 3 Captures" n'a qu'un match (fini 1) mais la cible
# est DECLAREE par 343 dans le nom meme de la variante.
[score_target]
# Slayer arene : plateau 50 (mesure massive — 417 matchs a 50 sur Super Fiesta seule).
"Slayer:Arena"               = 50
"Team Slayer:Arena"          = 50
"Slayer:Arena Super Fiesta"  = 50
"Slayer:Arena Fiesta"        = 50
"Slayer:Arena Tactical"      = 50
"Arena:Slayer"               = 50
"Arena:Team Slayer"          = 50
"Arena:Team Snipers"         = 50
"Team Snipers:Arena"         = 50
"Fiesta:Slayer"              = 50
"Super Fiesta:Slayer"        = 50
"Tactical:Slayer"            = 50
"Ranked:Slayer"              = 50
# Slayer BTB : plateau 100.
"BTB:Slayer"                 = 100
"BTB Heavies:Slayer"         = 100
"BTB:Fiesta Slayer"          = 100
"BTB:Team Snipers"           = 100
# CTF : 3 captures partout, SAUF Neutral Flag arene (plateau net a 5, 25 matchs).
"CTF:Arena"                  = 3
"Arena:CTF"                  = 3
"Ranked:CTF"                 = 3
"Ranked:CTF 3 Captures"      = 3
"BTB:CTF"                    = 3
"BTB Heavies:CTF"            = 3
"BTB:Fiesta CTF"             = 3
"CTF:BTB"                    = 3
"Husky Raid:CTF"             = 3
"Husky Raid:Super CTF"       = 3
"Super Husky Raid:CTF"       = 3
"Arena:One Flag CTF"         = 3
"BTB:One Flag CTF"           = 3
"CTF:Arena Neutral Flag"     = 5
# Strongholds : 200 en social, 250 en classe (plateaux mesures ; c'est le score AFFICHE
# par le jeu, celui que porte la courbe du film — l'API compte des ticks, cf.
# analysis/replay/document_score.go).
"Strongholds:Arena"          = 200
"Arena:Strongholds"          = 200
"Ranked:Strongholds"         = 250
# KOTH : il n'y a pas de capture, la colline se marque a la GARDE — et le score EST le
# compte de collines gagnees. Plateaux mesures le 2026-08-30 sur les 52 matchs KOTH du
# registre : 3 en social (45 matchs sur 46 finissent a 3 ; le 46e finit a 2 sur 511 s,
# c'est-a-dire au chrono) et 4 en classe (3 matchs sur 3, duree moyenne 770 s).
# CETTE ENTREE ETAIT ECARTEE AU MOTIF QUE « l'oracle du film differe de l'API » : le motif
# est PERIME. Verifie le 2026-08-30, le registre porte desormais des COLLINES (606d9844 a
# 3-0, 8076f97f a 0-3) la ou il portait des SECONDES (105/8, 78/105) au releve du lot A —
# le backfill du 2026-08-24 a homogeneise la colonne.
"KOTH:Arena"                 = 3
"Ranked:King of the Hill"    = 4
# Total Control : 3 series de zones.
"BTB:Total Control"          = 3
"BTB Heavies:Total Control"  = 3
"BTB:Fiesta Total Control"   = 3
# Autres plateaux mesures.
"BTB:Stockpile"              = 5
"Assault:Neutral Bomb"       = 3
"Assault:One Bomb"           = 3
"Arena:VIP"                  = 10
"Arena:Escalation Slayer"    = 11
"Event:Escalation Slayer"    = 11

# ---------------------------------------------------------------------------------------
# TICS DE GARDE PAR POINT (schema_version 4, mesure du 2026-08-30) — le DENOMINATEUR de
# la progression vers le prochain point sur un mode ou l'on marque en TENANT une zone.
#
# EN KOTH IL N'Y A PAS DE CAPTURE : la colline se prend instantanement quand aucun adversaire
# n'y est ; c'est la GARDE qui marque, et la colline tourne a chaque point. Cette table dit
# combien de TICS de garde valent un point — sans elle, le rejeu sait QUI tient la colline mais
# pas OU EN EST la progression.
#
# MEME DOCTRINE QUE LES TROIS TABLES CI-DESSUS : cle = game_variant_name exact, valeur
# MESUREE, variante absente = pas de denominateur, donc AUCUNE jauge affichee (jamais une
# jauge remplie au juge).
#
# 35 EST UN COMPTE, PAS UN REGLAGE. Le compteur est `comp 23 A` du statborg, qui reproduit
# `ZonesStats.StrongholdScoringTicks` de l'API EXACTEMENT joueur par joueur (31 joueurs sur 31,
# 4 films). La barre d'un camp est l'UNION des instants de tic de ses joueurs — ni la somme
# (elle compterait deux fois le meme tic) ni le maximum sur la periode (il perd les relais).
# Mesure : le camp QUI MARQUE rend exactement 35 sur 15 periodes sur 16 (4 films, 4 cartes ;
# l'unique ecart vaut 33), tandis que le camp qui NE marque pas rend 1 a 25 et JAMAIS 35 — le
# controle est dans la mesure elle-meme. 35 est aussi le chiffre annonce par la documentation
# du jeu : deux chaines independantes concordent.
#
# CE CHIFFRE NE SE CALE PAS SUR LE RENDU. Une version anterieure de cette table portait 43,
# mesure sur le canal de PROPRIETE (une reconstruction), et la tentation etait de le monter pour
# que la jauge tombe pleine pile au point. La voie propre etait de changer de SOURCE, pas de
# corriger la constante. Detail des trois lots : `.ai/V7.5/PLAN_KOTH_GARDE_VIVANTE_2026-08-30.md`
# §E1, §E1-bis et §E1-ter ; instrument `internal/analysis/replay/colline_statborg_e1bis_test.go`.
#
# VOLONTAIREMENT ABSENTS :
#   - "Ranked:King of the Hill" : les 3 matchs classes du registre sont INEXPLOITABLES (deux
#     sans film en cache, un sur « Solitude - Ranked », carte absente de map_quant_bounds.json).
#     Rien ne dit que le classe partage le seuil du social, et lui recopier la valeur serait
#     la devinette que cette table interdit. Reprise : un film classe en cache AVEC bornes.
#   - Strongholds et Total Control : modes a zones SIMULTANEES, dont la progression se lit
#     directement dans la jauge du film (`ZoneState.gauge`, schema 18). Le tic de `comp 23 A`
#     y existe aussi (l API le nomme StrongholdScoringTicks pour les deux modes), mais rien ne
#     dit qu il s y accumule de la meme facon : non mesure, donc non declare.
#
# Consommation : mappings.LoadRegulation -> RegulationSet.HoldTicksPerPoint(variante)
# -> replaybuild -> ScoreTimeline.{HoldTicks, HoldTicksPerPoint} -> lisere de garde du bandeau.
[hold_ticks_per_point]
"KOTH:Arena" = 35

# ---------------------------------------------------------------------------------------
# VARIANTES DONT LE RESULTAT SE LIT EN MANCHES (schema_version 3, mesure du 2026-08-29).
#
# Pour ces variantes, `CoreStats.Score` est un CUMUL DE POINTS sur toutes les manches : il
# ne dit PAS qui a gagne. Sur 4 matchs Oddball du corpus, l'equipe VICTORIEUSE affiche
# MOINS de points que la perdante (ex. 181-186 pour une victoire 2 manches a 1). L'app
# affiche donc, pour ces variantes, les MANCHES gagnees/perdues, et relegue le score de
# l'API en second plan.
#
# MEME DOCTRINE QUE LES DEUX TABLES CI-DESSUS : cle = game_variant_name exact, contenu
# MESURE, jamais « au juge ». Une variante absente garde les points — degradation sure.
# Mesure : `.ai/V7.5/RAPPORT_MANCHES_2026-08-29.md` (1 942 matchs re-lus, 0 erreur).
#
# VOLONTAIREMENT ABSENTS, et ce n'est pas un oubli :
#   - One Flag CTF, Assault:One Bomb, Attrition : modes A MANCHES eux aussi, mais leur
#     `Score` EST DEJA le compte de manches (3-1 = trois manches a une, verifie sur 14 des
#     16 matchs). Les declarer ne changerait rien a l'ecran, et transformerait les 2 matchs
#     a manche nulle (score 3-3 contre 2-2 manches gagnees) en un affichage dont rien ne
#     prouve qu'il soit celui du jeu.
#   - CTF:Arena et Ranked:CTF : deux MI-TEMPS, pas des manches decisives. Le score est le
#     total de captures (2-3) et c'est LUI le score du jeu ; le compte de manches y vaut
#     0-1, ce qui serait un contresens. En prime la meme variante est tantot a une manche
#     tantot a deux — aucune regle par variante n'y tiendrait.
#   - KOTH : mesure du 2026-08-24, une seule manche dans le corpus.
#
# Consommation : mappings.LoadRegulation -> RegulationSet.RoundsDecide(variante) ->
# analysis.TeamScoreDisplay (source unique de la regle d'affichage).
[rounds_decide]
"Arena:Oddball"  = true
"Ranked:Oddball" = true
"Oddball:Arena"  = true
