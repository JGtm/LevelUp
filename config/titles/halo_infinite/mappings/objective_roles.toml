# config/titles/halo_infinite/mappings/objective_roles.toml
#
# TABLE MODE DE JEU -> ROLES D'OBJECTIF STATIQUES du rejeu 2D. Lue par le SERVICE de
# rejeu (une requete de rejeu joint le catalogue map_objectives.json par map_id) : c'est
# le serveur qui choisit les roles servis, le client n'affiche que ce qui arrive
# (title-agnostic, degradation par absence).
#
# POURQUOI EN DONNEE ET PAS EN GO (lot 4.1) : la liste des modes a objectifs et leurs
# roles sont un savoir DU TITRE, pas du decodeur — la meme frontiere que replay_labels
# (ADR 0011). Un second titre apportera sa propre table, ou aucune.
#
# COMMENT UNE ENTREE MATCHE. Le service normalise le pair_name du match
# (analysis.NormalizeModeLabel : "Arena:CTF on Aquarius" -> "CTF") puis cherche chaque
# jeton de `match` comme MOT ENTIER, insensible a la casse, dans le libelle normalise
# (analysis.ExtractKnownMode). "Fiesta CTF", "One Flag CTF", "CTF 3 Captures" matchent
# donc "CTF" sans etre listes. Un libelle sans aucun jeton (Slayer, Land Grab,
# un UUID brut) = aucun role = aucun calque. Plusieurs entrees peuvent matcher : leurs
# roles s'additionnent.
#
# `points_only = true` : les objets du mode sont des POINTS, quelle que soit la forme que le
# fichier de carte leur donne — un objet a forme sort en MARQUEUR (son centre), jamais en zone
# dessinee. AJOUTE LE 2026-08-26 sur signalement utilisateur (« des bases s'affichent sur un
# CTF », film 530820e5 sur Catalyst).
#
# CE QUI SE PASSAIT. Le catalogue porte des formes sur des roles qui ne sont pas des aires a
# tenir, et `BuildMapObjectives` transformait TOUT objet a forme en zone. Recensement du
# 2026-08-26 sur les 73 entrees du catalogue (1 764 objets) :
#
#   flag_delivery        28 objets a forme sur 14 cartes (Catalyst en porte 2, en cylindre)
#   stockpile_navpoint   32 objets a forme sur 16 cartes (AUCUN ponctuel : tous a forme)
#   assault_bomb          2 objets a forme sur  2 cartes
#   flag_spawn / oddball_spawn / stockpile_socket   0 objet a forme — rien a corriger, mais
#                        leurs modes portent le drapeau quand meme (voir ci-dessous)
#
# LE CATALOGUE N'EST PAS MODIFIE, ET C'EST DELIBERE : cette forme est une donnee REELLE du
# fichier de carte (l'aire ou la capture du drapeau est validee, le volume ou le noyau se
# depose). Ce qui etait faux, c'est de la PRESENTER comme une base de Bastion. La distinction
# « objectif qu'on TIENT » contre « objectif qu'on TOUCHE » est un savoir du TITRE : elle vit
# donc ici, en donnee, et pas dans le decodeur.
#
# LE DRAPEAU SE POSE PAR MODE, PAS PAR ROLE, et c'est ce qui le rend robuste : en CTF, en
# Assaut, en Stockpile et en Oddball, AUCUN objectif n'est une aire qu'on tient — on porte un
# objet, on le depose quelque part. Marquer les quatre entrees couvre donc aussi les roles qui
# n'ont aucune forme aujourd'hui (`flag_spawn`, `oddball_spawn`, `stockpile_socket`) : une
# regeneration du catalogue qui leur en donnerait une ne rouvrirait pas le defaut.
#
# GARDE-FOU AU CHARGEMENT : `points_only` est REFUSE sur un role surfacique
# (`strongholds_zone`, `extraction_zone`, `hill`, `totalcontrol_zone`, `firefight_objective`).
# Sans ce refus, une ligne de configuration ferait disparaitre les trois bases d'une carte de
# Bastion en les reduisant a des marqueurs — une regression majeure et silencieuse.
#
# `neutral = true` : les objets du mode s'affichent NEUTRES meme si le fichier .mvar
# leur donne un team_index. MESURE sur le catalogue 72 cartes : 48 zones de Bastion en
# equipe 0 et 47 en equipe 1 (Vagabond en porte) — or la possession d'une zone de
# Bastion ou d'Extraction est DYNAMIQUE et n'est pas decodee (registre : « etat vivant
# des objectifs »). Colorer la zone a la couleur du team_index affirmerait une
# allegeance que le jeu ne donne qu'en cours de partie. Les spawns et livraisons de
# drapeau, eux, appartiennent reellement a un camp : ils gardent leur couleur.
#
# Les roles admis sont ceux du decodeur (mapvar) : flag_spawn, flag_delivery,
# stockpile_socket, stockpile_navpoint, strongholds_zone, extraction_zone,
# oddball_spawn, assault_bomb, hill, totalcontrol_zone, firefight_objective. Un role
# inconnu est une erreur de configuration (validation stricte au chargement), jamais un
# silence.
#
# UN ROLE DU DECODEUR PEUT N'ETRE SERVI PAR AUCUN MODE, et c'est un etat legitime :
# `firefight_objective` (5 volumes avec forme par carte de Firefight, mesure du 2026-08-20)
# entre au CATALOGUE mais aucune entree ci-dessous ne le sert. La decision de le servir
# demande de savoir quel libelle de manche Firefight le porte, ce qu'aucune mesure ne dit
# encore — la servir « au cas ou » afficherait cinq zones sur une carte PvE sans savoir
# laquelle est active. Consigne au registre, a trancher sur mesure.

[meta]
title_slug     = "halo_infinite"
schema_version = 1

[[modes]]
# Toutes les variantes drapeau : le jeton "CTF" attrape CTF / One Flag CTF / Fiesta CTF /
# Neutral Flag CTF / CTF 3 Captures ; "Neutral Flag" attrape "Arena Neutral Flag" (mesure
# sur les 435 pair_name du registre local, 2026-08-13).
match       = ["CTF", "Neutral Flag"]
roles       = ["flag_spawn", "flag_delivery"]
points_only = true

[[modes]]
match   = ["Strongholds"]
roles   = ["strongholds_zone"]
neutral = true

[[modes]]
match       = ["Oddball"]
roles       = ["oddball_spawn"]
points_only = true

[[modes]]
match       = ["Stockpile"]
roles       = ["stockpile_socket", "stockpile_navpoint"]
points_only = true

[[modes]]
match   = ["Extraction"]
roles   = ["extraction_zone"]
neutral = true

[[modes]]
# Les variantes bombe sont des habillages d'Assaut : "Neutral Bomb", "One Bomb",
# "Neutral Bomb Squad" (mesure registre local). L'objet assault_bomb est l'apparition
# de la bombe — neutre dans le fichier (4/4 en team_index -1).
match       = ["Assault", "Neutral Bomb", "One Bomb"]
roles       = ["assault_bomb"]
points_only = true

[[modes]]
# King of the Hill (lot C-ter volet 2, 2026-08-19). "King of the Hill" attrape les pair_name
# "Arena:King of the Hill on X" / "Ranked:King of the Hill on X" une fois normalises ("King of
# the Hill"), et "KOTH" attrape le game_variant_name "KOTH:Arena" que l'artefact lit en brut
# (releve du registre local : 26 libelles, 2026-08-19). Les deux jetons attrapent aussi
# "Heroic King of the Hill" / "Heroic KOTH" (Firefight PvE) : ces cartes ne portent aucun
# objet du role, rien n'est servi — degradation par absence, pas une erreur.
#
# La colline se pose par le hash de ROLE de mapvar (LabelHashHillRole, nom non retrouve), sauf
# revendication de l'objet par un autre mode — la regle exacte est sur isHill, et elle a ete
# CORRIGEE le 2026-08-20 : exiger la paire role+filtre ecartait les collines que leur fichier
# declare sans filtre. Le catalogue en porte 3 a 7 par carte, toutes neutres dans le fichier.
# neutral = true par coherence avec Bastion/Extraction : la colline ACTIVE et son proprietaire
# sont l'affaire de zoneStates (etat vivant), jamais du team_index du fichier.
match   = ["King of the Hill", "KOTH"]
roles   = ["hill"]
neutral = true

[[modes]]
# Total Control (lot catalogue, 2026-08-25). Le jeton attrape les pair_name
# "Arena:Total Control on X" / "BTB:Total Control on X" une fois normalises.
#
# CE QUE CETTE ENTREE SERT, ET CE QU'ELLE NE SERT PAS. Le fichier declare un VIVIER de 13 a
# 18 zones par carte (Command 18, Fortitude 18, Breaker 16, Deadlock 15, Highpower 15, Oasis
# 14, Scarr 14 ; 302 zones sur 21 entrees, TOUTES avec forme). Une manche de Total Control
# n'en ACTIVE que 3. Le choix de ces 3 n'est PAS dans la variante de carte : ce role publie
# donc des FORMES, jamais un etat, et le rejeu ne doit pas les presenter comme trois zones
# tenues.
#
# C'est la difference de fond avec Bastion, ou le fichier declare exactement les 3 zones du
# mode (verifie 2026-08-20 : toute carte du catalogue ayant un match Strongholds en a
# exactement 3, sans exception). C'est en revanche la MEME situation que la colline de KOTH,
# dont le fichier declare 3 a 7 emplacements et dont l'ACTIVE est designee par le film (tag 5
# du slot de l'objet de mode, lot C-ter volet 1). Le vivant de Total Control viendra du meme
# canal, et c'est a ce moment-la seulement que `totalcontrol_zone` pourra rejoindre
# heldZoneRoles (replaybuild/zones.go) — pas avant : sans designateur, un etat de zone
# publierait 14 a 18 zones tenues la ou il y en a 3.
#
# neutral = true, meme raison que Bastion et la colline : la possession est dynamique. Ici la
# MESURE l'exige en plus de la symetrie : 296 des 302 zones sont neutres dans le fichier, mais
# 3 sont en equipe 0, 2 en equipe 2 et UNE en equipe 7 — une equipe 7 sur un mode a deux camps
# etablit que ce champ ne porte rien pour ce role.
match   = ["Total Control"]
roles   = ["totalcontrol_zone"]
neutral = true
