# config/titles/halo_infinite/mappings/map_variants.toml
#
# Suffixes de NOM qui font d'une carte la VARIANTE d'une autre : meme terrain, identifiant d'asset
# propre (« Thunderhead Heavies » est une carte distincte de « Thunderhead » au registre des matchs).
# Une variante est COMPTEE SOUS SA CARTE DE BASE partout : filtres de cartes, et toute statistique par
# carte (vignettes et lectures de la Tactique, taux de victoire par carte, briefing, Synthese, Escouade,
# Coequipiers, motifs, series temporelles). Les identifiants ne bougent pas : le regroupement est une
# table map_id -> carte de base (domain.GroupesDeCartes), construite sur le nom retenu du registre.
#
# Regle de variante : un nom EN du registre qui se termine par l'un de ces suffixes, precede d'une espace,
# est la variante de la carte dont le nom est le reste du nom, A CONDITION qu'un map_id du registre porte
# ce nom de base. Sans carte de base au registre, la carte reste seule. Aucune heuristique de nombre de
# mots. Le groupe reunit tous les identifiants qui portent le nom de base et ceux de ses variantes.
#
# Regle de republication (independante des suffixes) : les map_id d'un meme nom forment un groupe, qu'il
# s'agisse d'une carte INTEGREE au jeu republiee sous un nouvel asset ou des versions successives d'une
# carte Forge (trace peu change d'une version a l'autre). Exception : quand ces map_id se resolvent vers
# plusieurs cles de MODULE differentes (mapcatalog.SourcesDeZones.CleDeModule : catalogue des bornes +
# zones versionnees), le nom couvre plusieurs cartes integrees ; un groupe par cle, les map_id sans cle
# restent seuls.
#
# Consommation : mappings.LoadMapVariantsFromFile -> Registry.GetMapVariants(slug) -> analysis.BaseMapName,
# analysis.GroupMapsByBase (+ service.MapModuleResolverFor) -> duckdb.MapGroupsRepo
# (port.MapGroupReader) -> services. Garde-rail : archlint/no_map_variant_suffix_literal_test.go (aucun suffixe en dur ailleurs).

[meta]
title_slug     = "halo_infinite"
schema_version = 1

[variants]
suffixes = ["- Ranked", "Heavies"]
