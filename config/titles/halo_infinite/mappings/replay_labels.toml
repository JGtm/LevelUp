# config/titles/halo_infinite/mappings/replay_labels.toml
#
# SOURCE UNIQUE des libelles PROPRES AU REJEU 2D d'un titre : les rangs de grenade, les
# capacites d'armure, et l'effet de tir par arme. Lu hors ligne par cmd/replay-build
# (internal/games/halo_infinite/replaylabels), jamais a l'execution d'une requete.
#
# POURQUOI CE FICHIER EXISTE (lot 3.1/3.2). Ces trois catalogues vivaient EN GO, et deux
# d'entre eux en FRANCAIS DANS LE CODE — ce qui interdit l'anglais autant qu'un second
# titre. Pire, les grenades etaient nommees DEUX FOIS et differemment : le rang 2
# s'affichait « Dynamo » dans les compteurs d'inventaire et « Shock » sur le lancer, sur
# la MEME fiche (constate sur le film 000d5950). Une seule table, ici.
#
# CE QUI N'EST PAS ICI, ET NE DOIT PAS Y VENIR :
#   - les NOMS D'ARMES : ils sont dans weapon_names.toml, keyes par weapon_key. Ce
#     fichier ne porte que l'EFFET DE RENDU, qui n'est pas un libelle (aucune langue).
#   - les IDENTIFIANTS de tag grenade : ils appartiennent au decodeur
#     (filmdec.GrenadeTypeIDsByRank), qui les a MESURES. Les recopier ici en ferait une
#     seconde source, donc une occasion de divergence.
#
# L'ORDRE DES RANGS EST LA DONNEE : rang = typeId - 1, etabli par deux chaines
# independantes (35 lancers apparies aux decrements unitaires du compteur, et la table
# `grenade_types` lue dans le binaire du jeu).

[meta]
title_slug     = "halo_infinite"
schema_version = 2

# Rangs de grenade, DANS L'ORDRE. L'index de la ligne EST le rang lu dans le film ; il
# sert aussi bien au compteur porte (Inventory.G) qu'au type d'un lancer (Grenade.rank).
#
# `icon` : vignette du HUD DU JEU (blanc/gris + alpha, a teindre), servie sous
# static/weapons-assets/{slug}/ — extraites du POC de rejeu (2026-08-12), qui les
# portait en data URI. Optionnel : sans icon, le client garde le libelle.
[[grenades]]
en = "Frag"
fr = "Fragmentation"
icon = "hud/Frag"

[[grenades]]
en = "Plasma"
fr = "Plasma"
icon = "hud/Plasma"

[[grenades]]
en = "Dynamo"
fr = "Dynamo"
icon = "hud/Dynamo"

[[grenades]]
en = "Spike"
fr = "Spike"
icon = "hud/Spike"

# Capacites d'armure, par PALETTE puis par RANG lu dans le film.
#
# POURQUOI UNE PALETTE, ET PAS UNE TABLE UNIQUE (2026-08-14, plan PLAN_RANG_CAPACITE_I48).
# Le rang que le film transmet est un index dans le groupe de tags `sofd` du match, et ce
# groupe est CHOISI A L'EXECUTION (RECETTE_LOADOUT §13, composant a `unite+0x268`). Mesure :
# sur les 46 equipements presents dans au moins deux des 12 `sofd`, 26 gardent leur rang et
# 20 en changent — le grappin est au rang 4 dans une famille et au rang 20 dans une autre.
# Une table unique nommerait donc FAUX un film sur deux.
#
# RIEN DANS LE FILM NE DESIGNE LA PALETTE — verifie, pas suppose (item 2.1 du plan) : le
# registre du chunk_00 est bit-a-bit identique d'un film a l'autre pour les noms et les
# flags de composants, sa longueur ne suit pas les familles (1 973 120 octets aussi bien
# sur `00162144`, famille A, que sur les trois films de la famille B), et aucun marqueur de
# groupe de tags (`sofd`, `eqip`, `vcdd`, `uwfa`, `glpa`) n'apparait dans aucun chunk. La
# palette se DEDUIT donc de la signature du film — cf. `replay/abilities.go`, qui porte la
# regle et ses chiffres, et qui REFUSE de nommer quand la signature est ambigue.
#
# TABLES PARTIELLES, ET C'EST PUBLIE COMME TEL : un rang absent de la palette retenue
# s'affiche avec son NUMERO (« capacite inconnue (10) ») — jamais devine, jamais approche
# par le nom d'une capacite voisine. L'icone suit LE MEME rang que le libelle : nom et
# vignette bougent ensemble.
#
# `family` (OPTIONNEL) — L'IDENTITE STABLE DERRIERE LE RANG, dans le MEME vocabulaire que
# `[[equipment_objects]].family` : c'est ce qui permet a un calque de dire « propulseur »
# sans jamais ecrire 5 ni 21 dans du Go (le rang du propulseur vaut 5 en famille A et 21 en
# famille B — un litteral en dur rendrait le calque muet sur l'autre famille, exactement le
# piege qui a rendu le translocateur muet hors famille A). Le libelle, lui, reste ce qui
# s'AFFICHE ; la famille est ce qui se JOINT.
#
# LES DEUX POUDRES A CANON (`8` camouflage, `9` surbouclier) N'EN PORTENT PAS : leur objet
# de manifeste est un power-up ramassable (`powerup_camo` / `powerup_overshield`), pas
# l'emplacement de capacite, et leur ETAT ACTIF se lit deja par un autre canal
# (`equipmentEpisodes`, i28 et i5). Leur donner une famille ici ferait joindre deux choses
# qui ne sont pas la meme.

# --- FAMILLE A ---------------------------------------------------------------------
# Les trois `sofd` de cette famille (d91958af 27 entrees, 03137359 19, 13c097ed 17) ont un
# prefixe rigoureusement identique sur les rangs 0 a 9, et c'est la seule famille
# compatible avec un jeu de capacites de joueur (RECETTE_LOADOUT §13).
#
# SOURCE DES NOMS : l'inversion murmur3 des identifiants de chaine du `sofd`, recoupee avec
# l'enumeration d'equipement de l'executable. C'est la table DU JEU, lue — d'une autre
# nature qu'une observation d'ecran, et c'est la source qui a fait RETIRER deux noms le
# 2026-08-14 (elle contredisait deux observations isolees). Une source assez sure pour
# retirer un nom l'est pour en donner un ; l'inverse serait incoherent.
#
# NE SONT PAS NOMMES, et le rang s'affiche seul :
#   - 0 (`mobility_sprint`, la course) et 7 (`melee_default`) : categorie NULLE, ce ne sont
#     pas des capacites — les nommer mettrait « course » sur une fiche d'equipement ;
#   - 3 : categorie nulle egalement, son `eqip` ne reference qu'un systeme de marquage ;
#   - 10, et les rangs 13 a 22, 24 a 26 : identifiants de chaine NON inverses. Le rang 10
#     est pourtant OBSERVE 67 fois sur le corpus — c'est le premier trou a combler.
[[ability_palettes]]
id = "famille_a"
# markers : les rangs dont l'observation SIGNE cette palette. Ils sont disjoints de ceux de
# la famille B, et c'est ce qui rend le classement possible. Le rang 23 en fait partie : il
# est observe sur les trois films de famille A qui le montrent (35, 35, 15 lectures) et sur
# AUCUN film de famille B.
markers = [1, 2, 4, 5, 6, 8, 9, 10, 11, 12, 23]

[ability_palettes.ranks]
"1"  = { en = "Threat Sensor", fr = "detecteur de menaces", icon = "hud/ThreatSensor", family = "sensor" }
"2"  = { en = "Drop Wall", fr = "mur de protection", icon = "hud/DropWall", family = "wall" }
"4"  = { en = "Grappleshot", fr = "grappin", icon = "hud/Grappleshot", family = "grapple" }
"5"  = { en = "Thruster", fr = "propulseur", icon = "hud/Thruster", family = "thruster" }
"6"  = { en = "Repulsor", fr = "repulseur", icon = "hud/Repulsor", family = "repulsor" }
"8"  = { en = "Active Camouflage", fr = "camouflage actif", icon = "hud/ActiveCamouflage" }
"9"  = { en = "Overshield", fr = "surbouclier", icon = "hud/Overshield" }
"11" = { en = "Quantum Translocator", fr = "translocateur quantique", icon = "hud/QuantumTranslocator", family = "translocator_beacon" }
"12" = { en = "Threat Seeker", fr = "traqueur de menaces", icon = "hud/ThreatSeeker", family = "threat_seeker" }
# 23 est le SEUL rang confirme par DEUX chaines : l'inversion murmur3 ET la banque sonore
# `sb_007_abl_repairfield`, atteinte depuis ce rang a la distance la plus courte.
"23" = { en = "Repair Field", fr = "champ de reparation", icon = "hud/RepairField", family = "repair_field" }

# --- FAMILLE B ---------------------------------------------------------------------
# Cette famille n'expose que les rangs 19 a 22, et AUCUN rang inferieur a 13 : mesure sur
# `000d5950` (82 identites), `00502e52` (65) et `07aa428d` (42), toutes dans cette bande.
# Ses identifiants de chaine ne sont PAS inverses — les deux noms ci-dessous ne viennent
# donc pas du binaire mais du terrain.
#
# SOURCE DES NOMS, et pourquoi DEUX SEULEMENT. Le releve Theater du 2026-07-27 sur
# `000d5950` nomme l'equipement des huit joueurs. Trois portaient un grappin et trois un
# propulseur : ces deux-la ont un CONTROLE DE GROUPE (trois lectures identiques a
# l'interieur de chaque triplet, et les deux triplets mutuellement distincts), plus un
# SECOND canal independant — i48 rend 20 sur les slots 513 et 516 (grappins) et 21 sur le
# slot 518 (propulseur), sans qu'aucune information du releve n'entre dans cette lecture.
#
# LE MUR (19) ET LE CAPTEUR (22) NE SONT PAS NOMMES : une seule observation chacun, sur un
# seul joueur. « Un controle de groupe vaut, un temoignage isole ne vaut pas »
# (RECETTE_LOADOUT §2) — et c'est exactement cette regle qui avait deja tort de les nommer.
# CE QUI LES RESTAURERAIT, et c'est bon marche : un SECOND releve Theater nommant
# l'equipement d'un joueur dont la lecture vaut 19 ou 22, sur un autre film que `000d5950`.
# Ligne au REGISTRE_REPORTS.
[[ability_palettes]]
id = "famille_b"
markers = [19, 20, 21, 22]

[ability_palettes.ranks]
"20" = { en = "Grappleshot", fr = "grappin", icon = "hud/Grappleshot", family = "grapple" }
"21" = { en = "Thruster", fr = "propulseur", icon = "hud/Thruster", family = "thruster" }

# Familles de capacite dont l'USAGE est MESURE par le canal d'IMPULSION du bipede : le corps
# de tag externe `R(2) == 1` des composants `biped-spartan-ability` (i57) et
# `-non-predicted-state` (i59) — le MEME composant dont le tag 3 porte deja le grappin.
# Cf. filmdec/ability_impulses.go (lecture) et replay/document_ability_impulses.go (jointure
# d'identite par le rang i48 de la MEME vie).
#
# CETTE LISTE EST UNE MESURE, PAS UN REGLAGE (lot R8 du 2026-09-03,
# RAPPORT_R8_USAGE_REPULSEUR_PROPULSEUR §8.8 — quatre films de famille A, rang attribue DANS
# LA MEME VIE et ANTERIEUREMENT) : 0,361 impulsion par vie de PROPULSEUR (22 sur 61) contre
# 0,011 par vie de repulseur (1 sur 90 — et le repulseur est PLUS porte que lui) et 0,000 sur
# 132 vies de GRAPPIN, qui a son propre tag. Oracle physique independant : pic de vitesse
# horizontale 6,2 a 8,8 m/s a ces instants contre 2,9 a 3,6 au hasard dans la meme vie.
# VERITE TERRAIN utilisateur (Theater, film `1cd3848a`, 2026-09-03) : 5 usages releves,
# 5 impulsions rendues, ecart <= 1 s.
#
# LE REPULSEUR N'Y EST PAS, et c'est un negatif MESURE, pas une lacune : le lot R9 a ferme
# ses trois portes restantes. L'inscrire ici ferait dessiner un geste que le film
# n'enregistre pas. UNE FAMILLE ABSENTE DE CETTE LISTE VOIT SES IMPULSIONS ECARTEES ET
# COMPTEES (`coverage.abilityImpulses.otherFamily`) : le canal ne se tait pas, il dit ce
# qu'il refuse. Une famille citee ici DOIT etre nommee par au moins un rang ci-dessus, sans
# quoi le calque serait muet en silence — le loader le refuse.
[ability_impulses]
families = ["thruster"]

# Familles de capacite dont les CHARGES RESTANTES sont MESUREES par le canal d'energie du
# bipede : i56 `biped-spartan-ability-energy`, masque R(3) puis 7 bits par emplacement arme,
# quartet HAUT = charges entieres (lot R11 du 2026-09-03,
# RAPPORT_R11_REPULSEUR_CHARGES §1.1 et §2). Cf. filmdec/ability_charges.go (lecture) et
# replay/document_ability_charges.go (jointure d'identite par le rang i48 de la MEME vie).
#
# CETTE LISTE EST UNE MESURE, PAS UN REGLAGE (R11 §2-5) : sur `1cd3848a`, la serie 4, 3, 2,
# 1, 0 tombe EXACTEMENT sur les cinq usages de propulseur releves au Theater (5/5, ecart
# <= 1 s) ; 36 accroches de grappin sur 36 (canal `grappleLines`, independant) sont appariees
# a une baisse, contre 2/36 pour un temoin decale de 5 s. Seules ces DEUX familles arment
# i56 — ce sont les deux capacites dont le client PREDIT le mouvement du porteur (R11 §8.2).
#
# LE REPULSEUR N'Y EST PAS, et c'est un negatif MESURE, pas une lacune : 218 vies de
# repulseur, 111,7 minutes de port sur onze films, 0 baisse attribuable — dont deux porteurs
# qui consomment leurs TROIS charges (le film l'annonce par le `spent` d'i48) pendant que le
# canal compte celles du grappin d'autres joueurs du meme film (R11 §4-5). UNE FAMILLE
# ABSENTE DE CETTE LISTE VOIT SES LECTURES ECARTEES ET COMPTEES
# (`coverage.abilityCharges.otherFamily`). Une famille citee ici DOIT etre nommee par au
# moins un rang de palette ci-dessus, sans quoi le calque serait muet en silence — le loader
# le refuse (meme validateur que la table precedente).
[ability_charges]
families = ["grapple", "thruster"]

# Effet de rendu d'un tir, par weapon_key (cf. weapon_names.toml pour le nom affiche).
#
# CE QUI EST MESURE, ET CE QUI EST CHOISI. Le libelle de l'arme est MESURE (le film le
# porte sur chaque evenement de tir). L'effet, lui, est CHOISI : une famille d'arme se
# dessine autrement qu'une autre. Le regroupement suit la nature physique de la decharge,
# pas le role de l'arme dans le jeu — une poudre se detonne brievement, un plasma ne
# s'eteint pas comme une poudre, un rai de dur-lumiere est continu, un arc electrique est
# brise.
#
# Valeurs admises (elles nomment une GEOMETRIE de rendu, pas un type de degat) :
#   ballistic | plasma | light | shock | explosive | melee | needles
#
# UNE ARME ABSENTE DE CETTE TABLE tombe sur le rendu neutre, jamais sur un rendu
# approchant : un effet emprunte affirmerait une arme qu'on ignore.
[shot_effects]
hinf_ma40_ar        = "ballistic"
hinf_br75           = "ballistic"
hinf_vk78_commando  = "ballistic"
hinf_sidekick       = "ballistic"
hinf_cqs48_bulldog  = "ballistic"
hinf_s7_sniper      = "ballistic"
hinf_stalker_rifle  = "ballistic"
hinf_mangler        = "ballistic"
hinf_skewer         = "ballistic"
hinf_plasma_pistol  = "plasma"
hinf_pulse_carbine  = "plasma"
hinf_ravager        = "plasma"
hinf_sentinel_beam  = "light"
hinf_heatwave       = "light"
hinf_disruptor      = "shock"
hinf_shock_rifle    = "shock"
hinf_m41_spnkr      = "explosive"
# Ces deux-la sont ici pour PRESERVER un rendu existant, et l'histoire vaut d'etre ecrite.
# Le rendu se faisait par le NOM que l'enum d'armes du decodeur donnait a la famille — et
# elle en donnait deux de faux : 0x9D6AAED2 s'y appelait « M41 SPNKr » (c'est le SPNKr a
# combustible) et 0x3E070217 « Pulse Carbine » (c'est la carabine Vestige). Le registre du
# titre les nomme correctement ; sans ces deux lignes, elles perdraient l'effet qu'elles
# avaient sous un faux nom.
hinf_fuel_rod_spnkr = "explosive"
hinf_vestige_carbine = "plasma"
hinf_cindershot     = "explosive"
hinf_hydra          = "explosive"
hinf_gravity_hammer = "melee"
hinf_energy_sword   = "melee"
hinf_needler        = "needles"
# Cles vues UNIQUEMENT sur les KILLS du feed (killicon rend un weapon_key par source de
# degat) : la meme table sert desormais les effets de MORT (ReplayDocument.killEffects),
# joints par weapon_key. La Dynamo est electrique — elle rejoint la famille `shock`, pas
# l'explosif generique. La grenade Spike n'a PAS de weapon_key (mesure, killicon GGGL 3) :
# elle reste sans effet de famille, jamais celui d'une voisine.
hinf_frag_grenade   = "explosive"
hinf_plasma_grenade = "explosive"
hinf_dynamo_grenade = "shock"
hinf_bandit         = "ballistic"
hinf_ma5k_avenger   = "ballistic"

# TEINTE d'un tir, par weapon_key — LA NATURE DE LA DECHARGE, pas le camp du tireur.
#
# POURQUOI CETTE TABLE EXISTE (2026-08-15, arbitrage ROUVERT par l'utilisateur). Le lot 3.2
# avait acte « famille = FORME, couleur = TIREUR » et abandonne la palette du POC.
# L'utilisateur tranche autrement, mot pour mot : « le muzzle flash c'est bien pour les armes
# CINETIQUES ; pour les autres faut des effets de type PLASMA BLEUTE OU ROUGEATRE pour les
# armes Banished a energie, voire d'ENERGIE VIOLETTE pour les armes Forerunner », puis
# « les couleurs des effets de tirs ne prennent pas la couleur du tireur [...] elle prend
# seulement l'ARME en compte ». La teinte dit donc CE QUI SORT DU CANON, et rien d'autre :
# l'identite du joueur reste portee par son marqueur et son cone de visee.
#
# POURQUOI UNE TABLE SEPAREE DE [shot_effects], ET PAS UNE COLONNE DE PLUS. Les deux ne se
# recoupent pas : la FORME suit la mecanique du projectile, la TEINTE suit sa nature
# energetique. Deux armes de la meme forme peuvent diverger (le Ravageur et la carabine a
# impulsion sont toutes deux `plasma` et n'ont pas la meme couleur dans le jeu), et deux
# armes de teinte identique peuvent avoir des formes opposees (le Crematier explose, la
# carabine Vestige file droit). Les fondre obligerait a inventer une famille par croisement.
#
# Valeurs admises (elles nomment une NATURE, jamais une couleur — la couleur est un token du
# theme, cote client) :
#   kinetic      poudre : la detonation d'une charge, chaude et breve
#   plasma_cool  decharge d'energie a spectre FROID (plasma Covenant bleu-vert)
#   plasma_hot   decharge d'energie a spectre CHAUD (armes Brute rouge-orange)
#   forerunner   energie Forerunner (l'utilisateur la veut VIOLETTE ; le POC disait cyan-or)
#   electric     arc electrique
#   needle       cristal des aiguilles
#   blast        deflagration chimique
#
# NE SONT PAS DANS CETTE TABLE, et c'est voulu : les armes de MELEE (elles n'emettent aucun
# tir — 0 evenement mesure sur les 17 904 tirs du corpus, et la regle du chantier veut qu'un
# coup de marteau n'ait pas d'eclair de bouche) et les GRENADES (un lancer n'est pas un tir).
# Une arme absente de cette table garde la teinte neutre du theme — jamais celle d'une voisine.
[shot_tints]
# UNSC : toutes cinetiques.
hinf_ma40_ar        = "kinetic"
hinf_br75           = "kinetic"
hinf_bandit         = "kinetic"
hinf_ma5k_avenger   = "kinetic"
hinf_vk78_commando  = "kinetic"
hinf_s7_sniper      = "kinetic"
hinf_cqs48_bulldog  = "kinetic"
hinf_sidekick       = "kinetic"
hinf_hydra          = "blast"
hinf_m41_spnkr      = "blast"
# Banished CINETIQUES : le Dechiqueteur crache des pointes, l'Empaleur un harpon. Ni l'un ni
# l'autre n'est une arme a energie — les ranger avec les plasmas dirait le contraire.
hinf_mangler        = "kinetic"
hinf_skewer         = "kinetic"
# Banished A ENERGIE, spectre FROID.
hinf_plasma_pistol  = "plasma_cool"
hinf_pulse_carbine  = "plasma_cool"
hinf_vestige_carbine = "plasma_cool"
hinf_cindershot     = "plasma_cool"
hinf_fuel_rod_spnkr = "plasma_cool"
# Banished A ENERGIE, spectre CHAUD.
hinf_ravager        = "plasma_hot"
hinf_stalker_rifle  = "plasma_hot"
hinf_heatwave       = "plasma_hot"
# FORERUNNER : le Rayon de Sentinelle est la seule arme Forerunner du jeu — et le corpus des
# 23 artefacts locaux n'en porte AUCUN tir. La teinte est declaree quand meme : elle existera
# le jour ou un film en portera un, et l'absence de mesure est dite plutot que masquee.
hinf_sentinel_beam  = "forerunner"
# ELECTRIQUE.
hinf_disruptor      = "electric"
hinf_shock_rifle    = "electric"
# AIGUILLES.
hinf_needler        = "needle"

# ---------------------------------------------------------------------------------------
# OBJETS D'EQUIPEMENT POSES sur la carte, par GlobalID du tag `eqip` du jeu.
#
# CE QUE LA CLE EST. Le record de CREATION d'une entite d'archetype 37 (`equipment`) porte,
# dans son bloc `object-multiplayer-properties`, un mot de 32 bits qui est le GlobalID du tag
# `eqip` de l'objet — sa DEFINITION dans les modules du jeu. Ce n'est ni une enumeration ni
# un index de palette : c'est la reference que le jeu utilise lui-meme. Les 21 valeurs
# observees sur le corpus de 11 films se resolvent TOUTES dans le groupe `eqip`
# (`himap/sonde_ti37_gamefiles_test.go`, 148 097 tags parcourus).
#
# LE NOM VIENT DE LA STRUCTURE DU JEU, PAS D'UNE STATISTIQUE — reecriture du 2026-08-18
# (PLAN_NOMMAGE_EQIP_TRANSLOCATEUR, gate 0). La version precedente de cette table nommait par
# une DIAGONALE (identifiant x rang de capacite du poseur, seuil 85 %) et n'y parvenait que
# deux fois sur vingt et une. La chaine que le jeu emploie lui-meme se lit hors ligne :
#
#   sofd (palette de capacites du match)  --rang-->  sofa  --+--> string_id (murmur3 du nom)
#                                                            +--> eqip (l'objet dans le monde)
#
# `sofd` est le bloc que `FUN_1407E7648` parcourt pour resoudre un rang de capacite
# (RECETTE_LOADOUT §9) ; `sofa` est le maillon que le chantier voisin traverse pour l'armement
# de vehicule (`vcdd -> sofd -> sofa -> uwfa -> weap`). Les modules n'ont plus de table de
# chaines (`stringsSize` = 0) : un `string_id` se CASSE par dictionnaire murmur3, et un
# identifiant non casse ne se nomme pas. Instruments : `himap/sonde_sofd_gamefiles_test.go`,
# `himap/sonde_eqip_gamefiles_test.go`, `himap/sonde_stringid_dico_test.go`.
#
# LES QUATRE PROVENANCES, et ce que chacune etablit :
#
#   sofa_string_id  le `string_id` du `sofa` est casse — le nom est celui du jeu. Douze noms
#                   sortent ainsi, dont les CINQ que la RECETTE §13 avait obtenus par un autre
#                   chemin (`mobility_sprint`, `ability_location_sensor`,
#                   `ability_deployable_wall`, `ability_grapple_hook`, `ability_evade`) : cinq
#                   egalites exactes a la meme position de structure.
#   sofa_modele     le `string_id` resiste, mais l'`eqip` partage son MODELE (`hlmt`) avec un
#                   `eqip` dont le `sofa` est nomme. Quatre cas, et ils tombent EXACTEMENT sur
#                   les quatre rangs 19-22 que la verite terrain Theater du 2026-07-27 nommait
#                   mur / grappin / propulseur / capteur — sans que la structure la consulte.
#   sofa_parent     l'`eqip` est ENGENDRE par un autre `eqip` (dependance `eqip -> eqip`) qui
#                   appartient a un `sofa` nomme : ce sont les panneaux deployes d'un mur.
#   gggl_entree     l'`eqip` est une entree de la liste des grenades du jeu (`gggl` 0x00000057,
#                   bloc de 832 o = 4 x 0xd0). Les quatre identifiants « plats » du corpus —
#                   ceux qu'aucun poseur n'accompagne — sont exactement les quatre premieres
#                   references `eqip` de ce bloc, aux offsets 0x4c, 0x11c, 0x1ec, 0x2bc : la
#                   PERIODE 0xd0 est celle que le chantier kill feed avait mesuree de son cote
#                   (ETAT_DE_L_ART_KILLWEAPON 7ter.48). L'ordre des entrees EST le rang de type
#                   de grenade du depot (`filmdec.GrenadeTypeIDsByRank`), et les banques sonores
#                   de `damagetag/data/labels.tsv` le confirment entree par entree :
#                   0 `kineticunsc` = fragmentation, 1 `plasma`, 2 `shock`/`lightning` = dynamo,
#                   3 `kineticbanished` = a pointes.
#
# LA DIAGONALE EST DEVENUE LE CONTROLE, et elle passe 6 sur 6. Les six identifiants dont le
# corpus mesure un rang de poseur retombent tous sur le rang que la structure leur donne :
#
#   0x8e2dc574  structure rang 19  ·  diagonale rang 19  22/25 = 88,0 %  temoin 30 %   ACCORD
#   0x72199cba  structure rang 22  ·  diagonale rang 22  28/32 = 87,5 %  temoin 22 %   ACCORD
#   0x528fce46  structure rang 19  ·  diagonale rang 19  22/27 = 81,5 %                ACCORD
#   0x72b63d69  structure rang  1  ·  diagonale rang  1  41/50 = 82,0 %                ACCORD
#   0x2974c233  structure rang  2  ·  diagonale rang  2  42/54 = 77,8 %                ACCORD
#   0x686b40c9  structure rang  2  ·  diagonale rang  2  21/28 = 75,0 %                ACCORD
#
# Les quatre qui echouaient le seuil de 85 % avaient donc RAISON : ce n'etait pas leur nature
# qui manquait, c'etait le denominateur `i48` sur les films Big Team Battle. Les quinze autres
# identifiants n'ont pas de diagonale mesurable (aucun poseur a rang lu, ou aucun poseur du
# tout pour les grenades) : c'est « non mesurable », jamais « contredit ».
#
# CE QUI RESTE `other` : 0x4396db42 (104 poses, 9 films, 26 deployees — releve du 2026-08-18 sur
# les 33 artefacts de disque). Il est rattache au `sofa` 0xeb500815 — le rang 10 des palettes
# 0xd91958af ET 0x03137359 de la famille A, le trou non casse le plus frequent du corpus
# (67 lectures `i48`).
#
# TROIS CHAINES L'ONT CHERCHE, LES TROIS RENDENT UN NEGATIF (2026-08-18,
# PLAN_EQUIPEMENTS_MANQUANTS_SONS phase 1.5). Chacune avec son denominateur, parce qu'un negatif
# sans denominateur ne vaut rien :
#
#   DICTIONNAIRE   son `string_id` 0xb328c9fa resiste a DEUX enumerations independantes : le
#                  dictionnaire global a trois jetons (49 954 499 candidats, esperance de
#                  collision 0,070) et un dictionnaire ELARGI construit pour la question
#                  (31 prefixes x 176 jetons a deux jetons = 1 898 966 candidats, esperance
#                  0,0022 sur 5 cibles ; `himap/sonde_eqip_anonyme_test.go`). Ce dernier retrouve
#                  10 sur 10 des noms etablis par ailleurs — son negatif porte donc.
#                  ET IL REFUTE UNE HYPOTHESE NOMMEE : `shroud_screen`, `smoke_screen`,
#                  `stealth_screen`, `cloak_screen`, `camo_screen` sont TOUS enumeres, avec les
#                  31 prefixes dont `ability_`, `equipment_`, `abl_`, `deployable_`. Aucun ne
#                  hache vers 0xb328c9fa. L'« ecran de dissimulation » n'est pas ecarte comme
#                  OBJET — aucun de ses noms plausibles n'est le nom de ce tag, c'est tout.
#   MODELE         `hlmt:eea39cf4` est UNIQUE dans le jeu. La mesure ne porte plus sur les
#                  21 identifiants du corpus mais sur les 116 tags `eqip` de l'installation,
#                  ou 16 modeles sont partages par deux `eqip` ou plus (`c62d74c3` capteur,
#                  `75070361` grappin, `99953db8` propulseur, `2e76f0a9` mur x4,
#                  `d8ca727d` panneaux x5, `c4b1aebd` surbouclier + camouflage x6).
#   BANQUE SONORE  son frere de `sofa`, l'`eqip` 0x4eebcb18, atteint une banque SELECTIVE
#                  (`sbnk 92c830f5`, 38 `.wem` embarques, aucun autre `eqip` ne l'atteint) — mais
#                  aucun de ces 38 `.wem` ne vit dans un `.pck` NOMME du jeu. La chaine qui
#                  nomme (`eqip -> effe -> snd! -> sbnk -> .wem -> pack`) est pourtant CALIBREE :
#                  elle rend `sb_007_abl_repairfield` pour le champ de reparation,
#                  `sb_010_grn_cv_plasmagrenade` pour la grenade a plasma et
#                  `sb_010_grn_un_lightninggrenade` pour la Dynamo.
#
# CE QUE LA STRUCTURE DIT QUAND MEME. Le `sofa` 0xeb500815 porte DEUX `eqip` : 0x4eebcb18, qui
# n'a aucun `hlmt` mais un `proj` (un PROJECTILE), et 0x4396db42, qui porte `gldf` + `lens` (un
# objet LUMINEUX, comme le surbouclier, le camouflage et le translocateur). Un objet lance qui
# deploie une source de lumiere : c'est une description, pas un nom.
#
# LE RANG 10 N'EST PAS UNE IDENTITE, C'EST UNE POSITION. La TROISIEME palette de la famille A
# (0x13c097ed) met au rang 10 un AUTRE `sofa` (0x457923a0), dont l'identifiant de chaine se
# casse en `regen_field`. Deux equipements differents occupent donc le meme rang selon la
# palette — et `regen_field` n'est PAS le rang 10 anonyme.
#
# `regen_field` EST LE SEUL NOM DU JEU QUE CE MANIFESTE NE PORTE PAS, et c'est volontaire : ses
# deux `eqip` (0x0dc0d5b4, 0x03bad9e7) n'apparaissent dans AUCUN artefact du corpus, et la parite
# de cette table est BILATERALE (toute ligne doit avoir un identifiant mesure). Le jour ou un
# film en montre un, la ligne s'ecrit — la chaine du nom est deja faite.
#
# PARITE : tout identifiant observe au corpus a une ligne ici, nommee ou `other` explicite.
# Garde-rail : `replaylabels/catalog_test.go`, TestPariteObjetsEquipementDuCorpus.
#
# ------------------------------------------------------------------------------------------
# `kind` — LA NATURE MESUREE (ajoute le 2026-08-18, PLAN_ORIGINE_POSES_ET_FAMILLES G.3)
#
#   carried    PORTE par le joueur : ses poses sont majoritairement des LACHERS. Quand la vie
#              du porteur s'acheve, ce qu'il portait tombe a ses pieds, et le film cree
#              l'objet la. 19 des 21 identifiants.
#   deployed   N'EXISTE QU'UNE FOIS DEPLOYE : la piece qu'un equipement ENGENDRE. Les deux
#              seuls du corpus sont les panneaux du mur, et ce sont exactement les deux que la
#              chaine des tags rattachait par `sofa_parent`.
#
# CE QUE LA MESURE A TROUVE, ET QUI RENVERSE LA LECTURE DE `equipmentPlacements`. Sur les
# 11 films calibres (4 250 poses, 3 661 a poseur mesure), la part des poses creees dans les
# 2 frames ET les 1,5 m du DERNIER POINT de leur poseur vaut 88,6 %. La part creee au DEBUT de
# sa vie — l'hypothese « dotation au spawn », ecrite avant la mesure — vaut 0,1 % (4 poses, et
# les 4 sont des vies de 0,13 a 1,49 s ou debut et fin se confondent). L'ecart n'est pas un
# reglage de seuil : les lachers sont a 20-40 ms de la fin de vie, les deploiements a 14-42 s.
#
# LA DIAGONALE DE LA NATURE, par identifiant (part de poses DEPLOYEES) :
#
#   0x528fce46  panneaux du mur (rang 19)   47/48 = 97,9 %   0 lacher sur 48   DEPLOYED
#   0x686b40c9  panneaux du mur (rang  2)   42/43 = 97,7 %   1 lacher sur 43   DEPLOYED
#   ----------------------------------------------------------------------------------------
#   0x2974c233  APPAREIL du mur (rang  2)   25/85 = 29,4 %                     carried
#   0x72b63d69  capteur (rang 1)            27/95 = 28,4 %                     carried
#   0x32d97758  champ de reparation        26/105 = 24,8 %                     carried
#   0x7ca85adc  repulseur                  33/163 = 20,2 %                     carried
#   0x72199cba  capteur (rang 22)            9/60 = 15,0 %                     carried
#   0x8e2dc574  APPAREIL du mur (rang 19)    6/46 = 13,0 %                     carried
#   0x273fe0eb  grappin                    22/223 =  9,9 %                     carried
#   les 4 grenades                                 2,6 a 5,1 %                 carried
#
# UN SEUIL A 50 % SEPARERAIT LES DEUX GROUPES SANS AMBIGUITE : 97,7 % d'un cote, 29,4 % de
# l'autre, et rien entre les deux. C'est le controle INTERNE de la mesure — si les 88,6 % de
# lachers etaient un artefact de la methode, les panneaux les porteraient aussi ; ils en ont
# zero et un.
#
# CE QUE CELA TRANCHE POUR LE RENDU : l'arc du mur se dessine sur les PANNEAUX
# (`0x528fce46`, `0x686b40c9`), jamais sur l'appareil — un appareil de mur a la position d'un
# joueur est, 87 fois sur 100, l'objet qu'il portait en mourant. Meme verdict pour le capteur :
# `0x72199cba` est PORTE, ses 60 poses sont 50 lachers pour 9 deploiements.
#
# CE QUE `kind` NE DIT PAS, et il ne faut pas le lui demander : ce qu'une pose PARTICULIERE
# est. Cela, c'est `origin` (`deployed` / `dropped` / `unknown`), mesure pose par pose et
# publie au document (schema 10). Un identifiant `carried` porte quand meme des deploiements
# reels — 25 murs et 9 capteurs dans ce corpus — et c'est `origin` qui les distingue.
#
# TROIS IDENTIFIANTS ONT UN EFFECTIF TROP FAIBLE POUR QUE LA MESURE TRANCHE SEULE, et leur
# `kind` repose alors sur la structure (aucun n'est `sofa_parent`, donc aucun n'est une piece
# engendree) : 0x730dc70f balise du translocateur (2 poses, 2 lachers), 0xb781197a surbouclier
# et 0xe7be9f5c camouflage (1 pose chacun, 1 lacher). Les quatre poses vont dans le meme sens
# que les 19 autres identifiants (23 a 40 ms, 0,44 a 0,67 m de la fin de vie), mais n = 1 ou 2
# ne prouve rien : c'est ecrit ici pour que personne ne le lise comme une mesure.
# ------------------------------------------------------------------------------------------

