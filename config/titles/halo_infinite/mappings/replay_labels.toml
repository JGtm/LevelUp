# ------------------------------------------------------------------------------------------
# OBJETS D'OBJECTIF — les objets du monde QUI FONT LE MODE, et que la chaine des socles doit
# reconnaitre pour ne PAS les publier comme des armes (2026-08-18,
# `.ai/V7.5/replay2d/PLAN_DRAPEAU_OBJET.md`, decision 1).
#
# CE QUE CETTE TABLE EST, ET CE QU'ELLE N'EST PAS. La cle est le mot de 32 bits du bloc
# `object-multiplayer-properties` d'un record de CREATION `ti=42` — le MEME champ que celui
# qui identifie une arme au sol, dans le MEME archetype. Ce n'est donc pas une table
# d'equipement (`equipment_objects`, archetype 37, chaine `sofd -> sofa -> eqip`) : c'est la
# liste des identifiants `ti=42` qui ne sont PAS des armes et dont la nature est etablie.
#
# COMMENT `0x2a392328` A ETE ETABLI (phase 0 du plan attachement,
# `attachement_phase0_drapeau_test.go`, 2026-08-18) — trois lectures, aucune supposee :
#
#   COMBIEN   110 / 41 / 46 creations `ti=42` sur les trois films de CTF du corpus
#             (`64e8adfa` et `530820e5` sur Catalyst, `53ce4390` sur Behemoth), toutes
#             ECARTEES du catalogue d'armes par le croisement d'identite.
#   OU        41 / 16 / 18 d'entre elles naissent a 0,0 m d'un socle `flag_spawn` du
#             catalogue de carte — un drapeau nait a son socle.
#   QUAND     l'une d'elles tombe a 1 ms d'un evenement de l'oracle (prise ou fin de portage).
#
# ET LE TEMOIN QUI FAIT LA SELECTIVITE : aucun AUTRE mot ecarte du catalogue d'armes ne
# reunit les deux (naitre au socle ET coincider avec l'oracle). Le seul candidat est celui-ci.
#
# CE QUE LA TABLE CHANGE POUR LA CHAINE DES SOCLES. Jusqu'ici ce mot etait ecarte par
# ACCIDENT — « identite hors du catalogue d'armes », comme le bruit du balayage. Il est
# desormais ecarte PARCE QU'ON SAIT CE QUE C'EST, avant meme la question « est-ce une arme ? ».
# Un drapeau n'est pas un socle d'arme : deux apparitions au meme socle en feraient un, et le
# rejeu dessinerait un socle de fusil a la base de chaque equipe.
#
# `family` : liste FERMEE (`flag`, `ball`). Le crane d'Oddball y est entre le 2026-08-27 ;
# la phrase precedente disait qu'il n'y etait pas « faute de canal ET d'oracle », et c'est
# cette phrase que la phase D4 du plan des objectifs vivants a attaquee — avec un succes
# PARTIEL qu'il faut lire tel quel (voir le bloc du crane ci-dessous).
#
# `en` / `fr` : le nom de l'objet, dans les deux langues du produit — jamais en dur en Go ni
# en TypeScript, meme regle que les grenades et les capacites.
[[objective_objects]]
id     = "0x2a392328"
family = "flag"
en     = "Flag"
fr     = "Drapeau"

# LE CRANE D'ODDBALL — identite ETABLIE le 2026-08-27, portage REFUTE le meme jour.
#
# CE QUI EST MESURE (phase D4, quatre films Oddball : `24dbb67d` Recharge, `43716616`
# Smallhalla, `51ebbc0f` Banished Narrows, `d9781168` Dredge ; instrument
# `oddball_crane_d4_test.go`, sortie figee dans `.ai/V7.5/replay2d/registre_film/`) :
#
#   COMBIEN   133 / 137 / 144 / 256 creations `ti=42` ECARTEES du catalogue d'armes, soit
#             69 / 107 / 82 / 199 mots de 32 bits distincts.
#   OU        ce mot-ci naissait a 0,0 m du socle `oddball_spawn` UNIQUE de la carte sur les
#             QUATRE films (3, 4, 4 et 13 creations au socle).
#   QUAND     a 6, 3, 3 et 5 ms d'un evenement `th=10` de crane.
#
# LE TEMOIN DE SELECTIVITE, ecrit comme pour le drapeau : sur `43716616` et `51ebbc0f`, AUCUN
# autre mot ecarte ne reunit les deux conditions. Sur les deux autres films il en existe UN,
# mais ce n'est pas le meme des deux cotes (`0xCBA072DC` / `0x042100A6`) et il s'en separe sur
# les DEUX criteres : 1 creation contre 16 a 47, ne a 1,7 et 2,9 m contre 0,0, coincidant a 157
# et 177 ms contre 3 a 6. Bruit de singleton, pas identite rivale.
#
# CE QUE CETTE ENTREE NE DIT PAS, ET QU'IL FAUT LIRE AVANT DE L'ETENDRE : QUI porte le crane.
# Le seuil de portage a ete mesure et REFUTE — 40,6 a 66,7 % de trous a porteur unique contre
# un seuil de 90 %, et un temoin place HORS trou qui rend le meme signal dans 66,7 et 71,4 %
# des cas. L'oracle du score personnel ne discrimine pas le portage en Oddball. Aucun calque de
# portage de crane n'existe, et il ne faut pas en deduire un de cette ligne.
[[objective_objects]]
id     = "0x0017592c"
family = "ball"
en     = "Oddball"
fr     = "Crane"

# ---------------------------------------------------------------------------
# LA ZONE DE RETOUR DU DRAPEAU (CTF) — la regle du mode, pas un reglage d'affichage.
#
# Un drapeau de CTF tombe ne reste pas au sol : une zone l'entoure, les coequipiers de son camp
# qui s'y tiennent VIDENT sa jauge de retour plus vite, et sans personne elle se vide seule
# jusqu'a ce qu'il rentre. Le rejeu 2D en tire le cercle et la jauge (schema 35).
#
# D'OU VIENNENT CES TROIS NOMBRES — LES DEUX PROVENANCES NE SE VALENT PAS :
#
#   radius_m       LU DANS LE JEU. Pool de constantes du script `parcel_deliver_object.lua`
#                  (tag `hsc*` de `any/globals/common-rtx-new.module`), table CONFIG, champ
#                  `innerAreaMonitorRadius` = 1,3. Le meme pool rend `flagCarrierMovespeedScalar
#                  = 0,715` — la penalite de vitesse du porteur, verifiable en jeu : c'est le
#                  TEMOIN qui atteste le decodage. CORROBORE independamment par la mesure :
#                  l'ajustement du modele sur les films CTF a son minimum de dispersion a
#                  1,3-1,5 m (cv 0,85 / 0,84), et se degrade de part et d'autre (0,5 m -> 1,44 ;
#                  3 m -> 1,09 ; 5 m -> 1,87).
#
#   reset_seconds  MESURE sur les films. Le defaut de la bibliotheque (`flagResetSeconds = 15`)
#                  est ecrase par instance (`FlagInitArgs.returnTimer`) : c'est la valeur du
#                  MATCH qui compte pour un rejeu. Episodes retournes sans qu'aucun defenseur
#                  n'approche : 29,0 / 30,0 / 31,4 / 32,2 s.
#
#   solo_seconds   MESURE sur les films. Ajustement du modele du jeu — jauge remplie au taux
#                  `1/reset + H(n)/solo`, H = serie HARMONIQUE (le jeu nomme sa fonction
#                  `CalculateReturnRateHarmonic`) — au rayon 1,3 : 3,09 s.
#
# Detail, protocole et bornes : `.ai/V7.5/PLAN_CTF_ZONE_RETOUR_2026-08-30.md`.
# NE PAS renseigner ces valeurs « au juge » pour un autre titre : la section absente ne dessine
# rien, ce qui est le comportement voulu, alors qu'un rayon invente dessine un cercle faux.
[flag_return_zone]
radius_m      = 1.3
reset_seconds = 30
solo_seconds  = 3.1
