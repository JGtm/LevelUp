# config/titles/halo_infinite/mappings/assets.toml
#
# Source de vérité des libellés et présentation des assets sémantiques d'Halo
# Infinite : modes (catégories), tiers de médaille, tiers de défi Prestige,
# cadences de défi, statuts de défi.
#
# Lue au boot par internal/games/mappings/loader_assets.go.
#
# Convention : sections [assets.{kind}.{id}].
# Champs obligatoires : labels.en, labels.fr, display_order.
# Champs optionnels : color_token, icon.
#
# Toute modification breaking incrémente schema_version (cf. tools/mappings/CHANGELOG.md).

[meta]
title_slug     = "halo_infinite"
schema_version = 1

# =============================================================================
# Modes (regroupements UX, alignés sur analysis.ModeCategory* en Go).
# Les ID utilisent les valeurs canoniques exactes retournées par le backend
# (ex : "Assassin", "Super Fiesta", "BTB") pour permettre une lookup directe
# côté frontend via useAssetLabel('mode', cat.value).
# =============================================================================

[assets.mode.Assassin]
labels = { en = "Slayer", fr = "Slayer" }
display_order = 10

[assets.mode.Fiesta]
labels = { en = "Fiesta", fr = "Fiesta" }
display_order = 20

[assets.mode."Super Fiesta"]
labels = { en = "Super Fiesta", fr = "Super Fiesta" }
display_order = 25

[assets.mode."Husky Raid"]
labels = { en = "Husky Raid", fr = "Husky Raid" }
display_order = 30

[assets.mode.BTB]
labels = { en = "Big Team Battle", fr = "Grande bataille en équipe" }
display_order = 40

[assets.mode.Ranked]
