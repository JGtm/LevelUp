# =============================================================================
# Cartes (kind = "map")
#
# Les ID utilisent le `MapUI` brut renvoyé par le backend (cf. SquadMatchRow.MapUI
# dans domain/squad.go) qui est aujourd'hui le nom EN d'affichage de la carte.
#
# La plupart des noms de cartes Halo restent en anglais en FR (politique de
# localisation Microsoft : noms propres conservés). On tient quand même cette
# section à jour pour deux raisons :
#   1. Démontrer la voie multi-titres : un autre titre pourra avoir des cartes
#      à libellés divergents entre EN et FR, le pipeline est prêt.
#   2. Permettre des FR personnalisés ponctuels (ex. cartes Firefight avec un
#      sous-titre traduit).
#
# Les cartes absentes de cette table tombent en fallback sur l'ID brut côté
# frontend (useAssetLabel('map', id) renvoie id si non mappé).
