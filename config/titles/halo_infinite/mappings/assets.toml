# =============================================================================
# Saisons Halo Infinite
#
# Calendrier marketing officiel (Halo Waypoint + recoupement
# SpartanRecord/AllSeasons.ts). Format ID : "season{N}" pour S1-S13 +
# "season_winter_22" pour la mise à jour hivernale 2022 (Winter Update,
# parfois appelée S2.5).
#
# Fenêtre temporelle : start_date = début officiel de la saison (au format
# RFC 3339 strict, heure 17:00 UTC = 18h Paris hiver / 19h Paris été, conforme
# aux drops Halo). end_date = début de la saison suivante. La saison courante
# (S13 — Infinite) est laissée ouverte (end_date absent) tant qu'aucune nouvelle
# saison n'est annoncée.
#
# extra.csr_season_id = identifiant CSR Waypoint correspondant
# (CsrSeason{N}-{op}, utile pour cross-référencer les ratings classés).
# extra.short_label = libellé compact pour rails et badges (ex. "S6").
#
# Maintenance : ajouter une nouvelle entrée à chaque nouvelle Operation /
# saison annoncée (cadence ~3 mois). Le job admin de validation TOML vs
# Waypoint reste à venir (out of scope du plan saisons V1).
#
# Distinction critique : ces saisons calendaires ne sont PAS les Battle Pass
# reward tracks (qui sont gérés par season_pass_service + battlepass_track_*
# en DB). Ici on ne décrit que le découpage temporel global du jeu.
# =============================================================================

[assets.season.season1]
labels = { en = "Heroes of Reach", fr = "Heroes of Reach" }
display_order = 10
start_date = "2021-12-08T17:00:00Z"
end_date   = "2022-05-03T17:00:00Z"
extra = { csr_season_id = "CsrSeason1", short_label = "S1" }

[assets.season.season2]
labels = { en = "Lone Wolves", fr = "Loups solitaires" }
display_order = 20
start_date = "2022-05-03T17:00:00Z"
end_date   = "2022-11-08T17:00:00Z"
extra = { csr_season_id = "CsrSeason2", short_label = "S2" }

[assets.season.season_winter_22]
labels = { en = "Winter Update", fr = "Mise à jour hivernale" }
display_order = 25
start_date = "2022-11-08T17:00:00Z"
end_date   = "2023-03-07T17:00:00Z"
# matchmade_path : seule saison dont l'ID n'est pas numéroté → son chemin CMS
# n'est pas déductible du gabarit "Seasons/Season{N}.json". Valeur relevée sur
# les appels réels au service record (logs 2026-07-22). Cf. deterministicSeasonPath.
extra = { csr_season_id = "CsrSeason2-2", short_label = "Winter 22", matchmade_path = "Seasons/Season-Winter-Break-22.json" }

