# ─── Score (bonus XP / penalties non-mappés à un axe) ───────────────────────

[awards.collected_bonus_xp]
axes   = ["score"]
weight = 1.0

# Les pénalités (betrayed_player, self_destruction, revive_denied,
# conversion_denied) sont volontairement absentes — un acte négatif ne
# devrait pas booster un axe positif. Le score Halo brut (mp.personal_score)
# les comptabilise déjà en interne.
