# --- LES ARMES A TIR CONTINU (lot M4b, 2026-09-24) -------------------------------------------------
#
# ELLES NE SONT OBSERVEES DANS AUCUN TIR, ET C EST LE FAIT QUI LES DEFINIT : leur barillet est de type
# de prediction 1 a debit d evenements NUL (lu dans le tag, instrument
# `internal/himodule/m4b_barillets_research_test.go`) — le jeu n emet jamais leur record 36, et leur
# tir ne vit que dans la gachette tenue de la vue de controle. La cle est le tag que le CHASSIS (ou
# la piece montee) DECLARE dans le film (`replay/tir_continu_armes.go`, qui porte aussi la cadence) ;
# le garde-rail Go exige que chaque entree `continuous` y figure, et reciproquement.
# `sound` est le COUP en queue de rafale (la premiere variante) ; `loop`, quand il existe, le son TENU
# pendant la rafale. Sans `loop`, le coup se rejoue a la cadence de l arme : c est le conteneur du jeu
# en mode « cadence de declenchement » (AkTransitionMode 5, manifeste V3 : Ghost 0,130 s, Banshee
# 0,125 s, Chopper 0,250 s, LMG 0,077 s — la periode de tir de chaque arme).

