# vehicle_weapons.toml — LE REGISTRE DES ARMES DE VEHICULE du rejeu 2D (schema 69 du document).
#
# Retours du rejeu du 2026-09-23, lot M4a (PLAN_RETOURS_REJEU_2026-09-23 §4.4 et §5). Il remplace
# les trois tables CLIENT (style, son, montage) qui etaient clees par des tags `weap` lus dans le
# module du jeu et jamais confrontes a un film : 7 des 11 cles n apparaissaient dans aucun
# document du parc, et 3 tags reellement publies en etaient absents.
#
# LA CLE EST UN TAG OBSERVE DANS UN FILM. `tag` = les 8 chiffres hexadecimaux (majuscules) de la
# moitie HAUTE de `Shot.w` (`0x<tag>00000000`). Le garde-rail Go
# (`internal/games/mappings/loader_vehicle_weapons_test.go`) exige que toute cle figure dans la
# fixture datee des tags observes au parc (`testdata/vehicle_weapons/vehicle_weapon_tags_observed.json`),
# et que tout tag de vehicule observe au moins 5 fois ait une entree ou une ligne `[[unknown]]`
# motivee. Une arme jamais vue dans un film (Ghost, canons de la Banshee, Chopper, LMG du Falcon,
# LMG du Wasp : toutes a TIR CONTINU, que le decodeur ne lit pas encore — lot M4b) n entre ici
# qu au jour ou un document la publie.
#
# CHAQUE ENTREE PORTE :
#   vehicle   famille ou variante du vehicule porteur (vocabulaire de `VehicleTrack.family` /
#             `variant` : wraith, rockethog, falcon, gungoose, scorpion, wasp...)
#   en / fr   le nom de l arme, publie dans le document (jamais ecrit en Go)
#   fire      single (un evenement par coup) | continuous (tir tenu)
#   fx        forme de l eclair — liste de [shot_effects] : ballistic | plasma | light | shock |
#             explosive | bomb | melee | needles
#   tint      nature de la decharge — liste de [shot_tints] : kinetic | plasma_cool | plasma_hot |
#             forerunner | electric | needle | blast
#   sound     stem de la PREMIERE variante du son de tir (fichier `static/sounds/{slug}/<stem>.wav`,
#             les variantes se tirent cote client) — OU `silence`, la raison d un silence DECIDE
#   mount     ancre sur le sprite, en fractions (repere nez en haut ; ax -0,5 gauche .. +0,5
#             droite, ay -0,5 nez .. +0,5 arriere) et classe de visee : aim = fixed (solidaire du
#             nez) | turret (visee du tireur)
#   proof     la PREUVE : documents, nombre de tirs, porteur mesure, tag de degat co-occurrent,
#             piece de RE ; `decision` quand un choix de l utilisateur tranche le rendu
#
# Mesures : fixture du 2026-09-23 (111 documents, schema 68), instrument
# `testdata/vehicle_weapons/sweep_vehicle_weapon_tags.mjs`.

