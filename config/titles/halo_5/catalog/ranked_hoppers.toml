# config/titles/halo_5/catalog/ranked_hoppers.toml
#
# Stratégie #1 (set-membership) de classification classé/non-classé Halo 5.
# Chargé par classification.LoadSetClassifier ; injecté dans l'adapter h5 à
# l'activation (cf. .ai/HANDOFF_H5_RANKED_CLASSIFICATION.md §5).
#
# Sémantique (cf. classification.SetClassifier) : le set est réputé EXHAUSTIF —
# un HopperId présent = classé (&true), absent = non-classé (&false).
#
# PEUPLÉ le 2026-06-25 depuis la SOURCE AUTORITATIVE : table `playlists` (champ
# officiel `isRanked`) de metadata.duckdb, elle-même seedée par `cmd/h5-metadata-fetch`
# depuis l'API Metadata OFFICIELLE Halo 5 (www.haloapi.com/metadata/h5/metadata/playlists).
# JAMAIS dérivé des parties. Pour H5, HopperId == playlist UUID (cf. mapping.go:
# `assetRef("playlist", r.HopperId)`), donc ces UUID sont directement les hopper_ids.
# Halo 5 = jeu figé → liste stable. Régénérer : `SELECT id, name FROM playlists
# WHERE is_ranked = true` sur le metadata.duckdb H5 après un h5-metadata-fetch.
#
# NB : ceci active la classification du chemin LIVE (sync futur). La reclassification
# des matchs DÉJÀ importés (match_registry.is_ranked) reste un backfill séparé.

schema_version = 1

