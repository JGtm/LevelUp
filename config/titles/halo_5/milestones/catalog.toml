# Halo 5 — Catalogue de milestones (couche 2 du plan V2 Ascension).
#
# Chargé au boot dans metadata.duckdb via milestones.SyncCatalog (lu auto par
# RegisterMilestonesSeedMigration dès que ce fichier existe).
# Schéma : apps/go-api/internal/progression/milestones/catalog_loader.go.
#
# Conventions (cf. halo_infinite/milestones/catalog.toml) :
#  - id : préfixé `halo_5.` + metric + threshold.
#  - metric : clé alignée sur les agrégats PlayerStats. H5 expose matches_played,
#    wins, kills, headshots, assists (tous fiables côté carnage). OMIS volontairement :
#    combat_* (modèle damage H5 = 115, calibration non validée) et accuracy
#    (data-limited) — à ajouter quand validés.
#  - icon : nom logique partagé avec HINF (icônes de milestone génériques, pas
#    title-specific) → mapping front réutilisé tel quel.

[meta]
schema_version = 1
title_slug = "halo_5"

# ─── Volume : matchs joués ─────────────────────────────────────────────────

[[milestones]]
id        = "halo_5.matches.100"
metric    = "matches_played"
threshold = 100
title_fr  = "Centurion"
title_en  = "Centurion"
icon      = "milestone_matches_100"

