# config/titles/halo_5/constants.toml
#
# Hosts d'ingestion API Halo 5 par axe (autorités internes cryptum), consommés par
# l'EndpointResolver (section [endpoints]). Hosts RÉELS confirmés LIVE le 2026-06-19
# (sonde cmd/probe-h5, JGtm, HTTP 200 + données réelles avec le SpartanToken v4 du
# pool Infinite). Halo 5 = coming_soon → ces hosts ne sont pas encore appelés au
# runtime ; ils documentent la cible confirmée pour l'adapter Phase 1.
#
# Mapping EndpointKey→autorité PROVISOIRE : le vocabulaire de clés est celui
# d'Infinite (stats/gamecms/economy/skill/ugc_film/discovery_ugc/challenges/
# nameplate). Halo 5 a son propre découpage d'autorités (SpartanStats sert
# matches+servicerecords+CSR+commendations+credits ; HaloPlayer sert profiles/
# appearance/spartan-render ; ContentHacs = CMS ; UGC = films+variants ; Packs =
# REQ). Le mapping fin est figé quand l'adapter h5 est écrit.

[meta]
title_slug = "halo_5"
schema_version = 1
# game_prefix — segment d'URL de jeu Halo 5. CONFIRMÉ "h5" à la sonde live (Xbox :
# /h5/players/...). cryptum note h5[platform] où [platform] est vide sauf PC ("pc").
# Consommé via games.GamePrefix(slug).
game_prefix = "h5"

[endpoints]
stats         = "https://spartanstats.svc.halowaypoint.com"   # matches, servicerecords, commendations, credits
gamecms       = "https://content-hacs.svc.halowaypoint.com"   # ContentHacs : metadata/CMS (REQ, Emblem, Hopper…)
economy       = "https://packs.svc.halowaypoint.com"          # REQ packs/store/cards (économie Halo 5)
skill         = "https://spartanstats.svc.halowaypoint.com"   # CSR natif (HighestCsrAttained dans servicerecords/carnage)
ugc_film      = "https://ugc.svc.halowaypoint.com"            # films (UgcFilmManifest référencé dans /matches)
discovery_ugc = "https://ugc.svc.halowaypoint.com"            # map/game variants, forge groups
challenges    = "https://spartanstats.svc.halowaypoint.com"   # commendations natives (pas de "défis" Halo 5)
nameplate     = "https://haloplayer.svc.halowaypoint.com"     # profiles/appearance/emblem/spartan render

# ─── Modèle de dégâts (baseline rendement / résistance) ─────────────────────
# effective_hp_to_kill Halo 5 = 86. VALIDÉ DATA le 2026-06-23 sur 8856 lignes
# match_participants réelles (DB shared h5). La valeur DESIGN 115 (bouclier 70 +
# armure 45) a été ÉCARTÉE : l'unité de dégâts de l'API cryptum h5 ≠ PV en jeu
# (avg dégâts/kill empirique h5 = 136, vs Infinite = 358.8 — facteur ~2.6, donc
# échelle de dégâts différente, PAS des ennemis plus fragiles). Calibration =
# scale-match sur le métrique cross-titre : on préserve le ratio baseline/empirique
# d'Infinite (225 / 358.8 = 0.627). hp_h5 = 225 × (dpk_h5 / dpk_inf) :
#   global  225 × 136   / 358.8 = 85.3
#   médiane 225 × 132.9 / 345.2 = 86.6   → retenu 86.
# Effet : l'OC moyen h5 = 86/136 = 0.63 == OC moyen Infinite 225/358.8 = 0.63 →
# la distribution OC/DR de h5 est centrée comme Infinite, donc les bandes de
# classification ET le P80 d'Infinite (OffensiveConversionP80/DefensiveResistanceP80)
# restent valides pour h5 (le vrai bug était hp=115 + P80 Infinite = double
# désalignement). P80 propre à h5 = raffinement futur (vérifier sa forme une fois
# le backfill h5 complet). Cf. PLAN_DAMAGE_MODEL_PER_TITLE.md + thought_log [2026-06-23].
[damage_model]
effective_hp_to_kill = 86
# no_native_kda = true → Halo 5 ne renvoie PAS de KDA per-match via l'API ; sa forme
# native est un FDA NET ((k+a/3)−d)/games. On ne fabrique JAMAIS de KDA façon Infinite
# pour h5 (valeur fausse) : les surfaces le laissent nil. Cf. games.ProvidesNativeKDA.
no_native_kda = true
