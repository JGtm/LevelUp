# config/titles/halo_5/constants.toml
#
# Hosts d'ingestion API Halo 5 par axe (autorités internes cryptum), consommés par
# l'EndpointResolver (section [endpoints]). Hosts RÉELS confirmés LIVE le 2026-06-19
# (sonde cmd/probe-h5, JGtm, HTTP 200 + données réelles avec le SpartanToken v4 du
# pool Infinite). Halo 5 = coming_soon → ces hosts ne sont pas encore appelés au
# runtime ; ils documentent la cible confirmée pour l'adapter Phase 1.
#
# Mapping EndpointKey→autorité PROVISOIRE : le vocabulaire de clés est celui
# d'Infinite (stats/gamecms/economy/skill/ugc_film/discovery_ugc/challenges/
# nameplate). Halo 5 a son propre découpage d'autorités (SpartanStats sert
# matches+servicerecords+CSR+commendations+credits ; HaloPlayer sert profiles/
# appearance/spartan-render ; ContentHacs = CMS ; UGC = films+variants ; Packs =
# REQ). Le mapping fin est figé quand l'adapter h5 est écrit.

[meta]
title_slug = "halo_5"
schema_version = 1
# game_prefix — segment d'URL de jeu Halo 5. CONFIRMÉ "h5" à la sonde live (Xbox :
# /h5/players/...). cryptum note h5[platform] où [platform] est vide sauf PC ("pc").
# Consommé via games.GamePrefix(slug).
game_prefix = "h5"

[endpoints]
stats         = "https://spartanstats.svc.halowaypoint.com"   # matches, servicerecords, commendations, credits
gamecms       = "https://content-hacs.svc.halowaypoint.com"   # ContentHacs : metadata/CMS (REQ, Emblem, Hopper…)
economy       = "https://packs.svc.halowaypoint.com"          # REQ packs/store/cards (économie Halo 5)
skill         = "https://spartanstats.svc.halowaypoint.com"   # CSR natif (HighestCsrAttained dans servicerecords/carnage)
ugc_film      = "https://ugc.svc.halowaypoint.com"            # films (UgcFilmManifest référencé dans /matches)
discovery_ugc = "https://ugc.svc.halowaypoint.com"            # map/game variants, forge groups
challenges    = "https://spartanstats.svc.halowaypoint.com"   # commendations natives (pas de "défis" Halo 5)
nameplate     = "https://haloplayer.svc.halowaypoint.com"     # profiles/appearance/emblem/spartan render

# ─── Modèle de dégâts (baseline rendement / résistance) ─────────────────────
# effective_hp_to_kill Halo 5 = 115 (design : bouclier 70 + armure 45). C'est les
# PV-pour-tuer RÉELS dans l'échelle de dégâts h5 — baseline des KPI rendement
# (offensive_conversion) / résistance (defensive_resistance).
# NE PAS le dériver de la moyenne empirique dégâts/kill (≈136 sur 8856 lignes) :
# cette moyenne inclut l'overkill + les dégâts d'assistances, avec un facteur
# title-spécifique NON constant (Infinite : 358.8 empirique pour 225 PV réels = ×1.6 ;
# h5 : 136 pour 115 = ×1.18). Un « scale-match » sur l'empirique fausserait la valeur :
# le PV-pour-tuer DESIGN fait foi. Cf. PLAN_DAMAGE_MODEL_PER_TITLE.md.
[damage_model]
effective_hp_to_kill = 115
# offensive_conversion_p80 Halo 5 = 1.264. VALIDÉ DATA 2026-06-23 sur la distribution
# réelle h5 (12891 lignes match_participants) : 80e percentile de l'OC = 115×(k+a/3)/dégâts.
# C'est la frontière « élite » qui normalise les barres/radars de rendement. NE PAS
# réutiliser le 0.90 d'Infinite : la MÉDIANE OC h5 (0.99) est déjà > 0.90 → tous les
# joueurs h5 paraîtraient élite. Même MÉTHODE que le 0.90 d'Infinite (= son propre 80e
# percentile) → « mêmes proportions relatives ». Résistance (DR) = N/A : l'API carnage
# h5 ne fournit PAS damage_taken (vérifié sur le retour cryptum brut, 0/13241).
offensive_conversion_p80 = 1.264
# no_native_kda = true → Halo 5 ne renvoie PAS de KDA per-match via l'API ; sa forme
# native est un FDA NET ((k+a/3)−d)/games. On ne fabrique JAMAIS de KDA façon Infinite
# pour h5 (valeur fausse) : les surfaces le laissent nil. Cf. games.ProvidesNativeKDA.
no_native_kda = true
# no_damage_taken = true → l'API carnage h5 ne fournit PAS damage_taken (0/13241
# vérifié). La résistance défensive (DR) n'est pas calculable : on neutralise l'axe
# défensif du profil de combat, l'alerte coaching « fragile » et les milestones
# endurance/excellence plutôt que d'afficher un DR=0 trompeur. Cf. games.ProvidesDamageTaken.
no_damage_taken = true
# no_team_mmr = true → le carnage cryptum h5 ne porte PAS de MMR d'équipe/adverse par
# match (seul le CSR natif est extrait, cf. reference_h5_csr_model). La colonne MMR du
# tableau Escouade (et d'Explorer) est MASQUÉE plutôt qu'affichée à « 0 » (trompeur).
# Cf. games.ProvidesTeamMMR.
no_team_mmr = true
# NB — max killing spree : PAS de flag no_max_killing_spree pour h5. Le carnage cryptum
# ne porte pas la valeur native (match_participants.max_killing_spree NULL), mais la
# « folie meurtrière max » = nombre de kills d'affilée AVANT de mourir est CALCULABLE
# depuis les events kill/death horodatés (killer_victim_pairs h5, synthétisés en
# canonical via analysis.SynthesizeKillEventsFromKVPairs). La capability events-timeline
# (match.events.timeline, supported pour h5) est le discriminant : un titre qui sert des
# kills horodatés peut DÉRIVER la spree via analysis.ComputeMaxKillingSpree. La valeur
# native fait foi quand elle existe (Infinite, pas de recalcul) ; sinon on calcule.
# Cf. games.ProvidesMaxKillingSpree (dérivé de CapMatchEventsTimeline, pas d'un flag).

# ─── Poids d'events du score d'engagement (chantier F7, DE-4) ────────────────
# Coefficients d'engagement PAR TITRE (cf. halo_infinite/constants.toml [engagement]
# pour la sémantique). CANDIDATS PROVISOIRES (chantier F7 E4) : initialisés aux poids
# de référence Infinite. La capability engagement.score h5 reste DEGRADED (calibration
# provisoire) jusqu'au gate humain E6 ; ces poids sont à valider/ajuster contre la
# distribution réelle h5 (assists NATIVES, impulses objectif allowlist) — cf. rapport
# .ai/ENGAGEMENT_CALIBRATION_H5_2026-07-11.md. Modèle events title-agnostic (H5 kills
# synthétisés via killer_victim_pairs, objectifs via impulses → event_type "mode").
[engagement]
objective = 1.5
assist    = 0.5
death     = 0.0
default   = 1.0
