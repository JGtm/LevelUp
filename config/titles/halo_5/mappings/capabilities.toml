# config/titles/halo_5/mappings/capabilities.toml
#
# Capabilities fines Halo 5 = surface RÉELLEMENT servie par l'adapter (Halo 5 est
# servi UNIQUEMENT par l'adapter, pas de chemin legacy) -> ces statuts gouvernent
# CapabilityMap.Has(), donc l'appel des méthodes Load*. RÈGLE : une capability n'est
# "supported"/"degraded" QUE si sa méthode Load* est réellement câblée — sinon
# Has()==true mènerait à un appel qui échoue toujours (cf. review Phase 1a).
# Valeurs : "supported" | "degraded" | "not_exposed".
#
# ÉTAT COURANT (MAJ 2026-07-04, F15-10) : câblés "supported" = career.progression,
# match.history, match.detail.core, commendations.native (AXE A/B prod-gate), +
# match.events.timeline / match.killfeed.per_kill / match.events.spatial /
# match.weapon.accuracy (natifs carnage/events). Restent "not_exposed" (Phase 2+) :
# match.scoreboard.extra, match.skill.snapshot (CSR par match), analytics.timeseries,
# engagement.score ; + surfaces absentes du titre (battlepass.progression,
# challenges.surface, pve.firefight_stats modèle != FF HINF, citations.engine — h5
# sert le NATIF commendations.native). La matrice OPTIMISTE cible (ce que la DONNÉE
# h5 permet, confirmé par la sonde) vit dans le handoff §2, PAS ici :
# ce fichier = ce qui est servable AUJOURD'HUI, pas l'intention.

[meta]
title_slug     = "halo_5"
schema_version = 1

[capabilities]
"match.history"          = "supported"   # CÂBLÉ : LoadMatchSummaries lit le shared h5 LOCAL (match_registry ⨝ match_participants → canonical.MatchSummary), AXE A prod-gate
"match.detail.core"      = "supported"   # CÂBLÉ : LoadMatchDetail (carnage → canonical.MatchDetail), voie canonique Match View
"match.scoreboard.extra" = "not_exposed" # carnage étendu (Phase 2)
"match.skill.snapshot"   = "not_exposed" # CSR pré/post par match = carnage Arena (Phase 2)
"career.progression"     = "supported"   # CÂBLÉ : LoadCareerSnapshot (Spartan Rank/CSR via service record)
"analytics.timeseries"   = "not_exposed" # buildable depuis l'historique (Phase 2)
"engagement.score"       = "not_exposed" # events présents, coefficients à recalibrer (Phase 2)
"citations.engine"       = "not_exposed" # moteur de citations DÉRIVÉ d'Infinite — h5 affiche le NATIF (commendations.native), pas ce moteur
"commendations.native"   = "supported"   # CÂBLÉ : commendations NATIVES par match (carnage ProgressiveCommendationDeltas → match_commendations + MatchDetail.Commendations), AXE B prod-gate
"pve.firefight_stats"    = "not_exposed" # Warzone Firefight, modèle != FF HINF (Phase 2+)
"battlepass.progression" = "not_exposed" # pas de season pass (REQ packs à la place)
"challenges.surface"     = "not_exposed" # pas de défis
# Canonical MatchEvents : CÂBLÉ Phase 1 (LoadMatchEvents → halo_5/events.go).
# Halo 5 sert NATIVEMENT la timeline complète (/h5/matches/{id}/events) avec
# arme-par-kill (KillerWeaponStockId) et positions monde (KillerWorldLocation).
"match.events.timeline"  = "supported" # natif /h5/matches/{id}/events
"match.killfeed.per_kill" = "supported" # KillerWeaponStockId par event de kill
"match.events.spatial"   = "supported" # KillerWorldLocation/VictimWorldLocation x,y,z
# Précision par arme : ShotsFired/ShotsLanded natifs des events weapon_drop,
# agrégés par (xuid, weapon_id) dans la table weapon_accuracy (somme = carnage).
"match.weapon.accuracy"  = "supported" # natif weapon_drop → table weapon_accuracy
