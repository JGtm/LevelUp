# config/titles/halo_5/mappings/asset_labels.toml
#
# Overrides de noms officiels (localisation officielle Halo 5: Guardians) pour le
# référentiel d'assets, UNE TABLE PAR LANGUE (ADR 0040 D-5) : `"nom EN" = { fr = "..." }`.
# Clé = nom EN EXACT de l'API Metadata officielle ; seules les langues CONNUES figurent
# dans la table (aujourd'hui `fr`). Une langue absente = repli sur la donnée de l'API
# (jamais de traduction inventée). Une clé de langue hors de config/locales.toml est refusée.
# Lu par cmd/h5-metadata-fetch : une ligne de traduction par langue renseignée (EN = donnée de l'API).
#
# Source : wiki.halo.fr (pages dédiées par arme/médaille), recherche convergente.
# RÈGLE : uniquement les correspondances CONFIRMÉES. Les noms non listés gardent
# l'EN (aucune traduction inventée). Identiques EN/FR volontairement omis (DMR,
# Magnum, Needler, Railgun, SAW, Hydra…).

# [weapons] RETIRÉ (V72-06) : les noms d'armes FR sont désormais la SOURCE UNIQUE
# keyée par weapon_key dans config/titles/halo_5/mappings/weapon_names.toml (résolu
# via weapon_id -> weapon_ids -> weapon_key). Les traductions confirmées de cette
# section y ont été migrées. Ne PAS ré-ajouter [weapons] ici (clé = nom EN brut,
# fragile — c'est précisément la source de mismatch que V72-06 supprime).

