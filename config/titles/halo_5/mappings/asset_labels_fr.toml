# config/titles/halo_5/mappings/asset_labels_fr.toml
#
# Overrides de noms FRANÇAIS (localisation officielle Halo 5: Guardians) pour le
# référentiel d'assets. Clé = nom EN EXACT de l'API Metadata officielle ; valeur =
# nom FR officiel. Lu par cmd/h5-metadata-fetch → seed name_fr (fallback EN si absent).
#
# Source : wiki.halo.fr (pages dédiées par arme/médaille), recherche convergente.
# RÈGLE : uniquement les correspondances CONFIRMÉES. Les noms non listés gardent
# l'EN (aucune traduction inventée). Identiques EN/FR volontairement omis (DMR,
# Magnum, Needler, Railgun, SAW, Hydra…).

