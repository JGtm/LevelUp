# config/titles/halo_5/title.toml
#
# Manifest Halo 5: Guardians — 2e titre EXPERIMENTAL.
# Handoff complet : .ai/HANDOFF_HALO5_EXPERIMENTAL.md (corrigé 2026-06-19 : Halo 5
# est RICHE — events/carnage/commendations natives via endpoints internes cryptum).
#
# status = "active" depuis le 2026-06-20 (commit 67db508113 — sonde live validée,
# CSR Diamant 5 lu via probe-h5) : Halo 5 est DÉCOUVERT, listé dans le switcher ET
# SERVI (plus de 503 RequireActiveTitle). registerAdditionalTitles câble l'adapter
# internal/games/halo_5 (career.progression + events) ; historique/détail restent
# Phase 2 (cf. handoff .ai/HANDOFF_HALO5_EXPERIMENTAL.md).
#
# xbox_title_id 219630713 = présence watcher + achievements Xbox.

[meta]
title_slug = "halo_5"
schema_version = 1

[title]
name = "Halo 5: Guardians"
provider = "halo_5"
status = "active"
icon_url = ""
xbox_title_id = "219630713"
steam_app_id = ""
# Matchs de placement des modes classés Halo 5 (CSR Arena). Valeur historique = 10
# (la sonde montrait MeasurementMatchesLeft:7 sur 10). Configurable par titre (vs
# Halo Infinite = 5 depuis Season 3). Consommé par l'adapter h5 pour l'état placement.
placement_matches = 10
# Saison CSR FIXE (G4 Phase 1). Le service record arena Halo 5 est un agrégat
# LIFETIME sans saison → une seule « saison » virtuelle. Aligne LECTURE
# (CSRSeasonIDForTitle → GetCSRSnapshots WHERE season_id) et ÉCRITURE (sync h5
# persiste player_csr_snapshots.season_id = "h5-lifetime"). Saisons réelles = Phase 2.
csr_season_id = "h5-lifetime"
# Préfixes de nom de fichier de capture APPARTENANT à Halo 5 (Windows Game Bar :
# "Halo_5_Guardians-2019-12-12_22h27.mp4"). Routage de l'indexeur média (DEC-8,
# plan résidus H5) : le dossier captures d'un joueur est partagé entre titres —
# ces fichiers ne sont indexés QUE par halo_5 (les autres titres les sautent via
# Registry.ForeignMediaFilenamePrefixes).
media_filename_prefixes = ["Halo_5_Guardians-"]
# Coarse capabilities Halo 5 (cf. handoff §2). Données riches ; divergence =
# vocab/échelle/natif. media = pipeline LOCAL (upload utilisateur + corrélation
# par timestamp de capture vers les matchs h5 ; PAS d'UGC API). Le parsing du
# format de capture Halo 5 « Halo_5_Guardians-YYYY-MM-DD_HHhMM » vit dans
# internal/ops/media_filename.go ; l'indexation est title-aware (SharedDBPath h5).
# Exclus pour l'instant : firefight (Warzone FF, modèle != FF HINF), forge (UGC
# HINF-shaped), world.leaderboard (scrape Waypoint HINF).
capabilities = [
  "matchmaking",
  "ranked",
  "career",
  "asset.images",
  "achievements",
  "engagement",
  "lusr",
  "media",
  "native_kill_mechanics",
  # Précision par arme (graphe page Synthèse) : ShotsFired/ShotsLanded natifs des
  # events weapon_drop, agrégés dans la table weapon_accuracy. Halo-5-only
  # (Infinite n'a pas d'events drop). Pendant title-level de match.weapon.accuracy.
  "weapon_accuracy",
  # Personnalisateur Spartan (modale home) : masques emblèmes/nameplates recolorisables
  # côté client. Halo-5-only (masques extraits du jeu). Cf. .ai/PLAN_H5_SPARTAN_CUSTOMIZER.md
  "spartan_customizer",
  # Page de detail de match publique sur Halo Waypoint (verifie utilisateur 2026-07-24 :
  # /halo-5-guardians/players/{gt}/matches/arena/{id}). URL construite cote front
  # (buildWaypointMatchUrl, segment + bucket arena par titre).
  "waypoint_match_url",
]
