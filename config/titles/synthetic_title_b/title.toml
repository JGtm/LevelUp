# config/titles/synthetic_title_b/title.toml
#
# Manifest du titre (MT-16 / day-one 2e titre). Découvert au boot par
# title.LoadTitlesIntoRegistry → enregistré dans le registre partagé.
#
# SQUELETTE 2e titre COMPLET (« même niveau d'information que Halo ») : déclare les
# 11 capabilities + porte tous les fichiers de config (mappings, constants,
# capabilities, auth) pour minimiser le travail quand un vrai 2e titre arrivera.
#
# status = "coming_soon" : le titre est DÉCOUVERT + listé dans le switcher (badge
# « bientôt »), mais N'EST PAS servi (RequireActiveTitle → 503) ni provisionné au
# boot (provisionAdditionalActiveTitles n'itère que les titres actifs). Pour
# l'activer réellement : (1) passer status="active", (2) enregistrer le DataAdapter
# de prod (internal/games/synthetic_title_b), (3) implémenter ses méthodes Load*
# contre la vraie source de données. La plomberie (registre, provisioning DB,
# hosts, auth, gating front) est déjà en place et byte-identique pour halo_infinite.

[meta]
title_slug = "synthetic_title_b"
schema_version = 1

[title]
name = "Synthetic Title B"
provider = "synthetic"
status = "coming_soon"
# Fixture multi-titre INTERNE : découverte + enregistrée + inspectable côté admin,
# mais JAMAIS exposée dans le switcher utilisateur (cf. Registry.PublicTitles).
# Évite que cette fixture de test « fuite » dans l'UI prod (vu en revue live H5).
is_internal = true
icon_url = ""
xbox_title_id = "999000111"
steam_app_id = ""
# Même niveau d'information que Halo : les capabilities produit déclarées.
# team_mmr / damage_taken / native_kda = miroir title-level des flags scalaires
# ProvidesTeamMMR / ProvidesDamageTaken / ProvidesNativeKDA (défaut true, comme
# Halo Infinite — le squelette n'a pas de [damage_model]
# no_team_mmr/no_damage_taken/no_native_kda).
capabilities = [
  "matchmaking",
  "firefight",
  "forge",
  "media",
  "ranked",
  "career",
  "asset.images",
  "achievements",
  "engagement",
  "lusr",
  "world.leaderboard",
  "team_mmr",
  "damage_taken",
  "native_kda",
]
